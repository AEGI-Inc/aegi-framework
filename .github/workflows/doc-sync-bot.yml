name: AEGI Doc Sync Bot

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  pr-doc-guide:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run repository integrity checks
        id: verify
        continue-on-error: true
        run: npm run verify

      - name: Analyze documentation impact and consistency
        id: docs
        continue-on-error: true
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-4-hydrogen' }}
        run: |
          node scripts/check-docs-sync.mjs \
            --base "${{ github.event.pull_request.base.sha }}" \
            --head "${{ github.event.pull_request.head.sha }}" \
            --ai \
            --markdown-out "${{ runner.temp }}/doc-sync-comment.md"

      - name: Post or update sticky PR comment
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('node:fs')
            const path = require('node:path')
            const marker = '<!-- aegi-doc-sync-bot -->'
            const reportPath = path.join(process.env.RUNNER_TEMP, 'doc-sync-comment.md')
            let body = fs.existsSync(reportPath)
              ? fs.readFileSync(reportPath, 'utf8')
              : `${marker}\n## AEGI 문서 정합성 점검 리포트\n\n리포트 생성에 실패했습니다.\n`

            const verifyOk = '${{ steps.verify.outcome }}' === 'success'
            body += `\n---\n무결성 검사(\`npm run verify\`): ${verifyOk ? '✅ PASS' : '❌ FAIL (워크플로 로그를 확인하세요)'}\n`

            const { owner, repo } = context.repo
            const issue_number = context.issue.number
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number,
              per_page: 100,
            })
            const existing = comments.find(c => c.body && c.body.includes(marker))
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body })
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body })
            }

      - name: Fail job if verify failed
        if: steps.verify.outcome != 'success'
        run: exit 1

  post-merge-doc-sync:
    if: github.event_name == 'push' && !startsWith(github.event.head_commit.message, 'docs(bot):')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run doc sync check with AI auto-fix
        id: sync
        continue-on-error: true
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-4-hydrogen' }}
        run: |
          node scripts/check-docs-sync.mjs \
            --base "${{ github.event.before }}" \
            --head "${{ github.sha }}" \
            --ai \
            --fix \
            --markdown-out "${{ runner.temp }}/doc-sync-report.md"
          cat "${{ runner.temp }}/doc-sync-report.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Create auto-sync PR if files were auto-fixed
        id: auto_pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          SHORT_SHA="${GITHUB_SHA::7}"
          BRANCH="docs/auto-sync-${SHORT_SHA}"
          git config user.name "aegi-doc-sync-bot[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add -A
          git commit -m "docs(bot): auto-sync documentation (${SHORT_SHA})"
          git push -u origin "$BRANCH"
          gh pr create \
            --base main \
            --head "$BRANCH" \
            --title "docs(bot): 문서 정합성 자동 동기화 (${SHORT_SHA})" \
            --body-file "${{ runner.temp }}/doc-sync-report.md"
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Verify repository after merge
        run: npm run verify
