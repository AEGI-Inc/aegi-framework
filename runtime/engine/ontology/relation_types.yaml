# 관계 타입 17종 · 표현 등급 · 엔진에 넣어 본 관계 → 간선
#
# 0단계에서 원본 표를 그대로 옮겼다. 값을 고칠 때는 이 파일을 고치고 원본도 같이 고친다.
# 명세 쪽은 validation/check_ontology.py, 대시보드 쪽은 ontology/tools/check_dashboard.py 가 대조한다.

sources:
  relation_types: docs/Relation_Schema_v3.md 「부여 층」 「구조 층」
  grades: docs/Relation_Schema_v3.md 「표현 등급 > 등급」 (Slack 실측 열은 측정값이라 문서에 남긴다)
  engine_probe: aegi-dashboard src/detection/v2/engine/edges.ts buildEdges — 엔진에 시험 입력을 넣어 본 결과. 처음은 0ee565f 에서 떴고, 2026-10-20 aegi-dashboard PR #125(수신 웹훅 갈래) 머지 뒤 owned_by.delivery_endpoint 시험을 더해 다시 떴다(다른 칸은 그대로) @ e3889a4

relation_types:
- number: 1
  name: has_role_on
  layer: grant
  arity: 3
  role: Policy
  form: Principal | Policy | Credential | Integration --[Policy]--> Resource | Tenant | Integration | Automation
  branches:
  - from: [Principal, Policy, Credential, Integration]
    to: [Resource, Tenant, Integration, Automation]
  evidence: Entra `unifiedRoleAssignment`, Snowflake `GRANTS_TO_USERS`, GitHub PAT `permissions`, Okta `ApiServiceIntegration.granted_scopes`
- number: 2
  name: permits
  layer: grant
  arity: 2
  role: null
  form: Policy | Credential --> Resource
  branches:
  - {from: [Policy, Credential], to: [Resource]}
  evidence: Snowflake `GRANTS_TO_ROLES`, GitHub deploy key
- number: 3
  name: member_of
  layer: grant
  arity: 2
  role: null
  form: Principal --> Tenant | Principal | Resource
  branches:
  - {from: [Principal], to: [Tenant, Principal, Resource]}
  evidence: GitHub org members, Graph group members
- number: 4
  name: owned_by
  layer: grant
  arity: 2
  role: null
  form: Endpoint | Automation | Credential --> Integration | Tenant ; Resource --> Principal ; Principal --> Integration
  branches:
  - {from: [Endpoint, Automation, Credential], to: [Integration, Tenant]}
  - {from: [Resource], to: [Principal]}
  - {from: [Principal], to: [Integration]}
  evidence: Graph `subscription.applicationId`, Drive `File.owners`, Okta `Group.external_source_app_id`
- number: 5
  name: registered_in
  layer: grant
  arity: 2
  role: null
  form: Integration --> Tenant
  branches:
  - {from: [Integration], to: [Tenant]}
  evidence: Graph `servicePrincipal`, GitHub App installation
- number: 6
  name: registered_by
  layer: grant
  arity: 2
  role: null
  form: Integration --> Principal
  branches:
  - {from: [Integration], to: [Principal]}
  evidence: Graph `createdObjects`
- number: 7
  name: acts_as
  layer: grant
  arity: 2
  role: null
  form: Integration --> Principal
  branches:
  - {from: [Integration], to: [Principal]}
  evidence: Graph `servicePrincipal.appId`
- number: 8
  name: authenticates_with
  layer: grant
  arity: 2
  role: null
  form: Principal | Endpoint | Integration --> Credential
  branches:
  - {from: [Principal, Endpoint, Integration], to: [Credential]}
  evidence: Snowflake PAT, Okta 앱 키, Graph `application.keyCredentials`
- number: 9
  name: runs_as
  layer: grant
  arity: 2
  role: null
  form: Automation --> Principal | Credential
  branches:
  - {from: [Automation], to: [Principal, Credential]}
  evidence: Azure Automation `identity.principalId`
- number: 10
  name: triggered_by
  layer: grant
  arity: 2
  role: null
  form: Automation --> Principal | Endpoint | Resource | Integration
  branches:
  - {from: [Automation], to: [Principal, Endpoint, Resource, Integration]}
  evidence: GitHub `actor`, `repository_dispatch`, ServiceNow Business Rule `table`, Azure Logic Apps `ApiConnection` 트리거
- number: 11
  name: receives_into
  layer: grant
  arity: 2
  role: null
  form: Endpoint --> Tenant | Resource
  branches:
  - {from: [Endpoint], to: [Tenant, Resource]}
  evidence: Azure Monitor DCR `workspaceResourceId`
- number: 12
  name: shared_with
  layer: grant
  arity: 2
  role: null
  form: Resource --> Tenant
  branches:
  - {from: [Resource], to: [Tenant]}
  evidence: Drive `permissions type:domain`
- number: 13
  name: applies_to
  layer: grant
  arity: 2
  role: null
  form: Policy --> Principal | Integration | Resource | Tenant
  branches:
  - {from: [Policy], to: [Principal, Integration, Resource, Tenant]}
  evidence: Okta `conditions.people`, Entra `conditionalAccessUsers`, GitHub ruleset `conditions`
- number: 14
  name: excludes
  layer: grant
  arity: 2
  role: null
  form: Policy --> Principal | Integration | Credential | Policy
  branches:
  - {from: [Policy], to: [Principal, Integration, Credential, Policy]}
  evidence: Okta `conditions.people.*.exclude`, GitHub ruleset `bypass_actors`
- number: 15
  name: evaluates
  layer: grant
  arity: 2
  role: null
  form: Policy --> Policy
  branches:
  - {from: [Policy], to: [Policy]}
  evidence: Entra `conditionalAccessGrantControls.authenticationStrength`, Okta `conditions.network.include`
- number: 16
  name: trusts
  layer: grant
  arity: 2
  role: null
  form: Tenant --> Tenant
  branches:
  - {from: [Tenant], to: [Tenant]}
  evidence: Entra `crossTenantAccessPolicy`, Slack `team.externalTeams.list`
- number: 17
  name: contained_in
  layer: structure
  arity: 2
  role: null
  form: any --> any
  branches:
  - {from: [any], to: [any]}
  evidence: GCP `Project.parent`, Drive `File.parents`, Okta `ApplicationKeyCredential`

grades:
- name: 구조
  perspective: Structure
  relation_types: [contained_in]
  default: 접힘
- name: 접근
  perspective: Authority
  relation_types: [has_role_on, permits, member_of, owned_by, applies_to, excludes, evaluates]
  default: 펼침
- name: 신뢰
  perspective: Trust
  relation_types: [authenticates_with, runs_as, triggered_by, acts_as, trusts, registered_in, registered_by, receives_into, shared_with]
  default: 펼침, 강조

engine_probe:
  what: 대시보드 엔진에 시험 입력을 넣어 나온 간선이다. 엔진의 규칙 그 자체가 아니다 — inputs 로 시험했고, depends_on_inputs 는 입력에 따라 달라지는 것이다. template 이 받는 칸만 적었고, 받지 않는 칸에서 나온 간선 수는 outside_template 에 센다
  inputs:
    provider: probe
    objects: 출발(source) · 도착(target) 둘. interface 하나씩, properties · judged 없음
    relation_properties: {basis: stated}
    role: null
    subtracted: 관계 없이 같은 객체로 만든 간선을 뺐다
  depends_on_inputs:
  - has_role_on 의 rank — 엔진은 역할로 정한다(roleCapability). 시험에는 역할이 없어서 늘 rank 없음 + role_rank_unknown 이다
  - 'member_of 의 M · G — 도착이 그룹 같은가(isGroupLike: 테넌트, 그룹 타입, principal_kind group, 들어오는 member_of)로 정한다. interface 쌍으로 정하는 것이 아니다'
  - member_of · shared_with 의 rank — provider · 대상 타입 · 역할로 정한다(membershipRank, roleCapability). 시험 provider 는 probe 라 기본값이 나왔다
  - provider 마다 갈리는 갈래(Okta resource_set, Slack 채널 멤버 능력 · 공개 여부, 컨테이너 바인딩)는 variants 에서만 시험했다
  - 객체가 interface 를 여럿 가지면 다른 갈래를 탈 수 있다. 시험은 interface 하나짜리 객체만 썼다
  - 2026-11-01 위협 간선을 관계 효과 표로 옮기며(A6) has_role_on 네 갈래, shared_with · contained_in 의 Slack 공개 갈래, contained_in.group_tenant · automation_resource 는 운영 엔진(aegi-adapter-engine edges.ts)을 읽어 맞췄다
  - 2026-11-20 has_role_on.gcp_project_member 는 운영 엔진(aegi-adapter-engine main f134243 + 사본만 바꾼 fix/gcp-log-gaps)에 3회차 실측 원본(r3-20261119-all)을 넣어 떴다. gcp 간선 M IamMember → Project 가 7 → 12, G 는 역할 세기가 갈려 23 → 24(앱 사용자 역할이 [read, create] 라 같은 사람의 보기 역할과 다른 간선), 다른 SaaS 객체 · 관계 · EA · 접근 표 해시는 같았다
  - 2026-11-20 has_role_on.gcp_public_principal 은 같은 방법(엔진 fix/gcp-profiles-review, #499 시험 원본의 allAuthenticatedUsers)으로 떴다. 누구나 → 프로젝트 G 하나가 생겼다. contained_in.gcp_app_store_caller 는 3회차 실측 원본(r3-20261119-all)에서도 U 저장소 → 앱 10개가 0 이 됐다
  - 2026-11-19 contained_in.gcp_app_store_caller · gcp_connector_store 는 운영 엔진(aegi-adapter-engine main 47e1eca 에 #499 를 합친 로컬 트리, 효과 표를 읽음)에 #499 의 가짜 원본(runner/gcp-gemini-enterprise.test.mjs)을 정규화해 넣어 떴다. 사전만 바꿔 U 저장소 → 앱 3개, 저장소 → 커넥터 1개가 빠지고 다른 간선은 그대로였다
  - 2026-11-05 triggered_by.input_carried(시작시킨 자원 → 자동화 F) 는 운영 엔진(aegi-adapter-engine edges.ts, 효과 표를 읽음)과 대시보드 edges.ts 손코드 갈래를 읽어 적었다. 시험 입력은 출발 자동화에 runs_as → Credential 관계 하나를 더한 것이다
  relations:
    has_role_on:
      use: edges
      edges:
      - pairs: [Principal>Resource, Principal>Tenant, Principal>Integration, Principal>Automation, Policy>Resource, Policy>Tenant, Policy>Integration, Policy>Automation, Credential>Resource, Credential>Tenant, Credential>Integration, Credential>Automation, Integration>Resource, Integration>Tenant, Integration>Integration, Integration>Automation]
        emits:
        - {kind: G, from: source, to: target, uncertain: [role_rank_unknown]}
      outside_template: {cells: 65, with_edges: 65}
      variants:
      # 2026-11-07 aegi-adapter-engine scripts/relationEdges.test.ts 「계정 상태」로 엔진에 넣어 본 결과(engine feat/principal-account-state)
      - name: has_role_on.inactive_account
        when: source account_state deleted, deprovisioned, suspended
        cases:
        - {pair: Principal>Resource, emits: []}
        - {pair: Principal>Tenant, emits: []}
        - {pair: Principal>Integration, emits: []}
        - {pair: Principal>Automation, emits: []}
      - name: has_role_on.deleted_assignment
