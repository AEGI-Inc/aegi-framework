    D · H 도 같다 — Apps Script 가 웹훅 주소를 스크립트 속성에 두면 Apps Script API 로는 못 읽어(코드 파일 · 매니페스트만 준다)
    secret_fingerprint 의 a 쪽이 빈다. 남는 근거는 실행 · 전송 기록뿐이다. Relation_Schema_v3 는 교차 관계를 stated 만 허용하므로
    지금 키 종류로는 못 잇는다. C 의 로그 상관 Link(kinds.log_correlation)도 뜻은 이 관계다 — 2026-11-15 에 그 Link 를 빼도 gt:board 가
    그대로임을 쟀다(그 note). 실행 기록은 SaaS 가 아니라 봇 자체 기록이라 실제 고객에게서는 드물다
  options: [그대로 둔다 — Link 나 관측으로만 본다, observed 교차 관계를 허용하고 판단 불가로 표시한다]
- id: missing_target
  question: 벤더 설정이 가리키는 상대가 수집한 목록에 없을 때 어떻게 적나
  why: >-
    Link_Schema_v3 「아직 안 정한 것」 그대로. g2 에서 Okta 의 Slack 앱 3개가 수집한 것과 다른 Slack 워크스페이스 · 엔터프라이즈를
    가리킨다. 지금은 target_missing: report — 잇지 않고 적는다
  options: [안 만든다, status unresolved 로 만든다]
- id: registered_in_across
  question: SaaS 를 넘는 「앱이 테넌트에 붙어 있다」에 registered_in 을 그대로 쓰나
  why: 대시보드 cross.ts 가 properties.cross_provider 로 구분해 두고 「aegi-schema 에 확인 요청할 결정」으로 남겼다
  options: [registered_in 그대로, 새 관계 이름]
- id: federated_proof
  question: M2 를 resolved 로 올리는 근거로 registered_in 을 요구하나
  why: >-
    Link_Schema_v3 M2 의 키는 「앱 ↔ 대상 테넌트」다. 대시보드는 앱 이름으로 대신 본다(federated_subject.differs).
    요구하면 테넌트 가리킴 칸을 수집하기 전까지 SAML 연결이 possibly_same 으로 내려간다
  options: [요구한다 — 지금 적은 대로, 앱 이름 같은 약한 근거도 받는다]
- id: group_push
  question: Okta 그룹 push 매핑을 어느 키 종류로 받나
  why: >-
    Link_Schema_v3 「아직 안 정한 것」 — Slack 쪽 그룹 id 를 API 로 못 얻는다. 대시보드는 v1 규칙(normalize/identity.ts
    buildGroupLinks)으로 만들고 단계 미결로 표시한다
  options: [SCIM 읽기를 수집 범위에 넣는다, 그룹 이름으로 맞춘다 (possibly_same), 사람이 확인한다 (M5)]

# 정한 것 — open 에서 옮겨 왔다. 질문은 그대로 두고 무엇으로 정했는지와 근거를 적는다
decided:
- id: link_material_kept
  question: 오브젝트 모델 v1 묶음에 Link 재료(GitHub ExternalIdentity 등)를 남기나
  decision: 묶음에 link_material 로 따로 남긴다
  when: 2026-10-19
  by: >-
    aegi-dashboard PR #120(머지 6bacb1c). normalize:model-v1 이 투영에서 뺀 Link 재료를 link_material.json 에 원본 그대로 쓰고,
    validate:model-v1 이 그 키가 model_report.json 의 link_only_objects 와 같은지 · 그래프에 없는지 · 원본과 같은지 본다.
    join.py 는 묶음의 link_material 을 읽는다 — 재료가 있으면 SAML 3건도 다시 계산된다(재료 없음 0)
- id: alias_level
  question: Okta Google 앱 배정의 username 이 GWS 주 이메일이 아니라 별칭과 맞으면 몇 단계로 잇나
  decision: 2026-11-03 부터 별칭이 맞아도 resolved (email_same_person). 옛 결정(2026-10-19)은 별칭만 맞으면 possibly_same, 두 계정의 사람 이름도 같으면 resolved 였다
  when: 2026-11-03
  by: >-
    Relation 주담당 2026-11-03 결정(email_same_person)이 대신한다. 별칭도 그 사람의 이메일이다. 옛 결정이 걱정한 「주소가 사람 사이를
    옮겨 다니는」 경우(퇴사자 주소를 다른 사람 별칭으로)는 같은 사람으로 묶이는 위험을 받아들이고, 사후 분석에 그 연결이 있는 편을 골랐다.
    옛 결정: Relation 담당(aegi-schema 이슈 #20 V2-R2 답변, 2026-10-19)
- id: okta_client_view
  question: Okta OAuth2Client 와 같은 client_id 를 가진 Okta 앱은 객체 둘인가, M4 의 Okta 클라이언트 id 는 어디서 읽나
  decision: 객체 하나(앱)다. M4 a 쪽은 Okta 앱의 properties.client_id 에서 읽는다
  when: 2026-10-20
  by: >-
    aegi-dashboard 오브젝트 모델 v2 결정 V2-D05(PR #127 머지)를 받았다 (aegi-schema 이슈 #20 답변에서 v2 가 main 에 들어오면 바꾸기로 했다).
    OAuth2Client 는 Okta 가 같은 앱을 클라이언트 API 로 보여 준 것이라 투영이 앱에 합치고, 그 키를 가리키던 관계 · 참조 · Link 를 앱으로
    옮긴다. 두 줄을 같이 두면 둘 다 있는 옛 묶음에서 같은 봇 연결이 두 번 생겨서 줄을 바꿨다
- id: app_account_filter
  question: natural_key 가 앱 계정을 거를 때 SaaS 원래 칸 대신 판정값 account_kind(판단표 G4-Q07)를 쓰나
  decision: >-
    SaaS 원래 칸은 그대로 두고, 엔진 G4 판정(account_kind)을 이 파일의 거르기에 맞춘다 — Salesforce CsnOnly 는 human, Guest 는 app,
    Slack is_app_user 는 사람 쪽(is_bot 만 app). Salesforce 가 조직마다 만드는 Chatter Expert 계정은 CsnOnly 여도 app 으로 따로 가른다
  when: 2026-11-01
  by: >-
    Relation 주담당 결정(판단표 G4-Q07, 권고대로). 거르기를 account_kind 로 바꾸면 엔진이 G4 판정을 동일인 연결 앞으로 옮기고 S9 시험과
    엔진 정답 시험을 같이 고쳐야 한다. 이 파일의 입장(「Chatter Free(CsnOnly) 사용자는 사람이라 잇는다」, ontology/README.md, S9 시험의 SF-C)과
    다르게 판정하던 엔진 쪽을 맞추는 편이 작다. 엔진은 aegi-adapter-engine scripts/collect/shared/judgments.ts accountKindOf 가 따르고,
    judgments.test.ts 가 판정 목록이 이 파일의 natural_key 거르기(Salesforce user_type 목록, Slack is_bot)와 같은지 맞춰 본다.
    판정이 바뀌는 계정은 대시보드 실측(10-27 게시본, 10-30 실측 묶음)과 저장소 데이터셋 넷에서 0 이다 — CsnOnly 계정은 실측과
    aegi_inc_measured_v2 에 하나씩이고 모두 Chatter Expert 다(따로 가르지 않았다면 human 으로 바뀐다). Guest 와 Slack is_app_user 계정은
    없다. Chatter Expert 는 이 파일의 거르기는 지나지만 사람 값과 맞지 않아 지금 링크에 없다
- id: email_same_person
  question: 두 계정의 이메일이 같으면 같은 사람으로 얼마나 강하게 잇나 (SaaS 가 달라도, admin@ 같은 공용 주소, 한 SaaS 안 여러 계정이어도)
  decision: >-
    같은 이메일이면 SaaS 를 가리지 않고 같은 사람(resolved)으로 잇는다. 공용으로 보이는 주소(앞부분이 admin, security, noreply 같은 것,
    한 SaaS 안에서 두 계정 이상이 같은 주소)도 잇고, 링크 간선에 shared_mailbox_suspected 만 남긴다. 판정은 바꾸지 않는다.
    비교는 대소문자, 앞뒤 공백을 가리지 않고 빈 값, 가린 값, 자리표시 값은 일치로 보지 않는다 (email_match, transform email_address)
  when: 2026-11-03
  by: >-
    Relation 주담당 결정. 사후 분석에서 그 연결이 있는 편이 낫다. M3 natural_key 의 이메일 줄(Slack, Salesforce Email, Atlassian, GitHub
    확인 도메인 메일)과 Okta Google 앱 배정 username ↔ GWS 이메일(주 이메일, 별칭) 줄이 resolved 가 된다. Salesforce Username, GitHub SAML
    nameId, Salesforce FederationIdentifier 줄은 이메일 칸이 아니라 그대로다. alias_level 의 옛 결정과 open.same_provider_accounts,
    open.service_account_email 을 이 결정이 대신한다. Jira (라)(Okta 프로비저닝으로 잇기)는 이 결정으로 우선순위가 내려갔다
- id: alias_domain_level
  question: 같은 조직이 DNS 로 확인한 별칭 도메인끼리 앞부분이 같은 주소(email_match.domain_alias)를 몇 단계로 잇나
  decision: resolved (domain_alias.level). 주소 허브도 그 묶음을 한 주소로 본다. 링크에 domain_alias 표시는 그대로 남긴다
  when: 2026-11-14
  by: >-
    11-03 결정(email_same_person)의 취지 「같은 사람의 메일이면 확정」을 데이터로 넓혔다(Relation 담당 세션, 사용자 위임). 11-04 운영 수집본에서
    별칭으로 맞춘 간선 3개가 모두 Okta 있는 원래 Link 에서도 같은 사람이었고, 거기서는 Okta 관리자가 그 별칭 주소를 앱 사용자 이름으로 배정해
    이미 resolved 였다. Okta 있음 데이터셋은 바이트까지 같고, Okta 없음 · Okta · GWS 없음에서 잘못 잡힌 주체가 0 이 되고 라벨 틀림이 0 이 됐다
    (Link_Schema_v3 「별칭 도메인 단계」). 같은 조직의 두 도메인에서 앞부분만 같은 다른 사람은 수집본에 없었다 — 생기면 domain_alias 표시로 가려 본다
- id: same_provider_accounts
  question: 한 허브 계정이 natural_key(M3)로 같은 provider 계정 둘 이상과 맞으면 다 잇나 (aegi-knowledge#28 4번을 옮겨 적음)
  decision: 다 잇는다(지금 구현). 이메일이 같은 같은 provider 계정 여럿은 링크 간선에 shared_mailbox_suspected 를 남긴다
  when: 2026-11-03
  by: >-
    Relation 주담당 2026-11-03 결정(email_same_person). #28 4번(10-22)의 어긋남을 구현 쪽으로 정했다. Link_Schema_v3 「set 안의 provider가
    전부 다르다」는 이 결정으로 같은 이메일이면 같은 provider 계정 여럿을 받는다
- id: service_account_email
  question: 사람의 메일 주소를 email 로 쓰는 서비스 계정을 M3(natural_key)로 그 사람과 잇나
  decision: 그대로 잇는다. 이메일이 같으니 resolved 이고, 공용으로 보이는 주소면 shared_mailbox_suspected 를 남긴다
  when: 2026-11-03
  by: >-
    Relation 주담당 2026-11-03 결정(email_same_person). 그 메일함 주인이 비밀번호 재설정으로 계정을 가져갈 수 있어 사후 분석에 그 연결이
    있는 편이 낫다. 서비스 계정 표시를 수집해 빼는 길은 고르지 않았다
- id: slack_profile_not_account
  question: Slack users.profile.get 응답(200.profile)을 계정(Principal)으로 두나
  decision: >-
    계정으로 두지 않는다. 그 사용자 member 계정의 프로필을 읽는 호출이라 사람 수, 테넌트 소속, 동일인 맞추기에서 빠진다.
    응답에 사용자 ID 가 없어 member 로 합치지 못하므로 객체를 만들지 않는다(같은 칸은 users.list members[*].profile 에 있다)
  when: 2026-11-10
  by: >-
    2026-11-10 Relation 주담당 위임, Claude 가 정함. 11-04 수집본에서 수집기 토큰 사용자의 프로필이 이름 없는 Principal 로 나와
    헬프데스크 명령 경로(GT-C)의 연동 쪽 사람으로 셌다. 엔진은 Profile 보정 emit reference_only 로 따른다
- id: audit_only_actor_system
  question: users.list 에 없고 감사 로그 actor 에만 나오는 Slack 행위자(Slack User, Salesforce System User 같은 시스템 행위자)를 테넌트 소속 사람으로 치나
  decision: >-
    치지 않는다. account_kind 를 system 으로 두고(이름이 아니라 users.list 에 없다는 사실로 가른다), 테넌트 소속 간선을 붙이지 않고,
    관측 기록의 행위자로만 남긴다. 나중에 users.list 에 나타나면 그때 사람이다. users.list 를 수집하지 못한 수집본에서는 가르지 않는다
  when: 2026-11-10
  by: >-
    2026-11-10 Relation 주담당 위임, Claude 가 정함. 11-04 수집본에서 감사 로그에만 나오는 행위자 둘이 사람(human)으로 판정돼
    헬프데스크 명령 경로(GT-C)의 연동 쪽 사람으로 셌다. Interface_Spec_v3 account_kind 에 system 을 더했다
