# SaaS 를 넘는 연결 규칙 — 키 종류마다 한 줄 (2026-10-18)
#
# Link_Schema_v3 「규칙은 provider 쌍이 아니라 방법 단위로 쓴다」. 그래서 여기에는 SaaS 이름이 없다.
# 한 줄 = "a 객체가 가진 이 종류의 값과 b 객체가 가진 같은 종류의 값이 같으면, 이것을 만든다".
# 어느 SaaS 의 어느 칸이 어느 종류인지(칸 표시)는 아래 fields 에 따로 적는다 — 새 SaaS 가 들어와도 kinds 는 그대로 두고
# fields 에 줄만 늘린다. 둘을 읽어 실제로 잇는 것은 ontology/join.py 다.
#
# 무엇을 관계로, 무엇을 Link 로 만드나는 이미 정해져 있다 — Relation_Schema_v3 「교차 provider 관계는 stated 만」 ·
# Profile_Schema_v4.2 external_refs. 출발이 Integration · Automation · Credential · Endpoint 이고 벤더가 적어 준 값이면 관계,
# 출발이 Principal 이면 "같은 사람" 추정이라 Link 다. validation/check_semantics.py S9 가 이 경계를 본다.
#
# 칸
#   meaning         사람이 읽는 한 줄. 기계는 안 읽는다 — 정답은 아래 칸들이다
#   method          Link_Schema_v3 「맞추는 방법」의 번호 (Link 만)
#   a · b           양쪽 객체의 interface. Link 는 a 가 허브(IdP) 쪽이다 (Link_Schema_v3 「허브 구조」)
#   same            맞추는 법 — exact 그대로 · casefold 대소문자와 앞뒤 공백 무시 · co_occurs 한 기록 행에 두 값이 함께 나온다
#   evidence        stated 벤더 설정 · API 가 적어 준 값 / observed 실행 · 요청 기록
#   tier            근거 세기 — groundtruth/connection-rules/legend.yaml tier 이름 그대로(config_id · config_name · fingerprint · via_person ·
#                   log_id · log_time). 범례 layer 가 truth 면 evidence stated, observed 면 evidence observed 다. 만든 관계 · Link 간선에 그대로 남긴다
#   makes           관계면 {relation, from, to}. Link 면 {link: [{level, when}]} — 위에서부터 먼저 맞는 단계 하나, 마지막은 when 없이.
#                   link_kind 는 Link 의 meta.kind (relation_semantics.yaml rules.automation_links 가 automation 을 읽는다)
#   places          식에서 쓰는 자리 중 끝 찾기로 구하는 것 — {자리: {from: a 또는 b, ...}}. from 객체에서 출발해
#                   relation_semantics.yaml resolvers 와 같은 칸(refs · relations · depth · want · take)으로 찾는다.
#                   resolvers 의 한 줄을 그대로 쓰려면 {from, resolver: <이름>}
#   where           이것도 맞아야 잇는다 (ontology/match.py 식. 자리는 a · b 와 places)
#   target_missing  값이 가리키는 상대가 수집한 목록에 없을 때 — report 잇지 않고 「못 이은 이유」에 적는다 / ignore 가리키는 값이 아니라 적을 것이 없다
#   fields.unique_match  true이면 같은 holder·값이 서로 다른 상대 끝점 여러 개에 맞을 때 연결하지 않고 ambiguous로 보고한다. 기본 false, 다대다 규칙에는 적용하지 않는다.
#   records         만든 연결에 같이 남기는 칸
#   now_in          같은 일을 하던 옛 대시보드 규칙 — <파일>:<규칙 이름 또는 관계 이름>. 그 코드는 지워졌고(aegi-adapter-engine #112)
#                   엔진은 이 파일을 바로 읽는다. S9 엔진 대조는 이 칸을 보지 않는다 (#61). 옛 실측 묶음(AEGI_MEASURED)의 연결을
#                   읽을 때만 쓴다. 새 종류에는 적지 않는다
#   note · differs  사람이 읽는 덧붙임 · 대시보드와 다르게 적은 것

sources:
  skip_if: aegi-dashboard scripts/collect/normalize-v2/cross.ts ofType(stub 제외) · identity.ts M1(stub 이면 안 잇는다) @ 1b5481c
  link_one_per_provider: aegi-dashboard scripts/collect/normalize-v2/identity.ts — 앱 배정 username 은 gws 가, email 은 slack 이 아직 집합에 없을 때만 잇는다 @ 1b5481c
  hubs: >-
    docs/Link_Schema_v3.md 「허브 구조」 · 「허브가 둘일 때」(2026-11-13). 11-04 운영 수집본을 Okta 없이 정규화(엔진 normalize --without okta)하면
    사람 Link 가 0개였고, GWS 를 둘째 허브로 두면 9개로 돌아온다. Okta 와 같이 두면 원래 데이터셋의 Link 가 바이트까지 같다(GWS 줄이 이은 22개는
    모두 Okta 가 이미 이은 계정, 충돌 0). 순서와 합치기는 엔진 scripts/collect/shared/join.ts groupPeople.
    주소 허브(2026-11-14, 「주소 허브」): Okta · GWS 를 다 빼면(--without okta,github:GH-20,gws) 사람 Link 0개 → 6개(16계정), 같은 사람 묶음 36 → 26.
    Okta 있음 · Okta 없음 데이터셋은 바이트까지 같다(남은 계정 가운데 같은 주소를 SaaS 둘이 쓰는 것 없음). 엔진 join.ts addressGroups · placeAddresses
  relation_marks: aegi-dashboard scripts/collect/normalize-v2/cross.ts addRelation properties.cross_provider @ 1b5481c
  email_match: >-
    Relation 주담당 2026-11-03 결정(decided.email_same_person). 공용 주소 앞부분은 RFC 2142(역할 메일함 이름 — postmaster, abuse, security,
    webmaster, info, sales, support 등)와 흔한 역할 주소에서 골랐다. 자리표시 값과 가린 값의 모양은 join.py, 엔진 join.ts 의 email_address 에 같이 있다. domain_alias(2026-11-08)는 Atlassian 조직 도메인(실측 값 claim_status verified, claim_type dns)과
    Google Workspace 도메인(admin#directory#domain, verified)에서 읽는다. 실측 dataset-prod3-relineage-20261108 에서 Atlassian 조직 하나가 example.com 과
    example.org 를 둘 다 DNS 로 확인했고, Okta login 은 example.com, GitHub 조직 확인 도메인 메일은 example.org 라 같은 주소 줄로는 안 이어졌다
  kinds: >-
    키 종류 · 단계 — docs/Link_Schema_v3.md 「맞추는 방법」(M1–M4) · 「허브 구조」. 관계와 Link 의 경계 — docs/Relation_Schema_v3.md
    「교차 provider 관계는 stated 만」 · docs/Profile_Schema_v4.2.md external_refs. 이어지는 동작 — aegi-dashboard
    scripts/collect/normalize-v2/cross.ts · identity.ts @ 1b5481c. 모양은 Link_Schema_v3 「방법 단위로」 예시와 달리 provider 를
    적지 않는다 — provider 는 칸 표시로 간다. request_target 은 groundtruth/connection-rules/gws-slack.yaml
    slack_request_to_apps_script 의 config_id 줄 · gws-external.yaml apps_script_web_app, 효과는 relation_semantics.yaml
    triggered_by (Automation>Endpoint)
  fields: >-
    aegi-dashboard scripts/collect/normalize-v2/cross.ts · identity.ts 가 읽는 칸, 그 칸을 만드는 slack.ts · okta.ts · gws.ts ·
    github.ts @ 1b5481c. 키 종류는 위 kinds. link_material 은 오브젝트 모델 v1 의 runtime-catalog.json link_only
    (docs/spec/model-v1, scripts/collect/model-v1/project.ts @ f0ef4b8). request_target 의 두 줄은 aegi-adapter-engine
    scripts/collect/normalize-v2/slack.ts SL-10 매니페스트(slash_commands[].url 을 url_host · url_path 로 나눈다) · gws.ts GW-11
    배포 목록(deployments[].deploymentId) @ a670ed2. 벤더 문서 — Slack 앱 매니페스트 slash_commands[].url 「the full https URL that
    acts as the slash command's request URL」(docs.slack.dev/reference/app-manifest), Apps Script API projects.deployments
    (deploymentId, entryPoints[].webApp.url), 웹앱 주소 script.google.com/macros/s/<배포 ID>/exec ·
    Workspace 도메인이면 /a/macros/<도메인>/s/<배포 ID>/exec (developers.google.com/apps-script/guides/web).
    natural_key 의 Salesforce · Atlassian 줄은 groundtruth/connection-rules okta-salesforce.yaml · okta-atlassian.yaml email_match,
    값은 aegi-adapter-engine scripts/collect/normalize-v2/salesforce.ts SF-02 (SOQL User 의 Email · Username 을 소문자로
    identifiers 에, CreatedDate 를 properties.created 에) · atlassian.ts JI-02 (users/search 의 emailAddress 를 소문자로 identifiers 에)
    @ a670ed2. Jira 는 사용자의 개인정보 설정에 따라 email 을 안 준다 — 「fields such as email will only be returned by the API if the
    user has permitted that data to be visible」(developer.atlassian.com/cloud/jira/platform/deprecation-notice-user-privacy-api-migration-guide).
    Salesforce 시스템 사용자 UserType(AutomatedProcess · CloudIntegrationUser · Guest)은 동기화에서 빼는 값으로 알려져 있다
    (oomnitza.zendesk.com 「Creating an extended integration for Salesforce users」, 2차 출처. Salesforce User 객체 문서는 이 환경에서 403).
    federated_subject 의 Salesforce 줄은 groundtruth/connection-rules okta-salesforce.yaml saml_sso 의 via_person 줄, 값은
    aegi-adapter-engine salesforce.ts SF-02 (SOQL User 의 FederationIdentifier · Username 을 소문자로 identifiers 에) · okta.ts OK-07
    앱 배정(credentials.userName 을 소문자로). 벤더 문서 — Salesforce Object Reference User.FederationIdentifier 「the value that must
    be listed in the Subject element of a Security Assertion Markup Language (SAML) IDP certificate to authenticate the user」,
    SamlSsoConfig.IdentityMapping 「Username · FederationId · UserId」(developer.salesforce.com get_document_content 로 읽음),
    Okta Management API Application 「salesforce」 키 이름(developer.okta.com/docs/api/openapi/okta-management/management/tag/Application)
  open: 이 파일을 쓰며 드러난 팀 결정 — Link_Schema_v3 「아직 안 정한 것」 · 대시보드 cross.ts 머리말 · PR #19 「실측 대조로 드러난 것」
  decided: open 에 있다가 정해진 것 — 정한 날짜와 근거(머지된 PR)를 같이 적는다

# 껍데기(수집 안 된 자리표시) 객체는 어느 쪽이든 잇지 않는다
skip_if: {any: [{a: {meta: {stub: true}}}, {b: {meta: {stub: true}}}]}

# Link 는 허브 계정 하나와 provider 하나 사이에 키 종류 하나만 남는다. kinds 를 위에서부터 시도해 먼저 이은 종류가 남고, 다른 종류는
# shadowed 로 뺀다. 같은 종류로 맞은 그 provider 계정이 여럿이면 다 잇는다(join.py). 그래도 되는지는 open.same_provider_accounts
link_one_per_provider: true

# 허브 — 같은 사람 Link 는 허브 계정 하나에서 시작한다(Link_Schema_v3 「허브 구조」, 2026-11-13). 허브는 계정을 내주는 디렉터리다:
# IdP(Okta) 또는 메일 디렉터리(GWS). 위가 먼저다. 위 허브가 아래 허브 계정을 이었으면(Okta ↔ GWS) 같은 사람이라 한 Link 로 합친다.
# 아래 허브가 이은 계정이 이미 다른 사람 Link 에 있거나, 합친 사람이 그 SaaS 계정을 위 허브로 이미 가졌는데 다른 계정이면 더하지 않고
# 「연결 충돌」로 적는다(link_one_per_provider 는 합친 Link 에도 지킨다). name 은 Link 이름으로 쓰는 칸.
# Microsoft 365(Entra) 사용자도 메일 디렉터리 허브다(Link_Schema_v3 「허브가 둘일 때」). 2026-11-20 수집기(engine #534)가 생겨 줄을 넣었다. GWS 다음 순위
# 맨 아래 주소 허브(role address, 2026-11-14)는 계정이 아니라 정규화한 주소 하나가 기준점이다. 위 허브가 사람 Link 에 넣지 않은 계정 가운데
# kind 의 이메일 칸(transform email_address, end 없음 — 그 계정 자신의 주소) 값이 같은 계정을 SaaS 둘 이상이면 한 Link 로 묶는다.
# 다른 키와 섞어 사슬로 잇지 않는다 — 묶음은 「그 주소를 쓰는 계정들」을 넘지 않고, 주소 둘을 가진 계정은 두 Link 에 다 들 수 있다.
# 그 주소를 쓰는 계정이 이미 위 허브 사람 하나에 있으면 남은 계정을 그 사람에 합친다(같은 합치기 · 충돌 규칙). 디렉터리 확인이 없어
# Link 에 주소 허브 출처(meta.hub address)를 남기고, 단계는 email_match 그대로(같은 주소 = resolved). 공용 주소 표시와 봇 · 시스템 거름도 kind 그대로다
hubs:
- {provider: okta, object_type: User, role: idp, name: properties.login}
- {provider: gws, object_type: User, role: mail_directory, name: properties.primaryEmail}
- {provider: microsoft, object_type: User, role: mail_directory, name: properties.userPrincipalName}
- {role: address, kind: natural_key}

# 여기서 만든 관계 행에 다는 표시. 같은 이름의 SaaS 안 관계(GitHub 앱 설치 → 조직의 registered_in 등)와 가른다
relation_marks: {cross_provider: true}

# 같은 이메일이면 같은 사람 (2026-11-03 Relation 주담당 결정, decided.email_same_person).
# 두 끝 칸이 다 transform email_address 를 거친 값(이메일 칸)이면, 키 종류의 makes 가 더 약해도 그 링크 단계를 level 로 올린다.
# email_address 는 앞뒤 공백을 빼고, 빈 값 · 가린 값(* • … █) · 이메일 모양이 아닌 값 · 자리표시 값(unknown@, none@ 등)을 버린다(일치로 보지 않는다).
# 대소문자는 키 종류의 same: casefold 가 가린다. 공용으로 보이는 주소는 묶되 링크에 shared_mailbox_suspected 만 남긴다(판정은 그대로):
# 주소 앞부분(+ 뒤를 뺀)이 local_parts 에 있거나, same_provider 이면 한 SaaS 안에서 두 계정 이상이 같은 주소일 때
email_match:
  level: resolved
  shared_mailbox:
    local_parts: [admin, administrator, root, security, secops, soc, noc, abuse, postmaster, hostmaster, webmaster, noreply, no-reply, donotreply, do-not-reply, info, support, help, helpdesk, it, ops, billing, accounts, sales, marketing, contact, hello, team, office, hr, alerts, notifications, service, system]
    same_provider: true
  # 2026-11-08. 같은 조직이 DNS 로 확인한 도메인끼리는 그 조직의 메일 도메인 별칭으로 본다. 이메일 칸끼리 앞부분이 같고 도메인만
  # 같은 별칭 묶음이면 kinds 의 키 종류로 잇는다. 묶음은 domains 칸 값을 그 객체의 end(조직, 고객) 단위로 모아 겹치는 도메인끼리 합친다.
  # 링크에 domain_alias(양 끝 도메인)를 남긴다. 단계는 level(2026-11-14 decided.alias_domain_level, 없으면 그 종류의 makes 단계).
  # 주소 허브(hubs role address)도 kinds 에 그 종류가 있으면 같은 별칭 묶음의 같은 앞부분을 한 주소로 본다
  domain_alias:
    kinds: [natural_key]
    level: resolved
    domains:
    - {provider: atlassian, object_type: Domain, path: properties.name, where: {self: {property: {claim_status: verified}}}, end: references.parent_scope}
    - {provider: gws, object_type: Domains, path: properties.domainName, where: {self: {property: {verified: true}}}, end: references.tenant}

kinds:
  secret_fingerprint:
    meaning: 자동화가 쓰는 비밀 값(웹훅 주소 · 토큰)의 지문이 어떤 자격증명의 지문과 같으면, 그 자동화는 그 자격증명으로 행동한다
    a: [Automation]
    b: [Credential]
    same: exact
    evidence: stated
    tier: fingerprint
    makes: {relation: runs_as, from: a, to: b}
    where: {b: {property: {removed_at: missing}}}
    target_missing: report
    now_in: [cross.ts:runs_as]
    note: 비밀 값은 원문 대신 sha256 지문으로 비교한다(D-21). 코드가 아니라 스크립트 속성에 둔 값은 API 로 못 읽어 a 쪽이 빈다

  tenant_pointer:
    meaning: 연동 앱 설정이 다른 SaaS 의 테넌트를 이름(조직 이름 · 도메인)으로 가리키고 그 이름의 테넌트가 있으면, 그 앱은 그 테넌트에 붙어 있다
    a: [Integration]
    b: [Tenant]
    same: casefold
    evidence: stated
    tier: config_name
    makes: {relation: registered_in, from: a, to: b}
    target_missing: report
    now_in: [cross.ts:registered_in]
    note: 설정 문자열은 오타 · 이름 변경 · 삭제 뒤에도 남는다 — 상대가 없을 수 있다(Link_Schema_v3 「벤더가 준 연결의 상대편이 실제로 있는가」)

  request_target:
    meaning: >-
      다른 SaaS 의 앱이 요청을 보내는 주소(슬래시 명령의 요청 주소 등)가 이 자동화의 배포를 가리키면, 이 자동화는 그 주소로
      들어온 요청으로 시작된다
    a: [Automation]
    b: [Endpoint]
    same: exact
    evidence: stated
    tier: config_id
    makes: {relation: triggered_by, from: a, to: b}
    target_missing: report
    note: >-
      두 값 모두 벤더 설정이다 — 요청 주소는 Slack 앱 매니페스트, 배포 ID 는 Apps Script 배포 목록. 웹앱 주소의 배포 ID 는
      경로의 s 다음 조각이다. 효과는 triggered_by Automation>Endpoint 의 T(input) — 그 명령을 칠 수 있는 사람이 스크립트를
      시작시키고, 스크립트는 배포 executeAs 신원으로 돈다. Apps Script 는 요청 헤더를 못 읽어 Slack 서명을 검증하지 못한다
      (groundtruth gws-slack slack_request_to_apps_script). Slack 의 이벤트 구독 · 상호작용 요청 주소는 엔진 정규화가 아직
      객체로 만들지 않아 Slack에서는 슬래시 명령만 칸 표시에 있다. GitHub webhook은 공식 Apps Script 웹앱 주소에서 추출한 배포 ID로
      같은 수신 Project를 찾는다. 비활성 webhook은 제외하며, 여러 Project가 같은 배포 ID를 가지면 연결을 보류한다.
      배포 ID 주소 형식: developers.google.com/apps-script/guides/web. 옛 대시보드에 없던 규칙이라 now_in 이 없다

  request_host:
    meaning: >-
      다른 SaaS 의 앱이 요청을 보내는 주소(슬래시 명령의 요청 주소 등)의 호스트가 이 테넌트가 받는 호스트면, 그 주소로 보낸 요청은
      이 테넌트로 들어간다
    a: [Endpoint]
    b: [Tenant]
    same: casefold
    evidence: stated
    tier: config_name
    makes: {relation: receives_into, from: a, to: b}
    target_missing: report
    note: >-
      두 값 모두 벤더 설정이다 — 요청 주소는 Slack 앱 매니페스트(slash_commands[].url), 테넌트 호스트는 그 SaaS 의 조직 설정이다.
      Okta Workflows 의 API Endpoint 카드는 흐름을 <조직 subdomain>.workflows.okta.com/api/flo/<흐름 id>/invoke 로 열어,
      Slack 이 중간 서버 없이 흐름을 부른다(groundtruth okta-slack slash_command_to_workflows). 흐름 객체는 읽는 공개 API 가 없어
      도착은 흐름이 든 조직(Tenant)이다 — 흐름 id 로 흐름을 가리는 request_target 은 흐름 객체가 생기면 쓴다.
      효과는 receives_into Endpoint>Tenant 의 G(쓰기) · F — 그 명령을 칠 수 있는 사람의 요청이 조직의 흐름으로 들어간다.
      벤더 문서 help.okta.com/wf/en-us/content/topics/workflows/function-reference/http/http_accept.htm. GitHub Actions 워크플로 파일에 글자로 적힌 호출 주소(curl 등)도 같은 칸으로 잇는다 — 워크플로마다 주소 하나에 통로(WorkflowRequestEndpoint) 하나, 호스트가 <조직>.okta.com 이면 Okta 조직, <사이트>.atlassian.net 이면 Atlassian 사이트(groundtruth okta-github actions_calls_okta, github-atlassian actions_to_jira). 비밀이나 변수로 넣은 주소는 파일에 없어 잇지 않는다. 옛 대시보드에 없던 규칙이라 now_in 이 없다

  request_resource:
    meaning: >-
      다른 SaaS 의 자동화가 요청을 보내는 주소가 이 자원의 API 주소면, 그 주소로 보낸 요청은 이 자원으로 들어간다
    a: [Endpoint]
    b: [Resource]
    same: casefold
    evidence: stated
    tier: config_name
    makes: {relation: receives_into, from: a, to: b}
    target_missing: report
    note: >-
      두 값 모두 벤더 설정이다 — Jira · Confluence 자동화 규칙 상세의 Send web request 주소(rule.components[].value.url), GitHub 저장소의
      full_name. GitHub REST 주소는 https://api.github.com/repos/<owner>/<repo>/... 다(docs.github.com/rest). 수집기가 주소를 호스트와
      지문으로 가리면서 GitHub REST 주소면 저장소(owner/repo)만 남긴다 — 이슈 번호와 쿼리는 남기지 않는다.
      groundtruth github-atlassian jira_automation_to_github, confluence_automation_to_github. 효과는 receives_into Endpoint>Resource 의
      G(쓰기) · F — 규칙이 그 주소로 보내는 요청(이슈 댓글, 워크플로 실행)이 저장소로 들어간다. 옛 대시보드에 없던 규칙이라 now_in 이 없다

  action_resource:
    meaning: >-
      다른 SaaS 의 자동화 동작이 보낼 곳으로 이 자원의 id 를 글자 그대로 적어 두면, 그 동작이 보낸 요청은 이 자원으로 들어간다
    a: [Endpoint]
    b: [Resource]
    same: exact
    evidence: stated
    tier: config_id
    makes: {relation: receives_into, from: a, to: b}
    target_missing: report
    note: >-
      request_resource 와 같은 일을 주소 대신 자원 id 로 한다. 두 값 모두 벤더 설정이다 — Salesforce Flow 의 Slack 동작
      (actionCalls actionName slackPostMessage)의 inputParameters slackConversationId, Slack 대화(conversations.list)의 id.
      변수나 수식으로 넣은 값은 수집기가 unresolved 로 남겨 잇지 않는다. Flow 는 Flow 자신이 아니라 조직에 연결된 Slack 앱의 토큰
      (slackAppIdForToken)으로 글을 올린다. 그래서 동작마다 통로(Endpoint) 객체를 두고 Flow 에는 contained_in 으로 단다 — Jira ·
      Confluence 자동화 요청 통로(AutomationRequestEndpoint)와 같은 모양이다. 효과는 receives_into Endpoint>Resource 의 G(쓰기) · F —
      Flow 가 도는 기록의 내용이 그 채널에 올라간다. groundtruth slack-salesforce flow_slack_action. 옛 대시보드에 없던 규칙이라 now_in 이 없다.
      Slack 워크플로의 커넥터 단계(GitHub 이슈 만들기 · Jira 이슈 만들기 · Google Sheets 행 더하기)도 같은 칸으로 잇는다 — 단계마다 통로
      (WorkflowConnectorEndpoint, 워크플로에 contained_in), 입력에 글자로 넣은 저장소 · 프로젝트 키 · 스프레드시트 id 가 상대 자원이다(SL-17
      admin.workflows.search 의 steps[].inputs). 단계는 커넥터 토큰(credential_source END_USER · BUILDER)으로 부르고 그 토큰이 어느 계정 것인지는
      Slack 이 주지 않는다. Jira 프로젝트 키는 사이트마다 따로라 같은 키가 둘이면 잇지 않는다(unique_match). groundtruth github-slack
      slack_workflow_connector_github, slack-atlassian slack_workflow_connector_jira, gws-slack slack_workflow_google

  vendor_app_pair:
    meaning: >-
      한 SaaS 에 설치된 상대 벤더의 공식 연동 앱과, 상대 SaaS 에 남은 같은 연동의 앱(설치 · OAuth 승인)이 벤더가 정한 한 연동의 두 쪽이면,
      앞 앱은 뒤 앱이 든 테넌트에 붙어 있다
    a: [Integration]
    b: [Tenant]
    same: exact
    evidence: stated
    tier: config_name
    makes: {relation: registered_in, from: a, to: b}
    target_missing: report
    note: >-
      두 쪽 모두 벤더 설정이고 같은 문자열이 없다 — 앱 id 는 벤더가 모든 고객에게 같게 주는 값이라, 칸 표시의 map 이 앱 id 를 연동 이름으로 바꿔
      맞춘다(표에 없는 앱은 값이 없다). 한쪽 앱만 있으면 상대가 없다(target_missing report). 상대 테넌트가 여럿이면 잇지 않는다(unique_match).
      groundtruth github-slack github_app_for_slack(GitHub 조직의 Slack 앱 설치 app_slug slack + Slack 의 GitHub 앱),
      slack-salesforce salesforce_for_slack_apps(Slack 의 Salesforce 앱 + Salesforce 사용자가 Slack 연동 앱에 준 OAuth 승인 OauthToken.AppName).
      앱 id 는 시험 환경 수집(GH-14 installations app_id, SL-08 approved_apps app.id)에서 읽었다. 배포 앱의 id 는 워크스페이스 · 조직마다 같다.
      registered_in 을 SaaS 를 넘어 쓰는 것은 tenant_pointer 와 같다(open.registered_in_across). 옛 대시보드에 없던 규칙이라 now_in 이 없다

  credential_endpoint:
    meaning: >-
      자격증명이 부르는 주소의 호스트가 다른 SaaS 테넌트의 주소 호스트면, 그 자격증명은 그 테넌트에 권한이 있다
      (세기는 자격증명에 넣은 계정의 권한이라 설정에서는 모른다)
    a: [Credential]
    b: [Tenant]
    same: casefold
    evidence: stated
    tier: config_name
    makes: {relation: has_role_on, from: a, to: b}
    target_missing: report
    note: >-
      두 값 모두 벤더 설정이다 — Salesforce Named Credential 의 Endpoint(SOQL NamedCredential), Atlassian 사이트의 baseUrl(serverInfo).
      groundtruth atlassian-salesforce named_credential_atlassian_token: Named Credential 이 Atlassian 사이트 주소를 가리키고 External
      Credential 에 Atlassian 계정 이메일과 API 토큰을 넣어 Jira · Confluence REST 를 부른다. 역할(세기)은 관계 행에 없어 효과의 G 는
      세기 모름(role_rank_unknown)이다. 범위를 정한 토큰(api.atlassian.com/ex/jira/<cloudId>)과, Endpoint 가 빈 새 꼴(주소가 설정 감사 기록에만
      남는다)은 이 칸 표시로 못 잇는다. 옛 대시보드에 없던 규칙이라 now_in 이 없다

  vendor_foreign_key:
    meaning: IdP 가 대상 앱의 계정 id 를 적어 줬으면(프로비저닝), 두 계정은 벤더가 가리킨 같은 사람이다
    method: M1
    a: [Principal]
    b: [Principal]
    same: exact
    evidence: stated
    tier: config_id
    makes: {link: [{level: disclosed_relation}]}
    target_missing: report
    now_in: [identity.ts:okta_appuser_external_id]
    note: 프로비저닝이 꺼진 앱은 값이 비어 있다(Link_Schema_v3 「M1의 전제가 실측으로 확인됐다」)

  federated_subject:
    meaning: >-
      대상 앱이 IdP 로그인으로 받은 계정 이름(SAML nameId · IdP 앱 배정 username)이 IdP 계정 이름과 같으면 같은 사람이다.
      그 IdP 가 대상 테넌트에 붙어 있다는 근거가 있어야 확정이다
    method: M2
    a: [Principal]
    b: [Principal]
    same: casefold
    evidence: stated
    tier: config_name
    places:
      b_tenants: {from: b, refs: [tenant], relations: [member_of], depth: 1, want: Tenant, take: all}
    makes:
      link:
      - {level: resolved, when: {exists_relation: {type: registered_in, target: $b_tenants, property: {cross_provider: true}}}}
      - {level: possibly_same}
    target_missing: report
    now_in: [identity.ts:saml_external_identity, identity.ts:okta_app_assignment_username]
    differs: >-
      「IdP 가 대상 테넌트에 붙어 있다」를 대시보드는 SAML 이면 Okta 앱 이름(ghec · github)으로 대신 보고, 앱 배정 username 이면
      따로 보지 않는다(언제나 resolved). 명세는 tenant_pointer 가 만든 registered_in 이 b 의 테넌트에 있어야 resolved 다
    note: >-
      SAML 쪽 값을 가진 GitHub ExternalIdentity 는 오브젝트 모델 v1(대시보드 PR #117)부터 Object 가 아니라 Link 재료다 —
      투영에서 빠져 묶음에 없다. 그래서 그 칸 표시에 link_material 을 단다

  directory_principal:
    meaning: >-
      권한 명단이 같은 신원 원장(디렉터리)의 그룹 · 도메인을 그 원장의 식별자(그룹 메일 · 도메인 이름)로 가리키면, 그 그룹의 구성원과 그 도메인의 계정은
      그 명단 주체의 구성원이다. 사람을 맞추는 추정이 아니라 벤더가 적은 식별자다 — Google Cloud IAM 의 group:{메일} 은 그 Google 그룹을,
      domain:{도메인} 은 그 Workspace 도메인의 계정 전부를 가리킨다
    a: [Principal]
    b: [Principal]
    same: casefold
    evidence: stated
    tier: config_id
    makes: {relation: member_of, from: b, to: a}
    target_missing: report
    note: >-
      2026-11-20 Relation 담당(Claude 가 정함). Relation_Schema_v3 「교차 provider 관계는 stated 만」은 주체에서 출발하는 교차 관계를 막는다 — 메일로 사람을 맞추는 것은
      추정이라서다. 이 종류는 사람 계정끼리가 아니라 명단 주체(그룹 · 도메인)와 그것이 가리키는 원장 쪽 그룹 · 계정을 잇고, 값은 벤더가 명단에 적은 식별자 그대로다.
      그래서 막는 범위 밖으로 둔다(명세 같은 절의 예외 문단, validation/check_semantics.py S9 의 directory_reference 칸).
      3회차 실측: gcp 그룹 주체 4개가 모두 같은 메일의 GWS Group 4개와 맞고, GWS Group 소속 6개가 그 그룹 주체로 이어진다.
      문서: Cloud Resource Manager v3 Binding.members 「group:{emailid}: An email address that represents a Google group」 · 「domain:{domain}: The G Suite domain (primary) that represents all the users of that domain」
    directory_reference: true

  natural_key:
    meaning: >-
      이메일처럼 사람이 정하는 값이 같으면 같은 사람일 수도 있다. 값은 재사용되므로 언제부터 그 사람 값이었는지를 같이 남긴다.
      이메일 칸끼리 맞으면 email_match 로 같은 사람(resolved)이다(2026-11-03). Salesforce Username 처럼 이메일 칸이 아닌 줄은 possibly_same 그대로
    method: M3
    a: [Principal]
    b: [Principal]
    same: casefold
    evidence: stated
    tier: config_name
    makes: {link: [{level: possibly_same}]}
    where: {not: {any: [{a: {property: {is_bot: true}}}, {b: {property: {is_bot: true}}}]}}
    target_missing: ignore
    records: [valid_from]
    now_in: [identity.ts:natural_key_email]
    note: >-
      봇 제외는 Link_Schema_v3 natural_key 예시의 exclude_when 이고, 대시보드도 Slack 쪽에서 봇을 뺀다(normalize-v2/slack.ts
      userByEmail). Slack 기준선의 봇은 email 이 없었지만 g2 의 Slack 봇 계정에는 봇 전용 주소가 있다 — 그래서 이 조건이 필요하다.
      valid_from 은 Slack 사용자의 date_created 인데, 대시보드 Slack 정규화(slack.ts addUser)가 그 칸을 안 남겨 늘 빈다
      (Link_Schema_v3 「M3 에는 유효창이 필수다」).
      Salesforce · Atlassian 줄(2026-10-22)은 봇 칸(is_bot)이 없어 칸 표시 where 로 사람이 아닌 계정을 뺀다 — Salesforce 시스템
      사용자(자동 프로세스 · 통합 사용자 · 사이트 게스트)는 email 이 사람 주소와 같아도 그 사람이 아니다. 무엇을 넣는지는 조직마다
      달라 값이 아니라 계정 종류(UserType)로 막는다. Atlassian 은 사람 계정(account_type atlassian)만 본다. Salesforce 의 valid_from 은 사용자 CreatedDate 다. Jira email 은
      개인정보 설정에 따라 비고, Atlassian 계정 생성일은 수집하지 않아 valid_from 이 빈다.
      계정 종류가 사람(Standard)인 서비스 계정은 못 가른다 — 시험 환경의 Salesforce 통합 사용자는 Standard 이고 메일이 관리자
      메일함이라 관리자와 이어진다(open.service_account_email).
      GitHub 줄(2026-10-23)은 조직 멤버의 verified_domain_emails(조직이 확인한 도메인의 메일, GraphQL organizationVerifiedDomainEmails)다.
      SAML 외부 신원(federated_subject)이 없는 조직에서도 사람을 잇는다. 계정 type 이 User 인 것만 보고 Bot 은 뺀다. 메일은 조직
      도메인 확인을 거친 값이라 개인 메일보다 강하지만, 사람이 바꿀 수 있어 possibly_same 이다. GitHub 은 그 메일이 언제부터
      그 계정 것인지 알려 주지 않아 valid_from 이 빈다

  log_correlation:
    meaning: 실행 · 요청 기록 한 행에 자동화의 id 와 IdP 자격(클라이언트) id 가 함께 찍혀 있으면, 두 신원은 같은 자동화일 수도 있다
    method: M4
    a: [Integration, Principal]
    b: [Principal]
    same: co_occurs
    evidence: observed
    tier: log_id
    makes: {link: [{level: possibly_same}], link_kind: automation}
    target_missing: report
    now_in: [identity.ts:worker_log_correlation]
    note: >-
      허브(IdP)를 안 거친 자동화를 잇는 유일한 방법이다(Link_Schema_v3 「아직 안 정한 것」 「현재 방법 없음」). 기록 보존 기간이 지나면
      끊긴다. a 쪽 IdP 자격은 Okta 앱(Integration)의 client_id 칸이다(decided.okta_client_view). Principal 은 옛 묶음(g2 등)의
      대시보드 연결을 읽으려고 남긴다 — 그때 대시보드는 OAuth2Client(Principal) 끝으로 이었다.
      뜻으로는 「같은 신원」보다 「이 봇이 이 IdP 자격으로 동작한다」(의미 층 holds, 근거 logged)에 가깝다.
      근거 기록 SL-12 는 SaaS 기록이 아니라 시험 환경 봇 Worker 의 D1 기록이고, okta_client_id 칸은 정답을 남기려고 Worker 가 적는다.
      11-04 수집본에서 Okta System Log 는 MFA 초기화(user.mfa.factor.reset_all)의 행위자를 클라이언트로만 남기고 Slack id 는 한 줄도 없다.
      Slack 감사 로그에는 슬래시 명령 기록 종류가 없다. 그래서 실제 고객에게서는 고객이 봇 자체 기록을 줄 때만 이 연결이 생긴다.
      옮길 때 판정 변화(2026-11-15, 엔진 main 5183187, 11-04 수집본, 의미 층 켬) — 이 키 종류의 record 줄만 빼면 gt:board 는 그대로다
      (정답 사람 라벨 맞음 · 틀림 · 못 찾음 7 · 0 · 6, 정답 위협 맞음 3/5). V2 위협은 45 → 43건이다. 정답 위협 C 는 효과(요청 기록과 Okta
      MFA 초기화 기록을 맞춤)로 여전히 잡히고, 위협이 가리키는 곳만 Okta 클라이언트에서 Slack 슬래시 명령으로 바뀐다. 11-14 에 적은 45 → 42건은
      자동화 간선의 반대 방향(자격 → 봇)만 뺀 결과다. SL-12 를 통째로 빼면(normalize --without worker:SL-12, 실제 고객 조건) 45 → 40건,
      라벨 5 · 2 · 6, 정답 위협 2/5 이고 B · C 의 SaaS 를 넘는 부분이 사라진다. 그러니 판정은 걸림돌이 아니다. 남은 것은
      open.observed_relation(팀이 정할 일) 하나다 — Relation_Schema_v3 는 교차 관계를 stated 만 받고, logged 근거는 아직 lint 가 받지 않는다.
      그 결정이 나면 holds 로 옮기고 판정 변화를 다시 잰다

# 칸 표시 — 어느 SaaS 의 어느 칸이 어느 키 종류인가. 새 SaaS 는 여기에 줄만 더한다 (위 kinds 는 그대로)
#
#   kind · side             키 종류와 그 종류의 a · b 중 어느 쪽인가. record 는 co_occurs 종류의 기록 (맨 아래)
#   provider · object_type  값을 가진 객체
#   path                    값이 있는 칸 — properties.<이름> · identifiers.<이름>. 목록이면 원소마다.
#                           <이름>[].<칸> 은 객체 목록의 원소마다 그 칸 (예: Apps Script 배포 목록의 deploymentId)
#   end                     연결의 끝. 없으면 값을 가진 객체 자신, references.<이름> 이면 그 참조가 가리키는 객체
#   to                      이 값의 상대를 이 provider · object_type 의 끝에서만 찾는다 (Profile_Schema_v4.2 external_refs 의 provider)
#   pointer                 이 값이 상대를 가리킨다 — 상대가 없으면 키 종류의 target_missing 을 따른다
#   transform               same 으로 맞추기 전에 값을 고친다 — {strip_suffix: 글자} · {require_suffix: 글자} (끝이 그 글자면 떼고,
#                           아니면 빈 값 — 그 칸이 이 종류의 값이 아니다) · {map: {값: 짝 이름}} (표에 있는 값만 짝 이름으로, 없으면 빈 값) ·
#                           email_domain (@ 뒤) ·
#                           {path_segment_after: 글자} (주소 경로를 / 로 나눠 그 글자인 첫 조각의 바로 다음 조각. 없으면 빈 값) ·
#                           url_host (절대 주소의 호스트 이름, 소문자, 포트 뺌. 스킴이 없으면 빈 값)
#   where                   값을 가진 객체에 더 맞아야 하는 것 (ontology/match.py 식. 자리 self · parent — parent 는 references.parent)
#   records                 만든 연결에 남기는 칸 {이름: path}
#   link_material           이 객체는 Object 가 아니라 Link 재료다(오브젝트 모델 v1 의 link_only) — 투영된 묶음에 없을 수 있어
#                           묶음 밖 Link 재료(link_material)에서도 찾는다. 둘 다 없으면 「재료 없음」으로 남긴다
#   level_cap               이 칸으로 맞춘 Link 는 이 단계보다 세지 않다. 같은 두 끝을 cap 없는 칸도 이으면 그 칸이 먼저다
#   cap_unless_same         {a: path, b: path} — 연결의 두 끝(a 끝 · b 끝 객체)의 이 칸이 키 종류의 same 으로 같으면 level_cap 을 풀어 준다.
#                           값 하나만으로는 약하지만 다른 칸 하나가 더 맞으면 확정할 수 있을 때
#   source · a · b          side: record 만 — 두 값이 함께 나오는 기록의 출처와 그 안의 칸
fields:
