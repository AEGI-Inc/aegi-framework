# 검토된 화면 설명 문구. 사람이 쓰고 고친다. 비어 있는 종류는 npm run display-text 가 AI 로 만들어 캐시하고, 검토를 거쳐 여기로 옮긴다.
# types 의 키는 object_type 소문자. 「종류 — 꾸밈말」 꼴은 화면에서 「꾸밈말 종류」로 붙인다.
provider: github
format: aegi-display-text/v1
name: GitHub
profile:
  role: 소스 코드, 배포
  points:
    - 회사 코드 저장소와 CI(Actions)
    - 팀과 역할로 정하는 저장소 쓰기 권한
    - 사람 대신 코드를 바꾸고 배포하는 워크플로와 토큰
types:
  organization:
    meaning: GitHub 조직(테넌트)
  user account:
    meaning: 개발자의 GitHub 계정
  team:
    meaning: 저장소 권한을 묶어 주는 GitHub 팀
  repository:
    meaning: 소스 코드 저장소
  commit:
    meaning: 저장소에 기록된 코드 변경
  pull request:
    meaning: 코드 변경 검토 요청
  workflow:
    meaning: GitHub Actions 워크플로 — 저장소 권한으로 자동 실행되는
  webhook:
    meaning: 이벤트를 외부 주소로 보내는 GitHub 웹훅
  github app installation registration:
    meaning: 조직에 설치된 GitHub 앱
  credential authorization:
    meaning: 조직이 승인한 개인 토큰, SSH 키
  branch protection rule:
    meaning: 브랜치 보호 규칙
  repository ruleset:
    meaning: 브랜치 보호 등 저장소 규칙
  organization custom repository role:
    meaning: 조직이 정의한 저장소 역할
  organization programmatic access grant:
    meaning: 조직이 개인 토큰(PAT)에 허락한 접근
