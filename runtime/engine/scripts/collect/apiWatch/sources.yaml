changelogs:
  - id: github_changelog
    provider: github
    feed: https://github.blog/changelog/feed/
    keywords: [REST API, GraphQL, audit log, deprecat, breaking, sunset, fine-grained, Copilot, Actions, rulesets, SCIM, SAML]
  - id: slack_changelog
    provider: slack
    feed: https://docs.slack.dev/changelog/rss.xml
    keywords: [deprecat, rate limit, retire, sunset, breaking, admin., conversations., users., team.]
  - id: gws_updates
    provider: gws
    feed: https://workspaceupdates.googleblog.com/feeds/posts/default
    keywords: [Admin SDK, API, Reports, audit, Directory, Drive API, Gmail API, Vault, Calendar API, Chrome, deprecat]
  - id: aws_whats_new
    provider: aws
    feed: https://aws.amazon.com/about-aws/whats-new/recent/feed/
    keywords: [IAM, Identity Center, Organizations, CloudTrail, STS, deprecat]
  - id: okta_developer_blog
    provider: okta
    feed: https://developer.okta.com/feed.xml
    keywords: [API, EOL, deprecat, Management API, Identity Governance, Cross App Access, breaking]
  # atlassian: developer changelog 는 RSS 주소를 못 찾음(11-18). 대신 스펙 주소 감시(A)로 본다

live:
  - id: github_api_versions
    provider: github
    url: https://api.github.com/versions
    pinned: '2022-11-28'      # scripts/collect/lib/auth.ts GITHUB_HEADERS 와 같아야 함
  - id: salesforce_api_versions
    provider: salesforce
    url_from_config: salesforce.instanceHost   # https://<instanceHost>/services/data/
    pinned_from_config: salesforce.apiVersion
