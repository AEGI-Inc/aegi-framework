format: im-pilot-profile/1
scope: additive_runtime_projection
provider: jira
service: jira
object_type: AutomationRule
interfaces: [Automation]
model:
  runtime_type_id: automation-source-bindings/1:atlassian:AutomationRule
  source: aegi-knowledge/schema/ontology/automation-sources.yaml
identity:
  primary:
    - {name: cloud, expr: $req.cloud, stability: stable}
    - {name: product, expr: $req.product, stability: stable}
    - name: id
      expr: {op: lower, of: rule.uuid}
      stability: stable
  scope: tenant
fields: {}
runtime_key: JI-AUTO-{cloud}-{id}
runtime_identifiers:
  primary: [id]
  id:
    stability: stable
    normalization: [lowercase]
runtime_rules:
  - id: list
    kind: object
    sources:
      - call: JI-10
        request: {kind: automation_definition}
        items: (root)
    id_expr: rule.uuid
    parts:
      cloud: $req.cloud
    properties:
      name: rule.name
      cloud_id: $req.cloud
      product: $req.product
      rule_uuid: {op: lower, of: rule.uuid}
      state: rule.state
      components: rule.components
      request_targets: rule.request_targets
      request_secret_fingerprints: rule.request_secret_fingerprints
      definition_sha256: definition_sha256
      trigger_type: rule.trigger_type
      scope_project_ids: rule.scope_project_ids
      actor_account_id: rule.actor_account_id
      incoming_rule_key:
        if: {path: rule.incoming_webhook, eq: true}
        then:
          op: lower
          of: {template: "{$req.product}/{rule.uuid}"}
    parent: {ref: $tenant, when: always}
    display: "{rule.name|rule.uuid}"
    relations:
      - type: contained_in
        source: $self
        target: $tenant
        basis: stated
        require: [target]
      # 이슈 사건 트리거(jira.issue.*)는 범위 프로젝트에 이슈를 만들거나 바꾸는 사람이 규칙을 시작시킨다. 예약 트리거 등은 잇지 않는다
      - type: triggered_by
        when:
          path: rule.trigger_type
          matches: ^jira\.issue\.
        each: rule.scope_project_ids
        source: $self
        target:
          type: Project
          id: $item
        basis: stated
        require: [target]
      # 규칙 동작은 행위자 이름으로 남는다(Automation 규칙 관리 API rule.actor). 웹훅으로 보내는 동작은 secret_fingerprint 로 따로 잇는다
      - type: runs_as
        when:
          path: rule.actor_account_id
          truthy: true
        source: $self
        target:
          type: User
          id: rule.actor_account_id
        basis: stated
        require: [target]

