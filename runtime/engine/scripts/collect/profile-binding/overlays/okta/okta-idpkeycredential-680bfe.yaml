overlay_basis:
  from: aegi-adapter-engine catalog/okta/profiles/id_pkey_credential.yaml
  engine_commit: d78062d
  research_agreement: same
runtime_rules:
  - id: list
    kind: object
    sources:
      - call: OK-20
        where:
          path: kid
          present: true
    id_expr: kid
    properties:
      kid: kid
      kty: kty
      use: use
      x5t_s256:
        op: null_if_missing
        of: x5t#S256
      x5c_sha256:
        op: null_if_missing
        of: x5c_sha256
      created: created
      lastUpdated: lastUpdated
      expires_at:
        op: null_if_missing
        of: expiresAt
    display: IdP 서명 키 {kid}
    relations:
      - type: owned_by
        source: $self
        target: $tenant
        basis: stated
      - type: authenticates_with
        each:
          op: index
          name: idp_by_kid
          key: kid
        source:
          type: IdentityProvider
          id: $item
        target: $self
        basis: stated
        require:
          - source
        properties:
          matched_on:
            const: protocol.credentials.trust.kid
    identity:
      primary:
        - name: id
          expr: kid
          stability: catalog_reviewed
      scope: tenant
    key_template: OKTA-IDPKEY-{id}
runtime_stub: null
runtime_key: OKTA-IDPKEY-{id}
runtime_identifiers:
  primary:
    - id
  id:
    stability: stable
relation_rules:
  - id: IdPKeyCredential:list
    sources:
      - call: OK-20
        where:
          path: kid
          present: true
    relations:
      - type: owned_by
        source: $self
        target: $tenant
        basis: stated
      - type: authenticates_with
        each:
          op: index
          name: idp_by_kid
          key: kid
        source:
          type: IdentityProvider
          id: $item
        target: $self
        basis: stated
        require:
          - source
        properties:
          matched_on:
            const: protocol.credentials.trust.kid
    self_identity: object_rule
identity:
  primary:
    - name: id
      expr: kid
      stability: catalog_reviewed
  scope: parent
  evidence:
    source: catalog_spec5_key
    key_template: OKTA-IDPKEY-{id}
    replaced:
      - $req.parent_id
      - kid
