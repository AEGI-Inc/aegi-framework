overlay_basis:
  from: aegi-adapter-engine catalog/okta/profiles/trusted_origin.yaml
  engine_commit: d78062d
  research_agreement: same
runtime_rules:
  - id: list
    kind: object
    sources:
      - call: OK-22
        request:
          kind: trusted_origins
        where:
          path: id
          present: true
    properties:
      name: name
      origin: origin
      scopes:
        op: pluck
        of: scopes
        field: type
        keep_empty: true
      status: status
      created: created
      lastUpdated: lastUpdated
    display: 신뢰 출처 {origin|name}
    relations: []
    identity:
      primary:
        - name: id
          expr: id
          stability: catalog_reviewed
      scope: tenant
    key_template: OKTA-ORIGIN-{id}
runtime_stub: null
runtime_key: OKTA-ORIGIN-{id}
runtime_identifiers:
  primary:
    - id
  id:
    stability: stable
