overlay_basis:
  from: aegi-adapter-engine catalog/okta/profiles/policy_rule.yaml
  engine_commit: d78062d
  research_agreement: same
runtime_rules:
  - id: list
    kind: object
    sources:
      - call: OK-10
        request:
          policy: present
    vars:
      policy_name:
        ref:
          type: Policy
          id: $req.policy
        prop: name
    parent:
      ref:
        type: Policy
        id: $req.policy
    properties:
      name: name
      status: status
      priority: priority
      system: system
      type: type
      actions: actions
    display: "{$vars.policy_name|$req.policy} › {name}"
    relations:
      - type: contained_in
        source: $self
        target:
          type: Policy
          id: $req.policy
        basis: stated
        require:
          - target
      - type: applies_to
        each: conditions.people.groups.include
        source: $self
        target:
          type: Group
          id: $item
        basis: stated
        properties:
          binding:
            const: explicit
      - type: excludes
        each: conditions.people.groups.exclude
        source: $self
        target:
          type: Group
          id: $item
        basis: stated
      - type: applies_to
        each: conditions.people.users.include
        source: $self
        target:
          type: User
          id: $item
        basis: stated
        properties:
          binding:
            const: explicit
      - type: excludes
        each: conditions.people.users.exclude
        source: $self
        target:
          type: User
          id: $item
        basis: stated
    identity:
      primary:
        - name: id
          expr: id
          stability: catalog_reviewed
      scope: tenant
    key_template: OKTA-PRULE-{id}
runtime_stub: null
runtime_key: OKTA-PRULE-{id}
runtime_identifiers:
  primary:
    - id
  id:
    stability: stable
relation_rules:
  - id: PolicyRule:list
    sources:
      - call: OK-10
        request:
          policy: present
    vars:
      policy_name:
        ref:
          type: Policy
          id: $req.policy
        prop: name
    relations:
      - type: contained_in
        source: $self
        target:
          type: Policy
          id: $req.policy
        basis: stated
        require:
          - target
      - type: applies_to
        each: conditions.people.groups.include
        source: $self
        target:
          type: Group
          id: $item
        basis: stated
        properties:
          binding:
            const: explicit
      - type: excludes
        each: conditions.people.groups.exclude
        source: $self
        target:
          type: Group
          id: $item
        basis: stated
      - type: applies_to
        each: conditions.people.users.include
        source: $self
        target:
          type: User
          id: $item
        basis: stated
        properties:
          binding:
            const: explicit
      - type: excludes
        each: conditions.people.users.exclude
        source: $self
        target:
          type: User
          id: $item
        basis: stated
    self_identity: object_rule
identity:
  primary:
    - name: id
      expr: id
      stability: catalog_reviewed
  scope: parent
  evidence:
    source: catalog_spec5_key
    key_template: OKTA-PRULE-{id}
    replaced:
      - $req.parent_id
      - id
fields:
  conditions:
    path: conditions
    source: collected_response
fields_basis: 설정 판정이 읽는 응답 최상위 키다. Profile 필드 선언에 없어 quarantined_fields 로 빠지던 것을 선언한다(값은 수집 응답 그대로)
