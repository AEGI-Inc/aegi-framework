overlay_basis:
  from: aegi-adapter-engine catalog/okta/profiles/group.yaml
  engine_commit: d78062d
  research_agreement: same
runtime_rules:
  - id: list
    kind: object
    sources:
      - call: OK-03
        request:
          group: absent
    mutable_ids:
      name: profile.name
    properties:
      name: profile.name
      description: profile.description
      type: type
      created: created
      source_app: source.id
    display: "{profile.name|id}"
    relations:
      - type: owned_by
        source: $self
        target:
          type: Application
          id: source.id
        basis: stated
    identity:
      primary:
        - name: id
          expr: id
          stability: catalog_reviewed
      scope: tenant
    key_template: OKTA-G-{id}
  - id: members
    kind: relations
    sources:
      - call: OK-03
        request:
          group: present
    relations:
      - type: member_of
        source:
          type: User
          id: id
        target:
          type: Group
          id: $req.group
        basis: stated
    key_template: OKTA-G-{id}
runtime_stub:
  display: "{id} (목록에 없음)"
runtime_key: OKTA-G-{id}
runtime_identifiers:
  primary:
    - id
  id:
    stability: stable
  name:
    stability: mutable
relation_rules:
  - id: Group:list
    sources:
      - call: OK-03
        request:
          group: absent
    relations:
      - type: owned_by
        source: $self
        target:
          type: Application
          id: source.id
        basis: stated
    self_identity: object_rule
  - id: Group:members
    sources:
      - call: OK-03
        request:
          group: present
    relations:
      - type: member_of
        source:
          type: User
          id: id
        target:
          type: Group
          id: $req.group
        basis: stated
tenant_binding:
  type: OrgSetting
tenant_basis: Okta 조직(OrgSetting)은 한 테넌트에 하나다. 조직 관리자 역할(SUPER_ADMIN 등)이 OrgSetting 에 걸리므로, 이 객체가 그 조직에 속한다는 참조가 있어야 관리자 권한이 이 객체까지 내려온다(2026-11-08, /mfa-reset 격차의 원래 권한자 0명)
