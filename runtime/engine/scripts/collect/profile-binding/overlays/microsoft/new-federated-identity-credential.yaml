format: im-pilot-profile/1
scope: additive_runtime_projection
provider: microsoft
service: entra
object_type: FederatedIdentityCredential
interfaces: [Credential]
identity:
  primary:
    - {name: id, expr: id, stability: stable}
  scope: tenant
fields: {}
runtime_key: M365-FIC-{id}
runtime_identifiers:
  primary: [id]
  id: {stability: stable}
runtime_rules:
  - id: list
    kind: object
    sources:
      - call: M365-05
        request: {kind: federatedIdentityCredentials}
        items: value
    id_expr: id
    properties:
      name: name
      issuer: issuer
      subject: subject
      audiences: audiences
      description: description
      app_id: $req.app
    display: "{name|subject|id}"
    relations:
      - type: authenticates_with
        source: {type: Application, id: $req.app}
        target: $self
        basis: stated
        require: [source, target]
      - type: contained_in
        source: $self
        target: {type: Application, id: $req.app}
        basis: stated
        require: [target]
