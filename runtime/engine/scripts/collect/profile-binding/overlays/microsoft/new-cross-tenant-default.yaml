format: im-pilot-profile/1
scope: additive_runtime_projection
provider: microsoft
service: entra
object_type: CrossTenantAccessDefault
interfaces: [Policy]
identity:
  primary:
    - {name: id, expr: id, stability: stable}
  scope: tenant
fields: {}
runtime_key: M365-CTAP-DEF-{id}
runtime_identifiers:
  primary: [id]
  id: {stability: stable}
runtime_rules:
  - id: list
    kind: object
    sources:
      - call: M365-19
        request: {kind: default}
        items: (root)
    id_expr: id
    properties:
      isServiceDefault: isServiceDefault
      inboundTrust: inboundTrust
      b2bCollaborationInbound: b2bCollaborationInbound
      b2bCollaborationOutbound: b2bCollaborationOutbound
      b2bDirectConnectInbound: b2bDirectConnectInbound
      b2bDirectConnectOutbound: b2bDirectConnectOutbound
      automaticUserConsentSettings: automaticUserConsentSettings
      tenantRestrictions: tenantRestrictions
    display: "{id}"
    relations:
      - type: applies_to
        source: $self
        target: $tenant
        basis: stated
        require: [target]
      - type: contained_in
        source: $self
        target: $tenant
        basis: stated
        require: [target]
