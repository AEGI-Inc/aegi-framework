    - {name: id, expr: {any: [id, {const: authenticationMethodsPolicy}]}, stability: stable}
  scope: tenant
fields: {}
runtime_key: M365-AMPOL-{id}
runtime_identifiers:
  primary: [id]
  id: {stability: stable}
runtime_rules:
  - id: list
    kind: object
    sources:
      - call: M365-23
        request: {kind: authenticationMethodsPolicy}
        items: (root)
    id_expr:
      any:
        - id
        - {const: authenticationMethodsPolicy}
    properties:
      policyVersion: policyVersion
      policyMigrationState: policyMigrationState
      registrationEnforcement: registrationEnforcement
      lastModifiedDateTime: lastModifiedDateTime
    display: "{displayName|id}"
    relations:
      - type: applies_to
        source: $self
        target: $tenant
        basis: stated
        require: [target]
      - type: contained_in
        source: $self
        target: $tenant
        basis: stated
        require: [target]
