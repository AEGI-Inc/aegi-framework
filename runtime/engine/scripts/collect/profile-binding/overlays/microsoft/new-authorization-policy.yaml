format: im-pilot-profile/1
scope: additive_runtime_projection
provider: microsoft
service: entra
object_type: AuthorizationPolicy
interfaces: [Policy]
identity:
  primary:
    - {name: id, expr: id, stability: stable}
  scope: tenant
fields: {}
runtime_key: M365-AUTHPOL-{id}
runtime_identifiers:
  primary: [id]
  id: {stability: stable}
runtime_rules:
  - id: list
    kind: object
    sources:
      - call: M365-23
        request: {kind: authorizationPolicy}
        items: (root)
    id_expr: id
    properties:
      allowInvitesFrom: allowInvitesFrom
      allowedToSignUpEmailBasedSubscriptions: allowedToSignUpEmailBasedSubscriptions
      allowedToUseSSPR: allowedToUseSSPR
      allowEmailVerifiedUsersToJoinOrganization: allowEmailVerifiedUsersToJoinOrganization
      allowUserConsentForRiskyApps: allowUserConsentForRiskyApps
      blockMsolPowerShell: blockMsolPowerShell
      guestUserRoleId: guestUserRoleId
      defaultUserRolePermissions: defaultUserRolePermissions
    display: "{displayName|id}"
    relations:
      - type: applies_to
        source: $self
        target: $tenant
        basis: stated
        require: [target]
      - type: contained_in
        source: $self
        target: $tenant
        basis: stated
        require: [target]
