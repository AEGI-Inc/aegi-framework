format: im-pilot-profile/1
scope: additive_runtime_projection
provider: microsoft
service: entra
object_type: SubscribedSku
interfaces: [Integration]
identity:
  primary:
    - {name: id, expr: skuId, stability: stable}
  scope: tenant
fields: {}
runtime_key: M365-SKU-{id}
runtime_identifiers:
  primary: [id]
  id: {stability: stable}
runtime_rules:
  - id: list
    kind: object
    sources:
      - call: M365-10
        request: {kind: subscribedSkus}
        items: value
    id_expr: skuId
    properties:
      operational_state:
        op: map
        of: capabilityStatus
        table:
          Enabled: active
          Warning: active
          Suspended: suspended
          LockedOut: inactive
          Deleted: inactive
        default: {const: unknown}
      skuId: skuId
      skuPartNumber: skuPartNumber
      capabilityStatus: capabilityStatus
      appliesTo: appliesTo
      consumedUnits: consumedUnits
      prepaidUnits: prepaidUnits
      servicePlans: servicePlans
      accountId: accountId
      accountName: accountName
      subscriptionIds: subscriptionIds
    display: "{skuPartNumber|skuId}"
    relations:
      - type: contained_in
        source: $self
        target: $tenant
        basis: stated
        require: [target]
