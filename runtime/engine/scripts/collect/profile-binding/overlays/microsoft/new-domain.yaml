format: im-pilot-profile/1
scope: additive_runtime_projection
provider: microsoft
service: entra
object_type: Domain
interfaces: [Tenant]
identity:
  primary:
    - {name: id, expr: id, stability: stable}
  scope: tenant
fields: {}
runtime_key: M365-DOM-{id}
runtime_identifiers:
  primary: [id]
  id: {stability: stable}
runtime_rules:
  - id: list
    kind: object
    sources:
      - call: M365-10
        request: {kind: domains}
        items: value
    id_expr: id
    properties:
      domain_name: id
      authenticationType: authenticationType
      availabilityStatus: availabilityStatus
      isAdminManaged: isAdminManaged
      isDefault: isDefault
      isInitial: isInitial
      isRoot: isRoot
      isVerified: isVerified
      supportedServices: supportedServices
    display: "{id}"
    relations:
      - type: contained_in
        source: $self
        target: $tenant
        basis: stated
        require: [target]
