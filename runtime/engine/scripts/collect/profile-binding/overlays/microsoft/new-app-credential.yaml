format: im-pilot-profile/1
scope: additive_runtime_projection
provider: microsoft
service: entra
object_type: AppCredential
interfaces: [Credential]
identity:
  primary:
    - {name: id, expr: keyId, stability: stable}
  scope: tenant
fields: {}
privacy:
  secret_leaf_names: [hint, secretText, key]
runtime_key: M365-APPCRED-{id}
runtime_identifiers:
  primary: [id]
  id: {stability: stable}
runtime_rules:
  - id: app_password
    kind: object
    sources:
      - call: M365-05
        request: {kind: applications}
        items: value
        each: passwordCredentials
    id_expr: keyId
    properties:
      credential_kind: {const: password}
      keyId: keyId
      displayName: displayName
      startDateTime: startDateTime
      endDateTime: endDateTime
      owner_kind: {const: application}
      owner_id: $parent.id
      owner_app_id: $parent.appId
    display: "{displayName|keyId}"
    relations:
      - type: authenticates_with
        source: {type: Application, id: $parent.id}
        target: $self
        basis: stated
        require: [source, target]
      - type: contained_in
        source: $self
        target: {type: Application, id: $parent.id}
        basis: stated
        require: [target]
  - id: app_key
    kind: object
    sources:
      - call: M365-05
        request: {kind: applications}
        items: value
        each: keyCredentials
    id_expr: keyId
    properties:
      credential_kind: {const: key}
      keyId: keyId
      displayName: displayName
      startDateTime: startDateTime
      endDateTime: endDateTime
      type: type
      usage: usage
      customKeyIdentifier: customKeyIdentifier
      owner_kind: {const: application}
      owner_id: $parent.id
      owner_app_id: $parent.appId
    display: "{displayName|keyId}"
    relations:
      - type: authenticates_with
        source: {type: Application, id: $parent.id}
        target: $self
        basis: stated
        require: [source, target]
      - type: contained_in
        source: $self
        target: {type: Application, id: $parent.id}
        basis: stated
        require: [target]
  - id: sp_password
    kind: object
    sources:
      - call: M365-06
        request: {kind: servicePrincipals}
        items: value
        each: passwordCredentials
    id_expr: keyId
    properties:
      credential_kind: {const: password}
      keyId: keyId
      displayName: displayName
      startDateTime: startDateTime
      endDateTime: endDateTime
      owner_kind: {const: servicePrincipal}
      owner_id: $parent.id
      owner_app_id: $parent.appId
    display: "{displayName|keyId}"
    relations:
      - type: authenticates_with
        source: {type: ServicePrincipal, id: $parent.id}
        target: $self
        basis: stated
        require: [source, target]
      - type: contained_in
        source: $self
        target: {type: ServicePrincipal, id: $parent.id}
        basis: stated
        require: [target]
  - id: sp_key
    kind: object
    sources:
      - call: M365-06
        request: {kind: servicePrincipals}
        items: value
        each: keyCredentials
    id_expr: keyId
    properties:
      credential_kind: {const: key}
      keyId: keyId
      displayName: displayName
      startDateTime: startDateTime
      endDateTime: endDateTime
      type: type
      usage: usage
      customKeyIdentifier: customKeyIdentifier
      owner_kind: {const: servicePrincipal}
      owner_id: $parent.id
      owner_app_id: $parent.appId
    display: "{displayName|keyId}"
    relations:
      - type: authenticates_with
        source: {type: ServicePrincipal, id: $parent.id}
        target: $self
        basis: stated
        require: [source, target]
      - type: contained_in
        source: $self
        target: {type: ServicePrincipal, id: $parent.id}
        basis: stated
        require: [target]
