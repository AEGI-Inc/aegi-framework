format: im-pilot-profile/1
scope: additive_runtime_projection
provider: microsoft
service: entra
object_type: BitlockerRecoveryKey
interfaces: [Credential]
identity:
  primary:
    - {name: id, expr: id, stability: stable}
  scope: tenant
fields: {}
privacy:
  secret_leaf_names: [key]
runtime_key: M365-BITLOCKER-{id}
runtime_identifiers:
  primary: [id]
  id: {stability: stable}
runtime_rules:
  - id: list
    kind: object
    sources:
      - call: M365-31
        request: {kind: bitlockerRecoveryKeys}
        items: value
    id_expr: id
    properties:
      device_id: deviceId
      volumeType: volumeType
      createdDateTime: createdDateTime
    display: "{deviceId|id}"
    relations:
      - type: contained_in
        source: $self
        target: {type: Device, lookup: deviceId, value: deviceId}
        basis: stated
        require: [target]
