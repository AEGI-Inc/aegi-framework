format: im-pilot-profile/1
scope: additive_runtime_projection
provider: microsoft
service: entra
object_type: DeviceLocalCredential
interfaces: [Credential]
identity:
  primary:
    - {name: id, expr: id, stability: stable}
  scope: tenant
fields: {}
privacy:
  secret_leaf_names: [credentials, passwordBase64]
runtime_key: M365-LAPS-{id}
runtime_identifiers:
  primary: [id]
  id: {stability: stable}
runtime_rules:
  - id: list
    kind: object
    sources:
      - call: M365-31
        request: {kind: deviceLocalCredentials}
        items: value
    id_expr: id
    properties:
      deviceName: deviceName
      lastBackupDateTime: lastBackupDateTime
      refreshDateTime: refreshDateTime
    display: "{deviceName|id}"
    relations:
      - type: contained_in
        source: $self
        target: {type: Device, lookup: deviceId, value: id}
        basis: stated
        require: [target]
