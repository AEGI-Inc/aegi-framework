overlay_basis:
  from: aegi-adapter-engine
    catalog/github/profiles/organization_custom_repository_role.yaml
  engine_commit: d78062d
  research_agreement: same
runtime_rules:
  - id: list
    kind: object
    sources:
      - call: GH-07
        items: custom_roles
    properties:
      name: name
      role_name: name
      base_role: base_role
      permissions: permissions
    display: "{name}"
    relations: []
    identity:
      primary:
        - name: id
          expr: id
          stability: catalog_reviewed
      scope: tenant
    key_template: GH-CROLE-{id}
runtime_stub: null
runtime_key: GH-CROLE-{id}
runtime_identifiers:
  primary:
    - id
  id:
    stability: stable
identity:
  primary:
    - name: id
      expr: id
      stability: catalog_reviewed
  scope: parent
  evidence:
    source: catalog_spec5_key
    key_template: GH-CROLE-{id}
    replaced:
      - $req.parent_id
      - id
tenant_binding:
  type: organization-full
tenant_basis: 생성기의 tenant 이름 Organization 은 카탈로그 이름이다. 새 Profile 의 조직 타입은 organization-full
