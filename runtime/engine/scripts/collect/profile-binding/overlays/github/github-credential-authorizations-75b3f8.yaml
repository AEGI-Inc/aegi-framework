overlay_basis:
  from: aegi-adapter-engine catalog/github/profiles/credential_authorization.yaml
  engine_commit: d78062d
  research_agreement: same
runtime_rules:
  - id: list
    kind: object
    sources:
      - call: GH-22
        items: (items)
    id_expr: credential_id
    vars:
      user:
        if:
          path: login
          truthy: true
        then:
          ref:
            type: simple-user
            lookup: login
            value: login
          prop: $key
      app:
        if:
          path: application_name
          truthy: true
        then:
          template: " › {application_name}"
        else:
          const: ""
    mutable_ids:
      authorized_credential_id: authorized_credential_id
    refs:
      grantee:
        when:
          path: $vars.user
          present: true
        ref:
          key: $vars.user
        type: simple-user
        value: login
    properties:
      login: login
      credential_type: credential_type
      application_name: application_name
      application_client_id: application_client_id
      scopes: scopes
      credential_authorized_at: credential_authorized_at
      credential_accessed_at: credential_accessed_at
      expires_at:
        op: null_if_missing
        of: authorized_credential_expires_at
    display: "{credential_type}{$vars.app} ({login})"
    relations: []
    identity:
      primary:
        - name: id
          expr: credential_id
          stability: catalog_reviewed
      scope: tenant
    key_template: GH-CREDAUTH-{id}
runtime_stub: null
runtime_key: GH-CREDAUTH-{id}
runtime_identifiers:
  primary:
    - id
  id:
    stability: stable
  authorized_credential_id:
    stability: mutable
identity:
  primary:
    - name: id
      expr: credential_id
      stability: catalog_reviewed
  scope: tenant
  evidence:
    source: catalog_spec5_key
    key_template: GH-CREDAUTH-{id}
    replaced:
      - authorized_credential_id
tenant_binding:
  type: organization-full
tenant_basis: 생성기의 tenant 이름 Organization 은 카탈로그 이름이다. 새 Profile 의 조직 타입은 organization-full
