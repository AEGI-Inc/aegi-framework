overlay_basis:
  from: aegi-adapter-engine catalog/github/profiles/organization.yaml
  engine_commit: d78062d
  research_agreement: same
runtime_rules:
  - id: list
    kind: object
    sources:
      - call: GH-01
        items: (root)
    tenant: none
    vars:
      ent:
        op: first
        of:
          op: pluck
          of:
            op: objects
            type: Enterprise
          field: key
    parent:
      ref:
        key: $vars.ent
      when: always
    mutable_ids:
      login: login
      node_id: node_id
    properties:
      login: login
      name: name
      plan: plan.name
      two_factor_requirement_enabled: two_factor_requirement_enabled
      default_repository_permission: default_repository_permission
      members_can_create_repositories: members_can_create_repositories
      created_at: created_at
    display: "{login}"
    relations: []
    identity:
      primary:
        - name: id
          expr: id
          stability: catalog_reviewed
      scope: tenant
    key_template: GH-ORG-{id}
  - id: ip_allow
    kind: enrich
    sources:
      - call: GH-31
        items: data.organization
    target: $tenant
    set:
      ip_allow_list_enabled: ipAllowListEnabledSetting
      ip_allow_list_for_installed_apps: ipAllowListForInstalledAppsEnabledSetting
    relations: []
    key_template: GH-ORG-{id}
  - id: actions_variables
    kind: enrich
    sources:
      - call: GH-34
        items: (root)
        where:
          path: $req.scope
          eq: org
    target: tenant
    append:
      actions_variables: variables
    relations: []
runtime_stub: null
runtime_key: GH-ORG-{id}
runtime_identifiers:
  primary:
    - id
  id:
    stability: stable
  login:
    stability: mutable
  node_id:
    stability: mutable
identity:
  primary:
    - name: id
      expr: id
      stability: catalog_reviewed
  scope: parent
  evidence:
    source: catalog_spec5_key
    key_template: GH-ORG-{id}
    replaced:
      - $req.parent_id
      - id
tenant_binding:
  type: organization-full
tenant_basis: 생성기의 tenant 이름 Organization 은 카탈로그 이름이다. 새 Profile 의 조직 타입은 organization-full
