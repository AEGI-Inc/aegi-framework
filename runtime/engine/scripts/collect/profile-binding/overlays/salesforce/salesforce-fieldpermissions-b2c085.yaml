overlay_basis:
  from: aegi-knowledge docs/decisions/SALESFORCE_PERMISSION_ROWS_2026-10-28.md
  decision: G4-Q02
  note: 내용 행은 객체로 만들지 않고 부모 권한 세트(프로필 소유면 그 Profile)의 permissions 속성에 접는다
runtime_rules:
  - id: fold
    kind: enrich
    sources:
      - call: RG-SF-FieldPermissions
        items: records
        where:
          path: attributes.type
          eq: FieldPermissions
    group_by:
      op: sf_id18
      of: ParentId
    target:
      switch:
        op: exists
        of:
          op: index
          name: ps_owner_profile
          key:
            op: sf_id18
            of: ParentId
      cases:
        "true":
          type: Profile
          id:
            op: index
            name: ps_owner_profile
            key:
              op: sf_id18
              of: ParentId
      default:
        type: PermissionSet
        id: ParentId
    observe: true
    merge:
      permissions:
        object:
          field_permission_rows:
            op: count
            of: $group
          fields_read:
            op: group
            key: $item.r.SobjectType
            of:
              op: filter
              of: $group
              where:
                path: $item.r.PermissionsRead
                truthy: true
          fields_edit:
            op: group
            key: $item.r.SobjectType
            of:
              op: filter
              of: $group
              where:
                path: $item.r.PermissionsEdit
                truthy: true
