overlay_basis:
  from: aegi-adapter-engine catalog/salesforce/profiles/user_role.yaml
  engine_commit: d78062d
  research_agreement: same
runtime_rules:
  - id: list
    kind: object
    sources:
      - call: SF-05
        items: records
        where:
          path: attributes.type
          eq: UserRole
    id_expr: Id
    parent:
      ref:
        type: UserRole
        id: ParentRoleId
      when: exists_end
    properties:
      name: Name
      developer_name: DeveloperName
      parent_role:
        if:
          path: ParentRoleId
          truthy: true
        then:
          op: sf_id18
          of: ParentRoleId
        else:
          const: null
    display: "{Name|Id}"
    relations: []
    identity:
      primary:
        - name: id
          expr: Id
          stability: catalog_reviewed
          normalization: &a1
            - to_18_char
      scope: tenant
    key_template: SF-ROLE-{id}
  - id: hierarchy
    kind: relations
    sources:
      - call: SF-05
        items: records
        where:
          all:
            - path: attributes.type
              eq: UserRole
            - path: ParentRoleId
              truthy: true
    relations:
      - type: contained_in
        source:
          type: UserRole
          id: Id
        target:
          type: UserRole
          id: ParentRoleId
        basis: stated
        require:
          - target
        properties:
          field:
            const: ParentRoleId
    key_template: SF-ROLE-{id}
runtime_stub: null
runtime_key: SF-ROLE-{id}
runtime_identifiers:
  primary:
    - id
  id:
    stability: stable
    normalization: *a1
relation_rules:
  - id: UserRole:hierarchy
    sources:
      - call: SF-05
        items: records
        where:
          all:
            - path: attributes.type
              eq: UserRole
            - path: ParentRoleId
              truthy: true
    relations:
      - type: contained_in
        source:
          type: UserRole
          id: Id
        target:
          type: UserRole
          id: ParentRoleId
        basis: stated
        require:
          - target
        properties:
          field:
            const: ParentRoleId
