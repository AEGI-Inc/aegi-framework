format: im-pilot-profile/1
scope: additive_runtime_projection
provider: aws
service: rds
object_type: RDSInstance
interfaces: [Resource]
identity:
  primary:
    - {name: id, expr: DBInstanceIdentifier, stability: stable}
  scope: tenant
fields: {}
runtime_key: AWS-RDS-{id}
runtime_identifiers:
  primary: [id]
  id: {stability: stable}
runtime_rules:
  - id: list
    kind: object
    sources:
      - call: AWS-04
        request: {kind: db_instances}
        items: DBInstances
    id_expr: DBInstanceIdentifier
    properties:
      db_instance_identifier: DBInstanceIdentifier
      arn: DBInstanceArn
      db_instance_class: DBInstanceClass
      engine: Engine
      engine_version: EngineVersion
      status: DBInstanceStatus
      publicly_accessible: PubliclyAccessible
      storage_encrypted: StorageEncrypted
      vpc_id: VpcId
      endpoint_address: EndpointAddress
      endpoint_port: EndpointPort
      security_group_ids: SecurityGroupIds
      endpoint: Endpoint
      db_subnet_group: DBSubnetGroup
      vpc_security_groups: VpcSecurityGroups
    display: "{DBInstanceIdentifier}"
    relations:
      - type: contained_in
        source: $self
        target: {type: VPC, id: VpcId}
        basis: stated
        require: [target]
      - each: VpcSecurityGroups
        type: applies_to
        source: {type: SecurityGroup, id: $item.VpcSecurityGroupId}
        target: $self
        basis: stated
        require: [source]
