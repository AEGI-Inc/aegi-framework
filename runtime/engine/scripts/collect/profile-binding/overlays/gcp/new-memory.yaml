format: im-pilot-profile/1
scope: additive_runtime_projection
provider: gcp
service: aiplatform
object_type: Memory
interfaces: [Resource]
# 근거: Agent Platform v1(reasoningEngines) Discovery 문서의 GoogleCloudAiplatformV1Memory 스키마. 명세에만 있음, 우리 환경 미조회(저장된 실제 응답 없음).
# 호출 ID GCP-06 와 request.kind 는 수집기(scripts/collect/providers/gcp.ts)와 맞춘 것이다. 실제 Google API 로는 돌려 보지 않았다.
# 기억 본문(fact)은 옮기지 않는다.
identity:
  primary:
    - {name: id, expr: name, stability: stable}
  scope: tenant
fields: {}
privacy:
  secret_leaf_names: [access_token, accessToken, refresh_token, refreshToken, client_secret, clientSecret, secret, password, token, securityToken, api_key, apiKey, privateKeyData, private_key, privateKey]
runtime_key: GCP-RE-MEMORY-{id}
runtime_identifiers:
  primary: [id]
  id: {stability: stable}
runtime_rules:
  - id: list
    kind: object
    sources:
      - call: GCP-06
        request: {kind: memories}
        items: memories
    tenant: {switch: {if: {path: name, matches: "^projects/[0-9]+(/|$)"}, then: {const: number}, else: {const: id}}, cases: {number: {type: Project, id: {op: regex, of: name, pattern: "^(projects/[^/]+)"}}, id: {type: Project, lookup: projectId, value: {op: regex, of: name, pattern: "^projects/([^/]+)"}}}}
    id_expr: name
    properties:
      displayName: displayName
      topics: topics
      disableMemoryRevisions: disableMemoryRevisions
      updateTime: updateTime
      createTime: createTime
      revisionExpireTime: revisionExpireTime
      revisionLabels: revisionLabels
      ttl: ttl
      expireTime: expireTime
      metadata: metadata
      description: description
      scope: scope
      context: context
      revisionTtl: revisionTtl
    display: "{displayName|title|name}"
    relations:
      - type: contained_in
        source: $self
        target: {type: ReasoningEngine, id: {op: regex, of: name, pattern: "^(.+)/memories/[^/]+$"}}
        basis: stated
        require: [target]
