format: im-pilot-profile/1
scope: additive_runtime_projection
provider: gcp
service: agentidentity
object_type: AgentIdentityAuthorization
interfaces: [Assignment]
# 근거: Agent Identity v1 Discovery 문서의 Authorization 스키마. 명세에만 있음, 우리 환경 미조회(저장된 실제 응답 없음).
# 호출 ID GCP-05 와 request.kind 는 수집기(scripts/collect/providers/gcp.ts)와 맞춘 것이다. 실제 Google API 로는 돌려 보지 않았다.
# Agent Identity 의 Authorization. 사용자가 에이전트에 준 동의 기록이다. Gemini Enterprise 의 Authorization 과 타입 이름이 겹쳐 따로 둔다.
identity:
  primary:
    - {name: id, expr: name, stability: stable}
  scope: tenant
fields: {}
privacy:
  secret_leaf_names: [access_token, accessToken, refresh_token, refreshToken, client_secret, clientSecret, secret, password, token, securityToken, api_key, apiKey, privateKeyData, private_key, privateKey]
runtime_key: GCP-AID-AUTHZ-{id}
runtime_identifiers:
  primary: [id]
  id: {stability: stable}
runtime_rules:
  - id: list
    kind: object
    sources:
      - call: GCP-05
        request: {kind: authorizations}
        items: authorizations
    tenant: {switch: {if: {path: name, matches: "^projects/[0-9]+(/|$)"}, then: {const: number}, else: {const: id}}, cases: {number: {type: Project, id: {op: regex, of: name, pattern: "^(projects/[^/]+)"}}, id: {type: Project, lookup: projectId, value: {op: regex, of: name, pattern: "^projects/([^/]+)"}}}}
    id_expr: name
    properties:
      scopes: scopes
      createTime: createTime
      state: state
      updateTime: updateTime
      clientUserId: clientUserId
    display: "{name}"
    relations:
      - type: contained_in
        source: $self
        target: {type: AuthProvider, id: {op: regex, of: name, pattern: "^(.+)/authorizations/[^/]+$"}}
        basis: stated
        require: [target]
