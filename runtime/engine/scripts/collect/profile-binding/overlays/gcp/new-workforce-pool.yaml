format: im-pilot-profile/1
scope: additive_runtime_projection
provider: gcp
service: iam
object_type: WorkforcePool
interfaces: [Principal]
# 근거: IAM v1 Discovery 문서의 WorkforcePool 스키마. 명세에만 있음, 우리 환경 미조회(저장된 실제 응답 없음).
# 호출 ID GCP-02 와 request.kind 는 수집기(scripts/collect/providers/gcp.ts)와 맞춘 것이다. 실제 Google API 로는 돌려 보지 않았다.
# 외부 IdP 사용자 풀. 조직 아래에 있어 프로젝트 경로가 없다. AclConfig 의 idp_type 이 THIRD_PARTY 일 때 Gemini Enterprise 접근 신원의 출처다.
identity:
  primary:
    - {name: id, expr: name, stability: stable}
  scope: tenant
fields: {}
privacy:
  secret_leaf_names: [access_token, accessToken, refresh_token, refreshToken, client_secret, clientSecret, secret, password, token, securityToken, api_key, apiKey, privateKeyData, private_key, privateKey]
runtime_key: GCP-WFPOOL-{id}
runtime_identifiers:
  primary: [id]
  id: {stability: stable}
runtime_rules:
  - id: list
    kind: object
    sources:
      - call: GCP-02
        request: {kind: workforce_pools}
        items: workforcePools
    id_expr: name
    properties:
      expireTime: expireTime
      state: state
      sessionDuration: sessionDuration
      parent: parent
      accessRestrictions: accessRestrictions
      description: description
      displayName: displayName
      disabled: disabled
      principal_kind: {const: group}
      account_kind: {const: unknown}
      account_state: {op: map, of: state, table: {ACTIVE: active, DELETED: deleted}, default: {const: unknown}}
    display: "{displayName|title|name}"
    relations: []
