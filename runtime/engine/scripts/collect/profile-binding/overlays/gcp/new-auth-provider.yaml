format: im-pilot-profile/1
scope: additive_runtime_projection
provider: gcp
service: agentidentity
object_type: AuthProvider
interfaces: [Policy]
# 근거: Agent Identity v1 Discovery 문서의 AuthProvider 스키마. 명세에만 있음, 우리 환경 미조회(저장된 실제 응답 없음).
# 호출 ID GCP-05 와 request.kind 는 수집기(scripts/collect/providers/gcp.ts)와 맞춘 것이다. 실제 Google API 로는 돌려 보지 않았다.
# 어떤 에이전트(workloadIds)가 어떤 범위를 받을 수 있는지 정한다. 유형별 설정(authProviderTypeParams)은 비밀값이 들 수 있어 옮기지 않는다.
identity:
  primary:
    - {name: id, expr: name, stability: stable}
  scope: tenant
fields: {}
privacy:
  secret_leaf_names: [access_token, accessToken, refresh_token, refreshToken, client_secret, clientSecret, secret, password, token, securityToken, api_key, apiKey, privateKeyData, private_key, privateKey]
runtime_key: GCP-AID-PROVIDER-{id}
runtime_identifiers:
  primary: [id]
  id: {stability: stable}
runtime_rules:
  - id: list
    kind: object
    sources:
      - call: GCP-05
        request: {kind: auth_providers}
        items: authProviders
    tenant: {switch: {if: {path: name, matches: "^projects/[0-9]+(/|$)"}, then: {const: number}, else: {const: id}}, cases: {number: {type: Project, id: {op: regex, of: name, pattern: "^(projects/[^/]+)"}}, id: {type: Project, lookup: projectId, value: {op: regex, of: name, pattern: "^projects/([^/]+)"}}}}
    id_expr: name
    properties:
      expireTime: expireTime
      blockedScopes: blockedScopes
      labels: labels
      createTime: createTime
      deleted: deleted
      state: state
      updateTime: updateTime
      allowedScopes: allowedScopes
      description: description
      workloadIds: workloadIds
      activation: {const: standing}
    display: "{name}"
    relations:
      - type: contained_in
        source: $self
        target: {switch: {if: {path: name, matches: "^projects/[0-9]+(/|$)"}, then: {const: number}, else: {const: id}}, cases: {number: {type: Project, id: {op: regex, of: name, pattern: "^(projects/[^/]+)"}}, id: {type: Project, lookup: projectId, value: {op: regex, of: name, pattern: "^projects/([^/]+)"}}}}
        basis: stated
        require: [target]
