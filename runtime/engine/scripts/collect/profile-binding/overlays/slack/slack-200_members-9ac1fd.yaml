overlay_basis:
  from: aegi-adapter-engine catalog/slack/profiles/user.yaml
  engine_commit: d78062d
  research_agreement: same
runtime_rules:
  - id: admin_list
    kind: object
    sources:
      - call: SL-01
        items: users
    vars:
      email:
        op: nonempty
        of:
          op: lower
          of:
            any:
              - email
              - profile.email
            empty_as: ""
      is_bot:
        if:
          any:
            - path: is_bot
              truthy: true
            - path: id
              eq: USLACKBOT
        then: true
        else: false
      bot_id: profile.bot_id
      app_id: profile.api_app_id
      ws:
        any:
          - op: url_param
            of: $env.endpoint
            name: team_id
          - $req.team_id
    mutable_ids:
      email: $vars.email
      name:
        any:
          - name
          - username
    refs:
      bot:
        ref:
          type: 200.bot
          id: $vars.bot_id
        value: $vars.bot_id
    properties:
      email: $vars.email
      name:
        any:
          - name
          - username
      real_name:
        any:
          - real_name
          - full_name
          - profile.real_name
      is_bot: $vars.is_bot
      is_app_user: is_app_user
      bot_id: $vars.bot_id
      app_id: $vars.app_id
      is_admin: is_admin
      is_owner: is_owner
      is_primary_owner: is_primary_owner
      is_restricted: is_restricted
      is_ultra_restricted: is_ultra_restricted
      deleted: deleted
      # 계정 상태. 관리자 목록(SL-01)은 is_active, users.list 는 deleted 를 준다. Slack 의 비활성(deactivate)은 관리자가 다시 켤 수 있어 해지(deprovisioned)로 본다
      account_state:
        op: map
        of: is_active
        table:
          'true': active
          'false': deprovisioned
        default:
          op: map
          of: deleted
          table:
            'true': deprovisioned
            'false': active
          default:
            const: unknown
      enterprise_user_id: enterprise_user.id
      principal_kind:
        if:
          path: $vars.is_bot
          truthy: true
        then:
          const: service
        else:
          const: human
    display: "{$vars.email|real_name|name|id}"
    meta:
      demo_role:
        if:
          any:
            - path: id
              in_expr: $ctx.measurementSlack
            - path: $vars.bot_id
              in_expr: $ctx.measurementSlack
        then:
          const: measurement_principal
    relations:
      - type: member_of
        source: $self
        target:
          type: 200.team
          id: $vars.ws
        basis: computed
        properties:
          via:
            const: queried_team
      - type: member_of
        each: enterprise_user.teams
        source: $self
        target:
          type: 200.team
          id: $item
        basis: stated
      - type: has_role_on
        when:
          path: is_owner
          eq: true
        source: $self
        target:
          type: 200.team
          id: $vars.ws
        role:
          name:
            const: owner
        basis: flag
        properties:
          flag_field:
            const: owner
      - type: has_role_on
        when:
          path: is_admin
          eq: true
        source: $self
        target:
          type: 200.team
          id: $vars.ws
        role:
          name:
            const: admin
        basis: flag
        properties:
          flag_field:
            const: admin
      - type: has_role_on
        when:
          path: is_primary_owner
          eq: true
        source: $self
        target:
          type: 200.team
          id: $vars.ws
        role:
          name:
            const: primary_owner
        basis: flag
        properties:
          flag_field:
            const: primary_owner
      - type: has_role_on
        when:
          path: enterprise_user.is_owner
          eq: true
        source: $self
        target: $tenant
        role:
          name:
            const: owner
        basis: flag
        properties:
          flag_field:
            const: owner
      - type: has_role_on
        when:
          path: enterprise_user.is_admin
          eq: true
        source: $self
        target: $tenant
        role:
          name:
            const: admin
        basis: flag
        properties:
          flag_field:
            const: admin
      - type: acts_as
        source:
          type: defs_app_id
          id: $vars.app_id
        target: $self
        basis: stated
    identity:
      primary:
        - name: id
          expr: id
          stability: catalog_reviewed
      scope: tenant
    key_template: SLK-U-{id}
