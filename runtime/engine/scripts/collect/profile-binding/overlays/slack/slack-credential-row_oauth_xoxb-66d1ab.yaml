# 2026-11-18 Credential 로 결정(aegi-knowledge catalog/slack review.yaml bot-token). 봇 토큰(xoxb)은 설치된 앱의 봇 사용자로 API 를 부르는
# 자격증명이다(Slack 문서 Tokens, Installing with OAuth). 앱마다 users.list 봇 사용자와 bots.info 가 있어 설치(토큰 발급)가 확인된다.
# IM 모델 v3.2 의 Policy(model-v1 reviewed_override)를 덮는다. Policy 면 owned_by 가 선언 밖 Policy>Integration 이라 토큰 → 앱 간선이 없다
interfaces: [Credential]
overlay_basis:
  from: aegi-adapter-engine catalog/slack/profiles/bot_token.yaml
  engine_commit: d78062d
  research_agreement: reviewed_override
runtime_rules:
  - id: list
    kind: object
    sources:
      - call: SL-10
        items: (root)
        where:
          path:
            op: count
            of: manifest.oauth_config.scopes.bot
          truthy: true
    vars:
      app:
        op: str
        of: $req.app_id
      app_name:
        any:
          - manifest.display_information.name
          - $req.app_id
    id_expr:
      template: "{$vars.app}:bot"
    parts:
      app: $vars.app
    parent:
      ref:
        type: defs_app_id
        id: $vars.app
    properties:
      app_id: $vars.app
      scopes: manifest.oauth_config.scopes.bot
    display: bot token ({$vars.app_name})
    relations:
      - type: owned_by
        source: $self
        target:
          type: defs_app_id
          id: $vars.app
        basis: stated
    identity:
      primary:
        - name: app
          expr: $vars.app
          stability: catalog_reviewed
      scope: tenant
    key_template: SLK-BOTTOKEN-{app}
runtime_stub: null
runtime_key: SLK-BOTTOKEN-{app}
runtime_identifiers:
  primary:
    - id
  id:
    stability: stable
relation_rules:
  - id: bot-token:list
    sources:
      - call: SL-10
        items: (root)
        where:
          path:
            op: count
            of: manifest.oauth_config.scopes.bot
          truthy: true
    vars:
      app:
        op: str
        of: $req.app_id
      app_name:
        any:
          - manifest.display_information.name
          - $req.app_id
    relations:
      - type: owned_by
        source: $self
        target:
          type: defs_app_id
          id: $vars.app
        basis: stated
    self_identity: object_rule
vars:
  app:
    op: str
    of: $req.app_id
  app_name:
    any:
      - manifest.display_information.name
      - $req.app_id
identity:
  primary:
    - name: app
      expr: $vars.app
      stability: catalog_reviewed
  scope: tenant
  evidence:
    source: catalog_spec5_key
    key_template: SLK-BOTTOKEN-{app}
    replaced:
      - $record_hash
binding:
  status: catalog_call
  call: SL-10
  operation_id: op:slack_docs_methods:apps.manifest.export
  paths:
    - shape: null
      path: []
  basis: catalog spec:5 sources
  previous_status: documented_not_collected
tenant_binding:
  type: 200.team
tenant_basis: 생성기의 tenant 이름 workspace 는 카탈로그 이름이다. 현행 카탈로그 workspace 의 연구 타입이 새
  Profile 200.team 이다
