overlay_basis:
  from: aegi-adapter-engine catalog/gws/profiles/idp_credential.yaml
  engine_commit: d78062d
  research_agreement: same
runtime_rules:
  - id: list
    kind: object
    sources:
      - call: GW-17
        request:
          profile: present
        items: idpCredentials
      - call: GW-17
        endpoint: /idpCredentials(\?|$)
        items: idpCredentials
    vars:
      profile:
        op: str
        of:
          any:
            - $req.profile
          empty_as: ""
      cred:
        if:
          path: name
          truthy: true
        then:
          op: split_last
          of: name
          sep: /
        else:
          op: str
          of:
            any:
              - id
            empty_as: default
    id_expr:
      any:
        - name
        - template: "{$vars.profile}:{$vars.cred}"
    parts:
      prof: $vars.profile
      cred: $vars.cred
    parent:
      ref:
        type: InboundSamlSsoProfile
        id: $vars.profile
    properties:
      name: name
      format: format
      cert_sha256: cert_sha256
    display: IdP 인증서 {$vars.cred}
    relations:
      - type: contained_in
        source: $self
        target:
          type: InboundSamlSsoProfile
          id: $vars.profile
        basis: stated
        require:
          - target
    identity:
      primary:
        - name: prof
          expr: $vars.profile
          stability: catalog_reviewed
        - name: cred
          expr: $vars.cred
          stability: catalog_reviewed
      scope: tenant
    key_template: GWS-IDPCRED-{prof}-{cred}
runtime_stub: null
runtime_key: GWS-IDPCRED-{prof}-{cred}
runtime_identifiers:
  primary:
    - id
  id:
    stability: stable
relation_rules:
  - id: IdpCredential:list
    sources:
      - call: GW-17
        request:
          profile: present
        items: idpCredentials
      - call: GW-17
        endpoint: /idpCredentials(\?|$)
        items: idpCredentials
    vars:
      profile:
        op: str
        of:
          any:
            - $req.profile
          empty_as: ""
      cred:
        if:
          path: name
          truthy: true
        then:
          op: split_last
          of: name
          sep: /
        else:
          op: str
          of:
            any:
              - id
            empty_as: default
    relations:
      - type: contained_in
        source: $self
        target:
          type: InboundSamlSsoProfile
          id: $vars.profile
        basis: stated
        require:
          - target
    self_identity: object_rule
vars:
  profile:
    op: str
    of:
      any:
        - $req.profile
      empty_as: ""
  cred:
    if:
      path: name
      truthy: true
    then:
      op: split_last
      of: name
      sep: /
    else:
      op: str
      of:
        any:
          - id
        empty_as: default
identity:
  primary:
    - name: prof
      expr: $vars.profile
      stability: catalog_reviewed
    - name: cred
      expr: $vars.cred
      stability: catalog_reviewed
  scope: parent
  evidence:
    source: catalog_spec5_key
    key_template: GWS-IDPCRED-{prof}-{cred}
    replaced:
      - $req.parent_id
      - name
