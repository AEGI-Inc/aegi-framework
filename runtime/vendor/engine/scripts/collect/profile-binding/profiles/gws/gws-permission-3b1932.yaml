      path: expirationTime
      defined: true
    then: expirationTime
    else:
      const: null
relation_plans:
  - type: contained_in
    source: $self
    target: $refs.file
    produced_by_reference: file
    basis: stated
  - type: has_role_on
    source: $refs.grantee
    target: $refs.file
    role:
      name: role
      kind: name_key
    produced_by_reference: grantee
    basis: stated
    allowed_roles:
