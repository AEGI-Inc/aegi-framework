references:
  - name: file
    field: $req.file
    target: File
    relation: contained_in
    source: gws_drive
    reviewed_at: 2026-10-25
    rationale: Reviewed source gws_drive; contained_in
  - name: grantee
    field: emailAddress
    target_switch: type
    targets:
      user: User
      group: Group
      domain: SpecialPrincipal
      anyone: SpecialPrincipal
    lookup_field: primaryEmail
    relation: has_role_on
    source: im_relation_decisions
    locator: A4 plus g4_decisions special principals
    target_services:
      User: admin
      Group: admin
      SpecialPrincipal: drive
    value_expr:
      any:
        - emailAddress
        - domain
        - if:
            path: type
            eq: anyone
          then:
            const: anyone
    identifier_types:
      User: primaryEmail
      Group: email
      SpecialPrincipal: name
    source_paths:
      - emailAddress
      - domain
    case_insensitive: true
    required: true
    reviewed_at: 2026-10-25
    rationale: A4 plus g4_decisions special principals
constants: {}
row_contracts:
