    - api_token
    - sharedSecret
    - privateKeyData
    - password
    - passwordHash
    - passwordSalt
  secret_paths:
    - _embedded.activation.challenge
  object_rules:
    - when_key: kty
      fields:
        - n
        - e
        - x5c
  token_patterns:
    - ^xox
    - hooks\.slack\.com/services/
  redact_write_only: true
  write_only_paths: []
