constants: {}
row_contracts:
  principal_kind:
    if:
      equals:
        - type
        - User
    then: human
    else:
      if:
        equals:
          - type
          - Bot
      then: service
      else:
        if:
          equals:
            - type
            - Organization
        then: group
        else: unknown
  account_kind:
    if:
      equals:
        - type
        - User
    then: human
    else:
      if:
        equals:
          - type
          - Bot
      then: app
      else: unknown
relation_plans:
  - type: contained_in
    source: $self
    target: $refs.parent_scope
    produced_by_reference: parent_scope
    basis: stated
privacy:
  secret_leaf_names:
