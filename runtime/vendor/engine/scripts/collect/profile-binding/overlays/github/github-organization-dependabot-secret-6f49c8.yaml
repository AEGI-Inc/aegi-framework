overlay_basis:
  from: aegi-adapter-engine
    catalog/github/profiles/organization_dependabot_secret.yaml
  engine_commit: d78062d
  research_agreement: same
runtime_rules:
  - id: list
    kind: object
    sources:
      - call: GH-25
        request:
          secret: absent
          scope: org
          kind: dependabot
        items: secrets
    vars:
      kind:
        op: str
        of: $req.kind
      available:
        if:
          path: visibility
          eq: selected
        then:
          any:
            - op: index
              name: secret_repos
              key:
                template: "{$req.kind}|{name}"
          empty_as: []
        else:
          const: []
    id_expr:
      template: "{$vars.kind}:org:{name}"
    parts:
      k: $vars.kind
      s:
        const: org
      n: name
    refs:
      available_to:
        each: $vars.available
        ref:
          key: $item.key
        type: Repository
        value: $item.value
    properties:
      name: name
      scope:
        const: organization
      visibility: visibility
      created_at: created_at
      updated_at: updated_at
    display: Dependabot 조직 비밀값 {name}
    relations: []
    identity:
      primary:
        - name: k
          expr: $vars.kind
          stability: catalog_reviewed
        - name: s
          expr: &a1
            const: org
          stability: catalog_reviewed
        - name: n
          expr: name
          stability: catalog_reviewed
      scope: tenant
    key_template: GH-SECRET-{k}-{s}-{n}
runtime_stub: null
runtime_key: GH-SECRET-{k}-{s}-{n}
runtime_identifiers:
  primary:
    - id
  id:
    stability: stable
vars:
  kind:
    op: str
    of: $req.kind
  available:
    if:
      path: visibility
      eq: selected
    then:
      any:
        - op: index
          name: secret_repos
          key:
            template: "{$req.kind}|{name}"
      empty_as: []
    else:
      const: []
identity:
  primary:
    - name: k
      expr: $vars.kind
      stability: catalog_reviewed
    - name: s
      expr: *a1
      stability: catalog_reviewed
    - name: n
      expr: name
      stability: catalog_reviewed
  scope: parent
  evidence:
    source: catalog_spec5_key
    key_template: GH-SECRET-{k}-{s}-{n}
    replaced:
      - $req.parent_id
      - name
tenant_binding:
  type: organization-full
tenant_basis: 생성기의 tenant 이름 Organization 은 카탈로그 이름이다. 새 Profile 의 조직 타입은 organization-full
