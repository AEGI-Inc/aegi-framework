overlay_basis:
  from: aegi-adapter-engine catalog/github/profiles/repository_ruleset.yaml
  engine_commit: d78062d
  research_agreement: same
runtime_rules:
  - id: list
    kind: object
    sources:
      - call: GH-08
        request:
          ruleset: present
        items: (root)
    properties:
      name: name
      target: target
      source_type: source_type
      source: source
      enforcement: enforcement
      conditions: conditions
      rules: rules
      bypass_actors:
        any:
          - bypass_actors
        empty_as: []
    display: "{name}"
    relations:
      - type: applies_to
        source: $self
        target:
          type: Repository
          lookup: name
          value: $req.repo
        basis: stated
        properties:
          binding:
            const: explicit
      - type: excludes
        each: bypass_actors
        source: $self
        target:
          switch: $item.actor_type
          cases:
            Team:
              type: team-full
              id: $item.actor_id
            RepositoryRole:
              type: organization-custom-repository-role
              id: $item.actor_id
        basis: stated
        require:
          - target
        properties:
          bypass_mode: $item.bypass_mode
    identity:
      primary:
        - name: id
          expr: id
          stability: catalog_reviewed
      scope: tenant
    key_template: GH-RULESET-{id}
runtime_stub: null
runtime_key: GH-RULESET-{id}
runtime_identifiers:
  primary:
    - id
  id:
    stability: stable
relation_rules:
  - id: Repository ruleset:list
    sources:
      - call: GH-08
        request:
          ruleset: present
        items: (root)
    relations:
      - type: applies_to
        source: $self
        target:
          type: Repository
          lookup: name
          value: $req.repo
        basis: stated
        properties:
          binding:
            const: explicit
      - type: excludes
        each: bypass_actors
        source: $self
        target:
          switch: $item.actor_type
          cases:
            Team:
              type: team-full
              id: $item.actor_id
            RepositoryRole:
              type: organization-custom-repository-role
              id: $item.actor_id
        basis: stated
        require:
          - target
        properties:
          bypass_mode: $item.bypass_mode
    self_identity: object_rule
identity:
  primary:
    - name: id
      expr: id
      stability: catalog_reviewed
  scope: parent
  evidence:
    source: catalog_spec5_key
    key_template: GH-RULESET-{id}
    replaced:
      - $req.parent_id
      - id
tenant_binding:
  type: organization-full
tenant_basis: 생성기의 tenant 이름 Organization 은 카탈로그 이름이다. 새 Profile 의 조직 타입은 organization-full
