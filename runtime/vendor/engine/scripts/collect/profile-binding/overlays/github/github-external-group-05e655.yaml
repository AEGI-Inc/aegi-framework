overlay_basis:
  from: aegi-adapter-engine catalog/github/profiles/external_group.yaml
  engine_commit: d78062d
  research_agreement: same
runtime_rules:
  - id: list
    kind: object
    sources:
      - call: GH-28
        items:
          - (root)
          - groups
        where:
          path: group_id
          defined: true
    id_expr: group_id
    properties:
      name: group_name
      group_name: group_name
      updated_at: updated_at
    display: 외부 그룹 {group_name}
    relations:
      - type: member_of
        each: teams
        source: $self
        target:
          type: team-full
          id: $item.team_id
        basis: stated
        require:
          - target
        properties:
          via:
            const: external_group_sync
      - type: member_of
        each: members
        when:
          path: $item.member_login
          truthy: true
        source:
          type: simple-user
          lookup: login
          value: $item.member_login
        target: $self
        basis: stated
    identity:
      primary:
        - name: id
          expr: group_id
          stability: catalog_reviewed
      scope: tenant
    key_template: GH-EXTGROUP-{id}
runtime_stub: null
runtime_key: GH-EXTGROUP-{id}
runtime_identifiers:
  primary:
    - id
  id:
    stability: stable
relation_rules:
  - id: ExternalGroup:list
    sources:
      - call: GH-28
        items:
          - (root)
          - groups
        where:
          path: group_id
          defined: true
    relations:
      - type: member_of
        each: teams
        source: $self
        target:
          type: team-full
          id: $item.team_id
        basis: stated
        require:
          - target
        properties:
          via:
            const: external_group_sync
      - type: member_of
        each: members
        when:
          path: $item.member_login
          truthy: true
        source:
          type: simple-user
          lookup: login
          value: $item.member_login
        target: $self
        basis: stated
    self_identity: object_rule
identity:
  primary:
    - name: id
      expr: group_id
      stability: catalog_reviewed
  scope: parent
  evidence:
    source: catalog_spec5_key
    key_template: GH-EXTGROUP-{id}
    replaced:
      - $req.parent_id
      - group_id
tenant_binding:
  type: organization-full
tenant_basis: 생성기의 tenant 이름 Organization 은 카탈로그 이름이다. 새 Profile 의 조직 타입은 organization-full
