overlay_basis:
  from: aegi-adapter-engine catalog/github/profiles/actions_secret.yaml
  engine_commit: d78062d
  research_agreement: same
runtime_rules:
  - id: list
    kind: object
    sources:
      - call: GH-25
        request:
          secret: absent
        items: secrets
        where:
          all:
            - path: $req.scope
              ne: org
            - path: $req.kind
              ne: dependabot
    vars:
      kind:
        op: str
        of: $req.kind
      repo:
        ref:
          type: Repository
          lookup: name
          value:
            op: str
            of: $req.repo
        prop: $key
      repo_id:
        ref:
          type: Repository
          lookup: name
          value:
            op: str
            of: $req.repo
        prop: $id
      environment:
        if:
          path: $req.environment
          truthy: true
        then:
          op: str
          of: $req.environment
      parent:
        if:
          path: $vars.environment
          present: true
        then:
          op: index
          name: env_by_name
          key:
            template: "{$req.repo}|{$vars.environment}"
        else: $vars.repo
      scope:
        if:
          path: $vars.environment
          present: true
        then:
          template: "{$vars.repo_id}:{$vars.environment}"
        else:
          op: str
          of: $vars.repo_id
      where:
        if:
          path: $vars.environment
          present: true
        then:
          template: " 환경 {$vars.environment}"
        else:
          const: ""
    require:
      all:
        - path: $vars.repo
          present: true
        - path: $vars.parent
          present: true
    id_expr:
      template: "{$vars.kind}:{$vars.scope}:{name}"
    parts:
      k: $vars.kind
      s: $vars.scope
      n: name
    parent:
      ref:
        key: $vars.parent
      when: always
    properties:
      name: name
      scope:
        if:
          path: $vars.environment
          present: true
        then:
          const: environment
        else:
          const: repository
      environment:
        op: null_if_missing
        of: $vars.environment
      created_at: created_at
      updated_at: updated_at
    display: Actions 비밀값 {name} ({$req.repo}{$vars.where})
    relations:
      - type: contained_in
        source: $self
        target:
          key: $vars.parent
        basis: stated
    identity:
      primary:
        - name: k
          expr: $vars.kind
          stability: catalog_reviewed
        - name: s
          expr: $vars.scope
          stability: catalog_reviewed
        - name: n
          expr: name
          stability: catalog_reviewed
      scope: tenant
    key_template: GH-SECRET-{k}-{s}-{n}
runtime_stub: null
runtime_key: GH-SECRET-{k}-{s}-{n}
runtime_identifiers:
  primary:
    - id
  id:
    stability: stable
relation_rules:
