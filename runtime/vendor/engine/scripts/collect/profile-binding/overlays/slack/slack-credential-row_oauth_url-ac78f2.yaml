overlay_basis:
  from: aegi-adapter-engine catalog/slack/profiles/incoming_webhook.yaml
  engine_commit: d78062d
  research_agreement: same
runtime_rules:
  - id: oauth_callback
    kind: object
    sources:
      - provider: worker
        call: D-21
        items: results
    vars:
      hook:
        any:
          - raw_response.incoming_webhook
        empty_as: {}
      app: raw_response.app_id
      channel:
        any:
          - raw_response.incoming_webhook.channel_id
          - channel_id
    require:
      all:
        - path: $vars.app
          present: true
        - path: $vars.channel
          present: true
    id_expr:
      template: "{$vars.app}:{$vars.channel}"
    parts:
      app: $vars.app
      ch: $vars.channel
    properties:
      app_id: $vars.app
      app_name: app_name
      channel_id: $vars.channel
      channel_name: $vars.hook.channel
      webhook_url_sha256: webhook_url_fingerprint
      configuration_url: $vars.hook.configuration_url
      installed_by: raw_response.authed_user.id
      installed_at:
        op: sqlite_iso
        of: created_at
      direction:
        const: in
      endpoint_owner:
        const: provider_hosted
      credential_kind:
        const: bearer_url
    display: "incoming-webhook → #{$vars.hook.channel|$vars.channel}"
    relations:
      - type: receives_into
        source: $self
        target:
          type: conversation
          id: $vars.channel
          # 2026-11-09. OAuth 응답의 team_id 가 채널의 워크스페이스다. 다른 워크스페이스(이전 회차 샌드박스)의 채널을 이 워크스페이스 채널로 두지 않는다
          stub_tenant:
            type: 200.team
            id:
              any:
                - raw_response.team.id
                - team_id
        basis: stated
      - type: owned_by
        source: $self
        target:
          type: defs_app_id
          id: $vars.app
        basis: stated
    identity:
      primary:
        - name: app
          expr: $vars.app
          stability: catalog_reviewed
        - name: ch
          expr: $vars.channel
          stability: catalog_reviewed
      scope: tenant
    key_template: SLK-HOOK-{app}-{ch}
  - id: integration_logs
    kind: object
    sources:
      - call: SL-09
        items: logs
        where:
          all:
            - path:
                op: split
                of: scope
                sep: ","
                trim: true
              contains: incoming-webhook
            - path: channel
              truthy: true
            - path:
                any:
                  - app_id
                  - service_id
              truthy: true
    group_by:
      template: "{app_id|service_id}|{channel}"
    group_sort:
      op: str
      of: date
    obs: last
    vars:
      first:
        op: first
        of: $group
      last:
        op: last
        of: $group
      owner:
        op: str
        of:
          any:
            - $vars.first.r.app_id
            - $vars.first.r.service_id
      channel:
        op: str
        of: $vars.first.r.channel
      removed:
        op: in
        of: $vars.last.r.change_type
        values:
          - removed
          - disabled
      channel_name:
        ref:
          type: conversation
          id: $vars.channel
        prop: name
    id_expr:
      template: "{$vars.owner}:{$vars.channel}"
    parts:
      app: $vars.owner
      ch: $vars.channel
    properties:
      app_id: $vars.first.r.app_id
      service_id: $vars.first.r.service_id
      service_type:
        any:
          - $vars.first.r.service_type
          - $vars.first.r.app_type
      channel_id: $vars.channel
      installed_by: $vars.first.r.user_id
      installed_at:
        op: epoch_iso
        of: $vars.first.r.date
      last_change: $vars.last.r.change_type
      last_change_at:
        op: epoch_iso
        of: $vars.last.r.date
      removed_at:
        if:
          path: $vars.removed
          truthy: true
        then:
          op: epoch_iso
          of: $vars.last.r.date
      reason:
        if:
          path: $vars.removed
          truthy: true
        then: $vars.last.r.reason
      source:
        const: team.integrationLogs
      direction:
        const: in
      endpoint_owner:
        const: provider_hosted
      credential_kind:
        const: bearer_url
    display:
      if:
        path: $vars.channel_name
        present: true
      then:
        template: "incoming-webhook → #{$vars.channel_name}"
      else:
        template: incoming-webhook → {$vars.channel}
    relations:
      - type: receives_into
        when:
          path: $vars.removed
          truthy: false
        source: $self
        target:
          type: conversation
          id: $vars.channel
        basis: stated
        properties:
          via:
            const: team.integrationLogs
      - type: owned_by
        when:
          all:
            - path: $vars.removed
              truthy: false
            - path: $vars.first.r.app_id
              truthy: true
        source: $self
        target:
          type: defs_app_id
          id: $vars.first.r.app_id
        basis: stated
    identity:
      primary:
        - name: app
          expr: $vars.owner
          stability: catalog_reviewed
        - name: ch
          expr: $vars.channel
          stability: catalog_reviewed
      scope: tenant
    key_template: SLK-HOOK-{app}-{ch}
runtime_stub: null
runtime_key: SLK-HOOK-{app}-{ch}
runtime_identifiers:
  primary:
    - id
  id:
    stability: stable
