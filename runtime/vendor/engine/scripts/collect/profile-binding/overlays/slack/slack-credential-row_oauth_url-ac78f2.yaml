      - type: owned_by
        when:
          all:
            - path: $vars.removed
              truthy: false
            - path: $vars.first.r.app_id
              truthy: true
        source: $self
        target:
          type: defs_app_id
          id: $vars.first.r.app_id
        basis: stated
