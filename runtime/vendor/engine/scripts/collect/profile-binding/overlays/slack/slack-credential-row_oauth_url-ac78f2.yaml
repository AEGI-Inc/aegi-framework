vars:
  hook:
    any:
      - raw_response.incoming_webhook
    empty_as: {}
  app: raw_response.app_id
  channel:
    any:
      - raw_response.incoming_webhook.channel_id
      - channel_id
identity:
  primary:
    - name: app
      expr: $vars.app
      stability: catalog_reviewed
    - name: ch
      expr: $vars.channel
      stability: catalog_reviewed
  scope: tenant
  evidence:
    source: catalog_spec5_key
    key_template: SLK-HOOK-{app}-{ch}
    replaced:
      - $record_hash
tenant_binding:
  type: 200.team
tenant_basis: 생성기의 tenant 이름 workspace 는 카탈로그 이름이다. 현행 카탈로그 workspace 의 연구 타입이 새
  Profile 200.team 이다
