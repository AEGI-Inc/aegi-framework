overlay_basis:
  from: Okta Management API AssignedAppLink.appInstanceId (앱 인스턴스 id)
  note: IM v1 typed reference 가 대상을 LogStream 으로 잘못 잡았다. 실측 값은 Application id 다(2026-10-28 병합 run 34건 미해결)
references:
  - name: appinstanceid
    field: appInstanceId
    target: Application
    relation: no_relation
    reviewed_at: 2026-10-28
    rationale: AssignedAppLink.appInstanceId 는 Application.id 다. 관계는 IM v1 판정대로 만들지 않는다
  - name: user
    field: $req.parent_id
    target: User
    relation: no_relation
    reviewed_at: 2026-11-14
    rationale: listAppLinks 는 /api/v1/users/{id}/appLinks 로 사용자마다 부른다. 경로의 사용자 id 가 이 배정을 받은 사람이다. 같은 배정의 관계는 AppUser 가 만들므로 관계는 더하지 않고 참조만 남긴다(컴플라이언스 관계 점검 assignment_references 용)
