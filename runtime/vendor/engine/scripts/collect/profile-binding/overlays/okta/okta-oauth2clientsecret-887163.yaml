runtime_stub: null
runtime_key: OKTA-APISVCSEC-{inst}-{sid}
runtime_identifiers:
  primary:
    - id
  id:
    stability: stable
relation_rules:
  - id: APIServiceIntegrationInstanceSecret:list
    sources:
      - call: OK-15
        request:
          instance_id: present
    vars:
      inst_name:
        ref:
          type: APIServiceIntegrationInstance
          id: $req.instance_id
        prop: displayName
    relations:
      - type: contained_in
        source: $self
        target:
          type: APIServiceIntegrationInstance
          id: $req.instance_id
        basis: stated
        require:
          - target
    self_identity: object_rule
identity:
  primary:
    - name: inst
      expr: $req.instance_id
      stability: catalog_reviewed
    - name: sid
      expr: id
      stability: catalog_reviewed
  scope: parent
  evidence:
    source: catalog_spec5_key
    key_template: OKTA-APISVCSEC-{inst}-{sid}
    replaced:
      - $req.parent_id
      - id
