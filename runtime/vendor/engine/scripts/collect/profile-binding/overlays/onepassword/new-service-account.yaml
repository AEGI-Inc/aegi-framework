format: im-pilot-profile/1
scope: additive_runtime_projection
provider: onepassword
service: directory
object_type: ServiceAccount
interfaces: [Principal]
# 근거: op whoami 실제 응답(2026-11-20). 서비스 계정 토큰으로 부르면 user_type SERVICE_ACCOUNT 와 그 계정의 user_uuid 가 온다.
# 수집에 쓰는 서비스 계정 자신만 보인다. 다른 서비스 계정은 CLI 로 읽히지 않는다(Subimage 1Password 수집기 docs/format.md).
# 금고 권한(SDK accessors)에는 서비스 계정이 accessorType user 로 나온다. Vault Profile 이 이 id 로 찾는다.
identity:
  primary:
    - {name: id, expr: user_uuid, stability: stable}
  scope: tenant
fields: {}
runtime_key: OP-SA-{id}
runtime_identifiers:
  primary: [id]
  id: {stability: stable}
runtime_rules:
  - id: whoami
    kind: object
    sources:
      - call: OP-01
        request: {kind: whoami}
        items: (root)
    where: {path: user_type, eq: SERVICE_ACCOUNT}
    id_expr: user_uuid
    properties:
      user_type: user_type
      principal_kind: {const: service}
      account_kind: {const: app}
      account_state: {const: active}
      collector_identity: {const: true}
    display: "{user_uuid}"
    relations:
      - type: contained_in
        source: $self
        target: $tenant
        basis: stated
        require: [target]
