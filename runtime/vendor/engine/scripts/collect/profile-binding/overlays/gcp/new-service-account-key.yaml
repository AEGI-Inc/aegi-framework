format: im-pilot-profile/1
scope: additive_runtime_projection
provider: gcp
service: iam
object_type: ServiceAccountKey
interfaces: [Credential]
# 근거: IAM v1 Discovery 문서의 ServiceAccountKey 스키마. 명세에만 있음, 우리 환경 미조회(저장된 실제 응답 없음).
# 호출 ID GCP-02 와 request.kind 는 수집기(scripts/collect/providers/gcp.ts)와 맞춘 것이다. 실제 Google API 로는 돌려 보지 않았다.
# 사용자 관리 키의 메타데이터만 둔다. 키 자료(privateKeyData, publicKeyData)는 옮기지 않는다.
identity:
  primary:
    - {name: id, expr: name, stability: stable}
  scope: tenant
fields: {}
privacy:
  secret_leaf_names: [access_token, accessToken, refresh_token, refreshToken, client_secret, clientSecret, secret, password, token, securityToken, api_key, apiKey, privateKeyData, private_key, privateKey]
runtime_key: GCP-SAKEY-{id}
runtime_identifiers:
  primary: [id]
  id: {stability: stable}
runtime_rules:
  - id: list
    kind: object
    sources:
      - call: GCP-02
        request: {kind: service_account_keys}
        items: keys
    tenant: {switch: {if: {path: name, matches: "^projects/[0-9]+(/|$)"}, then: {const: number}, else: {const: id}}, cases: {number: {type: Project, id: {op: regex, of: name, pattern: "^(projects/[^/]+)"}}, id: {type: Project, lookup: projectId, value: {op: regex, of: name, pattern: "^projects/([^/]+)"}}}}
    id_expr: name
    properties:
      disabled: disabled
      validAfterTime: validAfterTime
      validBeforeTime: validBeforeTime
      keyType: keyType
      privateKeyType: privateKeyType
      extendedStatus: extendedStatus
      keyAlgorithm: keyAlgorithm
      disableReason: disableReason
      keyOrigin: keyOrigin
      credential_kind: {const: key_pair}
      expires_at: validBeforeTime
    display: "{name}"
    relations:
      - type: authenticates_with
        source: {type: ServiceAccount, id: {op: regex, of: name, pattern: "^(.+)/keys/[^/]+$"}}
        target: $self
        basis: stated
        require: [source]
