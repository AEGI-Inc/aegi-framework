format: im-pilot-profile/1
scope: additive_runtime_projection
provider: gcp
service: iam
object_type: WorkforcePoolProvider
interfaces: [Integration]
# 근거: IAM v1 Discovery 문서의 WorkforcePoolProvider 스키마. 명세에만 있음, 우리 환경 미조회(저장된 실제 응답 없음).
# 호출 ID GCP-02 와 request.kind 는 수집기(scripts/collect/providers/gcp.ts)와 맞춘 것이다. 실제 Google API 로는 돌려 보지 않았다.
# 외부 IdP(Okta 등) 연결. SAML 메타데이터와 OAuth 클라이언트 비밀값은 옮기지 않는다.
identity:
  primary:
    - {name: id, expr: name, stability: stable}
  scope: tenant
fields: {}
privacy:
  secret_leaf_names: [access_token, accessToken, refresh_token, refreshToken, client_secret, clientSecret, secret, password, token, securityToken, api_key, apiKey, privateKeyData, private_key, privateKey]
runtime_key: GCP-WFPROVIDER-{id}
runtime_identifiers:
  primary: [id]
  id: {stability: stable}
runtime_rules:
  - id: list
    kind: object
    sources:
      - call: GCP-02
        request: {kind: workforce_pool_providers}
        items: workforcePoolProviders
    id_expr: name
    properties:
      description: description
      detailedAuditLogging: detailedAuditLogging
      attributeMapping: attributeMapping
      attributeCondition: attributeCondition
      expireTime: expireTime
      state: state
      attributeSyncInterval: attributeSyncInterval
      vendorType: vendorType
      scimUsage: scimUsage
      disabled: disabled
      displayName: displayName
      oidc_issuer_uri: oidc.issuerUri
      oidc_client_id: oidc.clientId
      has_saml: {op: exists, of: saml}
      has_extra_attributes_client: {op: exists, of: extraAttributesOauth2Client}
      has_extended_attributes_client: {op: exists, of: extendedAttributesOauth2Client}
      operational_state: {op: map, of: state, table: {ACTIVE: active}, default: {const: unknown}}
    display: "{displayName|title|name}"
    relations:
      - type: contained_in
        source: $self
        target: {type: WorkforcePool, id: {op: regex, of: name, pattern: "^(.+)/providers/[^/]+$"}}
        basis: stated
        require: [target]
