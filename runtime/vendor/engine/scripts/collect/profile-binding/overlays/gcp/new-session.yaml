format: im-pilot-profile/1
scope: additive_runtime_projection
provider: gcp
service: discoveryengine
object_type: Session
interfaces: [Resource]
# 근거: Discovery Engine v1alpha Discovery 문서의 GoogleCloudDiscoveryengineV1alphaSession 스키마. 명세에만 있음, 우리 환경 미조회(저장된 실제 응답 없음).
# 호출 ID GCP-03 와 request.kind 는 수집기(scripts/collect/providers/gcp.ts)와 맞춘 것이다. 실제 Google API 로는 돌려 보지 않았다.
# 대화 본문(turns)은 옮기지 않고 개수만 둔다.
identity:
  primary:
    - {name: id, expr: name, stability: stable}
  scope: tenant
fields: {}
privacy:
  secret_leaf_names: [access_token, accessToken, refresh_token, refreshToken, client_secret, clientSecret, secret, password, token, securityToken, api_key, apiKey, privateKeyData, private_key, privateKey]
runtime_key: GCP-GE-SESSION-{id}
runtime_identifiers:
  primary: [id]
  id: {stability: stable}
runtime_rules:
  - id: list
    kind: object
    sources:
      - call: GCP-03
        request: {kind: sessions}
        items: sessions
    tenant: {switch: {if: {path: name, matches: "^projects/[0-9]+(/|$)"}, then: {const: number}, else: {const: id}}, cases: {number: {type: Project, id: {op: regex, of: name, pattern: "^(projects/[^/]+)"}}, id: {type: Project, lookup: projectId, value: {op: regex, of: name, pattern: "^projects/([^/]+)"}}}}
    id_expr: name
    properties:
      displayName: displayName
      userPseudoId: userPseudoId
      labels: labels
      startTime: startTime
      pendingAsyncAssistOperationId: pendingAsyncAssistOperationId
      state: state
      isPinned: isPinned
      endTime: endTime
      turn_count: {op: count, of: turns}
    display: "{displayName|title|name}"
    relations:
      - type: contained_in
        source: $self
        target: {type: Engine, id: {op: regex, of: name, pattern: "^(.+/engines/[^/]+)/sessions/[^/]+$"}}
        when: {path: name, matches: "^(.+/engines/[^/]+)/sessions/[^/]+$"}
        basis: stated
        require: [target]
      - type: contained_in
        source: $self
        target: {type: DataStore, id: {op: regex, of: name, pattern: "^(.+/dataStores/[^/]+)/sessions/[^/]+$"}}
        when: {path: name, matches: "^(.+/dataStores/[^/]+)/sessions/[^/]+$"}
        basis: stated
        require: [target]
