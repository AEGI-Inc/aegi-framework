format: im-pilot-profile/1
scope: additive_runtime_projection
provider: gcp
service: iam
object_type: WorkloadIdentityPoolProvider
interfaces: [Integration]
# 근거: IAM v1 Discovery 문서의 WorkloadIdentityPoolProvider 스키마. 명세에만 있음, 우리 환경 미조회(저장된 실제 응답 없음).
# 호출 ID GCP-02 와 request.kind 는 수집기(scripts/collect/providers/gcp.ts)와 맞춘 것이다. 실제 Google API 로는 돌려 보지 않았다.
# 외부 워크로드 IdP 신뢰. SAML 메타데이터와 인증서 본문은 옮기지 않는다.
identity:
  primary:
    - {name: id, expr: name, stability: stable}
  scope: tenant
fields: {}
privacy:
  secret_leaf_names: [access_token, accessToken, refresh_token, refreshToken, client_secret, clientSecret, secret, password, token, securityToken, api_key, apiKey, privateKeyData, private_key, privateKey]
runtime_key: GCP-WIPROVIDER-{id}
runtime_identifiers:
  primary: [id]
  id: {stability: stable}
runtime_rules:
  - id: list
    kind: object
    sources:
      - call: GCP-02
        request: {kind: workload_identity_pool_providers}
        items: workloadIdentityPoolProviders
    tenant: {switch: {if: {path: name, matches: "^projects/[0-9]+(/|$)"}, then: {const: number}, else: {const: id}}, cases: {number: {type: Project, id: {op: regex, of: name, pattern: "^(projects/[^/]+)"}}, id: {type: Project, lookup: projectId, value: {op: regex, of: name, pattern: "^projects/([^/]+)"}}}}
    id_expr: name
    properties:
      disabled: disabled
      attributeMapping: attributeMapping
      state: state
      actorProviders: actorProviders
      description: description
      displayName: displayName
      expireTime: expireTime
      attributeCondition: attributeCondition
      oidc_issuer_uri: oidc.issuerUri
      oidc_allowed_audiences: oidc.allowedAudiences
      aws_account_id: aws.accountId
      has_saml: {op: exists, of: saml}
      has_x509: {op: exists, of: x509}
      operational_state: {op: map, of: state, table: {ACTIVE: active}, default: {const: unknown}}
    display: "{displayName|title|name}"
    relations:
      - type: contained_in
        source: $self
        target: {type: WorkloadIdentityPool, id: {op: regex, of: name, pattern: "^(.+)/providers/[^/]+$"}}
        basis: stated
        require: [target]
