format: im-pilot-profile/1
scope: additive_runtime_projection
provider: gcp
service: iam
object_type: WorkforcePoolProviderScimTenant
interfaces: [Endpoint]
# 근거: IAM v1 Discovery 문서의 WorkforcePoolProviderScimTenant 스키마. 명세에만 있음, 우리 환경 미조회(저장된 실제 응답 없음).
# 호출 ID GCP-02 와 request.kind 는 수집기(scripts/collect/providers/gcp.ts)와 맞춘 것이다. 실제 Google API 로는 돌려 보지 않았다.
# 외부 IdP 가 사용자를 밀어 넣는 SCIM 수신 주소.
identity:
  primary:
    - {name: id, expr: name, stability: stable}
  scope: tenant
fields: {}
privacy:
  secret_leaf_names: [access_token, accessToken, refresh_token, refreshToken, client_secret, clientSecret, secret, password, token, securityToken, api_key, apiKey, privateKeyData, private_key, privateKey]
runtime_key: GCP-WFSCIM-{id}
runtime_identifiers:
  primary: [id]
  id: {stability: stable}
runtime_rules:
  - id: list
    kind: object
    sources:
      - call: GCP-02
        request: {kind: scim_tenants}
        items: workforcePoolProviderScimTenants
    id_expr: name
    properties:
      displayName: displayName
      baseUri: baseUri
      serviceAgent: serviceAgent
      state: state
      description: description
      claimMapping: claimMapping
      purgeTime: purgeTime
    display: "{displayName|title|name}"
    relations:
      - type: contained_in
        source: $self
        target: {type: WorkforcePoolProvider, id: {op: regex, of: name, pattern: "^(.+)/scimTenants/[^/]+$"}}
        basis: stated
        require: [target]
