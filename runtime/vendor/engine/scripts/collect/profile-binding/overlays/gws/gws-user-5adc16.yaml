              - nonEditableAliases
          value:
            op: lower
            of:
              op: str
              of: $item
    relations:
      - type: member_of
        when:
          path: orgUnitPath
          truthy: true
        source: $self
        target:
          type: OrgUnit
          lookup: orgUnitPath
          value: orgUnitPath
        basis: stated
    self_identity: object_rule
  - id: User:admin_fallback
    sources:
