    relations:
      - type: has_role_on
        when:
          path: isAdmin
          truthy: true
        source:
          type: User
          id: id
        target: $tenant
        role:
          name:
            const: _SEED_ADMIN_ROLE
        basis: stated
        properties:
          via:
            const: users.isAdmin (역할 목록 없이)
      - type: has_role_on
        when:
          all:
            - path: isAdmin
              truthy: false
            - path: isDelegatedAdmin
              truthy: true
        source:
          type: User
          id: id
        target: $tenant
        role:
          name:
