  call: GW-04
  operation_id: null
  paths:
    - shape: sh:gws_directory:Member
      path: []
  basis: catalog spec:5 sources
fields:
  email:
    expr: email
    source: catalog_spec5
  role:
    expr: role
    source: catalog_spec5
  type:
    expr: type
    source: catalog_spec5
  status:
    expr: status
    source: catalog_spec5
references: []
relation_plans: []
privacy:
  secret_leaf_names:
    - access_token
    - refresh_token
    - client_secret
    - signing_secret
    - verification_token
    - bot_access_token
    - app_token
    - api_token
    - password
    - token
overlay_basis:
  from: aegi-adapter-engine catalog/gws/profiles/member.yaml
  engine_commit: d78062d
  research_agreement: no_research_type
runtime_rules:
  - id: list
    kind: object
    sources:
      - call: GW-04
        request:
          group: present
        items: members
    vars:
      group:
        ref:
          type: Group
          lookup: email
          value:
            op: str
            of: $req.group
          ci: true
        prop: $key
      gid:
        ref:
          type: Group
          lookup: email
          value:
            op: str
            of: $req.group
          ci: true
        prop: $id
      principal_type:
        if:
          path: type
          eq: GROUP
        then:
          const: Group
        else:
          const: User
    require:
      path: $vars.gid
      present: true
    id_expr:
      template: "{$vars.gid}:{id}"
