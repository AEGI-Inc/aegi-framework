      g: $vars.gid
      m: id
    parent:
      ref:
        key: $vars.group
      when: always
    refs:
      grantee:
        ref:
          switch: type
          cases:
            GROUP:
              type: Group
              lookup: email
              value: email
              ci: true
          default:
            type: User
            id: id
        value: id
    properties:
      email: email
      role: role
      type: type
      status: status
    display: "{email} ∈ {$req.group}"
    relations:
      - type: member_of
        source:
          switch: type
          cases:
            GROUP:
              type: Group
              lookup: email
              value: email
              ci: true
          default:
            type: User
            id: id
        target:
          key: $vars.group
        basis: stated
        properties:
          via_assignment: $self
      - type: has_role_on
        when:
          path: role
          in:
            - OWNER
            - MANAGER
        source:
          switch: type
          cases:
            GROUP:
              type: Group
              lookup: email
              value: email
              ci: true
          default:
            type: User
            id: id
        target:
          key: $vars.group
        role:
          name: role
        basis: stated
        properties:
          via_assignment: $self
    identity:
      primary:
        - name: g
          expr: $vars.gid
          stability: catalog_reviewed
        - name: m
          expr: id
          stability: catalog_reviewed
      scope: tenant
    key_template: GWS-MEM-{g}-{m}
runtime_stub: null
runtime_key: GWS-MEM-{g}-{m}
runtime_identifiers:
