format: im-pilot-profile/1
scope: catalog_spec5_record_projection
provider: gws
service: null
object_type: Member
interfaces:
  - Assignment
model:
  research_type: null
  runtime_type_id: model-v1:gws:Member
  decision_refs:
    - model-v1 runtime record_projection
vars:
  group:
    ref:
      type: Group
      lookup: email
      value:
