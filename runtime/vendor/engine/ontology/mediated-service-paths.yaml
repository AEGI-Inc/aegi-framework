status: implementation_candidate
purpose: Display a verified A -> intermediary -> B configured path as an A -> B service connection while retaining the intermediary and original evidence.
storage:
  object_properties: WorkerScript.mediated_service_paths
  scope: Presentation records computed by the adapter and persisted in D1, not new canonical Relations or identity Links.
fields:
  id: Stable path identifier
  source_object_key: Existing source request Endpoint
  target_object_key: Existing unique final target object
  operation: Verified HTTP operation and resource kind
  via: Intermediary object key, admitted request route and deployed code fingerprint
  evidence: stated for configured code paths; observed execution evidence must be separately identified
  source_relation_keys: Existing trigger relation identifying the request endpoint
  conditions: Original workspace/channel checks may still gate execution; do not infer authorization or successful execution
matching:
  ingress: Match only an existing trigger endpoint and the exact admitted route fingerprint.
  github: Resolve the repository by exact configured owner/name after proving that the dispatched callback reaches a PUT to the GitHub contents API.
  okta: Resolve the user ID within the exact configured Okta origin after proving callback -> client request -> POST reset_factors.
  ambiguous_or_unresolved: Report without rendering a guessed service connection.
display:
  default: Hide objects explicitly marked intermediary from the target-SaaS graph and render persisted service paths between their existing endpoints.
  details: Show intermediary, operation, source code fingerprint, source evidence and configured-only status.
boundaries:
  - Nine Interfaces and seventeen Relation names are unchanged.
  - A service path does not grant access, establish credential identity or participate in detection/EA as a synthetic canonical Relation.
  - No client-side composition from coincidentally shared workers or service hosts.
  - A webhook that only writes receiver logs has no final target SaaS connection.
  - Physical infrastructure and raw relations remain available as provenance; default graph visibility does not delete evidence.
