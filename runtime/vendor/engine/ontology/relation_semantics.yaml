    - name: has_role_on.session_active
      when: '세션에서 켤 때만 효력인 권한(properties.activation: session)인데 켜진 세션이 관측됐다(session_active: true)'
      match: {all: [{relation: {property: {activation: session}}}, {relation: {property: {session_active: true}}}]}
      cases:
      - pair: Principal>Tenant
        emits:
        - {kind: G, from: source, to: target, rank: role}
      - pair: Principal>Resource
        emits:
        - {kind: G, from: source, to: target, rank: role}
      decided: >-
        2026-11-01 Relation 주담당 결정(판단표 G4-Q06, 권고 채택). 켜진 관측이 있으면 지금 효력이 있으니 상시 권한과 같이 센다.
        아래 has_role_on.session_activation 보다 좁아서 위에 둔다
    - name: has_role_on.session_activation
      when: 'properties.activation: session 이고 켜진 세션이 관측되지 않았다'
      match: {relation: {property: {activation: session}}}
      cases:
      - pair: Principal>Tenant
        emits:
        - {kind: G, from: source, to: target, rank: role, uncertain: [session_activation]}
      - pair: Principal>Resource
        emits:
        - {kind: G, from: source, to: target, rank: role, uncertain: [session_activation]}
      decided: >-
        2026-11-01 Relation 주담당 결정(판단표 G4-Q06, 권고 채택). 활성화 행(Salesforce SessionPermSetActivation)은 지금 켜진 세션만
        보여 주므로, 행이 없어도 사용자는 언제든 켤 수 있다. 있다고도 없다고도 못 해 판정 보류(모름)로 둔다.
        「모름」 어휘는 uncertainty.yaml engine_reasons.session_activation
    - name: has_role_on.gcp_public_principal
      when: 출발이 Google Cloud IAM 의 누구나 주체(allUsers 인터넷 누구나, allAuthenticatedUsers Google 계정이 있는 누구나)
      match: {all: [{source: {provider: gcp, object_type: IamMember}}, {source: {property: {member: [allUsers, allAuthenticatedUsers]}}}]}
      cases:
      - pair: Principal>Resource
        emits:
        - {kind: G, from: everyone, to: target, rank: role}
      - pair: Principal>Tenant
        emits:
        - {kind: G, from: everyone, to: target, rank: role}
      decided: >-
        2026-11-20 Relation 담당(Claude 가 정함). Google Cloud IAM 문서 「Principal identifiers」: allUsers 는 인터넷의 누구나, allAuthenticatedUsers 는 Google 계정으로
        인증한 누구나다(조직 밖 개인 계정 포함). 둘 다 테넌트 밖 누구나라 Atlassian 익명 주체(special_principal.public)와 같은 누구나(everyone) 간선이다. 3회차 실측 명단에는 없다(#499 시험 원본에만 있다)
    - name: has_role_on.gcp_project_member
      when: 출발이 Google Cloud IAM 의 사용자 · 그룹 · 도메인 · 서비스 계정 주체이고, 도착이 테넌트(프로젝트 · 조직)다 — 그 테넌트의 IAM 명단에 직접 든 주체
      match: {all: [{source: {provider: gcp, object_type: IamMember}}, {source: {property: {member_type: [user, group, domain, serviceAccount]}}}, {target: {interface: Tenant}}]}
      cases:
      - pair: Principal>Tenant
        emits:
        - {kind: M, from: source, to: target}
        - {kind: G, from: source, to: target, rank: role}
      decided: >-
        2026-11-20 Relation 담당(Claude 가 정함). Google Cloud 에는 「테넌트 구성원」 명단이 따로 없고, 프로젝트에 들어오는 사람은 프로젝트 IAM 허용 정책에
        역할로 묶인 주체다(IAM 문서 「Allow policies」: 정책은 주체를 역할에 묶는다, 「Resource hierarchy」: 프로젝트는 자원을 묶는 기본 단위).
        그래서 프로젝트 명단에 직접 든 주체를 프로젝트 소속(M)으로 본다. 소속은 권한을 아래로 내리지 않는다(providers.yaml tenant_scope membership 은 모두 none) —
        권한은 같은 행의 G(역할 세기) 그대로다. 그룹 · 도메인 주체는 그 구성원(crosswalk directory_principal 의 member_of)이 소속을 물려받는다.
        누구나 주체(allUsers · allAuthenticatedUsers, member_type special)는 위 갈래가 먼저 받고, 지운 주체(deleted) · 풀 주체(principalSet)는 넣지 않는다.
        3회차 실측(r3-20261119-all): IamMember 12개 가운데 11개가 프로젝트 명단에 직접 있다(그룹 4 · 도메인 1 · 사용자 4 · 서비스 계정 2). 앱 명단에만 있는 사용자 1개는 소속이 생기지 않는다.
        로그: 자기 계정 사건(사용자 데이터 고치기 · 커넥터 동의 · 동의 화면 열기) 35건이 「자기 계정인데 테넌트 소속(M) 없음」이었다 — 행위자는 그룹 · 도메인 주체를 거쳐 들어온 GWS 사용자다
    - name: has_role_on.special_principal.public
      when: 출발이 Atlassian 특수 주체 익명 사용자(properties.access_class ANONYMOUS_USERS) — 테넌트 밖 누구나
      match: {all: [{source: {provider: atlassian, object_type: SpecialPrincipal}}, {source: {property: {access_class: ANONYMOUS_USERS}}}]}
      cases:
      - pair: Principal>Resource
        emits:
        - {kind: G, from: everyone, to: target, rank: role}
      - pair: Principal>Tenant
        emits:
        - {kind: G, from: everyone, to: target, rank: role}
      decided: >-
        2026-11-01 Relation 주담당 결정(판단표 G4-Q03, 권고 채택). 익명 공개는 shared_with.anyone 과 같은 누구나(everyone) 간선이다.
        Jira 권한 스킴의 anyone 보유자도 정규화가 이 특수 주체로 만든다
    - name: has_role_on.special_principal.tenant_members
      when: 출발이 Atlassian 특수 주체 모든 라이선스 사용자(ALL_LICENSED_USERS)이고 Jira 권한 스킴을 거치지 않았다(properties.via_scheme 없음) — 그 테넌트 전원
      match: {all: [{source: {provider: atlassian, object_type: SpecialPrincipal}}, {source: {property: {access_class: ALL_LICENSED_USERS}}}, {relation: {property: {via_scheme: missing}}}]}
      cases:
      - pair: Principal>Resource
        emits:
        - {kind: G, from: tenant, to: target, rank: role}
      - pair: Principal>Tenant
        emits:
        - {kind: G, from: tenant, to: target, rank: role}
      decided: >-
        2026-11-01 Relation 주담당 결정(판단표 G4-Q03, 권고 채택). 테넌트 전원은 shared_with 기본 효과(G 테넌트 → 자원, 「조직 공유」)와 같은
        뜻이라 간선을 그 특수 주체의 테넌트에서 낸다. 테넌트 소속(M)인 계정이 모두 닿는다. shared_with.set 은 이름과 달리 「링크가 있는
        누구나」(GWS anyone)라 everyone 이고, 테넌트 전원 어휘는 기본 효과 쪽이다. has_role_on 에서는 테넌트가 관계의 끝이 아니어서
        간선 끝 tenant(머리말)를 쓴다. 정규화는 Jira 권한 스킴의 보유자 applicationRole 가운데 역할을 적지 않은 것도 이 특수 주체로
        만든다(catalog/atlassian/review.yaml). 결정은 Jira applicationRole 을 판정 보류로 정했고, 그것이 로그인한 누구나라는 벤더 근거도
        찾지 못해 Jira 권한 스킴을 거친 행(via_scheme)은 이 갈래에서 빼 아래 역할 묶음(모름)으로 보낸다
    - name: has_role_on.special_principal.role_bundle
      when: 출발이 그 밖의 Atlassian 특수 주체 — 모든 제품 관리자(ALL_PRODUCT_ADMINS), 제품 접근 역할(APPLICATION_ROLE_*), 라이선스 없는 사용자, Jira 권한 스킴을 거친 모든 라이선스 사용자
      match: {source: {provider: atlassian, object_type: SpecialPrincipal}}
      cases:
      - pair: Principal>Resource
        emits:
        - {kind: G, from: source, to: target, rank: role, uncertain: [dynamic_holder_unresolved]}
      - pair: Principal>Tenant
        emits:
        - {kind: G, from: source, to: target, rank: role, uncertain: [dynamic_holder_unresolved]}
      decided: >-
        2026-11-01 Relation 주담당 결정(판단표 G4-Q03, 권고 채택). 어떤 역할을 가진 사람들의 묶음인데 그 보유자(제품 관리자, 제품 접근 그룹
        회원)를 수집하지 않아 펼 때까지 판정 보류(모름)다. Effective Access 의 Jira 동적 보유자 applicationRole 과 같은 사유
        dynamic_holder_unresolved 를 쓴다. 라이선스 없는 사용자(ALL_UNLICENSED_USERS)는 결정이 말하지 않아 같이 모름으로 둔다.
        특수 주체 셋 가운데 가장 넓어 맨 아래에 둔다
    depends_on:
    - has_role_on 의 rank — 엔진은 역할로 정한다(roleCapability). 시험에는 역할이 없어서 늘 rank 없음 + role_rank_unknown 이다
  permits:
    names: {forward: 허용 대상, reverse: '허용하는 정책, 자격증명'}
    description: A 가 B 에 대한 접근을 허용한다
    inverse: permitted_by
    characteristics: []
    role_in_graph: info
    effects: []
  member_of:
    names: {forward: 소속, reverse: 멤버}
    description: A 는 B 의 멤버다
    inverse: has_member
    characteristics: [irreflexive, asymmetric]
    role_in_graph: path
    effects:
    - pairs: [Principal>Tenant, Principal>Principal]
      emits:
      - {kind: M, from: source, to: target}
    - pairs: [Principal>Resource]
      emits:
      - {kind: G, from: source, to: target, rank: membership}
    conditions:
    - name: member_of.inactive_account
      when: 출발 계정이 지워졌거나 해지됐거나 정지됐다(source account_state deleted, deprovisioned, suspended)
      match: {source: {judged_or_property: {account_state: [deleted, deprovisioned, suspended]}}}
      decided: >-
        2026-11-07 Relation 주담당 위임(Claude 가 정함). 11-05 총점검에서 Okta DEPROVISIONED, GWS 정지, Slack deleted 로 바꾼 계정의 접근 간선이 그대로였다.
        지웠거나 해지했거나 정지한 계정은 지금 로그인도 API 호출도 안 되므로 간선을 내지 않는다. 남은 배정은 위생 문제(쓰지 못하는 계정에 권한이 남음)지 접근 경로가 아니다.
        정지를 판정 보류(간선 + 사유)로 두면, 그 계정의 직접 권한은 보류라 없는 것으로, 같은 보류 권한으로 자동화를 시작시키는 것은 있는 것으로 세어 「연동으로만 닿는 사람」 위협이 새로 생겼다(11-04 수집본, 실행 신원 정지 변형). 다시 켜면 직접 권한과 연동 길이 함께 살아나므로 지금 판정에서는 빼는 쪽이 맞다
      cases:
      - {pair: Principal>Tenant, emits: []}
      - {pair: Principal>Principal, emits: []}
      - {pair: Principal>Resource, emits: []}
    - name: member_of.measurement_membership
      when: 'properties.measurement_principal: true'
      match: {relation: {property: {measurement_principal: true}}}
      cases:
      - {pair: Principal>Tenant, emits: []}
      - {pair: Principal>Resource, emits: []}
    - name: member_of.measurement_principal
      when: '출발이 측정 도구 계정(fixture_meta.demo_role: measurement_principal)'
      match: {source: {meta: {demo_role: measurement_principal}}}
      cases:
      - {pair: Principal>Tenant, emits: []}
    - name: member_of.gws_org_unit
      when: provider gws, 도착이 OrgUnit(조직 단위). 소속만 주는 범위다
      match: {all: [{relation: {provider: gws}}, {target: {object_type: OrgUnit}}]}
      decided: '2026-11-01 Relation 주담당 결정(aegi-knowledge#149 4번). 조직 단위는 사용자를 뺄 수 없고 옮기기만 되는 정책 범위라, 멤버라서 그 자원에 능력이 생기지 않는다. 소속(M)으로 보고 EA 회수 지점이 아니다'
      cases:
      - pair: Principal>Resource
        emits:
        - {kind: M, from: source, to: target}
    - name: member_of.scope_only_target
      when: 도착이 권한 대상이 아니다(target grant_target false). 관리 범위를 정하는 단위라 소속만 준다
      match: {target: {judged_or_property: {grant_target: false}}}
      decided: >-
        2026-11-21 Relation 주담당 위임(Claude 가 정함, Microsoft 365 도입 점검). Microsoft Entra 관리 단위(AdministrativeUnit)는 관리 역할을
        그 단위의 사용자 · 그룹 · 기기에만 걸게 하는 범위다(learn.microsoft.com 「Administrative units in Microsoft Entra ID」). 멤버라서 관리 단위에
        능력이 생기지 않는다 — gws 조직 단위(member_of.gws_org_unit)와 같은 뜻이다. 기본 갈래(Principal>Resource G, rank membership)로 두면 멤버가
        관리 단위에 쓰기 이상을 받는 것으로 나온다. Profile 이 grant_target false 로 적은 객체만 걸려 provider 이름을 갈래에 두지 않는다.
        2026-11-20 M365 수집본에는 관리 단위 멤버가 0 이라 지금 판정은 바뀌지 않는다
      cases:
      - pair: Principal>Resource
        emits:
        - {kind: M, from: source, to: target}
    - name: member_of.slack_conversation
      when: provider slack, 도착이 conversation
      match: {all: [{relation: {provider: slack}}, {target: {object_type: conversation}}]}
      cases:
      - pair: Principal>Resource
        emits:
        - {kind: G, from: source, to: target, rank: 3}
    depends_on:
    - 'member_of 의 M · G — 도착이 그룹 같은가(isGroupLike: 테넌트, 그룹 타입, principal_kind group, 들어오는 member_of)로 정한다. interface 쌍으로 정하는 것이 아니다'
    - member_of · shared_with 의 rank — provider · 대상 타입 · 역할로 정한다(membershipRank, roleCapability). 시험 provider 는 probe 라 기본값이 나왔다
  owned_by:
    names: {forward: 소유자, reverse: 소유물}
    description: A 의 주인은 B 다
    inverse: owns
    characteristics: [irreflexive, asymmetric]
    role_in_graph: path
    effects:
    - pairs: [Endpoint>Integration, Endpoint>Tenant, Automation>Integration, Automation>Tenant, Credential>Integration, Credential>Tenant]
      emits:
      - {kind: A, from: source, to: target}
    - pairs: [Resource>Principal]
      emits:
      - {kind: G, from: target, to: source, rank: 5}
    - pairs: [Principal>Integration]
      emits:
      - {kind: A, from: target, to: source}
    conditions:
    - name: owned_by.inactive_account
      when: 도착 계정이 지워졌거나 해지됐거나 정지됐다(target account_state deleted, deprovisioned, suspended)
      match: {target: {judged_or_property: {account_state: [deleted, deprovisioned, suspended]}}}
      decided: >-
        2026-11-07 Relation 주담당 위임(Claude 가 정함). 11-05 총점검에서 Okta DEPROVISIONED, GWS 정지, Slack deleted 로 바꾼 계정의 접근 간선이 그대로였다.
        지웠거나 해지했거나 정지한 계정은 지금 로그인도 API 호출도 안 되므로 간선을 내지 않는다. 남은 배정은 위생 문제(쓰지 못하는 계정에 권한이 남음)지 접근 경로가 아니다.
        정지를 판정 보류(간선 + 사유)로 두면, 그 계정의 직접 권한은 보류라 없는 것으로, 같은 보류 권한으로 자동화를 시작시키는 것은 있는 것으로 세어 「연동으로만 닿는 사람」 위협이 새로 생겼다(11-04 수집본, 실행 신원 정지 변형). 다시 켜면 직접 권한과 연동 길이 함께 살아나므로 지금 판정에서는 빼는 쪽이 맞다
      cases:
      - {pair: Resource>Principal, emits: []}
    - name: owned_by.caller
      when: '출발 자동화가 부른 사람 권한으로 돈다(run_as_resolution: caller)'
      match: {source: {judged_or_property: {run_as_resolution: caller}}}
      cases:
      - {pair: Automation>Integration, emits: []}
      - {pair: Automation>Tenant, emits: []}
    - name: owned_by.delivery_endpoint
      when: 출발이 받는 곳이 정해진 통로다(receives_into 가 있는 Endpoint) — Slack 수신 웹훅처럼 그 자원에 올리는 것 말고는 주인 앱으로 동작하지 않는다
      match: {all: [{source: {interface: Endpoint}}, {exists_relation: {type: receives_into, source: $source}}]}
      cases:
      - {pair: Endpoint>Integration, emits: []}
      - {pair: Endpoint>Tenant, emits: []}
      - {pair: Credential>Integration, emits: []}
      - {pair: Credential>Tenant, emits: []}
      decided: >-
        2026-10-19 Relation 담당 결정 — 재설계 5단계의 첫 값 변경. 수신 웹훅 주소를 쥐면 그 채널에 글을 올릴 수 있을 뿐 앱의 bot token
        권한은 못 쓴다. 그 힘은 receives_into 가 따로 준다(G · F). 대행(A)으로 두면 앱이 테넌트에 역할을 갖는 순간 웹훅을 쥔 쪽이 그 역할을
        물려받는다 — g2 실측에 앱 → 엔터프라이즈 역할(bot-token)을 넣어 보면 「Apps Script 가 Slack 조직 전체에서 관리 작업」 거짓 탐지가 생겼다
        (aegi-dashboard 이슈 #123). 대시보드 blastRadius.ts tokenCapability() 도 수신 웹훅을 「아무것도 못 함」으로 본다.
        엔진(edges.ts owned_by)은 aegi-dashboard PR #125(2026-10-20 머지)부터 같다 — engine_probe 에 이 갈래를 시험해 넣었다
    - name: owned_by.outbound_endpoint
      when: 출발이 밖으로 보내기만 하는 통로(direction out 인 Endpoint)이고 도착이 조직 — 주소를 쥔 쪽은 조직이 보낸 내용을 받을 뿐 조직의 힘을 쓰지 못한다
      match: {all: [{source: {interface: Endpoint}}, {source: {judged_or_property: {direction: out}}}]}
      cases:
      - {pair: Endpoint>Tenant, emits: []}
      decided: >-
        2026-11-01 Relation 주담당 결정(결정 반영 2호, aegi-knowledge#28 미결 일곱 중 하나), 권고 채택. Okta 이벤트 훅(비동기 한 방향 알림), 로그 스트림(System Log 를 밖으로), SSF 송신 스트림, 메일 서버(Okta 가
        보내는 메일이 지나는 SMTP)가 걸린다. 흐름은 rules.outbound_hooks 의 F(조직 → 통로)가 그대로 준다. 결정 반영 1호
        owned_by.delivery_endpoint(받는 통로)와 방향만 다른 같은 모양이다. GitHub 조직 웹훅(direction out)이 조직 소유로 들어와도 같이 걸린다
    - name: owned_by.app_refresh_token
      when: 출발이 사람이 앱에 준 bearer 토큰(credential_kind bearer_token, 그 토큰으로 인증하는 사람이 있다)이고 도착이 앱 — 쥐면 앱이 아니라 그 사람이 된다(authenticates_with.app_refresh_token)
      match: {all: [{source: {judged_or_property: {credential_kind: bearer_token}}}, {exists_relation: {type: authenticates_with, target: $source}}]}
      cases:
      - {pair: Credential>Integration, emits: []}
      decided: >-
        2026-11-01 Relation 주담당 결정(결정 반영 2호, aegi-knowledge#28 미결 일곱 중 하나). 권고는 「실측 결과가 바뀌어 따로 본다」였고 10-30 실측으로 재고 정했다. Okta 리프레시 토큰은 앱(클라이언트)이 사용자
        대신 받은 것이라 그 토큰으로 받는 접근 토큰은 그 사용자를 받은 scope 만큼 대신한다. 앱이 클라이언트 자격으로 받은 관리 역할은
        못 쓴다. 엔진의 피해 범위(blastRadius.ts credentialOwner, tokenCapability)도 이미 그렇게 센다. 10-30 실측의 리프레시 토큰 21개는
        모두 앱 둘이 받은 것이고 그 앱들은 관계가 하나도 없어, 지금 A(토큰 → 앱)는 아무 데도 닿지 않는다. 그래서 「그대로」는 사람 권한을
        가진 토큰을 「아무것도 못 함」으로 둔다
    - name: owned_by.org_bearer_token
      when: 출발이 사람이 만든 bearer 토큰(credential_kind bearer_token)이고 도착이 조직 — 쥐면 조직이 아니라 만든 사람이 된다(authenticates_with.org_bearer_token)
      match: {source: {judged_or_property: {credential_kind: bearer_token}}}
      cases:
      - {pair: Credential>Tenant, emits: []}
      decided: >-
        2026-11-01 Relation 주담당 결정(결정 반영 2호, aegi-knowledge#28 미결 일곱 중 하나), 권고 채택. Okta API 토큰은 만든 관리자 계정의 권한을 그대로 갖고(Okta 개발자 문서 「Create an API token」), Google 앱
        비밀번호는 그 계정으로 옛 방식 앱에 로그인한다. 조직은 소속만 남는다(참조 tenant 의 contained_in). Google 앱 비밀번호가 사람 권한
        전부보다 좁다는 표시는 붙이지 않는다 — 10-30 실측에 0개이고, 좁은 범위를 간선에 펴는 칸이 없다
    - name: owned_by.public_certificate
      when: 출발이 공개 인증서(credential_kind certificate)이고 도착이 조직 — 개인키는 상대가 가져 쥐어도 무엇으로도 동작하지 못한다
      match: {source: {judged_or_property: {credential_kind: certificate}}}
      cases:
      - {pair: Credential>Tenant, emits: []}
      decided: >-
        2026-11-01 Relation 주담당 결정(결정 반영 2호, aegi-knowledge#28 미결 일곱 중 하나), 권고 채택. Okta IdP 서명 키(material_location counterparty_side)가 걸린다. 그 신뢰는 IdP authenticates_with 키와
        IdP registered_in 조직이 이미 말한다
    - name: owned_by.unknown_runner_tenant
      when: 출발이 실행 신원을 모르는 자동화(run_as_resolution unknown)이고 앱 없이 조직 소유 — 「조직으로 동작」은 근거가 없다
      match: {source: {judged_or_property: {run_as_resolution: unknown}}}
      cases:
      - {pair: Automation>Tenant, emits: []}
      decided: >-
        2026-11-01 Relation 주담당 결정(결정 반영 2호, aegi-knowledge#28 미결 일곱 중 하나), 권고 채택. 앱이 아닌 IdP, 사용자 종류 사이 Okta 프로필 매핑, 앱 이름이 없는 Slack 워크플로가 걸린다. 누가 고칠 수 있나는
        관리자(has_role_on), 관리 역할이 따로 말한다. 앱 소유면 앱으로 동작(A)은 그대로다
    - name: owned_by.registered_device
      when: 출발이 관리 콘솔에 등록된 기기(GWS Cloud Identity Device)이고 도착이 사람 — 기기에 등록된 사용자일 뿐, 기기 기록을 바꿀 권한이 아니다
      match: {source: {provider: gws, object_type: GoogleAppsCloudidentityDevicesV1Device}}
      cases:
      - {pair: Resource>Principal, emits: []}
      decided: >-
        2026-11-03 사용자 지시(관계 0 객체 정리, GWS 기기 연결). Device owned_by User 를 넣자 이 갈래의 G(주인 → 자원, rank 5)가 Apps Script
        runs_as 주인을 거쳐 「Customer Intake Sync 스크립트 경유 기기 무단 변경」 거짓 탐지 3건과 EA 6행을 냈다. Cloud Identity 의 기기 주인은
        기기에 등록된 사용자(ownerType BYOD 는 개인 소유 표시)이고, 기기 기록을 바꾸거나 지우는 devices API 는 관리자 역할이 있어야 한다.
        사용자 신원으로 도는 스크립트는 자기 기기도 바꾸지 못한다. 관계는 그래프에 남기고 닿음만 내지 않는다
  registered_in:
    names: {forward: 등록된 테넌트, reverse: 등록된 앱}
    description: 앱 A 가 테넌트 B 에 등록, 설치돼 있다
