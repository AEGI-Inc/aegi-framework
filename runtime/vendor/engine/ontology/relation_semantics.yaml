      cases:
      - {pair: Integration>Principal, emits: []}
  authenticates_with:
    names: {forward: 자격증명, reverse: 이 자격증명을 쓰는 쪽}
    description: A 는 B 로 인증한다
    inverse: authenticates
    characteristics: [irreflexive, asymmetric]
    role_in_graph: path
    # 기본 효과는 없고 아래 조건 갈래만 간선을 만든다(사용자 인증 요소처럼 주인이 없는 자격증명, 앱 · 통로의 자격증명은 그대로 정보다).
    # 칸은 template 셋을 다 적는다 — 엔진이 이 칸들을 효과 표가 아는 칸으로 보고 template 밖 경고(relation_outside_effects)를 내지 않는다
    effects:
    - pairs: [Principal>Credential, Integration>Credential, Endpoint>Credential]
      emits: []
    conditions:
    - name: authenticates_with.inactive_account
      when: 출발 계정이 지워졌거나 해지됐거나 정지됐다(source account_state deleted, deprovisioned, suspended). 그 계정의 토큰 · 키로 그 계정 행세를 하지 못한다(정지 포함)
      match: {source: {judged_or_property: {account_state: [deleted, deprovisioned, suspended]}}}
      decided: >-
        2026-11-07 Relation 주담당 위임(Claude 가 정함). 계정을 해지하면 벤더가 그 계정의 토큰을 끊는다(Okta 해지는 세션과 토큰을 거둔다).
