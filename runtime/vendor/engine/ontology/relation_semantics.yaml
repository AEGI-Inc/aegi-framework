# 관계 17종의 의미 — 이름 · 방향 · 성질 · 효과
#
# Relation 재설계 2단계(2026-10-13). 이 파일이 정본이다 — 명세 문서 표에서 옮긴 것이 아니고 bootstrap.py 가 만들지 않는다.
# relation_types.yaml 이 "무엇을 잇는가"(template)를 쥐고, 이 파일이 "무엇을 만드는가"(effects)를 쥔다.
#
# 값은 아직 바꾸지 않았다. effects · conditions · filters · role_in_graph 는 engine_probe(엔진에 넣어 본 결과)를
# 그대로 옮겼고, validation/check_ontology.py O6 이 둘이 같은지(간선 종류 · 방향) 본다. 고치는 것은 결정마다 PR 하나씩(3단계).
# 시험 입력 때문에 생긴 값 둘만 규칙으로 적었다 — has_role_on 의 rank(시험에 역할이 없었다)와
# member_of · shared_with 의 기본 rank 1(시험 provider 가 probe 였다). 이유는 각 관계의 depends_on 에 있다.
# 2026-10-19 부터 결정 반영(5단계)을 시작했다. 엔진과 일부러 다르게 정한 갈래에는 decided(언제 · 왜) · differs(엔진은 어떤가)를
# 적고 S3 기준선에 올린다. 엔진이 따라오면 differs 를 지우고 기준선에서 뺀다 — 첫째 owned_by.delivery_endpoint 는 2026-10-20 엔진이 따라와 뺐다

sources:
  grade_of_kind: 제안 — 엔진 간선 종류를 표현 등급으로 옮기는 기준. ontology/effects.yaml 의 원래 권한(M · U · G) / 연동(T · A · F) 구분을 따른다. 결정 전이다
  relations: 이 파일이 정본. names · description · inverse 는 새로 적었다. effects · conditions · filters · role_in_graph · depends_on 은 relation_types.yaml engine_probe (aegi-dashboard @ 0ee565f) 에서 옮겼다. characteristics 는 처음에 Slack 회귀 기준선 190행 · 대시보드 합성 150행(aegi-dashboard @ f278107)에 행이 있고 예외가 0 인 것만 적었다. 2026-10-16 검증을 실측으로만 하기로 하고 g2 실측 285행(대시보드 KV dataset/v2, 2026-10-02 판, git 밖)에 다시 걸었다 — 선언한 성질 22개 중 triggered_by 둘을 뺀 20개에 행이 있고 예외 0. 합성은 근거에서 뺐다
  references: 객체 참조의 뜻(아래 references 블록). aegi-dashboard src/detection/v2/engine/edges.ts @ 1b5481c 「객체 참조 (v2 references)」 절과 up() 이 읽는 칸을 옮겼다. 값은 그대로다
  references_skip_objects: 같은 엔진 절의 `if (measurement(k)) continue` — 측정 도구 계정은 참조를 읽지 않는다
  rules: 사전 표 · 속성 규칙의 뜻(아래 rules 블록). aegi-dashboard src/detection/v2/engine/edges.ts @ 1b5481c 의 공개 여부 · 응답자 · 자동화 신원 연결 절과 buildEntryPoints · buildDeploymentEntries · buildOutboundHooks 를 옮겼다. 값은 그대로다
  rules_outside: 같은 파일에서 이 명세가 일부러 안 옮긴 간선 함수
  resolvers: 같은 파일의 tenantOf() 와 공개 여부 · 배포 · 웹훅 절이 끝을 찾는 방법
  decided: open 에 있다가 정해진 것 — 정한 날짜, 정한 사람과 근거를 같이 적는다(crosswalk.yaml decided 와 같은 칸, 남은 일은 then). 2026-11-01 Relation 주담당 결정부터
  open: >-
    결정 반영 2호 초안 — 팀이 정할 일이라 적기만 했다(값은 그대로). 2026-11-01 Relation 주담당이 열 가운데 아홉을 정해 조건 갈래와
    rules 로 옮겼다(decided). 남은 open 은 정하지 않은 것이다. 10종은 aegi-dashboard PR #127(오브젝트 모델 v2) 정규화
    normalize-v2/okta.ts · gws.ts · slack.ts 의 owned_by → 조직 행, 종류를 고르는 상수는 docs/spec/model-v1/runtime-catalog.json
    Profile 상수. 벤더 근거는 Okta 개발자 문서 「Create an API token」, Okta 도움말 「Event hooks」 · 「Log streaming」 ·
    「Use your own email provider」, Okta SSF Transmitter API, Okta Mappings API, Google 도움말 「Sign in with app passwords」
    (2026-10-21 검색으로 확인, 이 환경에서 문서 사이트는 직접 열지 못했다). 결과 차이는 대시보드 시험 데이터
    (scripts/collect/model-v1/model.test.ts 의 V2-P1 · V2-P2 수집 기록)를 엔진에 넣어 본 것이다

# 간선 종류 → 표현 등급. 관계의 등급은 effects 가 만드는 간선 종류에서 계산한다 (O5)
grade_of_kind:
  M: 접근
  G: 접근
  U: 구조
  T: 신뢰
  A: 신뢰
  F: 신뢰

# names       forward = 출발에서 도착을 부르는 이름, reverse = 도착에서 출발을 부르는 이름 (화면 · 보고서 · AI 가 쓴다)
# inverse     반대 방향 관계의 이름. 저장은 이 관계 한 방향만 한다
# characteristics  irreflexive(자기 자신과 안 이어짐) · asymmetric(A→B 면 B→A 아님) · functional(출발 하나에 도착 하나). O7 이 데이터에 건다
# role_in_graph    path(경로에 쓰인다) · ingredient(다른 관계를 거른다 · 합쳐진다) · info(정보로만 둔다)
# effects     template 칸(pairs)에서 만드는 간선. from · to 는 source(출발) · target(도착) · everyone · grant(via_grant 의 자격증명) ·
#             tenant(출발의 테넌트. 아래 resolvers.tenant_of 로 찾는다) ·
#             resource_set(properties.resource_set 의 리소스 세트가 덮는 객체 전부. providers.yaml resource_set_coverage 로 편다. 여럿이면 간선도 여럿)
#             resource_set_unexpanded(그 세트에 펴지 못한 대상이 있으면 관계 도착, 다 폈으면 없음)
#             Effective Access 실행기의 관계 홉은 갈래가 resource_set · resource_set_unexpanded 끝을 적었으면 그 끝들을 도착으로 쓴다(관계 도착 대신)
#             rank 는 능력 순위(capabilities.yaml rank: read 1 · write 3 · admin 5). role = 역할에서(capabilities.yaml role_rank), membership = provider 소속 규칙에서(capabilities.yaml membership_capabilities 의 가장 센 능력)
# conditions  interface 쌍이 아닌 조건(속성 · provider · 측정 계정)이 붙으면 달라지는 갈래
#             when 은 사람이 읽는 문장, match 는 같은 뜻을 기계가 읽는 식이다 (문법은 ontology/match.py 머리말). 위에서부터 먼저 맞는 갈래 하나를 쓴다.
#             relation 자리의 resource_set_scope 는 저장 속성이 아니라 엔진이 판정 때 계산해 넣는 칸이다(providers.yaml resource_set_coverage 머리말)
#             그래서 더 좁은 갈래(다른 갈래의 식을 다 품은 것)를 위에 둔다 — S8 이 본다
relations:
  has_role_on:
    names: {forward: 역할이 있는 대상, reverse: 역할 보유자}
    description: A 는 B 에 역할 R 을 가진다
    inverse: role_held_by
    characteristics: [irreflexive, asymmetric]
    role_in_graph: path
    effects:
    - pairs: [Principal>Resource, Principal>Tenant, Principal>Integration, Principal>Automation, Policy>Resource, Policy>Tenant, Policy>Integration, Policy>Automation, Credential>Resource, Credential>Tenant, Credential>Integration, Credential>Automation, Integration>Resource, Integration>Tenant, Integration>Integration, Integration>Automation]
      emits:
      - {kind: G, from: source, to: target, rank: role}
    conditions:
    - name: has_role_on.inactive_account
      when: 출발 계정이 지워졌거나 해지됐거나 정지됐다(source account_state deleted, deprovisioned, suspended)
      match: {source: {judged_or_property: {account_state: [deleted, deprovisioned, suspended]}}}
      decided: >-
        2026-11-07 Relation 주담당 위임(Claude 가 정함). 11-05 총점검에서 Okta DEPROVISIONED, GWS 정지, Slack deleted 로 바꾼 계정의 접근 간선이 그대로였다.
        지웠거나 해지했거나 정지한 계정은 지금 로그인도 API 호출도 안 되므로 간선을 내지 않는다. 남은 배정은 위생 문제(쓰지 못하는 계정에 권한이 남음)지 접근 경로가 아니다.
        정지를 판정 보류(간선 + 사유)로 두면, 그 계정의 직접 권한은 보류라 없는 것으로, 같은 보류 권한으로 자동화를 시작시키는 것은 있는 것으로 세어 「연동으로만 닿는 사람」 위협이 새로 생겼다(11-04 수집본, 실행 신원 정지 변형). 다시 켜면 직접 권한과 연동 길이 함께 살아나므로 지금 판정에서는 빼는 쪽이 맞다
      cases:
      - {pair: Principal>Resource, emits: []}
      - {pair: Principal>Tenant, emits: []}
      - {pair: Principal>Integration, emits: []}
      - {pair: Principal>Automation, emits: []}
    - name: has_role_on.deleted_assignment
      when: 'properties.via_assignment 가 지운 배정(properties.deleted: true)'
      match: {via_assignment: {property: {deleted: true}}}
      decided: 2026-11-01 Relation 주담당 — 손코드(edges.ts)는 칸을 가리지 않는다. 그대로 effects 의 칸 전부에 건다 (진단표 Relation_Effects_Diagnosis_v1)
      cases:
      - {pair: Principal>Resource, emits: []}
      - {pair: Principal>Tenant, emits: []}
      - {pair: Principal>Integration, emits: []}
      - {pair: Principal>Automation, emits: []}
      - {pair: Policy>Resource, emits: []}
      - {pair: Policy>Tenant, emits: []}
      - {pair: Policy>Integration, emits: []}
      - {pair: Policy>Automation, emits: []}
      - {pair: Credential>Resource, emits: []}
      - {pair: Credential>Tenant, emits: []}
      - {pair: Credential>Integration, emits: []}
      - {pair: Credential>Automation, emits: []}
      - {pair: Integration>Resource, emits: []}
      - {pair: Integration>Tenant, emits: []}
      - {pair: Integration>Integration, emits: []}
      - {pair: Integration>Automation, emits: []}
    - name: has_role_on.excluded
      when: 역할 객체가 excludes 로 출발 주체를 뺐다
      match: {exists_relation: {type: excludes, source: $role, target: $source}}
      decided: 2026-11-01 Relation 주담당 — 손코드(edges.ts)는 칸을 가리지 않는다. 그대로 effects 의 칸 전부에 건다 (진단표 Relation_Effects_Diagnosis_v1)
      cases:
      - {pair: Principal>Resource, emits: []}
