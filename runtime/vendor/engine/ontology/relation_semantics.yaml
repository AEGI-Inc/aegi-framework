      decided: >-
        2026-11-01 Relation 주담당 결정(결정 반영 2호, aegi-knowledge#28 미결 일곱 중 하나)(owned_by.app_refresh_token 의 짝). scope 를 간선에 펴는 칸이 없어 「scope 만큼」은 모름 사유 token_scope_limited 로 남긴다.
        피해 범위는 scope 를 능력으로 바꿔 센다.
        2026-11-10 Relation 주담당 위임(Claude 가 정함) — 간선은 그대로 둔다(위협 간선은 길마다 따로 걸지 않아 scope 로 거를 자리가 없다).
        Effective Access 는 접근 규칙 x_token_scoped 가 scope 표(capabilities.yaml token_scopes)로 사람의 G 를 걸러 낸다. 그 행에서는 token_scope_limited 가 풀린다
