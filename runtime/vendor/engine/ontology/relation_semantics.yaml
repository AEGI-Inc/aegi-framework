    - name: has_role_on.okta_resource_set_partial
      when: provider okta, 리소스 세트를 수집해 보니 조직 전체를 덮는 대상(모든 사용자, 모든 그룹, 모든 앱, IAM 전체)이 없고 그룹 하나 같은 일부만 덮는다(계산 칸 resource_set_scope partial)
      match: {relation: {provider: okta, property: {resource_set_scope: partial}}}
      decided: >-
        2026-11-04 Relation 주담당 위임(Claude 가 정함) — 일부만 덮는 리소스 세트의 역할은 조직 전체에 대한 권한이 아니다. 조직(Tenant) 칸은 간선을 내지 않는다.
        자원 칸은 아래 okta_resource_set 갈래(펼치지 않음)로 간다. 근거는 수집한 리소스 세트 대상(OK-05 /iam/resource-sets/{id}/resources 의 orn).
        11-04 운영 테넌트: HelpDesk 역할의 리소스 세트가 그룹 하나(groups:<id>:contained_resources)만 덮어, 조직 전체 관리 위협 하나가 넓게 잡혀 있었다.
        2026-11-09 Relation 주담당 위임(Claude 가 정함) — 세트가 덮는 대상(resource_set 끝, providers.yaml resource_set_coverage)에 역할 세기 그대로 간선을 낸다.
        사람(Principal)은 조직 칸에도 resource_set_partial 사유를 단 간선을 하나 낸다. 연동이 조직 전체를 건드린다고만 알 때 그 사람이 원래 일부를 가졌으니
        「원래 권한 없음」으로 확정하지 않으려는 것이다(11-04 /mfa-reset 격차: HelpDesk 담당자가 리셋 대상 그룹의 MFA 를 원래 초기화할 수 있는데 확실 격차로 셌다).
        자격증명, 연동, 정책은 조직 칸 간선을 내지 않는다 — 넓게 잡힌 위협이 다시 생기지 않게. 다만 세트에 펴지 못한 대상(표에 없는 orn, 모으지 않은 서비스)이 있으면
        누구든 조직 칸에 resource_set_not_expanded 사유 간선을 낸다 — 넓게 잡히는 것보다 놓치는 것이 더 나쁘다(검증 세션 2026-11-09).
        2026-11-12 Relation 주담당 위임(Claude 가 정함) — 범위는 정규화가 적지 않고 엔진이 판정 때 providers.yaml resource_set_coverage(org_wide)로 계산한다
