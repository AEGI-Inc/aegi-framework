      - {pair: Principal>Integration, emits: []}
      - {pair: Principal>Automation, emits: []}
      - {pair: Policy>Resource, emits: []}
      - {pair: Policy>Tenant, emits: []}
      - {pair: Policy>Integration, emits: []}
      - {pair: Policy>Automation, emits: []}
