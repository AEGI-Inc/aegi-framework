      decided: >-
        2026-11-01 Relation 주담당 결정(결정 반영 2호, aegi-knowledge#28 미결 일곱 중 하나), 권고 채택(owned_by.org_bearer_token 의 짝). authenticates_with 는 이 결정으로 정보(info)에서 경로(path)가 됐다
