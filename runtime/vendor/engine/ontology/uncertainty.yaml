# 「모름」 어휘
#
# 0단계에서 원본 표를 그대로 옮겼다. 값을 고칠 때는 이 파일을 고치고 원본도 같이 고친다.
# 명세 쪽은 validation/check_ontology.py, 대시보드 쪽은 ontology/tools/check_dashboard.py 가 대조한다.

sources:
  unknowns: docs/Relation_Schema_v3.md 「화면이 구분해야 하는 모름」
  enums: docs/Object_Schema_v4.1.md 「unresolved_reason」, docs/Profile_Schema_v4.2.md 「completeness」 「enumerable」
  engine_reasons: aegi-dashboard src/detection/v2/engine/accessModel.ts REASON_LABELS @ 0ee565f
  reason_levels: 2026-11-03 구조 개편 2단계(aegi-knowledge#210, 2cbcad4). 사유가 단계를 내리나를 사유가 온 곳으로 정한다. specs/Path_Rule_Schema_v1.md 「닿음 핵심 위의 모양 거름」, aegi-adapter-engine scripts/accessRules/executor.ts 가 같은 뜻으로 단계를 내린다

