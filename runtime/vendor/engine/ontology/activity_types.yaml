# 사건 사전 — 원본 사건 종류(provider|event_type)마다 행위, 효과, 원본 칸 위치
#
# 명세는 specs/Activity_Schema_v1.md. 엔진은 이 파일에서 생성한 코드로 사건 기록(Activity)을 만든다.
# SaaS 마다 다른 것은 여기에만 둔다. 새 SaaS 는 calls 한 줄과 types 줄을 더한다(엔진 코드를 고치지 않는다).
# 검사는 validation/check_activity_types.py (관계 종류가 17종 안, 자리·행위·효과가 어휘 안, 키 중복 없음, 호출이 calls 에 있음).
#
# types 는 11-04 운영 수집본 로그 418종을 종류마다 손으로 분류한 결과(11-11)를 씨앗으로 옮겼다.
# GH-19(엔터프라이즈 감사 로그, 조직 필터)는 GH-17 과 같은 사건이라 줄을 따로 두지 않는다.
# 씨앗의 기계 추정 211줄은 11-11 사람이 확인해 고쳤다(원본 대상 칸 모양과 벤더 문서). 남은 review 는 확인하지 못한 까닭이다.
# 관계 효과의 from, to 는 그 관계 행의 출발과 도착이고, 원본 대상 칸에 없는 끝은 비운다. 3항 관계의 역할은 role 이다.
# 부여 사건의 관계가 스냅샷에 없는 까닭이 사전 밖(수집·추출·식별)이면 줄의 snapshot_gap 에 관계 종류별로 적는다. 사전 자리를 억지로 맞추지 않는다.
# relation_type 은 지금 관계 17종 이름이다. 관계 어휘를 바꾸면 이 칸도 같이 바꾼다.
# 이 단계에서 엔진은 사건을 간선, EA, 격차에 쓰지 않는다(보관만). observation 칸이 있는 줄만 지금 관측을 만든다.
# self_service 는 자기 계정에 하는 행위(비밀번호 · MFA · 내 정보 · 내 자격증명 SSO 인가)다. actor 면 늘 행위자 자신의 계정, target 이면 대상이 행위자일 때만.
# 그때 로그 점수판은 관리 권한 대신 그 테넌트 구성원인지를 묻는다. 남의 계정에 한 같은 행위는 그대로 관리 권한을 묻는다.

sources:
  vocabulary: specs/Activity_Schema_v1.md 「어휘」. 기존 Splunk_Normalized_Event_Contract_v1 의 outcome, unmatched, matched_on 과 같은 말
  calls: 11-04 운영 수집본(20261104T102155Z-ad5b) 로그 호출의 원본 모양을 읽고 적음(2026-11-11). Okta 경로는 엔진 observations.ts, Splunk 매퍼 mapper.ts 와 같다
  types: 11-11 운영 로그 418종 분류(종류마다 효과, 관계, 자리, 맞음 정도). observation 은 엔진 observations.ts 의 Okta AUDIT 9종(2026-11-11 main). self_service 칸 2026-11-15 Relation 주담당 위임, Claude 가 정함. 11-04 운영 로그의 설명 안 된 사건 중 자기 계정 행위 9건(GWS password_edit 은 resourceDetails.title 이 행위자 메일 5/5, Okta MFA 등록 · Atlassian 내 정보는 대상 = 행위자). GitHub 문서 audit log events 「org_credential_authorization.grant — A member authorized credentials for use with SAML single sign-on」, Google 관리 콘솔 도움말 Login audit 「Password change」(사용자 자신). 같은 모양 줄(MFA 끄기, 내 정보 고치기)을 함께 적음. Salesforce changedemail 은 Display 사용자 id 를 18자로 맞춘 뒤 대상 = 행위자 2건. 2026-11-18 11-14 시험 환경 수집본(20261002T162805Z-687d)의 사전 밖 33종 140건 가운데 30종을 더함(Relation 주담당 위임, Claude 가 정함). 뜻은 벤더 문서로 확인한 것은 Okta Event Types 카탈로그 14종(예 user.account.privilege.revoke 「All of user's admin privilege revoked」, iam.resourceset.bindings.delete 「Admin assignment is deleted」), Slack Audit Logs API methods & actions 8종, Google Reports API Login 활동 2종(login_challenge, email_forwarding_out_of_domain)과 Workspace 도움말 「세션 묶기로 쿠키 도용 막기」의 DBSC key validation, GitHub 조직 감사 로그 이벤트 5종. 자리는 그 원본 대상 칸 모양으로 정함(Slack permissions_assigned 32건은 문서는 「구성원에게 권한」이나 원본은 모두 계정 종류 역할 단위 설정이라 설정 바뀜으로). 문서에서 찾지 못한 Slack api_apps_acls_updated, pref.slack_connect_approval_type, org_owner_created 3종은 넣지 않음

vocabulary:
  verbs: [read, write, create, delete, grant, revoke, configure, authenticate, execute, send, export, request, activate]
  effect_kinds: [relation_created, relation_removed, relation_modified, object_created, object_removed, object_state_changed, object_attr_changed, setting_changed, exercised, denied, none]
  actor_kinds: [human, integration, automation, credential, system, anonymous]
  via_as: [app, token, bot, automation, agent, delegation]
  slots: [target, source, role, assignment, container, policy, destination, credential, object, counterparty]
  outcomes: [success, failure, unknown, success_implied]
  deny_kinds: [policy, no_relation, app_code, protocol]
  decision_results: [allow, deny, challenge]
  unmatched: [not_in_graph, ambiguous, name_only]
  fits: [fits, fits_with_attr, no_fit, n/a]
  snapshot_gaps: [not_collected, not_extracted, identity]
  self_services: [actor, target]

# 수집 호출마다 원본 칸이 어디 있나. 읽는 법(경로 문법)은 Activity_Schema_v1 「사전의 칸 위치」.
# 대상 칸의 slot_by 는 원소의 칸 값 → 자리. Okta 매핑 사건은 앱을 옮기면 옮기기 전 정책도 대상에 넣고 detailEntry.previousPolicy=true 로 표시한다.
# kinds 는 원본 대상 종류 → IM 객체 종류(object_type) 목록. 적으면 엔진은 그 종류 안에서만 대상을 찾는다.
# 같은 값을 다른 종류가 id 로 갖는 곳만 적는다(GWS 사용자 메일 = 같은 사용자의 Calendar id, Jira 프로젝트 id = 같은 숫자의 Filter id).
# id_alias 는 원본이 같은 객체를 그래프와 다른 식별자로 적어 경로 앞부분이 다를 때 쓴다. match 의 첫 묶음이 kinds 객체의 from 식별자 값이면, 맞은 부분을 그 객체의 to 식별자 값으로 바꿔 대상을 찾는다.
# records 가 없는 호출은 칸 위치를 아직 적지 않았다(엔진이 건너뛰고 건수만 센다).
calls:
  OK-12:
    provider: okta
    records: ''
    key: [uuid]
    event_type: eventType
    occurred_at: published
    actor:
      id: [actor.id, actor.alternateId]
      type: actor.type
      kind:
      - {path: actor.type, map: {User: human, PublicClientApp: integration, Client: integration, SystemPrincipal: system}}
    targets:
    - {each: 'target[]', id: [id, alternateId], type: type, slot_by: {path: detailEntry.previousPolicy, map: {'true': source}}}
    slots:
      {UserGroup: container, AppInstance: container, ResourceSet: container, RESOURCE_SET: container,
       AppUser: assignment, ConsentGrant: assignment, ROLE_ASSIGNED: assignment, CUSTOM_ROLE_BINDING_ADDED: assignment,
       PolicyEntity: policy, PolicyRule: policy, Policy: policy, 'Bucket UUID': policy, 'Bucket Uuid': policy,
       ROLE: role, Role: role, CUSTOM_ROLE: role,
       AuthenticatorEnrollment: credential, 'Factor Type': credential, access_token: credential, refresh_token: credential, id_token: credential,
       code: credential, Token: credential, OAuth2ClientSecretEntity: credential, Connection: credential}
    outcome: {path: outcome.result, map: {SUCCESS: success, ALLOW: success, FAILURE: failure, DENY: failure}, default: unknown}
    outcome_reason: outcome.reason
    session: {id: authenticationContext.externalSessionId, root_id: authenticationContext.rootSessionId, auth_method: authenticationContext.credentialType}
    job: {id: transaction.id, step: authenticationContext.authenticationStep}
    change:
    - {names: debugContext.debugData.changedAttributes, sep: ','}
    - {each: 'target[]', field: type, before: changeDetails.from, after: changeDetails.to}
    decision: {result: {path: outcome.result, map: {ALLOW: allow, SUCCESS: allow, DENY: deny, FAILURE: deny, CHALLENGE: challenge}}}
  GW-10:
    provider: gws
    records: items
    children: 'events[]'
    key: [id.uniqueQualifier, id.time, etag]
    event_type: {join: [$parent.id.applicationName, name], sep: ':'}
    occurred_at: $parent.id.time
    params: {list: 'parameters[]', name: name, value: [value, multiValue, intValue, boolValue]}
    actor:
      id: [$parent.actor.profileId, $parent.actor.email]
      kind:
      - {path: $parent.actor.email, regex: 'gserviceaccount\.com$', kind: integration}
      - {path: $parent.actor.callerType, map: {KEY: credential}}
      - {path: $parent.actor.email, regex: '.', kind: human}
      - {path: $parent.actor.profileId, regex: '.', kind: human}
    via:
    - {id: [$parent.actor.applicationInfo.oauthClientId], as: app}
    targets:
    - {params: [doc_id, target_user, USER_EMAIL, GROUP_EMAIL, group_email, member_id, user_email, ORG_UNIT_NAME, ROLE_NAME, DOMAIN_NAME, target_domain, SETTING_NAME, ALERT_ID, RULE_NAME, shared_drive_id, destination_folder_id, source_folder_id, APPLICATION_NAME, SCRIPT_ID, CALENDAR_ID, RESOURCE_IDENTIFIER, email_forwarding_destination_address]}
    - {join: {paths: [$parent.actor.profileId, 'param:client_id'], sep: '|'}, id: ['param:client_id'], type: '=client_id'}
    - {each: '$parent.resourceDetails[]', id: [id], type: type}
    slots: {GROUP_EMAIL: container, group_email: container, ORG_UNIT_NAME: container, DOMAIN_NAME: container, target_domain: container, ROLE_NAME: role, SETTING_NAME: policy, RULE_NAME: policy, shared_drive_id: container, destination_folder_id: destination, source_folder_id: source}
    kinds: {target_user: [User], USER_EMAIL: [User], user_email: [User]}
    outcome: {path: status.eventStatus, map: {SUCCEEDED: success, SUCCESS: success, FAILED: failure, FAILURE: failure}, default: success_implied}
    change:
    - {field: param:SETTING_NAME, before: param:OLD_VALUE, after: param:NEW_VALUE}
    - {field: '=visibility', before: param:old_visibility, after: param:visibility}
  SL-11:
    provider: slack
    records: entries
    key: [id]
    event_type: action
    occurred_at: date_create
    actor:
      id: [actor.user.id, actor.user.email]
      type: actor.type
      kind:
      - {path: actor.type, map: {user: human}}
    via:
    - {id: [context.app.id], as: app}
    - {id: [context.acting_agent], as: agent}
    targets:
    - {id: [entity.user.id], type: '=user'}
    - {id: [entity.channel.id], type: '=channel'}
    - {id: [entity.app.id], type: '=app'}
    - {id: [entity.workspace.id], type: '=workspace'}
    - {id: [entity.enterprise.id], type: '=enterprise'}
    - {id: [entity.file.id], type: '=file'}
    - {id: [entity.usergroup.id], type: '=usergroup'}
    - {id: [entity.workflow.id], type: '=workflow'}
    - {id: [entity.role.id], type: '=role'}
    - {id: [entity.external_auth_oauth2_token.id], type: '=external_auth_oauth2_token'}
    - {id: [entity.external_data_source.id], type: '=external_data_source'}
    - {id: [details.target_user], type: '=user'}
    - {id: [details.target_user_id], type: '=user'}
    - {each: 'details.affected_users[]', id: ['.'], type: '=user'}
    - {id: [details.app_id], type: '=app'}
    - {id: [details.api_app_id], type: '=app'}
    - {id: [details.shared_with.channel_id], type: '=channel', slot: destination}
    - {id: [context.location.id], type: context.location.type}
    slots: {workspace: container, enterprise: container, role: role}
    outcome: {path: details.success, map: {'true': success, 'false': failure}, default: success_implied}
    session: {id: context.session_id}
    change:
    - {field: '=scopes', before: 'details.previous_scopes', after: 'details.new_scopes'}
    decision: {result: {path: details.decision, map: {allow: allow, allowed: allow, deny: deny, denied: deny, block: deny, blocked: deny}}, rule: details.matched_rule.id}
  AT-90:
    provider: atlassian
    records: data
    key: [id]
    event_type: attributes.action
    occurred_at: attributes.time
    actor:
      id: [attributes.actor.id, attributes.actor.email]
      kind:
      - {path: attributes.actor.id, regex: '.', kind: human}
    via:
    - {id: [attributes.actor.auth.tokenId], as: token}
    # context 를 container 앞에 둔다: 줄이 context 종류를 container 로 덮으면(사용자를 넣은 그룹) 조직보다 먼저 잡힌다
    targets:
    - {each: 'attributes.context[]', id: [id], type: type}
    - {each: 'attributes.container[]', id: [id], type: type, slot: container}
    slots: {role: role, auth-policy: policy}
    kinds: {project: [Project]}
    outcome: {path: '=success_implied'}
  JI-90:
    provider: atlassian
    records: records
    key: [id]
    event_type: summary
    occurred_at: created
    actor:
      id: [authorAccountId]
      kind:
      - {path: authorAccountId, regex: '.', kind: human}
      - {kind: system}
    targets:
    - {id: [objectItem.id, objectItem.name], type: objectItem.typeName}
    - {each: 'associatedItems[]', id: [id, name], type: typeName}
    slots: {GROUP: container, PROJECT: container, PROJECT_ROLE: role}
    kinds: {PROJECT: [Project], PROJECT_ROLE: [ProjectRole]}
    outcome: {path: '=success_implied'}
    change:
    - {each: 'changedValues[]', field: fieldName, before: changedFrom, after: changedTo}
  CF-90:
    provider: atlassian
    records: results
    key: [creationDate, summary, affectedObject.name, affectedObject.objectType]
    event_type: summary
    occurred_at: creationDate
    actor:
      id: [author.accountId]
      kind:
      - {path: author.accountId, regex: '.', kind: human}
      - {kind: system}
    targets:
    - {id: [affectedObject.name], type: affectedObject.objectType, name_only: true}
    - {each: 'associatedObjects[]', id: [name], type: objectType, name_only: true}
    slots: {Group: container, Space: container, 'Space ID': container, 'Space key': container}
    outcome: {path: '=success_implied'}
    change:
    - {each: 'changedValues[]', field: name, before: oldValue, after: newValue}
  GH-17:
    provider: github
    records: ''
    key: [_document_id]
    event_type: action
    occurred_at: '@timestamp'
    actor:
      id: [actor, actor_id]
      kind:
      - {path: actor_is_bot, map: {'true': integration}}
      - {path: actor, regex: '.', kind: human}
      - {kind: system}
    via:
    - {id: [token_id], as: token, when: programmatic_access_type}
    - {id: [oauth_application_id], as: app}
    targets:
    - {id: [user], type: '=user'}
    - {id: [repo], type: '=repo'}
    - {id: [team], type: '=team'}
    - {id: [hook_id], type: '=hook'}
    - {id: [integration], type: '=integration'}
    - {id: [workflow_id], type: '=workflow'}
    - {id: [environment_name], type: '=environment'}
    - {id: [org], type: '=org', slot: container}
    slots: {repo: container, team: container}
    outcome: {path: '=success_implied'}
    change:
    - {field: '=config', before: config_was, after: config}
  GH-19: {same_as: GH-17}
  SF-90:
    provider: salesforce
    records: records
    key: [Id]
    event_type: Action
    occurred_at: CreatedDate
    actor:
      id: [CreatedById]
      kind:
      - {kind: human}
    via:
    - {id: [DelegateUser], as: delegation}
    targets:
    - {id: [Display], regex: '(?<!(?!_)\w)(005(?:(?!_)\w){12}(?:(?:(?!_)\w){3})?)(?!(?!_)\w)', type: '=User', normalize: [to_18_char]}
    outcome: {path: '=success_implied'}
  # Gemini Enterprise(provider gcp) Cloud Logging 항목. 수집기는 아직 받지 않는다(조회가 POST 라 GET 전용 규칙에 걸림, engine #499 GCP-07 임시 이름과 같게 둠).
  # 칸 위치는 2026-11-17~19 3회차 로그 7,867건(활동·데이터 접근 감사, gemini_enterprise_user_activity, connector_activity)의 키 구조로 적었다.
  # 감사 로그는 protoPayload.methodName, 사용자 활동·커넥터 활동은 jsonPayload.logMetadata.methodName, 에이전트 추론 기록은 labels."event.name" 이 종류다
  # (한 항목에 하나만 있어 빈 sep 으로 잇는다. 점 든 키는 큰따옴표로 감싼다). api_error(s) 는 종류 칸이 없어 다루지 않는다.
  # 대상은 resourceName 을 끝까지 맞춘 것이 target, 경로 중간의 엔진·어시스턴트·프로젝트가 container 다. 객체 id 는 PR #499 Profile 의 name 꼴(projects/<번호>/...)이다.
  # 2026-11-20 설정값 원본(20261118T161227Z-6e6f)으로 맞춰 봄: 번호 꼴은 엔진·어시스턴트·에이전트·커넥터·저장소가 그대로 같다. 콘솔 조회 등 178건은 projects/<프로젝트 id> 꼴이라 id_alias 로 번호 꼴로 바꿔 찾는다.
  # 행위자는 IAM 주체(IamMember)의 메일로 찾는다(같은 메일을 id 로 가진 UserLicense 에 붙지 않게 kinds 로 좁힘). IamMember 에 메일 식별자가 있어야 한다.
  # IAM 명단에 사용자 주체가 없는 사람(그룹 · 도메인으로만 권한을 받음)은 gcp 계정 객체가 없다. 로그의 메일은 같은 Google 계정, 곧 GWS 사용자 그 자체라
  # (crosswalk directory_principal 과 같은 근거, 추정 아님) 그때만 GWS User 안에서 찾는다(actor.directory). 다른 SaaS 계정으로 넓히지 않는다(2026-11-20 Relation 담당 결정)
  GCP-07:
    provider: gcp
    records: ''
    key: [insertId]
    event_type: {join: [protoPayload.methodName, jsonPayload.logMetadata.methodName, 'labels."event.name"'], sep: ''}
    occurred_at: timestamp
    actor:
      id: [protoPayload.authenticationInfo.principalEmail, jsonPayload.userIamPrincipal]
      type: '=principal'
      directory: {provider: gws, kinds: [User]}
      kind:
      - {path: protoPayload.authenticationInfo.principalEmail, regex: 'gserviceaccount\.com$', kind: integration}
      - {path: protoPayload.authenticationInfo.principalEmail, regex: '.', kind: human}
      - {path: jsonPayload.userIamPrincipal, regex: '@', kind: human}
      - {kind: system}
    via:
    - {id: [protoPayload.authenticationInfo.oauthInfo.oauthClientId], as: app}
    targets:
    - {id: [protoPayload.resourceName], regex: '^(projects/[^/]+)$', type: '=Project'}
    - {id: [protoPayload.resourceName], regex: '^(projects/[^/]+)/', type: '=ProjectParent'}
    - {id: [protoPayload.resourceName], regex: '^(projects/[^/]+/locations/[^/]+/collections/[^/]+/engines/[^/]+)$', type: '=Engine'}
    - {id: [protoPayload.resourceName], regex: '^(projects/[^/]+/locations/[^/]+/collections/[^/]+/engines/[^/]+)/', type: '=EngineParent'}
    - {id: [protoPayload.resourceName], regex: '^(.+/engines/[^/]+/assistants/[^/]+)$', type: '=Assistant'}
    - {id: [protoPayload.resourceName], regex: '^(.+/engines/[^/]+/assistants/[^/]+)/', type: '=AssistantParent'}
    # 사용자 활동 로그의 에이전트 만들기(CreateAgent)는 resourceName 이 없고 만들 곳(어시스턴트)을 request.parent 에 적는다(3회차 6/6).
    # 감사 로그의 같은 사건(resourceName)처럼 경로 중간의 엔진(앱)도 container 로 잡는다. 같은 칸의 WriteUserEvent 는 위치 경로라 두 regex 에 맞지 않는다
    - {id: [jsonPayload.request.parent], regex: '^(projects/[^/]+/locations/[^/]+/collections/[^/]+/engines/[^/]+)/', type: '=EngineParent'}
    - {id: [jsonPayload.request.parent], regex: '^(.+/engines/[^/]+/assistants/[^/]+)$', type: '=AssistantParent'}
    # 사용자 활동 로그의 에이전트 고치기 · 공유(UpdateAgent 24 · SetIamPolicy 1, 3회차)도 resourceName 이 없고 에이전트 이름을 logMetadata.name 에 적는다(25/25).
    # 감사 로그의 같은 사건처럼 에이전트를 target, 경로 중간의 엔진 · 어시스턴트를 container 로 잡는다. 끝이 /agents/<id> 인 이름만 맞춘다(다른 사건의 이름 칸은 건드리지 않음)
    - {id: [jsonPayload.logMetadata.name], regex: '^(projects/[^/]+/locations/[^/]+/collections/[^/]+/engines/[^/]+)/assistants/[^/]+/agents/[^/]+$', type: '=EngineParent'}
    - {id: [jsonPayload.logMetadata.name], regex: '^(.+/engines/[^/]+/assistants/[^/]+)/agents/[^/]+$', type: '=AssistantParent'}
    - {id: [jsonPayload.logMetadata.name], regex: '^(.+/assistants/[^/]+/agents/[^/]+)$', type: '=Agent'}
    - {id: [protoPayload.resourceName], regex: '^(.+/assistants/[^/]+/agents/[^/]+)$', type: '=Agent'}
    - {id: [protoPayload.resourceName], regex: '^(.+/sessions/[^/]+)$', type: '=Session'}
    - {id: [protoPayload.resourceName], regex: '^(.+/dataStores/[^/]+)$', type: '=DataStore'}
    - {id: [protoPayload.resourceName], regex: '^(projects/[^/]+/locations/[^/]+/collections/[^/]+/dataConnector)$', type: '=DataConnector'}
    - {id: [protoPayload.resourceName], regex: '^(.+/userStores/[^/]+)$', type: '=UserStore'}
    - {id: [protoPayload.resourceName], regex: '^(projects/[^/]+/locations/[^/]+/aclConfig)$', type: '=AclConfig'}
    # 에이전트 추론 기록은 자원 이름이 라벨 조각으로만 온다. 엔진은 기본 컬렉션 아래에 있다(설정값 원본 엔진 2개 모두)
    - {join: {paths: ['=projects/', resource.labels.resource_container, '=/locations/', resource.labels.location, '=/collections/default_collection/engines/', resource.labels.engine_id, '=/assistants/', resource.labels.assistant_id, '=/agents/', resource.labels.agent_id], sep: ''}, id: [], type: '=Agent'}
    slots: {ProjectParent: container, EngineParent: container, AssistantParent: container, UserStore: container, AclConfig: policy}
    kinds: {principal: [IamMember], Project: [Project], ProjectParent: [Project], Engine: [Engine], EngineParent: [Engine], Assistant: [Assistant], AssistantParent: [Assistant],
            Agent: [Agent], Session: [Session], DataStore: [DataStore], DataConnector: [DataConnector], UserStore: [UserStore], AclConfig: [AclConfig]}
    # 콘솔 조회 등은 자원 이름을 projects/<프로젝트 id>/… 로 적는다. 그래프 객체는 projects/<번호>/… 다. 같은 프로젝트의 두 식별자(Project Profile 의 mutable_ids.project_id 와 id)로 앞부분을 바꿔 찾는다(id_alias)
    id_alias:
    - {match: '^projects/([^/]+)', kinds: [Project], from: project_id, to: id}
    outcome: {path: protoPayload.status.code, map: {'3': failure, '5': failure, '7': failure, '8': failure, '9': failure, '12': failure, '16': failure}, default: success}
    outcome_reason: protoPayload.status.message
    job: {id: jsonPayload.assistToken}
    change:
    - {each: 'protoPayload.serviceData.policyDelta.bindingDeltas[]', field: role, after: member}
  # 1Password 감사 이벤트(Events API v3 beta GET /api/v3/auditevents, engine #535 수집기 OP-03, 2026-11-21). 원본 칸은 4회차(aegi.men) 실측 3건과
  # www.1password.dev events-api beta reference get-v3-auditevents 의 AuditEvent 꼴(id, create_time, actor, category, action, targets, correlation_id).
  # 사건 이름은 action(target.attribute.verb 꼴)이다. 행위자 종류는 문서가 user 만 예로 든다. service-account 는 실측 값이다(수집 서비스 계정 자신)
  OP-03:
    provider: onepassword
    records: audit_events
    key: [id]
    event_type: action
    occurred_at: create_time
    actor:
      id: [actor.id, actor.email]
      type: actor.type
      kind:
      - {path: actor.type, map: {user: human, service-account: integration}}
    targets:
    - {each: 'targets[]', id: [id], type: type}
    kinds: {user: [User], service-account: [ServiceAccount], group: [Group], vault: [Vault], item: [Item]}
    outcome: {path: outcome.result, map: {success: success, failure: failure}, default: unknown}
    session: {id: context.session.id}
  GW-16: {provider: gws}
  SL-05: {provider: slack}
  SL-12: {provider: slack}
  GH-18: {provider: github}
  D-21: {provider: slack}
  GH-11: {provider: github}
  RG-GW-alertcenter.alerts.list: {provider: gws}
  RG-SF-BrowserPolicyViolation: {provider: salesforce}
  RG-SF-WaveAutoInstallRequest: {provider: salesforce}

