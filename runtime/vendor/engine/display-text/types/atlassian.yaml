# 검토된 화면 설명 문구. 사람이 쓰고 고친다. 비어 있는 종류는 npm run display-text 가 AI 로 만들어 캐시하고, 검토를 거쳐 여기로 옮긴다.
# types 의 키는 object_type 소문자. 「종류 — 꾸밈말」 꼴은 화면에서 「꾸밈말 종류」로 붙인다.
provider: atlassian
format: aegi-display-text/v1
name: Atlassian
profile:
  role: 이슈, 문서 협업 (Jira, Confluence)
  points:
    - Jira 프로젝트 이슈와 Confluence 스페이스 문서
    - 프로젝트 역할과 스페이스 권한으로 정하는 열람, 편집
    - 프로젝트 관리 역할(ADMINISTER_PROJECTS)로 바뀌는 프로젝트 설정 전체
types: {}
