# 검토된 화면 설명 문구. 사람이 쓰고 고친다. 비어 있는 종류는 npm run display-text 가 AI 로 만들어 캐시하고, 검토를 거쳐 여기로 옮긴다.
# types 의 키는 object_type 소문자. 「종류 — 꾸밈말」 꼴은 화면에서 「꾸밈말 종류」로 붙인다.
provider: slack
format: aegi-display-text/v1
name: Slack
profile:
  role: 협업, 메시징
  points:
    - 사람과 봇의 대화 공간
    - 채널 멤버의 채널 내용 열람
    - 봇, 슬래시 명령, 웹훅으로 다른 SaaS 데이터 수신과 조작
types:
  enterprise:
    meaning: Slack 엔터프라이즈(테넌트)
  workspace:
    meaning: Slack 워크스페이스(테넌트)
  file:
    meaning: Slack에 올린 파일
  user:
    meaning: Slack 사용자 계정
  usergroup:
    meaning: Slack 사용자 그룹(@멘션 그룹)
  conversation:
    meaning: Slack 채널 — 들어온 사람이 내용을 보는
  message:
    meaning: 채널에 올라온 메시지
  conversation membership assignment:
    meaning: 누가 어느 채널에 들어 있는지의 기록
  slack app installation registration:
    meaning: 워크스페이스에 설치된 Slack 앱
  slash command request endpoint:
    meaning: 슬래시 명령이 호출하는 외부 주소
  bot:
    meaning: Slack 앱이 행동할 때 쓰는 봇 사용자
  bot-token:
    meaning: 봇이 Slack API를 부르는 토큰
  incoming-webhook:
    meaning: 외부에서 채널로 메시지를 넣는 웹훅 주소
