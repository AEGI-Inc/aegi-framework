# ==== 의미 층 능력 목록 (2026-11-11, 명세 Relation_Semantic_Layer_v1.md 「능력」)
# 위의 세기 표(rank)는 그대로 둔다. 의미 층은 세기 대신 「무엇을 할 수 있나」 목록(능력)으로 적는다.
# 능력 목록은 위 표에서 계산한다 — 세기 r 의 묶음은 rank_capabilities[r] 이다. 그래서 표를 두 벌로 적지 않는다.
# 능력 목록의 세기(rank)는 그 목록에서 가장 센 능력의 rank 다. 세기 2(triage) · 4(maintain, organizer)는 1 · 3 으로 접힌다 —
# 판정 문턱이 1 · 3 · 5 라 결과가 같다(2026-11-11 11-04 수집본 점수판 main 과 같음). validation/check_semantic_layer.py 가 접힘을 본다
# 세기로 못 가르는 능력(인증과 읽기는 둘 다 1)은 아래 capability_names · membership_capabilities 처럼 목록을 바로 적는다

# 능력 10종. rank 는 세기 표의 1 · 3 · 5 와 같은 눈금이다. events 는 11-04 운영 로그에서 그 능력으로 나뉜 사건 수
capability_vocabulary:
  authenticate: {rank: 1, meaning: 로그인 · 토큰 받기 · SSO, event_types: 39, events: 6786}
  read: {rank: 1, meaning: 보기 · 읽기(내려받기 없이 열람), event_types: 45, events: 886}
  write: {rank: 3, meaning: 있는 것을 고치기, event_types: 76, events: 412}
  create: {rank: 3, meaning: 새로 만들기, event_types: 74, events: 390}
  delete: {rank: 3, meaning: 지우기, event_types: 10, events: 32}
  share: {rank: 3, meaning: 공유 · 내보내기(사본이나 접근이 밖으로 나감), event_types: 21, events: 79}
  send: {rank: 3, meaning: 메시지 · 메일 보내기, event_types: 2, events: 73}
  execute: {rank: 3, meaning: 자동화 · 스크립트 · 명령 실행, event_types: 13, events: 70}
  configure: {rank: 3, meaning: 설정 · 정책 바꾸기, event_types: 45, events: 402}
  grant: {rank: 5, meaning: 남에게 권한 · 소속 · 역할 주기(누가 들어오는지를 정함), event_types: 59, events: 405}

# 능력에서 수준으로 (2026-11-16, 직접 권한). 판정과 Access Gap 이 같은 수준을 쓴다. 권한 하나의 수준은 그 능력들 가운데 가장 높은 것
#   none 은 수준에 넣지 않는다. 로그인(authenticate)은 전제 조건이고, 권한 주기(grant)는 그 대상의 내용을 읽거나 고치는 길이 아니다
#   share, send, execute 를 쓰기로 둔 것은 확인 필요
capability_levels:
  authenticate: none
  read: read
  write: write
  create: write
  delete: write
  share: write
  send: write
  execute: write
  configure: admin
  grant: none

# 묶음. 표에는 묶음 이름이나 능력 목록을 적는다
capability_bundles:
  none: []
  use: [read]
  edit: [read, write, create, delete]
  manage: [read, write, create, delete, share, configure, grant]

# 세기 → 묶음. 위 세기 표(role_rank, okta_standard_roles, role_name_rank, scope_rank, privilege_rank, role_flag_rank, role_type_rank,
# token_scopes abilities · ranks)에 나오는 세기는 모두 여기 있어야 한다
rank_capabilities: {0: none, 1: use, 2: use, 3: edit, 4: edit, 5: manage}

# 역할 하나의 능력을 정하는 차례. role_rank_order 에 permission_prefixes(사용자 정의 역할 권한 이름)를 base_role 앞에 끼운 것이다 —
# 엔진 roleCapability 가 그 차례로 본다. 위에서부터 보고 처음 정한 방법을 쓴다. 다 못 정하면 모름(엔진 role_rank_unknown)
capability_order: [permissions, name, scopes, privileges, flags, object_type, grants, permission_prefixes, base_role]

# 역할 이름(name 단계)을 볼 표의 차례. provider 칸이 있으면 그 provider 의 이름만 본다
#   okta_standard_roles  이름(대소문자 무시) → 세기 · applies_to
#   capability_names     provider 마다 이름(대소문자 무시) → 능력 목록
#   role_name_rank       provider 마다 정규식(대소문자 그대로, 앞뒤 빈칸 뗌) → 세기
#   role_rank            모든 provider, 이름(대소문자 무시) → 세기
#   permission_summary   「키:수준,키:수준」 꼴 → 수준 가운데 가장 센 것
capability_name_steps:
- {table: okta_standard_roles, provider: okta}
- {table: capability_names}
- {table: role_name_rank}
- {table: role_rank}
- {table: permission_summary}

# 세기로 못 가르는 이름 → 능력 목록 (대소문자 무시). 값은 능력 목록, 또는 {caps, below}: below 는 아래 객체(상위 범위에서 내려간 곳)로 내려갈 때 남는
# 능력이다(caps 안). 간선 도착 자체에는 caps 전부, 그 아래에는 below 만 — 엔진 semantic/ceiling.ts underCeiling
capability_names:
  okta:
    assigned: [authenticate, read]
  # 1Password 금고 권한 이름(2026-11-21, 근거는 role_name_rank onepassword). 비밀번호 보기도 보기(read)다 — 능력 어휘에 「비밀 읽기」가 따로 없다.
  # 금고 관리는 권한 주기(grant)만이다. 문서상 그것만으로 항목을 못 본다(capability_levels 의 grant 는 수준 없음)
  onepassword:
    read_items: [read]
    reveal_item_password: [read]
    update_item_history: [read]
    create_items: [create]
    import_items: [create]
    update_items: [write]
    archive_items: [delete]
    delete_items: [delete]
    send_items: [share]
    export_items: [share]
    print_items: [share]
    manage_vault: [grant]
  # 사용자 OAuth 승인(OauthToken, 역할 이름 authorized). 연결 앱이 이 사용자로 로그인 · 토큰을 받는 데 동의한 것이라 사용자 쪽 능력은 인증뿐이다.
  # 세기는 role_name_rank 의 1 과 같다(authenticate 세기 1). 이 사용자로 대신 동작하는 앱은 이 능력을 물려받지 않는다(access_rules.yaml
  # x_acts_as_inherits 의 skip_caps_only). 2026-11-16 Relation 주담당 위임(Claude 가 정함)
  salesforce:
    authorized: [authenticate]
  # 앱 역할 없이 앱에 배정(appRoleId 0…0, Graph 「appRoleAssignment」의 default access). 그 앱에 로그인하고 보는 것이다 — Okta 앱 배정과 같다
  microsoft:
    default_access: [authenticate, read]
  # Gemini Enterprise 앱 사용자 역할. 3회차 실측 includedPermissions(135개)에 앱 안에 새로 만드는 권한이 있다 — 세션(sessions.create · update · delete ·
  # uploadFile), 에이전트(agents.create), 자기 사용자 데이터(engines.createEngineUserData · updateEngineUserData), 노트북 · 메모리. 앱 설정을 바꾸는
  # 권한(engines.update · setIamPolicy)과 저장소 쓰기는 없다. 그래서 세기 하나(role_name_rank 의 1)가 아니라 [read, create] 로 적는다: 앱을 쓰고 그 안에
  # 새로 만든다. 고치기 · 설정 · 권한 주기는 주지 않는다. 2026-11-20 Relation 담당(Claude 가 정함). 로그: 세션 만들기 40건 · 에이전트 만들기 4건이
  # 「읽기까지만 닿음(write 근거 없음)」이었다.
  # below: 아래 객체(앱 안 어시스턴트 · 에이전트 · 위젯 설정 · 저장소)로는 읽기만 내려간다. 만들기는 앱 자체에 거는 능력이다 — 내려보내면 만들기가 쓰기 수준이라
  # 앱 사용자가 위젯 설정 · 남의 에이전트를 「쓴다」로 세였다(3회차 실측: Apps Script 실행 신원이 그룹으로 이 역할을 받아 위협 2개가 새로 생겼다)
  gcp:
    roles/discoveryengine.agentspaceuser: {caps: [read, create], below: use}

# 권한 요약 문자열. split 로 나누고 kv 로 키와 수준을 가른다. 수준(소문자) → 묶음
permission_summary: {split: ',', kv: ':', levels: {read: use, write: edit, admin: manage}}

# 역할 객체의 권한 이름 목록 → 능력 (permission_prefixes 단계). 이름이 read_suffix 로 끝나면 read_caps, 아니면 other_caps.
# 객체 종류는 types 표(접두사 → 소문자 객체 종류)에서 이름이 맞는 줄 전부
permission_prefixes:
  okta: {from: properties.permissions, read_suffix: .read, read_caps: use, other_caps: edit, types: okta_permission_types}

# member_of 가 그룹 · 테넌트가 아닌 자원을 가리킬 때 그 소속이 주는 능력. 줄이 없으면 default
membership_capabilities:
  default: use
  rows:
  - {provider: slack, target_type: conversation, caps: [read, write, send]}
