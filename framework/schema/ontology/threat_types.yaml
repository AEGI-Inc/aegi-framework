# 위협 유형
#
# 위협 판정(aegi-adapter-engine docs/spec/AEGI_THREAT_JUDGMENT_V2.md)이 사람과 대상마다 붙이는 유형 넷과 대표 유형 순서.
# 값을 고칠 때는 이 파일을 고치고 엔진에서 npm run ontology:sync 로 받는다. 엔진은 생성 코드(THREAT_TYPES, THREAT_TYPE_ORDER)로 읽는다.
# 판정 절차(기준선, Access Gap, 경로, 확실성)는 엔진 명세에 있고 이 파일은 유형의 뜻과 가르는 기준만 쥔다.

sources:
  types: 이 파일이 정본 (aegi-knowledge#346, #347, 2026-11-19 결정). 정보 노출을 비인가 접근으로 바꾸고 권한 상승과 데이터 반출을 다시 정의. 그 전 정본은 엔진 contract.ts 와 명세 5절 「유형 표」였다
  order: 이 파일이 정본 (aegi-knowledge#346, 2026-11-19 결정). 한 위협에 유형이 여럿이면 이 순서로 대표 유형을 고른다
  outside: 이 파일이 정본 (aegi-knowledge#346, 2026-11-19 결정). 「권한 상승(외부)」 꼬리표 대신 사람마다 다는 조직 밖 표시. 사람 기준이고 데이터 반출에도 단다 (aegi-knowledge#349 검토, 2026-11-19 결정)

# 기준선: 사람이 그 대상에 원래 가진 접근. 조직 안은 직접 권한(누구나 공유 읽기 포함), 조직 밖은 승인 목록 밖이면 없음, 승인 목록 안이면 승인 범위(읽기).
# 접근: 읽기, 쓰기(게시 전용 포함), 관리. 로그인만 되거나 부여만 되는 것은 접근이 아니다.
types:
  - id: unauthorized_access
    name: 비인가 접근
    meaning: 대상에 읽기, 쓰기, 관리가 모두 없던 사람이 접근을 얻음
    baseline: 없음
    direction: 접근이 없던 사람이 대상으로 들어옴. 조직 밖 사람이면 밖에서 안. 조직 안 사람도 포함
    rules:
      - 내용 객체와 다른 사람 계정 프로필은 새 읽기부터 센다. 그 밖의 제어 객체와 그룹은 새 쓰기나 새 관리부터 센다
      - 제어 객체의 관리를 새로 얻고 그 아래 기준선으로 못 읽던 내용이 있으면 비인가 접근도 붙인다. 사유 「아래 내용 읽기」
      - 조직 밖 사람이 공개 의도로 등록한 내용을 읽는 것은 넣지 않는다
  - id: privilege_escalation
    name: 권한 상승
    meaning: 대상에 접근이 이미 있던 사람이 더 높은 수준을 얻음
    baseline: 있음
    direction: 같은 사람의 수준이 올라감
    rules:
      - 게시 전용(읽기 없는 쓰기)만 있던 사람이 읽기를 얻어도 권한 상승
      - 승인 목록에 있는 조직 밖 사람이 승인 범위(읽기)를 넘어 쓰기나 관리를 얻으면 권한 상승
  - id: data_exfiltration
    name: 데이터 반출
    meaning: 조직 안 데이터가 조직 밖 목적지로 실제로 흐름
    baseline: 받는 사람의 Access Gap. 승인 목록에 있는 받는 사람은 승인 범위(읽기)라 반출이 아님. 받는 목적지 기준 판정과 외부 서비스 목적지는 aegi-adapter-engine#509
    direction: 안에서 밖
    subject: 받는 목적지(주소, 외부 서비스)
    rules:
      - 데이터 흐름이 조직 밖 목적지에 닿을 때만 센다. 조직 밖 사람이 조직 안 객체를 읽는 것은 비인가 접근이다
      - 받는 목적지에는 비인가 접근을 붙이지 않는다
      - 공개 의도로 등록한 내용은 밖으로 흘러도 누가 읽든 반출로 세지 않는다
      - 전송 기록이 없으면 발생 가능, 있으면 발생. 흐름 자체가 추정인 간선의 기록은 전송 기록으로 세지 않는다. 확실성은 다른 유형처럼 경로가 확인됐는가로 정한다
  - id: accountability_loss
    name: 추적성 상실
    meaning: 고정 실행 신원이 주인이 아닌 사람의 호출을 대신해 대상 감사 로그에 호출자가 남지 않음
    baseline: 보지 않음
    direction: 해당 없음
    rules:
      - 판정 조건은 엔진 명세 6절. 이번 개편에서 바꾸지 않았다

order: [data_exfiltration, privilege_escalation, unauthorized_access, accountability_loss]

outside:
  meaning: 판정 줄의 사람이 조직 밖이거나 조직 경계를 모름
  applies_to: [unauthorized_access, privilege_escalation, data_exfiltration]
  rules:
    - 유형 이름에 꼬리표를 붙이지 않고 사람마다 단다
    - 사람 기준이다. 데이터 반출을 받는 사람이라도 조직 안이면 붙이지 않는다
    - 심각도의 기밀성은 데이터 반출과 같은 표(조금 7, 중간 8, 넓게 9, 전부 9)
