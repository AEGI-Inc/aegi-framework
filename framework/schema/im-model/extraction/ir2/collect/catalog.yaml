# 출처 정의 (2026-10-15). build_registry.py 가 이 표와 받은 목록(manifest.jsonl)을 합쳐 registry.json 을 만든다.
# 경로는 finding-nemo 기준 상대 경로다. url, retrieved_at, 상태는 manifest 에서 온다 (manifest 가 없는 파일은 여기 적는다).
# kind: api_schema | api_doc | log_doc | event_doc | tenant,  rank: 1 API 스키마, 2 API 문서, 3 로그와 이벤트 문서, 4 테넌트
# naming: 이름 비교를 같은 명명 체계 안으로 묶는 표지
# 폴더 출처(dir)는 안의 파일 전체(이름 순, desktop.ini 제외)로 해시를 만든다

