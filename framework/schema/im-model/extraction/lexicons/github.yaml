# GitHub 사전 v0 (2026-10-14). 정보 지도용으로 처음 만들었다. 줄마다 이유를 적는다.

sources:
  openapi:
    # 웹훅 절(294)이 있는 판. 최신 main 판(1.1.4)에는 웹훅 절이 없다 (sources_2026-10-13.md)
    - {id: ghec_openapi_2026_03_10, path: github-api-drive-upload/01_docs_원문/raw_specs/ghec.2026-03-10.json}
  audit:
    # github/docs 의 audit-logs 데이터(fields-pool.json 등)를 2026-09-03 에 기계로 옮긴 목록. action 마다 필드 이름 배열이 있다
    - {id: gh_audit_events_2026_09_03, path: github-api-drive-upload/02_API_전수_리스트/audit_events.jsonl}
  graphql:
    # GHEC GraphQL 공개 스키마 (docs.github.com/public/ghec/schema.docs.graphql, 2026-10-13 받음). REST 명세와 같은 GHEC 판
    - {id: gh_graphql_ghec_2026_10_13, path: github_api_list/snapshot_2026-10-13/raw/docs.github.com__public__ghec__schema.docs.graphql}
  permissions:
    # docs.github.com "Permissions required for GitHub Apps" 원문 마크다운. 절 제목이 권한, 표 행이 엔드포인트
    - {id: gh_app_permissions, path: github_api_list/snapshot_2026-10-13/raw/docs.github.com__api__article__body__pathname__en__rest__authentication__permissions-required-for-github-apps}

# REST 경로 파라미터 이름에서 떼는 꼬리 (공용 사전에 더한다)
param_suffixes: [_number, _slug, _name]

# 경로 파라미터 이름 -> 공간
param_space:
  owner: "@resolve"        # /repos/{owner}/{repo}: 사용자이거나 조직이다
  username: user
  org: org
  enterprise: enterprise
  repo: repo
  repository_id: repo
  team_slug: team
  pull_number: pull_request   # 응답 필드 pull_request_id 와 같은 공간
  account_id: "@resolve"   # Marketplace 계정: 사용자 또는 조직
  actor_id: user
  user_id: user
  pattern_id: custompattern       # /secret-scanning/custom-patterns/{pattern_id} (2026-10-14)
  template_repo: repo             # /repos/{template_owner}/{template_repo}/generate: 템플릿도 저장소다
  template_owner: "@resolve"

# 응답과 감사 필드 이름 -> 공간 (예시 값 접두사가 없어서 이름으로만 정한다)
field_space:
  repo_id: repo
  repository_id: repo
  org_id: org
  organization_id: org
  user_id: user
  actor_id: user
  team_id: team
  business_id: enterprise
  enterprise_id: enterprise
  installation_id: installation
  oauth_application_id: oauth_application
  runner_group_id: runnergroup   # REST 경로 공간 이름(밑줄 없음)과 맞춘다
  pull_request_id: pull_request
  # 감사 로그는 대상을 ID 와 함께 이름 문자열로도 남긴다 (repo = "owner/name", org = 로그인 이름). 이름 키다
  repo: repo
  org: org
  actor: user
  user: user
  business: enterprise

# 응답 스키마 이름 -> 공간. 접사(simple-, full-, nullable- ...)를 떼도 안 맞는 것만 적는다
schema_affixes: [simple, full, nullable, minimal, private, public, basic]
schema_space:
  repository: repo
  organization: org
  integration: app            # GitHub App 의 응답 스키마 이름이 integration 이다
  # SCIM 응답 (2026-10-14). 응답 형식이 application/scim+json 이라 전에는 IR 에 없었다. user-response, group-response 는 SCIM 에만 쓰인다
  scim-user: scimuser
  scim-enterprise-user-response: scimuser
  user-response: scimuser
  scim-enterprise-group-response: scimgroup
  group-response: scimgroup
  # 생성 응답의 스키마 (2026-10-14). 전에는 본문의 runner_group_id 로 runnergroup 에 잘못 붙었다
  actions-hosted-runner: hostedrunner
  network-configuration: networkconfiguration
  ssh-signing-key: sshsigningkey
  # 맥락이 붙은 표현 스키마 (2026-10-14 공간 재구성). 같은 대상의 다른 모양이다
  accessible-repository: repo
  team-organization: org
  base-gist: gist
  runner-groups-enterprise: runnergroup
  runner-groups-org: runnergroup
  installation: installation
  enterprise: enterprise
  collaborator: user          # /repos/{owner}/{repo}/collaborators 원소
  team-member: user           # /orgs/{org}/teams/{team_slug}/members 원소

scope_spaces: [org, enterprise]
vendor_hosts: [github.com, githubusercontent.com, github.io, githubassets.com]

# 감사 category -> 공간 (다리 B4)
audit_alias:
  repo: repo
  org: org
  team: team
  user: user
  business: enterprise
  enterprise: enterprise
  integration: app
  integration_installation: installation
  oauth_application: oauth_application
  hook: hook
  pull_request: pull_request
  issue: issue
  environment: environment
  organization_role: organizationrole   # 2026-10-14 정정: role 공간은 없다
  repository_ruleset: ruleset
  personal_access_token: pat           # 2026-10-14 정정: 공간 이름은 pat
  public_key: key
  # 2026-10-14 추가: 공간 이름이 category 이름과 다른 것
  codespaces: codespace
  gist: gist
  workflows: workflow
  issue_comment: issuecomment       # 2026-10-14 공간 재구성으로 comment 가 댓글 종류별로 나뉘었다
  commit_comment: commitcomment
  discussion_comment: comment
  gpg_key: gpgkey                      # 2026-10-14 정정: 공간 gpgkey 가 따로 있다
  git_signing_ssh_public_key: sshsigningkey   # 2026-10-14 정정
  github_hosted_runner: runner
  custom_hosted_runner: runner
  protected_branch: repo        # 보호 규칙은 저장소 안의 브랜치 이름 키다. 항목은 repo 쪽에서 찾는다
  repository_ruleset: ruleset
  migration: migration
  packages: package
  artifact: artifact
  deployment: deployment
  # 2026-10-14 추가: 감사 로그 전용 후보 정리(out/github/audit_only_candidates.md)의 「API에 있음」
  external_group: externalgroup
  external_identity: scimuser             # SCIM 사용자 프로비저닝
  team_group_mapping: externalgroup       # 팀과 IdP 그룹 연결. 바뀌는 쪽은 외부 그룹의 teams
  business_secret_scanning_custom_pattern: custompattern
  org_secret_scanning_custom_pattern: custompattern
  repository_secret_scanning_custom_pattern: custompattern
  code_scanning: codescanningalert   # 2026-10-14 alert 가 경고 종류별로 나뉘었다
  secret_scanning_alert: secretscanningalert
  repository_vulnerability_alert: dependabotalert   # Dependabot 경고
  repository_advisory: ghsa
  secret_scanning_push_protection: secretscanningbypassrequest
  secret_scanning_push_protection_request: secretscanningbypassrequest
  security_configuration: configuration
  security_configuration_default: configuration
  repository_security_configuration: configuration
  audit_log_streaming: stream
  enterprise_role: enterpriserole
  enterprise_team: enterpriseteam
  repository_invitation: repositoryinvitation
  role: organizationrole                  # 사용자 정의 조직 역할
  network_configuration: networkconfiguration
  premium_runner: hostedrunner            # 대형 러너
  repository_image: imagedefinition
  custom_property_definition: customproperty
  organization_custom_property_definition: customproperty
  custom_property_value: repo             # 값은 저장소에 붙는다 (protected_branch 와 같은 이유)
  organization_custom_property_value: org
  enterprise_installation: installation
  issue_type: issuetype
  issue_dependencies: issue
  sub_issues: issue
  project: project
  project_collaborator: project
  project_view: project
  project_field: field
  pull_request_review: review
  pull_request_review_comment: pullrequestreviewcomment
  required_status_check: repo             # 브랜치 보호의 필수 검사. 저장소 안의 이름 키다
  user_email: user

namespace_token_space:
  repos: repo
  orgs: org
  teams: team
  users: user

action_token_alias:
  member: [user, collaborator]   # repo.add_member 는 저장소 협업자 추가다 (/repos/{owner}/{repo}/collaborators)
  members: [user]
  collaborator: [user]
  repository: [repo]
  customimage: [imagedefinition]   # custom_image (2026-10-14)
  # 동사가 바꾸는 속성 (2026-10-14). 이름에 명사가 없을 때 이 항목으로 잇는다
  alert: [codescanningalert]      # code_scanning.alert_created: 2026-10-14 alert 가 종류별로 나뉘어 이름 토큰을 잇는다
  rename: [name]
  close: [state]
  reopen: [state]

# 밑줄로 갈렸지만 한 대상 이름인 토큰 쌍 (2026-10-14). 자동으로 붙이면 self_hosted_runner 가 hostedrunner 가 되어 사전에 적는다
action_token_join: [runner_group, custom_image]

record_key_alias: {}
setting_action_prefixes: []

# ID 가 아닌 경로 파라미터 (2026-10-14). 공간을 만들지 않는다. 경로 끝에 오면 부모 공간 안의 이름 키가 된다
non_id_params: [basehead, path, ref, sha, cluster, version, branch, tag, file_path, tag_sha, tree_sha, file_sha, commit_sha, dir, language, stack, build]

# 응답 객체의 속성 이름 -> 공간 (I1c). 스키마 이름이 없는 웹훅 payload 의 객체에 쓴다
object_space:
  repository: repo
  repositories: repo
  organization: org
  sender: user
  owner: "@resolve"
  user: user
  assignee: user
  author: user
  issue: issue
  pull_request: pull_request
  team: team
  installation: installation
  enterprise: enterprise
  release: release
  label: label
  milestone: milestone
  comment: comment
  review: review

# ID 공간 설명 (2026-10-14). 정보 지도 화면과 인계 문서가 쓴다. 판정이 아니라 사람이 읽는 메모다.
