# 스키마 계열 우선 공간 (2026-10-14, extract.py schema_spaces). 결과 out/github/space_rebuild.json
space_from_schema: true
# 하위 유형 스키마 꼬리. 이 꼬리로 끝나는 스키마는 그 계열이다 (labeled-issue-event, renamed-issue-event ... -> issue-event: 이슈 타임라인 사건)
schema_subtype_suffixes: [issue-event]
# 레코드 자기 키. 이슈, PR, 경고는 id 가 아니라 저장소 안 number 로 가리킨다
record_key_fields: [id, number]
# 공간이 아닌 응답 스키마
schema_ignore: [empty-object]
node_id_field: node_id     # 2부 V2: node_id 값이 GraphQL 타입을 말한다 (info_map_v2.py node_ids)
