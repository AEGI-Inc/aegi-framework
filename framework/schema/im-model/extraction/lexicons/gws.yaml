# Google Workspace 사전 v0 (2026-10-14)
# 자료: gws_api_list/snapshot_2026-10-13 (Discovery 문서 11종, Reports API 활동 부록 55쪽, OAuth scope 목록, Workspace Events 안내)

sources:
  discovery:
    - {id: gws_directory, api: directory, strip: admin/directory/v1/, path: gws_api_list/snapshot_2026-10-13/raw/admin.googleapis.com__discovery__rest__version__directory_v1}
    - {id: gws_reports, api: reports, strip: admin/reports/v1/, path: gws_api_list/snapshot_2026-10-13/raw/admin.googleapis.com__discovery__rest__version__reports_v1}
    - {id: gws_datatransfer, api: datatransfer, strip: admin/datatransfer/v1/, path: gws_api_list/snapshot_2026-10-13/raw/admin.googleapis.com__discovery__rest__version__datatransfer_v1}
    - {id: gws_alertcenter, api: alertcenter, path: gws_api_list/snapshot_2026-10-13/raw/alertcenter.googleapis.com__discovery__rest__version__v1beta1}
    - {id: gws_cloudidentity, api: cloudidentity, path: gws_api_list/snapshot_2026-10-13/raw/cloudidentity.googleapis.com__discovery__rest__version__v1}
    - {id: gws_gmail, api: gmail, strip: gmail/v1/, path: gws_api_list/snapshot_2026-10-13/raw/gmail.googleapis.com__discovery__rest__version__v1}
    - {id: gws_groupssettings, api: groupssettings, path: gws_api_list/snapshot_2026-10-13/raw/groupssettings.googleapis.com__discovery__rest__version__v1}
    - {id: gws_licensing, api: licensing, strip: apps/licensing/v1/, path: gws_api_list/snapshot_2026-10-13/raw/licensing.googleapis.com__discovery__rest__version__v1}
    - {id: gws_workspaceevents, api: workspaceevents, path: gws_api_list/snapshot_2026-10-13/raw/workspaceevents.googleapis.com__discovery__rest__version__v1}
    - {id: gws_calendar, api: calendar, path: gws_api_list/snapshot_2026-10-13/raw/www.googleapis.com__discovery__v1__apis__calendar__v3__rest}
    - {id: gws_drive, api: drive, path: gws_api_list/snapshot_2026-10-13/raw/www.googleapis.com__discovery__v1__apis__drive__v3__rest}
    - {id: gws_drivelabels, api: drivelabels, path: aegi-dashboard/candidate-extraction/ir2/collect/snapshots/snapshot_2026-10-15/raw/drivelabels.googleapis.com__discovery__rest__version__v2}  # 2026-10-18 수집 범위 보완
    - {id: gws_gmailpostmastertools, api: gmailpostmastertools, path: aegi-dashboard/candidate-extraction/ir2/collect/snapshots/snapshot_2026-10-15/raw/gmailpostmastertools.googleapis.com__discovery__rest__version__v1}  # 2026-10-18 수집 범위 보완
    - {id: gws_vault, api: vault, path: aegi-dashboard/candidate-extraction/ir2/collect/snapshots/snapshot_2026-10-15/raw/www.googleapis.com__discovery__v1__apis__vault__v1__rest}  # 2026-10-18 수집 범위 보완
    - {id: gws_forms, api: forms, path: aegi-dashboard/candidate-extraction/ir2/collect/snapshots/snapshot_2026-10-15/raw/forms.googleapis.com__discovery__rest__version__v1}  # 2026-10-18 수집 범위 보완
    - {id: gws_people, api: people, path: aegi-dashboard/candidate-extraction/ir2/collect/snapshots/snapshot_2026-10-15/raw/www.googleapis.com__discovery__v1__apis__people__v1__rest}  # 2026-10-18 수집 범위 보완
    - {id: gws_chromemanagement, api: chromemanagement, path: aegi-dashboard/candidate-extraction/ir2/collect/snapshots/snapshot_2026-10-15/raw/chromemanagement.googleapis.com__discovery__rest__version__v1}  # 2026-10-18 수집 범위 보완
    - {id: gws_meet, api: meet, path: aegi-dashboard/candidate-extraction/ir2/collect/snapshots/snapshot_2026-10-15/raw/meet.googleapis.com__discovery__rest__version__v2}  # 2026-10-18 수집 범위 보완
    - {id: gws_script, api: script, path: aegi-dashboard/candidate-extraction/ir2/collect/snapshots/snapshot_2026-10-15/raw/www.googleapis.com__discovery__v1__apis__script__v1__rest}  # 2026-10-18 수집 범위 보완
