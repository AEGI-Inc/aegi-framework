# Slack 사전 v0 (2026-10-12)
# ID 공간의 1순위 근거는 Slack 공식 OpenAPI 의 defs_*_id 패턴이다 (normalize_slack.py 가 기계로 읽는다).
# 여기에는 그것으로 안 정해지는 것만 적는다. 줄마다 왜 적었는지 남긴다.

# 플래그 관계(is_admin 등)의 범위로 볼 공간. 판정 단계는 이것을 임시 Tenant 로도 쓴다 (규칙 미정, 2026-10-12)
scope_spaces: [team, enterprise]

# 벤더 자기 호스트. 응답에만 있는 URL 이 이 호스트면 Endpoint 가 아니라 콘텐츠 링크다
vendor_hosts: [slack.com, slack-edge.com, slack-files.com, slack-imgs.com, slackb.com]

# 접두사 집합이 겹치는 정의를 한 공간으로 본다.
# defs_channel 은 "Channel-like conversation ID" 로 C, G, D 를 모두 받는다. Slack 은 셋을 conversations.* 하나로 다루고
# Object_Schema_v4.1 도 object_type channel 하나로 둔다. 그래서 하나로 합친다.
space_merge:
  - {into: channel, members: [channel_id, channel, group_id, dm_id]}

# defs 에 없는 접두사. 공식 문서의 예시 값에서 옮겼다.
extra_prefixes:
  Wf: workflow        # admin.workflows.search 예시 Wf0BUURGTDMM
  Ft: trigger         # workflow trigger_ids 예시
  Fn: function        # admin.functions.list 예시
  Rl: role            # admin.roles.listAssignments 예시 Rl0A
  L: list             # slackLists 예시 (확인 필요)

# 필드 이름 -> 공간. defs 로 안 정해질 때만 쓴다 (예시 값도 없을 때).
field_space:
  team_id: team
  team: team
  user_id: user
  user: user
  users: user
  user_ids: user
  channel_id: channel
  channel: channel
  channel_ids: channel
  channels: channel
  enterprise_id: enterprise
  app_id: app
  bot_id: bot
  file_id: file
  file: file
  usergroup_id: subteam
  usergroup: subteam
  workflow_id: workflow
  role_id: role
  collaborator_ids: user    # admin.workflows.collaborators.add: "encoded user IDs"
  entity_id: "@resolve"     # admin.roles.listAssignments: 채널이나 워크스페이스
  workspace_id: "@resolve"  # T 또는 E
  target_team: team
  creator: user
  owner: user

# 파라미터 이름 -> 공간. 응답 필드에는 안 쓴다 (응답은 예시 값 접두사로 정해진다)
param_space:
  group_id: "@resolve"      # groups.* 에서는 비공개 채널(G), restrictAccess 에서는 IdP 그룹(S). 메서드마다 다르다
  id: "@resolve"            # 파라미터 id 는 메서드마다 대상이 다르다 (calls 의 id 는 통화)

# 감사 로그 entity 종류, action category -> 공간 (다리 B4)
audit_alias:
  workspace: team
  workspace_or_org: team
  enterprise: enterprise
  user: user
  file: file
  channel: channel
  app: app
  workflow: workflow
  workflow_v2: workflow
  workflow_builder: workflow
  usergroup: subteam
  subteam: subteam
  role: role
  function: function

# RPC 이름공간 단어 -> 공간 (동작 이름 토큰을 공간에 대 볼 때)
namespace_token_space:
  member: user              # Events API member_joined_channel 의 member 는 사용자
  users: user
  user: user
  conversations: channel
  channel: channel
  channels: channel
  teams: team
  team: team
  usergroups: subteam
  apps: app
  workflows: workflow
  files: file
  roles: role
  # 공간은 아니지만 이름공간이 다른 대상을 가리킨다 (2026-10-14). 쓰기 짝이 앞 공간으로 거슬러 가지 않게 한다
  canvases: canvas          # conversations.canvases.create 의 title 은 채널 이름이 아니다
  datastore: datastore      # apps.datastore.* 는 앱 설정이 아니라 데이터 저장소 항목을 쓴다
  requestSharedInvite: invite_request

# 구조상 회수할 수 있어 보여도 접근 관계가 아닌 것 (벤더 동작). 판정기가 Assignment 를 붙이지 않는다.
# 근거를 반드시 적는다. 2026-10-12
not_access:
  - ops: [slack.admin.usergroups.addChannels, slack.admin.usergroups.listChannels, slack.admin.usergroups.removeChannels]
    why: "사용자 그룹 기본 채널은 가입할 때 한 번 초대하고 끝나는 기록이다. 그룹에서 빠져도 채널 멤버십은 남는다"
    source: "aegi-schema/docs/Slack_Profiles_v3.md 「prefs.channels 는 접근 관계가 아니다」, 09-28 재시험"

# 수집 등급: 읽기 동작의 scope 로 정한다. admin.* scope 는 조직 관리자 토큰(Enterprise Grid)이 필요하다
collect_tiers:
  - {scope_prefix: "admin", tier: org_admin_token, note: "Slack Admin API. Enterprise Grid 조직 관리자"}
  - {scope_prefix: "auditlogs", tier: org_admin_token, note: "Audit Logs API. Enterprise Grid"}
default_tier: standard_token

# 감사 action 이름 토큰 -> 정보 항목 경로 토큰 (정보 지도 ④, 2026-10-13). 줄마다 이유
action_token_alias:
  renamed: [name]           # channel_renamed, emoji_renamed: 이름이 바뀐다
  username: [name]          # Slack user.name 이 사용자 이름(username)이다 (users.info 응답)
  guest: [user]             # guest_channel_join: 손님도 user 공간이다 (U… ID)
  member: [user]
  usergroup: [subteam]      # audit_alias 와 같다
  workspace: [team]
  private: [is_private]     # public_channel_converted_to_private
  public: [is_private]
  admin: [is_admin]         # role_change_to_admin
  owner: [is_owner]
  # 상태가 뒤집히는 생애 동사 -> 그 상태를 담는 항목
  deactivated: [deleted]    # users.info deleted: 비활성 사용자는 deleted=true
  reactivated: [deleted]
  archive: [is_archived]
  unarchive: [is_archived]
  deleted: [deleted, is_deleted]

# 배열 원소의 자기 키 필드. 배열 이름과 키 이름이 다를 때만 적는다 (정보 지도 I7, 2026-10-14)
record_key_alias:
  organizations: team_id    # team.externalTeams.list: organizations[*] 하나가 외부 조직 하나이고 team_id 가 그 조직의 ID 다

# 조직 설정 변경 action 의 접두사 (정보 지도 ④, 2026-10-14). 143건. Object 후보가 아니라 설정 목록으로 따로 본다
setting_action_prefixes: ["pref."]

# ID 공간 설명 (2026-10-14). 정보 지도 화면과 인계 문서가 쓴다. 판정이 아니라 사람이 읽는 메모다.
# 형식: "설명 | 상태". 상태: 대상 = Object 로 볼 만함, 확인 = 묶음이나 범위를 정해야 함, 의심 = 독립 대상이 아닐 수 있음
space_notes:
  user: "워크스페이스 구성원 계정 (U…, W…). users.info, users.list | 대상"
  channel: "대화방. 공개, 비공개, DM, 그룹 DM 을 conversations.* 하나로 다룬다 (C…, G…, D…) | 대상"
  team: "워크스페이스 (T…). 테넌트 범위이기도 하다 | 대상"
  enterprise: "Enterprise Grid 조직 (E…). 여러 워크스페이스를 묶는 최상위 테넌트 | 대상"
  app: "Slack 앱 (A…). 매니페스트, 승인, 제한 목록의 대상 | 대상"
  bot: "앱이 메시지를 보낼 때 쓰는 봇 (B…). app_id 로 앱에 이어진다 | 대상"
  file: "파일, 캔버스, 리스트 (F…). Slack 은 캔버스와 리스트도 파일 ID 를 쓴다 | 대상"
  subteam: "사용자 그룹 (S…). usergroups.* | 대상"
  workflow: "워크플로 (Wf…). Workflow Builder 와 앱 워크플로 | 대상"
  trigger: "워크플로 트리거 (Ft…). 트리거 권한 목록이 있다 | 대상"
  function: "워크플로 단계로 쓰는 함수 (Fn…). 이벤트 function_executed 에서만 많이 보인다 | 대상"
  role: "관리 역할 (Rl…). 역할 자체를 읽는 API 는 없고 배정 목록과 감사 entity 에만 나온다 | 대상"
  reminder: "리마인더 (Rm…). reminders.* | 대상"
  comment: "파일 댓글 (Fc…). 구형 기능이라 반응과 별표 목록에서 주로 보인다 | 확인"
  session: "사용자 로그인 세션. admin.users.session.list 의 session_id 를 키로 본 공간 | 대상"
  view: "에이전트 대화의 보기 (view_id). 문서 예시 값이 T 접두사라 대기열에 있다 | 의심"
  block: "Block Kit 블록 (block_id). 메시지 안에서만 유일한 키일 수 있다 | 의심"

# v2 (info_map_v2.py): 부모 안에서만 유일한 키. 메시지 ts 는 채널 안에서만 유일하다
local_key_fields: [ts]
