# 스키마 계열 우선 공간 (2026-10-14, extract.py schema_spaces). sObject 정의가 곧 스키마라 대부분 그대로다. 결과 out/salesforce/space_rebuild.json
space_from_schema: true
record_key_fields: [Id]
schema_affixes: []
