# Salesforce 사전 v0 (2026-10-12)
# 자료: Object Reference for the Salesforce Platform (공식 PDF). sObject 의 Supported Calls 를 표준 REST 동작으로 펼친다.


# 권한 필드 묶음을 한 줄로 적은 자리. PDF 는 PermissionSet, Profile 의 수백 개 권한 필드를 이 이름 하나로 적는다 (2026-10-13)
permission_family_fields: [PermissionsPermissionName]

# Tenant 임시 (Organization 객체)
scope_spaces: [organization]

vendor_hosts: [salesforce.com, force.com, my.salesforce.com]

collect_tiers: []
default_tier: standard_token

# EventLogFile 필드 이름 -> 공간 (2026-10-14). 대문자 밑줄 이름이라 꼬리 규칙이 안 맞는다. 공간이 있는 것만
field_space:
  ACTUAL_LOGGED_IN_USER_ID: user
  ARTICLE_ID: knowledgearticle
  ARTICLE_VERSION_ID: knowledgearticleversion
  ASSET_ID: asset
  AUTHENTICATION_SERVICE_ID: authprovider
  BATCH_ID: asyncapexjob
  CONNECTED_APP_ID: connectedapplication
  DASHBOARD_COMPONENT_ID: dashboardcomponent
  DASHBOARD_ID: dashboard
  DASHBOARD_ID_DERIVED: dashboard
  DELEGATED_USER_ID: user
  DELEGATED_USER_ID_DERIVED: user
  DOCUMENT_ID: document
  DOCUMENT_ID_DERIVED: document
  EFFECTIVE_ACCOUNT_ID: account
  GROUP_ID: group
  JOB_ID: asyncapexjob
  KEY_ID: tenantsecret
  KEY_ID_DERIVED: tenantsecret
  MASTER_REPORT_ID: report
  NETWORK_ID: network
  ORGANIZATION_ID: organization
  POLICY_ID: transactionsecuritypolicy
  POLICY_ID_DERIVED: transactionsecuritypolicy
  REPORT_ID: report
  REPORT_ID_DERIVED: report
  SAVED_VIEW_ID: listview
  SITE_ID: site
  USER_ID: user
  USER_ID_DERIVED: user
  VIEWING_USER_ID: user
  WEBSTORE_ID: webstore

# EventLogFile 유형은 범주가 하나(event_log_file)다. 이름의 명사로 공간을 정한다 (info_map.py audit_space_from_name)
audit_space_from_name: true
action_stop_extra: [api, event, apex, lightning, wave, ui, external]

# ID 공간 설명 (2026-10-14). 정보 지도 화면과 인계 문서가 쓴다.
# 형식: "설명 | 상태". 상태: 대상 = Object 로 볼 만함, 확인 = 묶음이나 범위를 정해야 함, 의심 = 독립 대상이 아닐 수 있음
