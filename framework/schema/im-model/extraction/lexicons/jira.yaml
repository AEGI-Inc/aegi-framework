# Jira Cloud 사전 v0 (2026-10-12)

sources:
  openapi:
    - {id: jira_openapi_v3, path: atlassian_api_list/snapshot_2026-10-12/raw/developer.atlassian.com__cloud__jira__platform__swagger-v3.v3.json, strip_prefixes: [/rest/api/3]}
  events:
    - {id: jira_webhooks, path: atlassian_api_list/snapshot_2026-10-12/raw/developer.atlassian.com__cloud__jira__platform__webhooks,
       exclude: [issue_event_type_name, commend_deleted]}   # 이벤트가 아닌 필드 이름, 문서 오타
  # 2026-10-14 추가 (normalize_atlassian.py)
  audit_db:
    - {id: atlassian_audit_db, path: atlassian_api_list/snapshot_2026-10-13/raw/support.atlassian.com__security-and-access-policies__docs__audit-log-activities-database,
       categories: ["Jira user actions", "Jira service management product actions", "Jira service management project actions"],
       name_prefixes: ["Jira "]}        # AI, Anti Abuse 범주의 Jira 활동
  audit_table:
    - {id: jira_audit_categories, path: atlassian_api_list/snapshot_2026-10-13/raw/support.atlassian.com__jira-cloud-administration__docs__audit-activities-in-jira-applications}
  scope_docs:
    - {id: jira_scopes, path: atlassian_api_list/snapshot_2026-10-13/raw/developer.atlassian.com__cloud__jira__platform__scopes-for-oauth-2-3LO-and-forge-apps}
  permission_docs:
    - {id: jira_builtin_permissions, path: atlassian_api_list/snapshot_2026-10-13/raw/developer.atlassian.com__cloud__jira__platform__rest__v3__api-group-permission-schemes,
       how: upper_keys, anchor: built-in-permissions, stop: "Permissions required", kind: project_permission}
    - {id: jira_global_permissions, path: atlassian_api_list/snapshot_2026-10-13/raw/support.atlassian.com__jira-cloud-administration__docs__what-are-global-permissions-and-what-do-they-do,
       how: headings, section: "Types of global permissions", level: h3, kind: global_permission,
       exclude: ["Atlassian Home for Jira Cloud project connection issue glance"]}   # 권한이 아니라 같은 절의 알림 글
  webhook_payload:
    - {id: jira_webhooks_payload, path: atlassian_api_list/snapshot_2026-10-12/raw/developer.atlassian.com__cloud__jira__platform__webhooks,
       events: ["jira:issue_created", "jira:issue_updated", "jira:issue_deleted"]}

# REST 경로 파라미터 이름에서 떼는 꼬리 (공용 사전에 더한다)
param_suffixes: [IdOrKey, KeyOrId, IdOrName]

# 경로 파라미터 이름 -> 공간 (꼬리를 떼도 안 맞는 것만)
param_space:
  accountId: user          # Jira 는 사용자를 accountId 로 가리킨다
  groupname: group
  groupId: group

field_space:
  accountId: user

scope_spaces: []
vendor_hosts: [atlassian.net, atlassian.com, atl-paas.net]

collect_tiers:
  - {scope_prefix: "manage:jira-configuration", tier: admin_token, note: "Jira 관리자"}
  - {scope_prefix: "read:jira-user", tier: standard_token}
default_tier: standard_token

# 받는 쪽 객체의 type 값 목록. 명세에 enum 이 없어 문서 값을 옮긴다 (2026-10-13)
# 근거: developer.atlassian.com Jira REST v3 "Permission schemes" 의 holder type 목록 (PermissionHolder)
# anyone, assignee, reporter, projectLead 처럼 대상이 정해지지 않은 값은 공간이 없어 버려진다
recipient_types:
  holder: [anyone, applicationRole, assignee, group, groupCustomField, projectLead, projectRole, reporter, user, userCustomField]
recipient_type_space:
  projectRole: role
  applicationRole: applicationrole
  groupCustomField: null
  userCustomField: null

# 감사 활동은 범주가 대상이 아니다(「Jira user actions」). 이름의 명사로 공간을 정한다 (2026-10-14, info_map.py audit_space_from_name)
audit_space_from_name: true
action_stop_extra: [jira, work, service, management, a, the, new, for]

# ID 공간 설명 (2026-10-14). 정보 지도 화면과 인계 문서가 쓴다.
# 형식: "설명 | 상태". 상태: 대상 = Object 로 볼 만함, 확인 = 묶음이나 범위를 정해야 함, 의심 = 독립 대상이 아닐 수 있음
