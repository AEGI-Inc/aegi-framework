  project: "Jira 프로젝트 (PK: id, key). 권한, 컴포넌트, 버전, 이슈를 담는 핵심 테넌트/컨테이너 | 대상"
  issue: "Jira 작업 항목/이슈 (PK: id, key). 코어 업무 단위 | 대상"
  user: "Jira 사용자 계정 (accountId). Atlassian 계정 식별자 | 대상"
  group: "사용자 그룹 (groupId, groupname). 권한 부여 및 멤버십 대상 | 대상"
  role: "프로젝트 역할 (projectRole). 프로젝트별 사용자/그룹 역할 배정 | 대상"
  applicationrole: "애플리케이션 역할 (Jira Software, Jira Service Management 등 제품 접근 권한) | 대상"
  permission: "권한 부여 레코드 (grant). 권한 체계 내 개별 권한 항목 | 대상"
  permissionscheme: "권한 체계. 프로젝트에 연결되어 권한 집합을 정의하는 정책 | 대상"
  issuesecurityscheme: "이슈 보안 체계. 보안 수준별 열람 권한 정의 | 대상"
  securitylevel: "이슈 보안 체계 내 개별 보안 수준 | 대상"
  workflow: "이슈 워크플로 정의 (상태 전이 및 규칙) | 대상"
  workflowscheme: "워크플로 체계. 이슈 유형별 워크플로 매핑 | 대상"
  notificationscheme: "이벤트별 알림 수신 체계 | 대상"
  fieldscheme: "필드 구성 체계. 이슈 유형별 필드 레이아웃 설정 | 확인"
  field: "커스텀 및 시스템 필드 메타데이터 | 대상"
  jiraissuefield: "이슈 필드 메타데이터 (field와 중복 여부 확인 필요) | 확인"
  customfieldoption: "커스텀 필드 선택지 옵션 | 확인"
  context: "커스텀 필드 구성 컨텍스트 (프로젝트/이슈유형별 범위) | 확인"
  screen: "이슈 화면 정의 (필드 배치 UI 레이아웃) | 대상"
  tab: "화면 내 탭 레이아웃 | 확인"
  filter: "저장된 검색 필터 (JQL 질의 및 공유 설정) | 대상"
  dashboard: "대시보드. 가젯과 필터 뷰 묶음 | 대상"
  component: "프로젝트 하위 컴포넌트 모듈 | 대상"
  version: "프로젝트 버전 및 릴리스 마일스톤 | 대상"
  issuetype: "이슈 유형 (Bug, Story, Task 등) | 대상"
  status: "이슈 진행 상태 (Open, In Progress, Closed 등) | 대상"
  statuscategory: "상태 상위 범주 (To Do, In Progress, Done) | 확인"
  priority: "이슈 우선순위 정의 | 대상"
  resolution: "이슈 해결 결과 정의 (Done, Won't Do 등) | 대상"
  worklog: "이슈 작업 소요 시간 기록 | 대상"
  comment: "이슈 댓글 | 대상"
