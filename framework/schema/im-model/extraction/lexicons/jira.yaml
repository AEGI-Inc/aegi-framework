  issuelinktype: "이슈 링크 유형 정의 | 대상"
  remotelink: "외부 웹 링크 및 원격 이슈 연결 | 대상"
  task: "비동기 백그라운드 작업 상태 | 확인"
  job: "스케줄 백그라운드 작업 | 확인"
