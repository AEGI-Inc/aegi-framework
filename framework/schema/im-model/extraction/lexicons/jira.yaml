  option: "시스템 설정 옵션 | 의심"


# 스키마 계열 우선 공간 (2026-10-14, extract.py schema_spaces). 결과 out/jira/space_rebuild.json
space_from_schema: true
record_key_fields: [id, key]
# 스키마 이름 접사: 같은 대상의 다른 모양 (IssueBean, UserDetails, JiraWorkflow, UpdatedProjectCategory, AttachmentMetadata)
schema_affixes: [bean, json, details, dto, response, model, get, create, created, update, updated, delete, readable, rest, jira, identifier, identifiers, metadata]
schema_cut_words: [with, for, by]
# 이름으로 안 묶이는 표현 스키마 -> 공간
schema_space:
  IssueTypeIssueCreateMetadata: issuetype
  ProjectIssueCreateMetadata: project
  LinkedIssue: issue
  CreatedIssue: issue
  JiraWorkflowStatus: status
  JiraWorkflowPreviewStatus: status
  UserPickerUser: user
schema_ignore: [IssueError, TaskProgressBeanJsonNode, TaskProgressBeanObject, PropertyKey, UserKey, ProjectTemplateKey]

# 공간 재구성(2026-10-14)으로 permission 이 권한 부여(permissiongrant)와 필터 공유(sharepermission)로 나뉘어 감사 이름 토큰을 잇는다
action_token_alias:
  permission: [permissiongrant]
  permissions: [permissiongrant]
