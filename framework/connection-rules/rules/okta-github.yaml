- id: copilot_okta_mcp
  type: stored_credential
  what: GitHub Copilot(VS Code 에이전트 모드)이 Okta 관리형 MCP 서버(https://<조직>.okta.com/mcp, Early Access) 또는 Okta 오픈소스 MCP 서버를 불러 Okta 관리 작업을 한다. 사용자가 VS Code 의 mcp.json 에 서버를 넣고, Okta 에 만든 OIDC + PKCE 앱의 client ID 를 직접 입력해 로그인한다
