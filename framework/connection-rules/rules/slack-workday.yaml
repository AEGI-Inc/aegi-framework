# slack ↔ workday 연결 규칙
# 벤더 문서로만 썼다 (2026-10-16). 시험 테넌트 결과는 ../test-environment/slack-workday.yaml 에 채운다. Workday 공통 확인 표면은 okta-workday.yaml 머리말
# Slack 워크플로 빌더 커넥터 목록에는 Workday 가 없다 (https://slack.com/help/articles/20155812595219-Slack-connectors-for-Workflow-Builder, 2026-10-16)

pair:
- slack
- workday
written: '2026-10-16'
verified: '2026-10-16'
kind: rules
note: 실제 값은 넣지 않는다. 시험 환경 값은 ../test-environment/slack-workday.yaml
methods:
- id: workday_for_slack
  type: app_grant
  what: Workday 가 게시한 Slack 앱 「Workday」(Workday for Slack, Workday Everywhere) 로 Slack 안에서 Workday 작업(승인, 휴가, 경비, 동료 찾기 등)을 함. 관리자가 Slack 워크스페이스에 앱을 설치하고 Workday 관리자 자격으로 테넌트(운영 tenantname, 샌드박스 tenantname-sb)에 연결한다. 테넌트에 Self-Service Agent 를 먼저 설정해야 한다
  identify:
    api: slack 감사 app_installed (Enterprise), admin.apps.approved.list (Enterprise), team.integrationLogs
    when: 앱 ID ABH43V9RN (Slack Marketplace 주소 기준)
  points_to:
  - tier: config_name
    a: slack 설치 앱 app_id ABH43V9RN
    b: workday (앱 게시자)
    check: a 가 Workday 앱이다. 앱 ID 는 모든 고객에게 같아 어느 테넌트인지는 알려 주지 않는다 (Workday 쪽 연결 기록 화면·API 는 문서에 없음)
    if_unreadable: '사람: Slack 앱 Home 탭 > Switch Dashboard > Admin Dashboard 에서 연결 설정을 본다'
  - tier: config_name
    a: slack 앱 연결에 넣은 테넌트 별칭 (tenantname, tenantname-sb)
    b: workday 테넌트 이름
    check: a 와 b 가 같다
  - tier: via_person
    a: slack 사용자 email
    b: workday Workday Account (앱 사용 때 Workday 로그인)
    check: a 와 b 가 같다
  - tier: log_time
    a: slack 감사 app_installed 시각과 설치자
    b: workday 그 관리자의 로그인 (Get_Workday_Account_Signons)
    check: 시각이 가깝고 사람이 같다
  activity:
  - slack app_installed, app_uninstalled (Workday 전용 감사 액션은 목록에 없다)
  - workday Get_Workday_Account_Signons (Authentication_Type, API_Client_ID)
  sources:
  - https://slack.com/marketplace/ABH43V9RN-workday (앱, 권한 탭은 보기·작업 범주만, 개별 scope 이름 없음) [브라우저]
  - https://marketplace.workday.com/en-US/apps/414159/workday-for-slack/overview (Workday for Slack by Workday, 기능 목록) [브라우저]
  - https://doc.workday.com/admin-guide/en-us/human-capital-management/hcm-innovation-services/workday-everywhere/steps--set-up-workday-everywhere-for-slack-and-mic.html (third-party application 으로 설치, tenantname·tenantname-sb, Workday Admin 자격, Self-Service Agent 선행, Admin Dashboard)
  - https://docs.slack.dev/reference/audit-logs-api/methods-actions-reference (app_installed. Enterprise 전용)
- id: person_link
  type: same_person
  what: 같은 사람 (Slack 계정 ↔ Workday 계정)
  identify:
    api: slack users.list email; workday Get_Workers, Get_Workday_Account
    when: 항상
  points_to:
  - tier: via_person
    a: slack user profile.email
    b: workday 업무 이메일
    check: a 와 b 가 같다
  sources:
  - https://community.workday.com/sites/default/files/file-hosting/productionapi/Human_Resources/v47.0/Get_Workers.html (Email_Address)
  note: 로그 등급 없음. 같은 사람 대조는 두 계정의 속성 비교라 로그에서 잇는 값이 따로 없다
- id: content_ref
  type: content_ref
  what: Slack 메시지의 Workday 링크 (<호스트>.workday.com/<tenant>, myworkday.com)
  identify:
    api: slack 메시지 본문 (수집하면)
    when: 본문에 workday.com 주소
  points_to:
  - tier: config_name
    a: slack 메시지의 workday 주소의 호스트·테넌트
    b: workday 테넌트 주소
    check: a 와 b 가 같다
  sources: ["https://docs.slack.dev/reference/methods/conversations.history (messages[].text)"]
  note: 로그 등급 없음. 본문 속 주소라 연결이 동작한 기록이 없다
