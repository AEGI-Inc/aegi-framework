# Google Workspace 공통 수단 연결 규칙
# 상대 SaaS 를 가리지 않고 GWS 가 밖과 붙는 수단. 4개 SaaS 사이 쌍은 ../rules/<쌍>.yaml 에 있다
# 실제 값은 넣지 않는다. 시험 환경 값은 ../test-environment/gws-external.yaml. 범례는 legend.yaml

anchor: gws
written: '2026-10-04'
verified: '2026-10-14'
kind: rules

methods:
- id: third_party_oauth_app
  type: app_grant
  what: "사용자가 서드파티 앱(또는 Apps Script)에 OAuth 로 자기 Google 데이터 권한을 줌"
  identify: {api: "gws Directory API users/{userKey}/tokens", when: "토큰이 있음"}
  points_to:
  - tier: config_name
    a: "gws tokens.list displayText, clientId, scopes"
    b: "앱 (다른 SaaS 의 앱이면 그 SaaS 쪽 설정이 가리키는 Google 도메인, 연결)"
    check: "a 와 b 가 같다"
    if_unreadable: "최고 관리자 토큰은 위임 관리자로 못 읽음(401). 최고 관리자 권한이나 Google 관리 콘솔 > 보안 > 액세스 및 데이터 제어 > API 제어 > 서드파티 앱 액세스 관리"
  - tier: log_id
    a: "gws token 감사 authorize·activity 의 client_id"
    b: "gws tokens.list 의 clientId (그 앱)"
    check: "a 와 b 가 같다"
  - tier: log_time
    a: "gws token 감사 activity 시각 (app_name, api_name, method_name)"
    b: "그 앱 쪽 요청 기록 시각"
    check: "시각이 같다"
  activity: ["gws token 감사 authorize, activity (app_name, client_id, scope)"]
  sources: ["https://developers.google.com/workspace/admin/directory/reference/rest/v1/tokens (clientId, displayText)", "https://developers.google.com/workspace/admin/reports/v1/appendix/activity/token"]

- id: domain_wide_delegation
  type: stored_credential
  what: "관리자가 서비스 계정이나 OAuth 클라이언트에 도메인 전체 위임을 줌. 위임받은 앱은 모든 사용자의 데이터에 접근한다"
  identify: {api: "gws admin 감사 AUTHORIZE_API_CLIENT_ACCESS (API_CLIENT_NAME, API_SCOPES)", when: "이벤트가 있음"}
  points_to:
  - tier: config_id
    a: "gws 위임 클라이언트 ID"
    b: "Google Cloud 서비스 계정 client ID (키를 가진 시스템 쪽)"
    check: "a 와 b 가 같다"
    if_unreadable: "위임 목록 조회 API 는 확인 못 함. Google 관리 콘솔 > 보안 > 액세스 및 데이터 제어 > API 제어 > 도메인 전체 위임 관리 (최고 관리자)"
  - tier: log_id
    a: "gws token 감사 activity 의 client_id (app_name 이 숫자 client ID)"
    b: "gws AUTHORIZE_API_CLIENT_ACCESS 의 API_CLIENT_NAME (위임한 client ID)"
    check: "a 와 b 가 같다"
  activity: ["gws admin 감사 AUTHORIZE_API_CLIENT_ACCESS", "gws token 감사 activity (app_name 이 숫자 client ID)"]
  sources: ["https://knowledge.workspace.google.com/admin/apps/control-api-access-with-domain-wide-delegation (support.google.com/a/answer/162106 에서 이동. 최고 관리자, 서비스 계정 client ID)", "https://developers.google.com/workspace/admin/reports/v1/appendix/activity/admin-domain-settings (AUTHORIZE_API_CLIENT_ACCESS, REMOVE_API_CLIENT_ACCESS: API_CLIENT_NAME, API_SCOPES, DOMAIN_NAME)", "https://developers.google.com/workspace/admin/reports/v1/appendix/activity/token (authorize·activity: app_name, client_id, client_type, scope, product_bucket)"]

- id: apps_script_web_app
  type: event_delivery
  what: "Apps Script 를 웹앱으로 배포해 밖에서 URL 로 부름"
  identify: {api: "Apps Script API projects.deployments (entryPoints[].webApp)", when: "entryPointType WEB_APP"}
  points_to:
  - tier: config_id
    a: "gws 배포 webApp.url (script.google.com/a/macros/<도메인>/s/<배포 ID>/exec)"
    b: "그 URL 을 부르는 밖의 설정 (다른 SaaS 의 웹훅 주소 등)"
    check: "a 와 b 가 같다"
  - tier: config_name
    a: "gws 배포 entryPointConfig.access (MYSELF, DOMAIN, ANYONE 등), executeAs (USER_DEPLOYING, USER_ACCESSING)"
    b: "누가 부를 수 있는가"
    check: "범위 판단"
  - tier: log_time
    a: "밖의 설정이 그 URL 을 부른 기록 시각"
    b: "gws Apps Script 실행 기록 (processType WEBAPP, functionName doGet·doPost) startTime"
    check: "시각이 같다"
  activity: ["gws Apps Script 실행 기록 processType WEBAPP"]
  sources: ["https://developers.google.com/apps-script/api/reference/rest/v1/projects.deployments [Exa]", "https://developers.google.com/apps-script/api/reference/rest/v1/processes (projectName, functionName, processType, startTime)", "https://developers.google.com/apps-script/guides/web (doGet, doPost)"]

- id: apps_script_outbound
  type: [stored_credential, event_delivery]
  what: "Apps Script 가 UrlFetchApp 으로 밖을 부름 (script.external_request 범위)"
  identify: {api: "gws tokens.list scopes 에 script.external_request, Apps Script projects.getContent", when: "범위가 있음"}
  points_to:
  - tier: config_name
    a: "Apps Script 코드의 호출 주소, 스크립트 속성의 주소"
    b: "밖의 서비스"
    check: "a 와 b 가 같다"
    if_unreadable: "스크립트 속성은 API 로 못 읽음. 소유자, 편집자가 편집기 > 프로젝트 설정 > 스크립트 속성에서 본다"
  - tier: log_time
    a: "gws Apps Script 실행 기록 startTime, functionName"
    b: "밖의 서비스 요청 기록 시각"
    check: "시각이 같다"
  activity:
  - gws Apps Script 실행 기록 (processes.list)
  sources: ["https://developers.google.com/apps-script/reference/url-fetch/url-fetch-app [Exa]", "https://developers.google.com/apps-script/api/reference/rest/v1/processes (projectName, functionName, processType, startTime)"]

- id: gmail_forwarding
  type: event_delivery
  what: "Gmail 자동 전달로 밖의 주소에 메일을 보냄"
  identify: {api: "Gmail API users.settings.getAutoForwarding, users.settings.forwardingAddresses.list", when: "enabled"}
  points_to:
  - {tier: config_name, a: "gmail autoForwarding.emailAddress, forwardingAddresses.forwardingEmail (verificationStatus)", b: "받는 주소", check: "a 와 b 가 같다"}
  - {tier: log_id, a: "gws login 감사 email_forwarding_out_of_domain 의 전달 주소 (메시지 형식의 email_forwarding_destination_address. 매개변수 표에는 없다)", b: "받는 주소", check: "a 와 b 가 같다"}
  activity: ["gws login 감사 email_forwarding_out_of_domain (email_forwarding_destination_address)"]
  sources: ["https://developers.google.com/workspace/gmail/api/reference/rest/v1/users.settings.forwardingAddresses (forwardingEmail, verificationStatus)", "https://developers.google.com/workspace/gmail/api/reference/rest/v1/AutoForwarding (enabled, emailAddress, disposition)", "https://developers.google.com/workspace/admin/reports/v1/appendix/activity/login (login_success: login_type saml·google_password 등)"]

- id: drive_external_share
  type: content_ref
  what: "Drive 파일을 도메인 밖 사용자, 도메인, 누구나에게 공유"
  identify: {api: "Drive API files.permissions.list", when: "type user, group, domain 의 주소가 도메인 밖이거나 type anyone"}
  points_to:
  - {tier: config_name, a: "drive permission emailAddress, domain, type", b: "밖의 계정, 도메인", check: "a 와 b 가 같다"}
  - {tier: log_id, a: "gws drive 감사 change_user_access 의 doc_id, target_user", b: "drive 파일 id, 밖의 계정·도메인", check: "a 와 b 가 같다"}
  activity: ["gws drive 감사 change_user_access, change_document_visibility, change_document_access_scope, change_acl_editors (파라미터 target_user, visibility) (https://developers.google.com/admin-sdk/reports/v1/appendix/activity/drive, 2026-10-05 원문 확인)"]
  sources:
  - 'https://developers.google.com/workspace/drive/api/reference/rest/v3/permissions (type user·group·domain·anyone, emailAddress, domain, role)'
  - 'https://developers.google.com/admin-sdk/reports/v1/appendix/activity/drive (change_user_access, change_document_visibility 등)'

- id: inbound_sso
  type: identity
  what: "밖의 IdP 가 GWS 로그인을 맡음 (SAML, OIDC SSO 프로필)"
  identify: {api: "Cloud Identity inboundSamlSsoProfiles, inboundOidcSsoProfiles, inboundSsoAssignments", when: "프로필이 있음"}
  points_to:
  - {tier: config_id, a: "gws idpConfig.entityId, issuerUri", b: "IdP 쪽 엔티티 ID", check: "a 와 b 가 같다", if_unreadable: "위임 범위 https://www.googleapis.com/auth/cloud-identity.inboundsso.readonly 와 서비스 계정 프로젝트의 Cloud Identity API 사용 설정 (2026-10-05 위임은 받아들여졌고 API 를 안 켜서 403 「Cloud Identity API has not been used」). 사람: 관리 콘솔 보안 > 인증 > 서드 파티 IdP를 사용한 SSO"}
  - {tier: log_time, a: "IdP 쪽 로그인 기록 시각과 사용자", b: "gws login 감사 login_success (login_type saml) 시각과 actor.email", check: "시각이 가깝고 사람이 같다. 로그인 감사에는 어느 SSO 프로필을 거쳤는지가 없다"}
  activity: ["gws login 감사 login_type saml"]
  sources: ["https://docs.cloud.google.com/identity/docs/reference/rest/v1/inboundSamlSsoProfiles [Exa]", "https://developers.google.com/workspace/admin/reports/v1/appendix/activity/login (login_success: login_type saml·google_password 등)"]

- id: google_as_idp
  type: identity
  what: "GWS 가 SAML IdP 가 되어 밖의 앱 로그인을 맡음 (관리 콘솔 웹 및 모바일 앱)"
  identify: {api: "gws Reports applicationName=saml", when: "login_success 가 있음"}
  points_to:
  - {tier: config_name, a: "gws saml 감사 application_name (SP 앱 이름)", b: "밖의 앱", check: "a 와 b 가 같다", if_unreadable: "SAML 앱 목록 API 확인 못 함. 관리 콘솔 > 앱 > 웹 및 모바일 앱"}
  - {tier: log_time, a: "gws saml login_success 시각, actor.email, application_name", b: "밖의 앱 로그인 기록 시각과 사용자", check: "시각이 가깝고 사람이 같다"}
  activity: ["gws saml login_success, login_failure (application_name, initiated_by)"]
  sources: ["https://developers.google.com/workspace/admin/reports/v1/appendix/activity/saml [Exa]", "https://developers.google.com/workspace/admin/reports/reference/rest/v1/activities (actor.email, id.time, events)"]

- id: marketplace_app
  type: app_grant
  what: "관리자가 Marketplace 앱을 도메인에 설치"
  identify: {api: "gws admin 감사 ADD_APPLICATION, ADD_APPLICATION_TO_WHITELIST (APP_ID, APPLICATION_NAME)", when: "이벤트가 있음"}
  points_to:
  - {tier: config_name, a: "gws APPLICATION_NAME, APP_ID", b: "앱 업체", check: "a 와 b 가 같다"}
  - {tier: log_id, a: "gws admin 감사 ADD_APPLICATION·ADD_APPLICATION_TO_WHITELIST 의 APP_ID", b: "앱 업체의 Marketplace 등록 앱 ID (Marketplace 앱 주소 끝 숫자)", check: "a 와 b 가 같다"}
  - {tier: log_time, a: "gws ADD_APPLICATION 시각", b: "gws token 감사 authorize 시각 (app_name 이 그 앱)", check: "시각이 가깝다. Marketplace APP_ID 와 OAuth client_id 를 잇는 값은 문서에 없다"}
  activity: ["gws admin 감사 ADD_APPLICATION, ADD_APPLICATION_TO_WHITELIST (APP_ID, APPLICATION_NAME)", "gws token 감사 authorize"]
  sources: ["https://developers.google.com/workspace/admin/reports/v1/appendix/activity/admin-domain-settings [Exa]", "https://developers.google.com/workspace/admin/reports/v1/appendix/activity/token (authorize·activity: app_name, client_id, client_type, scope, product_bucket)"]
- id: workspace_studio_webhook_step
  type: event_delivery
  what: Google Workspace Studio 흐름의 「Send a webhook」 단계가 고정 URL 로 HTTP 요청(GET, POST, PUT, PATCH, DELETE)을 보낸다. 흐름 소유자가 단계를 추가하고 흐름을 켠다. URL 칸에는 변수를 쓸 수 없다. 관리자가 Webhook 설정을 따로 켜야 하며 기본은 꺼짐이다. URL 허용 목록은 Business Plus 와 Enterprise Standard·Plus, Education Standard·Plus 에서 쓸 수 있다고 릴리스 글이 쓴다.
  identify:
    api: gws 관리 콘솔 Apps > Google Workspace > Workspace Studio > Webhook settings (화면). Studio 흐름 편집기의 Send a webhook 단계 (화면). Reports API applicationName=workspace_studio 의 Start step, End step 이벤트 (Step app 값에 webhook 이 찍히는지는 문서에 없음)
    when: 흐름에 Send a webhook 단계가 있고, 그 단계를 포함한 실행(run)이 일어남
  points_to:
  - tier: config_name
    a: gws 관리 콘솔 Webhook 허용 목록의 호스트 (허용 목록이 있는 에디션에서만 있음. 화면)
    b: 흐름의 Send a webhook 단계 URL 호스트 (흐름 편집기 화면. 흐름을 읽는 API 는 문서에 없음)
    check: 호스트가 같다
    if_unreadable: URL 은 흐름 편집기 화면에서 본다. 허용 목록이 없는 에디션은 이 tier 를 쓸 수 없다
  - tier: log_time
    a: gws Reports workspace_studio 의 Start step, End step 이벤트 시각과 Actor (흐름 소유자 이메일)
    b: 받는 외부 서비스의 요청 로그 시각 (서비스마다 다르고 문서에 없음)
    check: 시각이 가깝다. 사람은 흐름 소유자 기준
  activity:
  - gws Reports workspace_studio 의 Start step, End step (Event 값, 문서 원문 이름)
  - gws Reports workspace_studio 의 Block step (관리자 정책이 단계를 막은 기록)
  - 흐름 Activity 탭의 webhook 응답 기록 (Reports 가 아니라 흐름 화면)
  sources:
  - https://support.google.com/workspace-studio/answer/16521900 (Send a webhook 단계, URL 정적, 변수 불가, 헤더·인증 칸 없음, Activity 탭, 관리자 설정 언급 없음) [WebFetch] [Exa]
  - https://workspaceupdates.googleblog.com/2026/09/automate-workflows-with-custom-starters-and-steps-third-party-integrations-and-webhooks-in-Workspace-Studio.html (Webhook settings 관리 콘솔 위치, 기본 꺼짐, URL 허용 목록, Sensitive Steps 승인, 에디션) [Exa]
  - https://knowledge.workspace.google.com/admin/reports/workspace-studio-log-events (Event 값 Start step, End step, Block step, Actor 는 흐름 소유자, Step app 속성) [Exa]
  note: '문서에 없음: webhook 호출 전용 Reports 이벤트와 Step app 값 webhook, 인증 헤더 입력 칸, 관리자 Webhook 설정 화면의 Help 원문(릴리스 글만 확인, 링크로 가리킨 「allow or block send a webhook」 페이지는 미열람), 받는 쪽 서비스의 로그. 기존 실측 기록(gws-salesforce workspace_studio_salesforce note)에는 Studio 로그에 연동 연결과 웹훅 호출 이벤트가 없고 Step app 속성만 있다고 되어 있다. 이 기록과 문서가 맞는다. 기존 gws-external apps_script_outbound 와 구조는 비슷하지만 실행기가 다르므로 새로 둔다. 기존 workspace_studio_salesforce 는 Salesforce Connector 단계라 다르다.'
- id: gws_workspace_mcp_external_clients
  type:
  - app_grant
  - stored_credential
  what: 'Claude.ai·Claude Desktop 같은 MCP 클라이언트가 Google Workspace 원격 MCP 서버(제품마다 하나, googleapis.com 아래 mcp/v1 경로: Gmail, Drive, Docs, Sheets, Slides, Calendar, Chat, People, Classroom)에 붙는다. Developer Preview Program 가입이 필요하고 Google Cloud 의 OAuth 2.0 클라이언트에 「Use this client for an AI-powered agent」를 켜야 한다. 서비스 계정(domain-wide delegation)과 Apps Script 기본 클라이언트는 이 설정을 못 쓴다. Claude.ai 쪽은 유료 Claude 플랜의 사용자 지정 커넥터를 쓴다'
  identify:
    api: gws Google Cloud 콘솔의 OAuth 클라이언트 설정, gws 관리 콘솔 감사 > OAuth 로그 이벤트(Reports API token 활동)
    when: OAuth 클라이언트에 「Use this client for an AI-powered agent」가 켜져 있고 mcp.googleapis.com 계열 호출이 있음
  points_to:
  - tier: config_id
    a: gws Google Cloud OAuth 클라이언트 ID
    b: MCP 클라이언트(Claude 커넥터)에 넣은 client ID
    check: a 와 b 가 같다
    if_unreadable: client secret 은 비밀이라 못 읽는다
  - tier: config_name
    a: gws OAuth 클라이언트의 승인된 리디렉션 URI
    b: 'MCP 클라이언트의 콜백 주소 (Claude: https://claude.ai/api/mcp/auth_callback)'
    check: a 에 b 가 있다
  - tier: via_person
    a: gws OAuth 동의를 한 Google 계정
    b: MCP 클라이언트의 로그인 사용자
    check: 같은 사람
  - tier: log_time
    a: gws Reports API token 활동의 시각, 앱 이름, 사용자
    b: 클라이언트 쪽 호출 기록 위치는 문서에 없다
    check: 시각이 가깝다. 짝 확인 방법은 문서에 없다
  activity:
  - gws Reports API token 활동 (MCP 호출로 확인한 이벤트 이름은 문서에 없다)
  sources:
  - https://developers.google.com/workspace/guides/configure-mcp-servers (서버 종류, Claude.ai·Claude Desktop 설정 절, Developer Preview, OAuth 클라이언트 설정과 서비스 계정 제한)
  - https://workspaceupdates.googleblog.com/2026/05/agent-tools-and-security-updates-for-workspace-developers.html (2026-05-01 점진 롤아웃. 조사 에이전트 요약, 직접 미확인)
  note: Agentforce 가 같은 서버를 부르는 경우는 gws-salesforce:agentforce_registry_google_workspace_mcp 이고 이 방법은 서드파티 AI 클라이언트다. 리디렉션 URI 는 조사 에이전트가 문서에서 읽은 값이고 직접 대조하지 않았다. 필요 에디션과 MCP 가격은 문서에 없다. 실측 없음
