# github ↔ slack 연결 규칙
# 연동 방법마다 「a 와 b 가 같아야 이어진 것」을 적는다. 읽는 법은 legend.yaml, ../README.md

pair:
- github
- slack
written: '2026-10-04'
verified: '2026-10-14'
kind: rules
note: 실제 값은 넣지 않는다. 시험 환경 값은 ../test-environment/github-slack.yaml
methods:
- id: github_app_for_slack
  type:
  - app_grant
  - event_delivery
  - same_person
  what: GitHub 공식 Slack 앱. GitHub 조직에 GitHub App 으로 설치되고 Slack 에 Slack 앱으로 설치되어, /github subscribe 로 이벤트를 채널에 보냄. /github signin 으로 사람을 묶음
  identify:
    api: github GET /orgs/{org}/installations
    when: app_slug == slack
  points_to:
  - tier: config_name
    a: github installation app_slug slack, target 조직
    b: slack 설치 앱 (GitHub 앱이 승인 앱 목록이나 봇에 있음)
    check: a 와 b 가 같다
    if_unreadable: 'slack admin.apps.approved.list (Enterprise, admin.apps:read). 사람: Slack 관리 > 앱 관리'
  - tier: config_name
    a: github GET /orgs/{org}/credential-authorizations application_name = Slack
    b: slack 쪽 사용자 (누가 승인했는지는 GitHub login 만)
    check: a 와 b 가 같다
  - tier: config_id
    a: Slack 쪽 구독 채널, 워크스페이스 ID
    b: GitHub 앱 내부 구독. 벤더가 조회 API 를 공개하지 않는다
    check: a 와 b 가 같다
    if_unreadable: Slack 채널에서 /github subscribe list 로 구독을 본다 (명령 이름은 README 기준)
  - tier: log_id
    a: github integration_installation.create 의 integration (slack)
    b: github installation app_slug
    check: a 와 b 가 같다
  - tier: log_time
    a: github integration_installation.create 시각
    b: slack 감사 app_installed 시각 (entity.app.name GitHub)
    check: 시각이 가깝다
  activity:
  - github integration_installation.create, org_credential_authorization.grant
  - slack app_installed (앱 이름 GitHub)
  sources:
  - https://github.com/integrations/slack [Exa] (설치 후 Slack 과 GitHub 사용자 계정이 묶임, /github signin, /github subscribe)
  - 'GET /orgs/{org}/installations 의 app_slug: 우리 수집 원본 응답(수집 호출 GH-14)으로 확인'
  - 'GitHub 감사 이벤트 이름: https://docs.github.com/en/enterprise-cloud@latest/admin/monitoring-activity-in-your-enterprise/reviewing-audit-logs-for-your-enterprise/audit-log-events-for-your-enterprise'
  - https://docs.github.com/en/organizations/keeping-your-organization-secure/managing-security-settings-for-your-organization/audit-log-events-for-your-organization
  - "https://github.com/slackapi/python-slack-sdk/blob/main/slack_sdk/audit_logs/v1/logs.py (Slack 공식 SDK 의 감사 로그 모델: entity.app.id·name·scopes, entity.workflow_v2.app_id·step_configuration, details.app_id·bot_id·installer_user_id·is_internal_integration·idp_config_id·idp_entity_id_hash)"
- id: slack_enterprise_search
  type: app_grant
  what: Slack 엔터프라이즈 검색이 GitHub 저장소를 읽음 (GitHub App slack-enterprise-search-for-github)
  identify:
    api: github GET /orgs/{org}/installations
    when: app_slug == slack-enterprise-search-for-github
  points_to:
  - tier: config_name
    a: github installation, credential-authorizations application_name = Slack enterprise search for GitHub
    b: slack 조직 (검색 설정은 API 로 확인 못 함)
    check: a 와 b 가 같다
  - tier: config_name
    a: slack 엔터프라이즈 검색 GitHub 데이터 소스의 Manage integrations 에 넣은 GitHub 조직 이름 (화면, Org Owner·Admin)
    b: github:organization:login (Slack enterprise search for GitHub 앱을 설치한 조직)
    check: a 와 b 가 같다
  - tier: log_id
    a: github integration_installation.create 의 integration
    b: slack-enterprise-search-for-github (GitHub App slug)
    check: a 와 b 가 같다
  - tier: log_time
    a: github integration_installation.create 시각
    b: slack 감사 enterprise_search_connectors_changed·enterprise_search_connectors_config_changed 시각
    check: 시각이 가깝다
  activity:
  - github integration_installation.create, org_credential_authorization.grant
  - slack 감사 enterprise_search_connectors_changed, enterprise_search_connectors_config_changed
  sources:
  - 'https://slack.com/help/articles/39044407124755-Set-up-and-manage-Slack-enterprise-search (GitHub 조직 이름 입력, Slack enterprise search for GitHub 앱 설치, Enterprise+, Org Owner·Admin)'
  - 'https://docs.github.com/en/rest/orgs/orgs (GET /orgs/{org}/installations, app_slug)'
  - 'https://docs.github.com/en/organizations/keeping-your-organization-secure/managing-security-settings-for-your-organization/audit-log-events-for-your-organization (hook.create, integration_installation.create, org_credential_authorization.grant)'
  - https://docs.slack.dev/reference/audit-logs-api/methods-actions-reference (enterprise_search_connectors_changed, enterprise_search_connectors_config_changed)
- id: github_webhook_to_slack
  type: event_delivery
  what: GitHub 웹훅이 Slack 수신 웹훅 주소로 직접 보냄
  identify:
    api: github GET /orgs/{org}/hooks, GET /repos/{o}/{r}/hooks
    when: config.url 호스트가 hooks.slack.com
  points_to:
  - tier: fingerprint
    a: github webhook config.url sha256
    b: slack:incoming-webhook:webhook_url_sha256
    check: a 의 sha256 과 b 가 같다
  - tier: log_id
    a: slack 메시지 bot_id
    b: slack 수신 웹훅 configuration_url 끝의 B…
    check: a 와 b 가 같다
  - tier: log_time
    a: github 배달 기록 delivered_at
    b: slack 그 봇 메시지 ts
    check: 시각이 같다
  activity:
  - github hook.create
  - slack 메시지 (bot_id)
  sources:
  - https://docs.github.com/en/rest/orgs/webhooks#list-organization-webhooks [Exa] (config.url)
  - https://docs.github.com/en/webhooks/webhook-events-and-payloads (배달 헤더 X-GitHub-Hook-ID, X-GitHub-Delivery, X-GitHub-Hook-Installation-Target-ID)
- id: actions_to_slack
  type:
  - stored_credential
  - event_delivery
  what: GitHub Actions 워크플로가 비밀에 넣은 Slack 웹훅이나 토큰으로 Slack 에 게시
  identify:
    api: github GET /orgs/{org}/actions/secrets, GET /repos/{o}/{r}/actions/secrets
    when: 비밀 이름에 SLACK
  points_to:
  - tier: config_name
    a: github 비밀 이름 (값은 볼 수 없음)
    b: slack (어느 웹훅인지 알 수 없음)
    check: a 와 b 가 같다
  - tier: log_time
    a: github workflows.completed_workflow_run 의 started_at·completed_at
    b: slack 메시지 ts (bot_id)
    check: 시각이 실행 구간 안이다
  activity:
  - github 워크플로 실행
  - slack 메시지 (bot_id)와 시각
  sources:
  - https://docs.github.com/en/rest/actions/secrets#list-organization-secrets [Exa] (값 없이 name, created_at, updated_at, visibility 만)
  - https://docs.github.com/en/organizations/keeping-your-organization-secure/managing-security-settings-for-your-organization/audit-log-events-for-your-organization
- id: slack_workflow_connector_github
  type: app_grant
  what: Slack 워크플로 빌더의 GitHub 커넥터 단계. Slack 워크플로가 GitHub 에 동작을 함
  identify:
    api: slack admin.workflows.search (사용자 토큰, admin.workflows:read) 의 steps·app_id 로 워크플로가 쓰는 커넥터, 커넥터 승인은 감사 external_auth_oauth2_token_* (https://docs.slack.dev/reference/methods/admin.workflows.search, https://docs.slack.dev/reference/audit-logs-api/methods-actions-reference, 2026-10-05 문서 확인)
    when: 워크플로 단계에 GitHub 커넥터
  points_to:
  - tier: config_name
    a: github 조직 credential-authorizations application_name (Slack 워크플로 빌더 GitHub 커넥터가 쓰는 OAuth 앱 이름은 벤더 문서에 없다. 실제로 커넥터를 승인해 보고 승인 목록에서 읽는다)
    b: slack 워크플로 빌더
    check: a 와 b 가 같다
    if_unreadable: Slack 워크플로 빌더 화면의 단계 목록. 워크플로 조회 API 는 admin.workflows.search 뿐
  - tier: log_id
    a: slack 감사 workflow_published 의 entity.workflow_v2.step_configuration[].step_function_app_id
    b: Slack 워크플로 빌더 GitHub 커넥터 앱 ID (값은 문서에 없어 커넥터를 넣어 보고 읽는다)
    check: a 와 b 가 같다
  - tier: log_time
    a: slack external_auth_oauth2_token_fetched 시각과 actor
    b: github 사용자 보안 로그 oauth_authorization.create 시각과 사용자
    check: 시각이 가깝고 사람이 같다
  activity:
  - slack 감사 workflow_created, workflow_published, workflow_v2_published, workflow_unpublished, workflow_deleted, workflow_trigger_permission_added·removed·set, 커넥터 토큰 external_auth_oauth2_token_fetched·refreshed·deleted (https://docs.slack.dev/reference/audit-logs-api/methods-actions-reference, 2026-10-05 문서 확인)
  sources:
  - https://slack.com/help/articles/20155812595219-Slack-connectors-for-Workflow-Builder [Exa 검색 요약] (커넥터 목록에 GitHub, GitHub Enterprise Server)
  - "https://github.com/slackapi/python-slack-sdk/blob/main/slack_sdk/audit_logs/v1/logs.py (Slack 공식 SDK 의 감사 로그 모델: entity.app.id·name·scopes, entity.workflow_v2.app_id·step_configuration, details.app_id·bot_id·installer_user_id·is_internal_integration·idp_config_id·idp_entity_id_hash)"
  - https://docs.github.com/en/authentication/keeping-your-account-and-data-secure/security-log-events
  - https://docs.slack.dev/reference/audit-logs-api/methods-actions-reference
- id: slash_command_via_server
  type: external_relay
  what: Slack 슬래시 명령이 외부 서버로 가고, 서버가 GitHub 토큰으로 저장소에 커밋. GitHub 웹훅도 같은 서버로 감
  identify:
    api: slack apps.manifest.export (SL-10), github GET /orgs/{org}/hooks
    when: slash_commands url 호스트 == github webhook config.url 호스트
  points_to:
  - tier: config_name
    a: slack manifest slash_commands[].url 호스트
    b: 외부 서버
    check: a 와 b 가 같다
  - tier: config_name
    a: github webhook config.url 호스트
    b: 같은 외부 서버
    check: a 와 b 가 같다
  - tier: log_id
    a: 외부 서버 요청 기록의 커밋 SHA
    b: github:commit:sha
    check: a 와 b 가 같다
  activity:
  - 외부 서버 요청 기록 (Worker SL-12), 웹훅 수신 기록 (Worker GH-18)
  - github push
  - slack 봇 메시지
  sources:
  - 'https://docs.slack.dev/interactivity/implementing-slash-commands (Slack 이 지정한 Request URL 로 HTTP POST)'
  - 'https://docs.slack.dev/reference/methods/apps.manifest.export.md (매니페스트 내보내기, 앱 설정 토큰)'
  - 'https://docs.github.com/en/rest/orgs/webhooks#list-organization-webhooks (config.url)'
- id: person_link
  type: same_person
  what: 같은 사람의 GitHub 계정과 Slack 계정
  points_to:
  - tier: via_person
    a: github 커밋 author.email
    b: slack:user:email
    check: a 와 b 가 같다
  - tier: via_person
    a: github SAML nameId → okta login → slack email (두 단계)
    b: slack:user:email
    check: a 와 b 가 같다
  - tier: config_id
    a: GitHub Slack 앱의 /github signin 매핑 (API 로 안 보임)
    b: slack:user:id
    check: a 와 b 가 같다
    if_unreadable: API 로 안 보임. Slack 채널에서 /github subscribe list 로 구독을 본다 (명령 이름은 README 기준)
  identify:
    api: github 커밋 author.email, GraphQL externalIdentities; slack users.list email
    when: 항상
  sources:
  - https://docs.github.com/en/rest/commits/commits (commit.author.email)
  - https://raw.githubusercontent.com/octokit/graphql-schema/main/schema.graphql (externalIdentities.samlIdentity.nameId, organizationVerifiedDomainEmails)
  - https://docs.slack.dev/reference/methods/users.list (profile.email)
  note: 로그 등급 없음. 같은 사람 대조는 두 계정의 속성 비교라 로그에서 잇는 값이 따로 없다
- id: content_ref
  type: content_ref
  what: Slack 메시지 속 GitHub 주소, 링크 펼침
  points_to:
  - tier: config_name
    a: slack 메시지 본문의 github.com 주소
    b: github 저장소, 이슈, PR
    check: a 와 b 가 같다
    if_unreadable: 수집기는 본문을 지문만 남긴다. conversations.history 의 text 를 수집하거나 사람이 채널에서 본다
  note: 수집기는 메시지 본문을 지문만 남겨 주소를 볼 수 없다 (SL-05) 로그 등급 없음. 본문 속 주소라 연결이 동작한 기록이 없다
  if_unreadable: 수집기는 본문을 지문만 남긴다. conversations.history 의 text 를 수집하거나 사람이 채널에서 본다
  identify:
    api: slack conversations.history text (수집하면)
    when: 본문에 github.com 주소
# ── 2026-10-05 연동 조합 표(../연동 조합 표.md)로 더함
  sources:
  - https://docs.slack.dev/reference/methods/conversations.history (messages[].text)
- id: github_webhook_to_slack_workflow
  type: event_delivery
  what: GitHub 웹훅이 Slack 워크플로 빌더의 웹훅 트리거 주소(hooks.slack.com/triggers/…)로 보내 Slack 워크플로를 시작
  identify:
    api: github GET /orgs/{org}/hooks, /repos/{o}/{r}/hooks
    when: config.url 호스트가 hooks.slack.com 이고 Slack 수신 웹훅 지문과 맞지 않음 (경로 /triggers/ 는 지문만 남아 직접 못 봄)
  points_to:
  - tier: fingerprint
    a: github webhook config.url sha256
    b: slack 워크플로 웹훅 트리거 주소의 sha256
    check: a 와 b 가 같다
    if_unreadable: "Slack 워크플로 웹훅 트리거 주소를 주는 API 는 없다 — admin.workflows.search 는 trigger_ids, trigger_types 만 주고 주소는 주지 않는다 (https://docs.slack.dev/reference/methods/admin.workflows.search, 2026-10-05 문서 확인). 사람: Slack 워크플로 빌더에서 트리거 주소를 보고 sha256 비교"
  - tier: log_time
    a: github 웹훅 배달 시각 (hook deliveries)
    b: slack 워크플로 실행, 그 워크플로가 올린 메시지 시각
    check: 시각이 같다
  activity:
  - github hook deliveries
  - slack 워크플로 메시지
  sources:
  - https://slack.com/help/articles/360041352714 (웹훅으로 시작하는 워크플로, 주소 hooks.slack.com/triggers, 유료 플랜, 초당 1건)
- id: copilot_cloud_agent_in_slack
  type: app_grant
  what: Slack 의 GitHub 앱 안에서 @GitHub 을 불러 Copilot 클라우드 에이전트에 작업을 시킨다. 앱 설치와 계정 연결은 github_app_for_slack 과 같고, 조직의 Copilot 클라우드 에이전트 정책과 sandbox 가 켜져 있어야 한다. 스레드 전체가 요청 맥락으로 쓰인다. 공개 미리보기
  identify:
    api: github GET /orgs/{org}/installations (app_slug), github 조직 Copilot 정책 (화면); slack 설치 앱 목록, @GitHub settings (화면)
    when: github 조직에 Slack GitHub 앱이 설치되어 있고 조직의 Copilot cloud agent 정책이 켜져 있음
  points_to:
  - tier: config_name
    a: github 조직에 설치된 Slack GitHub 앱의 접근 저장소
    b: slack 채널의 기본 저장소 (@GitHub settings)
    check: a 와 b 가 같다
    if_unreadable: API 가 없다. Slack 에서 @GitHub settings, @GitHub help (화면)
  - tier: via_person
    a: slack 사용자
    b: github 로그인 (@GitHub 을 처음 부를 때 연결)
    check: 같은 사람
  - tier: log_time
    a: slack 감사 app_installed (GitHub 앱 설치) 시각
    b: github 감사 integration_installation.create 시각
    check: 시각이 가깝다
  activity:
  - github 조직 감사 copilot.swe_agent_repo_enablement_updated, copilot.swe_agent_repo_enabled, copilot.swe_agent_repo_disabled, integration_installation.create
  - slack 감사 app_installed, app_scopes_expanded
  sources:
  - https://docs.github.com/en/enterprise-cloud@latest/copilot/how-tos/use-copilot-agents/coding-agent/integrate-coding-agent-with-slack (Slack 에서 Copilot 에이전트 사용, 정책, 공개 미리보기)
  - https://github.blog/changelog/2026-08-25-the-new-github-copilot-experience-in-slack/ (플랜 요건)
  - https://docs.github.com/en/organizations/keeping-your-organization-secure/managing-security-settings-for-your-organization/audit-log-events-for-your-organization (GitHub 조직 감사 이벤트 이름)
  - https://docs.slack.dev/reference/audit-logs-api/methods-actions-reference (Slack 감사 로그 action 이름)
  note: Slack 에서 Copilot 에이전트 세션을 시작한 기록은 양쪽 문서에 없다. DM 에서는 사용자 권한으로, 채널에서는 앱 신원으로 PR 이 만들어진다고 문서가 쓴다
- id: copilot_connector_slack
  type: app_grant
  what: GitHub Copilot 이 GitHub 이 검증한 Slack 커넥터로 Slack 을 부른다. 사용자가 Slack 에 로그인해 접근을 승인한다. 문서는 Slack 관리자가 MCP 연결을 먼저 켜야 할 수 있다고 적는다. public preview
  identify:
    api: github Copilot 앱 Customize 탭의 Connectors, Copilot CLI 의 /mcp 연결 화면 (읽는 API 는 문서에 없다)
    when: Connectors 에 Slack 이 연결되어 있음
  points_to:
  - tier: via_person
    a: Copilot 연결을 승인한 GitHub 사용자
    b: 그 연결에서 Slack 에 로그인한 사용자
    check: 같은 사람
    if_unreadable: '양쪽을 읽는 API 가 문서에 없다. 사람: Copilot Connectors 화면, Slack 관리 화면'
  - tier: log_time
    a: github 쪽 연결 기록 위치는 문서에 없다
    b: slack 쪽 대응 기록 위치는 문서에 없다
    check: 시각이 가깝다. 짝 확인 방법은 문서에 없다
  activity:
  - 문서에 없다
  sources:
