# Salesforce 공통 수단 연결 규칙
# Salesforce 조직이 밖의 서버·앱과 붙는 수단. 다른 SaaS 와의 쌍은 ../rules/<saas>-salesforce.yaml
# 벤더 문서로만 썼다 (2026-10-14). 시험 테넌트 값은 ../test-environment/salesforce-external.yaml. 범례는 legend.yaml
# 감사 표면: SetupAuditTrail(Action, Section, Display, CreatedById, DelegateUser. 최소 180일), LoginHistory(LoginType, Application, ApiType, SourceIp, LoginUrl, AuthenticationServiceId), OauthToken, EventLogFile(View Event Log Files 권한, Shield·Event Monitoring 고객 1년 보관), LoginEventStream(실시간, 추가 구독)

anchor: salesforce
written: '2026-10-14'
verified: '2026-10-14'
kind: rules

methods:
- id: connected_app
  type: app_grant
  what: "밖의 앱이 connected app(OAuth 클라이언트)으로 Salesforce API 를 부름. 2025-09 부터 설치하지 않은 connected app 은 대부분 사용자에게 막히고(Approve Uninstalled Connected Apps, Use Any API Client 권한 예외), Spring '26 부터 새 connected app 생성이 제한돼 external client app 을 권장한다. 2025-08 Salesloft Drift 사건은 이 경로(Drift connected app 의 OAuth 토큰)였다"
  identify: {api: "salesforce SOQL OauthToken (AppName, UserId, LastUsedDate, UseCount. Customize Application 이면 전체), ConnectedApplication (Name, OptionsAllowAdminApprovedUsersOnly 등. 키·콜백 없음), Metadata API ConnectedApp (oauthConfig.consumerKey, callbackUrl, certificate, scopes, ipRelaxation)", when: "토큰이 있는 앱"}
  points_to:
  - {tier: config_id, a: "salesforce ConnectedApp oauthConfig.consumerKey", b: "밖의 앱의 client_id", check: "a 와 b 가 같다"}
  - {tier: config_name, a: "salesforce ConnectedApp oauthConfig.callbackUrl 호스트", b: "밖의 앱 서버", check: "a 와 b 가 같다"}
  - {tier: config_name, a: "salesforce OauthToken.AppName, UserId", b: "밖의 앱 (이름으로)", check: "이름 일치", if_unreadable: "Setup > Connected Apps OAuth Usage"}
  - {tier: log_id, a: "salesforce LoginHistory.Application, SourceIp, ApiType (그 앱의 로그인)", b: "밖의 앱 서버 주소", check: "a 와 b 가 같다"}
  activity: ["salesforce OauthToken (LastUsedDate, UseCount), LoginHistory, EventLogFile API·Login·UniqueQuery, SetupAuditTrail (앱 설정 변경)", "Drift 사례의 확인 항목: Drift connected app 인증 활동, Event Monitoring 의 그 연결 사용자, UniqueQuery 로 실행된 SOQL, IP Relaxation"]
  sources: ["https://developer.salesforce.com/docs/atlas.en-us.object_reference.meta/object_reference/sforce_api_objects_oauthtoken.htm [Exa]", "https://developer.salesforce.com/docs/atlas.en-us.object_reference.meta/object_reference/sforce_api_objects_connectedapplication.htm (모든 필드 읽기 전용) [브라우저]", "https://developer.salesforce.com/docs/atlas.en-us.api_meta.meta/api_meta/meta_connectedapp.htm (consumerKey, callbackUrl, certificate, ipRelaxation, Spring '26 생성 제한) [브라우저]", "https://admin.salesforce.com/blog/2025/get-ready-for-changes-to-connected-app-usage-restrictions (2025-09 미설치 앱 제한, 새 권한) [Exa]", "https://cloud.google.com/blog/topics/threat-intelligence/data-theft-salesforce-instances-via-salesloft-drift (Drift 사건, Salesforce 쪽 확인 항목, IOC) [Exa]"]

- id: external_client_app
  type: app_grant
  what: "external client app(connected app 후속, Metadata API 59.0+)으로 밖의 앱이 OAuth 로 붙음"
  identify: {api: "salesforce Metadata API ExternalClientApplication (label, contactEmail, distributionState, orgScopedExternalApp), SOQL OauthToken", when: "앱이 있음"}
  points_to:
  - {tier: config_name, a: "salesforce ExternalClientApplication label, orgScopedExternalApp ([조직 ID]:[앱 이름])", b: "밖의 앱", check: "이름으로"}
  - {tier: config_name, a: "salesforce OauthToken.AppName", b: "같은 앱", check: "a 와 b 가 같다"}
  - {tier: log_id, a: "salesforce LoginHistory.Application", b: "그 앱 이름", check: "a 와 b 가 같다"}
  - {tier: log_time, a: "salesforce LoginHistory.LoginTime, SourceIp", b: "밖의 앱 요청 기록 시각과 주소", check: "시각이 같고 주소가 같다"}
  activity: ["salesforce OauthToken, LoginHistory", salesforce SetupAuditTrail 의 Display 에 든 External Client App 이름 (Action 값 ecappOauthConsumerSecretGet 은 화면 관찰) (Action 값 목록은 문서 없음)]
  sources: ["https://developer.salesforce.com/docs/atlas.en-us.api_meta.meta/api_meta/meta_externalclientapplication.htm [Exa]", "https://developer.salesforce.com/docs/atlas.en-us.object_reference.meta/object_reference/sforce_api_objects_loginhistory.htm [Exa] (UserId, LoginTime, LoginType, SourceIp, Application, AuthenticationServiceId)", 'https://developer.salesforce.com/docs/atlas.en-us.object_reference.meta/object_reference/sforce_api_objects_setupaudittrail.htm [Exa] (Action 과 Display 의 정의)']

- id: named_credential
  type: stored_credential
  what: "Named Credential(+ External Credential)이 밖의 엔드포인트와 인증 정보를 담고 Apex·Flow 가 callout:<이름> 으로 부름"
  identify: {api: "salesforce SOQL NamedCredential (DeveloperName, MasterLabel. Endpoint 는 legacy 전용·56.0 deprecated. View Setup and Configuration)", when: "자격이 있음"}
  points_to:
  - {tier: config_name, a: "salesforce Named Credential URL 호스트. 새 꼴은 SOQL NamedCredential.Endpoint 가 비어 있어 SetupAuditTrail namedCredentialParameterInsert 의 Url 매개 변수나 Metadata API 로 읽는다", b: "받는 서버", check: "a 와 b 가 같다", note: 2026-10-29 시험 환경 응답에서 확인 (test-environment/v3 checks). 벤더 문서에는 없다}
  - {tier: log_id, a: "salesforce EventLogFile ApexCallout 의 호출 엔드포인트 URL 호스트", b: "Named Credential URL 호스트", check: "a 와 b 가 같다"}
  - {tier: log_time, a: "salesforce ApexCallout TIMESTAMP_DERIVED", b: "받는 서버 수신 기록 시각", check: "시각이 같다"}
  activity: ["salesforce SetupAuditTrail (Named Credential 변경)", "salesforce EventLogFile ApexCallout (URL, METHOD, STATUS_CODE, USER_ID)", salesforce SetupAuditTrail 의 Display 에 든 Named Credential 이름 (Action 은 namedCredentialEncryptedFieldChange 등 화면 관찰 값) (Action 값 목록은 문서 없음)]
  sources: ["https://developer.salesforce.com/docs/atlas.en-us.object_reference.meta/object_reference/sforce_api_objects_namedcredential.htm [Exa]", "https://developer.salesforce.com/docs/atlas.en-us.object_reference.meta/object_reference/sforce_api_objects_eventlogfile_apexcallout.htm [Exa] (EventLogFile ApexCallout: 호출 엔드포인트 URL, METHOD, USER_ID, TIMESTAMP_DERIVED)", "https://developer.salesforce.com/docs/atlas.en-us.object_reference.meta/object_reference/sforce_api_objects_setupaudittrail.htm [Exa] (Action 은 'The category of the change made in Setup.' 이며 값 목록 없음. Display 는 변경 전체 설명, 보관 기간 180일)"]

- id: remote_site_setting
  type: event_delivery
  what: "Remote Site Settings 에 등록한 밖의 URL 로 Apex callout 을 허용"
  identify: {api: "salesforce Metadata API RemoteSiteSetting (url, isActive, disableProtocolSecurity)", when: "등록이 있음"}
  points_to:
  - {tier: config_name, a: "salesforce RemoteSiteSetting.url 호스트", b: "받는 서버", check: "a 와 b 가 같다"}
  - {tier: log_id, a: "salesforce EventLogFile ApexCallout 의 호출 엔드포인트 URL 호스트", b: "RemoteSiteSetting.url 호스트", check: "a 와 b 가 같다"}
  - {tier: log_time, a: "salesforce ApexCallout TIMESTAMP_DERIVED", b: "받는 서버 수신 기록 시각", check: "시각이 같다"}
  activity: ["salesforce EventLogFile ApexCallout", "salesforce SetupAuditTrail (Remote Site 변경)"]
  sources: ["https://developer.salesforce.com/docs/atlas.en-us.api_meta.meta/api_meta/meta_remotesitesetting.htm [Exa]", "https://developer.salesforce.com/docs/atlas.en-us.object_reference.meta/object_reference/sforce_api_objects_eventlogfile_apexcallout.htm [Exa] (EventLogFile ApexCallout: 호출 엔드포인트 URL, METHOD, USER_ID, TIMESTAMP_DERIVED)", "https://developer.salesforce.com/docs/atlas.en-us.object_reference.meta/object_reference/sforce_api_objects_setupaudittrail.htm [Exa] (Action, Section, Display, CreatedById, CreatedDate)"]

- id: csp_trusted_site
  type: content_ref
  what: "CSP Trusted Sites 에 등록한 밖의 도메인을 Lightning·Visualforce 페이지가 불러옴"
  identify: {api: "salesforce Tooling CspTrustedSite (EndpointUrl, IsActive, Context)", when: "등록이 있음"}
  points_to:
  - {tier: config_name, a: "salesforce CspTrustedSite.EndpointUrl 호스트", b: "밖의 사이트", check: "a 와 b 가 같다"}
  activity: ["salesforce SetupAuditTrail (CSP Trusted Site 변경)"]
  sources: ["https://developer.salesforce.com/docs/atlas.en-us.api_tooling.meta/api_tooling/tooling_api_objects_csptrustedsite.htm [Exa]", "https://developer.salesforce.com/docs/atlas.en-us.object_reference.meta/object_reference/sforce_api_objects_setupaudittrail.htm [Exa] (Action, Section, Display, CreatedById, CreatedDate)"]
  note: "로그 등급 없음. 브라우저가 붙는 경로라 Salesforce 쪽에 그 origin 이 남는다는 문서가 없다. 등록과 변경은 SetupAuditTrail 에 남는다"

- id: cors_allowlist
  type: content_ref
  what: "CORS 허용 목록의 밖의 origin 이 브라우저에서 Salesforce API 를 부름 (목록에 없으면 403)"
  identify: {api: "salesforce SOQL CorsWhitelistEntry (UrlPattern)", when: "등록이 있음"}
  points_to:
  - {tier: config_name, a: "salesforce CorsWhitelistEntry.UrlPattern", b: "밖의 웹앱 origin", check: "a 와 b 가 같다"}
  activity: ["salesforce SetupAuditTrail (CORS 허용 목록 변경)"]
  sources: ["https://developer.salesforce.com/docs/atlas.en-us.object_reference.meta/object_reference/sforce_api_objects_corswhitelistentry.htm [Exa]", "https://developer.salesforce.com/docs/atlas.en-us.object_reference.meta/object_reference/sforce_api_objects_setupaudittrail.htm [Exa] (Action, Section, Display, CreatedById, CreatedDate)"]
  note: "로그 등급 없음. 브라우저가 붙는 경로라 Salesforce 쪽에 그 origin 이 남는다는 문서가 없다. 등록과 변경은 SetupAuditTrail 에 남는다"

- id: outbound_message
  type: event_delivery
  what: "워크플로 Outbound Message 가 밖의 endpoint URL 로 SOAP 메시지를 보냄. Send Session ID 를 켜면 세션 ID 가 함께 간다"
  identify: {api: "salesforce Setup > Outbound Messages (endpoint URL, User to send as), View Message Delivery Status. 메타데이터 필드명은 문서 미열람", when: "메시지 정의가 있음"}
  points_to:
  - {tier: config_name, a: "salesforce outbound message endpoint URL 호스트", b: "받는 서버", check: "a 와 b 가 같다"}
  - {tier: log_id, a: "받는 서버 수신 기록의 OrganizationId, ActionId", b: "salesforce 조직 ID, 그 outbound message 를 보낸 워크플로 동작", check: "a 와 b 가 같다"}
  activity: ["salesforce Outbound Messages 전달 상태 (Retry, Del)"]
  sources: ["https://developer.salesforce.com/docs/platform/api/guide/sforce-api-om-outboundmessaging-setting-up.html (endpoint URL, 포트 80·443·1024–66535, Send Session ID, User to send as, View Message Delivery Status, Retry) [브라우저]", "https://developer.salesforce.com/docs/atlas.en-us.api.meta/api/sforce_api_om_outboundmessaging_wsdl.htm [Exa] (notifications: OrganizationId, ActionId)"]

- id: event_relay
  type: event_delivery
  what: "Event Relay 가 Platform Event·Change Data Capture 를 Amazon EventBridge 로 보냄"
  identify: {api: "salesforce Tooling EventRelayConfig (DestinationResourceName = callout:<Named Credential>, EventChannel, state)", when: "구성이 있음"}
  points_to:
  - {tier: config_id, a: "salesforce EventRelayConfig.DestinationResourceName 이 가리키는 Named Credential (AWS 계정·리전)", b: "AWS EventBridge 파트너 이벤트 소스", check: "a 와 b 가 같다"}
  activity: ["salesforce SetupAuditTrail (Event Relay 설정 변경)"]
  sources: ["https://developer.salesforce.com/docs/atlas.en-us.api_tooling.meta/api_tooling/tooling_api_objects_eventrelayconfig.htm [Exa]", "https://developer.salesforce.com/docs/atlas.en-us.object_reference.meta/object_reference/sforce_api_objects_setupaudittrail.htm [Exa] (Action, Section, Display, CreatedById, CreatedDate)"]
  note: "로그 등급 없음. 이벤트 하나가 EventBridge 로 넘어간 기록을 Salesforce 쪽에서 읽는 방법은 문서에서 확인하지 않았다"

- id: auth_provider_external
  type: identity
  what: "Auth. Provider(OpenIdConnect, Microsoft, Custom 등)로 밖의 IdP 계정이 Salesforce 에 로그인하거나 밖의 API 토큰을 받음. 등록 처리기는 ExecutionUserId 사용자로 돈다"
  identify: {api: "salesforce SOQL AuthProvider (ProviderType, ConsumerKey, AuthorizeUrl, TokenUrl, IdTokenIssuer, RegistrationHandlerId, ExecutionUserId)", when: "제공자가 있음"}
  points_to:
  - {tier: config_id, a: "salesforce AuthProvider.ConsumerKey, IdTokenIssuer, AuthorizeUrl 호스트", b: "밖의 IdP 의 클라이언트·issuer", check: "a 와 b 가 같다"}
  - {tier: log_id, a: "salesforce LoginHistory.AuthenticationServiceId", b: "AuthProvider.Id", check: "a 와 b 가 같다"}
  activity: ["salesforce LoginHistory (AuthenticationServiceId = 그 AuthProvider)", "salesforce SetupAuditTrail (Auth. Provider 변경)", salesforce SetupAuditTrail 의 Display 에 든 Auth. Provider 이름 (Action insertAuthProvider 등) (Action 값 목록은 문서 없음)]
  sources: ["https://developer.salesforce.com/docs/atlas.en-us.object_reference.meta/object_reference/sforce_api_objects_authprovider.htm [브라우저]", "https://developer.salesforce.com/docs/atlas.en-us.object_reference.meta/object_reference/sforce_api_objects_loginhistory.htm [Exa] (UserId, LoginTime, LoginType, SourceIp, Application, AuthenticationServiceId)", "https://developer.salesforce.com/docs/atlas.en-us.object_reference.meta/object_reference/sforce_api_objects_setupaudittrail.htm [Exa] (Action, Section, Display, CreatedById, CreatedDate)", 'https://developer.salesforce.com/docs/atlas.en-us.object_reference.meta/object_reference/sforce_api_objects_setupaudittrail.htm [Exa] (Action 과 Display 의 정의, 값 목록 없음)']

- id: installed_package
  type: external_relay
  what: "AppExchange 관리 패키지가 설치돼 코드·설정이 조직 안에 들어오고, 패키지 업체 서버와 connected app 으로 통신할 수 있다"
  identify: {api: "salesforce Tooling InstalledSubscriberPackage (SubscriberPackageId, SubscriberPackage.Name, NamespacePrefix, SubscriberPackageVersionId)", when: "패키지가 있음"}
  points_to:
  - {tier: config_name, a: "salesforce 패키지 이름·네임스페이스", b: "업체", check: "이름으로"}
  - {tier: config_name, a: "같은 업체의 OauthToken.AppName, Remote Site·Named Credential 호스트", b: "업체 서버", check: "같은 업체"}
  - {tier: log_time, a: "salesforce SetupAuditTrail 의 패키지 설치 시각", b: "같은 업체 connected app 의 OauthToken.CreatedDate", check: "시각이 가깝다"}
  activity: ["salesforce SetupAuditTrail (패키지 설치·업그레이드)"]
  sources: ["https://developer.salesforce.com/docs/atlas.en-us.api_tooling.meta/api_tooling/tooling_api_objects_installedsubscriberpackage.htm [브라우저]", "https://developer.salesforce.com/docs/atlas.en-us.object_reference.meta/object_reference/sforce_api_objects_setupaudittrail.htm [Exa] (Action, Section, Display, CreatedById, CreatedDate)", "https://developer.salesforce.com/docs/atlas.en-us.object_reference.meta/object_reference/sforce_api_objects_oauthtoken.htm [Exa] (AppName, UserId, CreatedDate, LastUsedDate, UseCount)"]

- id: api_user_password_token
  type: stored_credential
  what: "밖의 시스템이 Salesforce 사용자 username 과 비밀번호+보안 토큰으로 API 에 로그인 (Okta 프로비저닝이 이 방식)"
  identify: {api: "salesforce SOQL LoginHistory (LoginType, ApiType, Application, SourceIp)", when: "사람이 아닌 출처의 API 로그인"}
  points_to:
  - {tier: log_id, a: "salesforce LoginHistory.SourceIp, Application, ApiType", b: "밖의 시스템 주소·클라이언트", check: "a 와 b 가 같다"}
  - {tier: config_name, a: "salesforce 그 사용자 Username (전용 API 사용자)", b: "밖의 시스템 설정의 계정", check: "a 와 b 가 같다"}
  activity: ["salesforce LoginHistory (LoginType, ApiType, Application, SourceIp)"]
  sources: ["https://developer.salesforce.com/docs/atlas.en-us.object_reference.meta/object_reference/sforce_api_objects_loginhistory.htm [Exa]", "https://saml-doc.okta.com/Provisioning_Docs/Salesforce_Customer_Portal_Provisioning.html (Password + Token, 전용 API 계정)", "https://saml-doc.okta.com/Provisioning_Docs/Salesforce_Federated_ID_Provisioning.html (Password + Token) [Exa. 2026-10-14 원주소 404, 본문에 폐기 문서 표시]"]
- id: hosted_mcp_server
  type: app_grant
  what: 'Salesforce 가 제공하는 호스팅 MCP 서버(표준 서버, 예: SObject Reads = platform/sobject-reads)를 외부 AI 클라이언트(Claude, ChatGPT, Cursor, Postman 등)가 External Client App 의 OAuth(authorization code, PKCE)로 불러 Salesforce 데이터를 읽거나 쓴다. 관리자가 MCP Servers 에서 서버를 켜고 External Client App 을 만들어야 한다. 문서는 Flex Credits 고객만 쓰는 기능이고 서버 사용량에 과금될 수 있다고 쓴다.'
  identify:
    api: salesforce Setup 의 API Catalog > MCP Servers (화면. 켜짐 여부를 읽는 API 는 문서에 없음). Setup 의 External Client App Manager (화면). 감사는 Event Log File Browser 의 API Total Usage 이벤트 로그 CSV 에서 API_CLIENT_CATEGORY = SALESFORCE_HOSTED_MCP
    when: 켜진 호스팅 MCP 서버가 있고, API Total Usage 행에 API_CLIENT_CATEGORY 가 SALESFORCE_HOSTED_MCP 인 기록이 있음
  points_to:
  - tier: config_id
    a: salesforce External Client App 의 Consumer Key (Settings > OAuth Settings)
    b: '외부 MCP 클라이언트 설정에 넣은 Consumer Key (예: Claude 커넥터 설정. 클라이언트 쪽을 읽는 API 는 문서에 없음)'
    check: a 와 b 가 같다
    if_unreadable: 클라이언트 쪽은 사용자 화면. Salesforce 쪽은 ECA 화면
  - tier: log_time
    a: salesforce API Total Usage 행의 USER_NAME, CLIENT_IP, 시각 (시각 필드 이름은 문서에 없음). 행 조건 API_CLIENT_CATEGORY = SALESFORCE_HOSTED_MCP
    b: salesforce LoginHistory 의 UserId, LoginTime, SourceIp, Application (Application 값은 ECA 이름)
    check: 사용자가 같고 시각이 가깝다
  - tier: via_person
    a: External Client App 으로 OAuth 동의한 Salesforce 사용자 (MCP 세션에 묶인 사용자)
    b: '외부 클라이언트 계정 (예: Claude 계정). 문서에 클라이언트 쪽 계정 필드는 없음'
    check: 같은 사람인지 사람이 확인한다
  activity:
  - salesforce API Total Usage 이벤트 로그 (API_CLIENT_CATEGORY = SALESFORCE_HOSTED_MCP)
  - salesforce LoginHistory, OauthToken (ECA 로그인, 기존 external_client_app 과 같은 기록)
  sources:
  - https://developer.salesforce.com/docs/platform/hosted-mcp-servers/guide/hosted-mcp-servers-overview.html (정의, Flex Credits 과금) [Exa]
  - https://developer.salesforce.com/docs/platform/hosted-mcp-servers/guide/activate-mcp-servers.html (Setup Quick Find 「MCP Servers」, API Catalog 아래, 기본 꺼짐) [Exa]
  - https://developer.salesforce.com/docs/platform/hosted-mcp-servers/guide/create-external-client-app.html (ECA 생성, Consumer Key, mcp_api·refresh_token scope, Connected App 미지원, Claude 콜백 URL) [Exa 검색 발췌, 원문 미열람]
  - https://developer.salesforce.com/docs/platform/hosted-mcp-servers/guide/security-best-practices.html (도구 호출은 사용자 컨텍스트, API_CLIENT_CATEGORY = SALESFORCE_HOSTED_MCP, 일일 CSV) [Exa]
  - https://developer.salesforce.com/blogs/2026/06/how-to-secure-salesforce-hosted-mcp-servers (Event Log File Browser 에서 API Total Usage 필터) [Exa 검색 발췌, 원문 미열람]
  - https://developer.salesforce.com/docs/platform/hosted-mcp-servers/references/reference/sobject-reads.html (서버 URL api.salesforce.com/platform/mcp/v1/platform/sobject-reads, 읽기 전용) [Exa]
  note: '서버 URL 은 테넌트와 무관한 공통 주소라 식별 값이 아니다. 식별은 External Client App 의 Consumer Key 로 한다. 이 방법은 external_client_app 과 같은 ECA 객체를 쓰지만, MCP 서버 활성화와 API_CLIENT_CATEGORY 가 MCP 경로를 가르므로 새로 둔다. 같은 호스팅 서버를 쓰는 다른 인스턴스는 slack-salesforce 의 slackbot_salesforce_mcp (Slackbot 쪽)이고, 이 파일에는 넣지 않는다. Google 쪽 Gemini 연결도 같은 서버(sobject-reads)를 요구하지만 그것은 rules_additions 항목 E 로 적는다. 문서에 없음: MCP Servers 목록을 읽는 API, MCP 도구 호출의 시각 필드 이름, 클라이언트 쪽 로그. Claude 의 콜백 URL https://claude.ai/api/mcp/auth_callback 은 공식 문서에 적혀 있어 ECA 식별 근거로 쓸 수 있다.'
