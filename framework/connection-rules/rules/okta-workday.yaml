# okta ↔ workday 연결 규칙
# Workday 는 HCM·Financials 테넌트(https://<호스트>.workday.com/<tenant>). 벤더 문서로만 썼다 (2026-10-16). 시험 테넌트 결과는 ../test-environment/okta-workday.yaml 에 채운다. 읽는 법은 legend.yaml, ../README.md
# Workday 공통 확인 표면 (WWS v47.0, https://community.workday.com/sites/default/files/file-hosting/productionapi/index.html):
#   Identity_Management Get_Workday_Account_Signons (로그인 기록. 한 번에 24시간 미만. Authentication_Type, SAML_Identity_Provider_Reference, API_Client_ID, Signon_IP_Address)
#   Integrations Get_Integration_Systems (연동 시스템과 Attribute 값), Get_Integration_System_Users (ISU 계정, Do_Not_Allow_UI_Sessions), Get_Integration_Events (실행 시각, 실행 계정)
#   User Activity Logging (View User Activity 리포트, /activityLogging API. 최대 30일, 테넌트 감사 기능은 아니라고 문서가 적는다)
#   SAML IdP 설정과 API 클라이언트 목록을 주는 WWS 작업은 문서에서 찾지 못했다. 화면: Edit Tenant Setup - Security, View API Clients

pair:
- okta
- workday
written: '2026-10-16'
verified: '2026-10-16'
kind: rules
note: 실제 값은 넣지 않는다. 시험 환경 값은 ../test-environment/okta-workday.yaml
methods:
- id: saml_sso
  type: identity
  what: Okta 가 Workday 로그인을 맡음 (SAML 2.0, IdP·SP 시작 둘 다). Okta 가 만든 Issuer, 인증서, IdP SSO Service URL 을 Workday 의 SAML Identity Providers 행에 넣는다
  identify:
    api: okta GET /api/v1/apps
    when: Workday 앱 (label, name 키 값과 signOnMode 는 Workday 페이지에 없어 연결을 만든 뒤 응답에서 읽는다)
  note: Workday 쪽 Service Provider ID 는 고정값 http://www.workday.com 이라 상대를 가리키지 않는다. Okta 앱 General 탭의 「Your Workday site URL」 이 틀리면 SAML 인증이 안 된다고 Okta 문서가 적는다. 잠김 대비 로그인 주소는 [Workday 주소]/login.flex?redirect=n
  points_to:
  - tier: config_id
    a: workday Edit Tenant Setup - Security > SAML Identity Providers 행의 「Issuer」
    b: okta 앱 SAML 메타데이터 entityID (Issuer)
    check: a 와 b 가 같다
    if_unreadable: 'Workday 쪽 API 는 문서에서 찾지 못함. 사람: Workday 관리자가 Edit Tenant Setup - Security 화면. Okta 쪽: GET /api/v1/apps/{appId}/sso/saml/metadata'
  - tier: config_name
    a: workday SAML Identity Providers 행의 「IdP SSO Service URL」
    b: okta 앱 IdP SSO Service URL (<조직>.okta.com/app/…/sso/saml)
    check: a 와 b 가 같다
  - tier: config_name
    a: okta 앱 General 탭의 「Your Workday site URL」
    b: workday 테넌트 주소 (Redirection URLs 의 Login Redirect URL [org URL]/login-saml2.flex)
    check: a 와 b 가 같은 테넌트를 가리킨다
  - tier: fingerprint
    a: workday SAML Identity Providers 행의 「x509 Certificate」(Create x509 Public Key 로 등록)
    b: okta 앱 서명 인증서
    check: a 의 sha256 과 b 가 같다
  - tier: via_person
    a: okta 배정 사용자 login
    b: workday Workday Account User_Name (Get_Workday_Account)
    check: a 와 b 가 같다
  - tier: log_id
    a: workday Get_Workday_Account_Signons 의 SAML_Identity_Provider_Reference
    b: workday SAML Identity Providers 행 (Identity Provider Name 이 Okta 인 행)
    check: a 가 그 행을 가리킨다
  - tier: log_time
    a: okta user.authentication.sso 시각과 사용자
    b: workday Get_Workday_Account_Signons 의 Signon_DateTime, User_Name, Authentication_Type
    check: 시각이 가깝고 사람이 같다
  activity:
  - okta user.authentication.sso
  - workday Get_Workday_Account_Signons (Successful, Failed_Signon, Authentication_Failure_Message)
  sources:
  - https://saml-doc.okta.com/SAML_Docs/How-to-Configure-SAML-2.0-for-Workday.html (Issuer, IdP SSO Service URL, x509 Certificate, Service Provider ID http://www.workday.com, login-saml2.flex, Your Workday site URL)
  - https://learn.microsoft.com/en-us/entra/identity/saas-apps/workday-tutorial (Edit Tenant Setup - Security, Service Provider ID, login.flex?redirect=n)
  - https://community.workday.com/sites/default/files/file-hosting/productionapi/Identity_Management/v47.0/Get_Workday_Account_Signons.html (Signon_DateTime, User_Name, SAML_Identity_Provider_Reference, Authentication_Type, 24시간 미만)
  - https://developer.okta.com/docs/reference/api/event-types/ (user.authentication.sso)
- id: workday_profile_source_import
  type: identity
  what: Okta 가 Workday 의 직원(worker)을 가져와 Okta 사용자를 만들고 바꿈 (Full·Incremental 가져오기). Profile & Lifecycle Sourcing 을 켜면 Workday 가 프로필 원천이 된다. Okta 는 ISU(Integration System User) 계정과 비밀번호로 Workday Web Services 를 부른다
  identify:
    api: okta GET /api/v1/apps
    when: Workday 앱 features 에 IMPORT_NEW_USERS, IMPORT_PROFILE_UPDATES, PROFILE_MASTERING
  note: Okta 쪽 설정은 Provisioning 탭 > Configure API Integration 의 API Username(「ISU username@tenant」 꼴), API Password, WebServices Endpoint(테넌트 이름까지의 기본 URL). Okta 는 Workday Provisioning Groups 를 가져오고 Security Groups 는 가져오지 않는다
  points_to:
  - tier: config_name
    a: okta 앱 Provisioning 의 API Username (ISU username@tenant)
    b: workday Get_Integration_System_Users 의 User_Name (Do_Not_Allow_UI_Sessions)
    check: a 의 @ 앞이 b 이고 @ 뒤가 그 테넌트다
    if_unreadable: 'Okta 쪽 API Username 은 콘솔 Provisioning 탭에서만 보인다 (공개 API 문서에 필드 없음)'
  - tier: config_name
    a: okta 앱 Provisioning 의 WebServices Endpoint (호스트와 테넌트)
    b: workday 테넌트 Web Services 주소 (Public Web Services 리포트의 WSDL soapbind:address)
    check: a 와 b 가 같다
  - tier: via_person
    a: okta user.profile.employeeNumber, email
    b: workday Get_Workers 의 Employee_ID, 업무 이메일
    check: a 와 b 가 같다
  - tier: log_time
    a: okta system.import.start, system.import.complete 시각
    b: workday Get_Workday_Account_Signons 에서 그 ISU 의 로그인 (Authentication_Type)
    check: 시각이 가깝다
  activity:
  - okta system.import.start, system.import.complete, system.import.user.create, system.import.user.update
  - workday 그 ISU 의 Get_Workday_Account_Signons, User Activity Logging (System Account = ISU)
  sources:
  - https://help.okta.com/en-us/content/topics/provisioning/workday/workday-provisioning.htm (Integration System User, API Username, WebServices Endpoint, Full·Incremental, Profile & Lifecycle Sourcing, employeeNumber, Provisioning Groups)
  - https://raw.githubusercontent.com/okta/okta-management-openapi-spec/master/dist/current/management-minimal.yaml (Application.features IMPORT_NEW_USERS, IMPORT_PROFILE_UPDATES, PROFILE_MASTERING)
  - https://community.workday.com/sites/default/files/file-hosting/productionapi/Integrations/v47.0/Get_Integration_System_Users.html (User_Name, Do_Not_Allow_UI_Sessions)
  - https://community.workday.com/sites/default/files/file-hosting/productionapi/Human_Resources/v47.0/Get_Workers.html (Employee_ID)
  - https://developer.okta.com/docs/reference/api/event-types/ (system.import.*)
- id: workday_writeback
  type: identity
  what: Okta 가 Workday 의 업무·집 연락처를 되써 넣음 (Early Access). Workday 쪽은 같은 ISU 보안 그룹에 Work Contact Change, Home Contact Change 업무 프로세스 권한을 준다
  identify:
    api: okta GET /api/v1/apps (Workday 앱); workday Work Contact Change 업무 프로세스 보안 정책 (화면)
    when: Work Contact Change 보안 정책의 web service 칸에 Okta ISU 의 보안 그룹이 있음
  points_to:
  - tier: config_name
    a: workday Work Contact Change 업무 프로세스 보안 정책에 든 Integration System Security Group
    b: okta 가 쓰는 ISU (workday_profile_source_import 의 API Username) 가 속한 그룹
    check: a 와 b 가 같다
  - tier: log_time
    a: workday Work Contact Change 업무 프로세스 실행 (실행 계정이 그 ISU)
    b: okta 사용자 프로필 변경 시각 (writeback 의 Okta 이벤트 이름은 문서에 없음)
    check: 시각이 가깝다
  activity:
  - workday 업무 프로세스 기록, User Activity Logging (System Account = ISU)
  sources:
  - https://help.okta.com/en-us/content/topics/provisioning/workday/workday-writeback-enhancement.htm (Early Access, Work Contact Change, Home Contact Change, 도메인 권한)
- id: workday_real_time_sync
  type: event_delivery
  what: Workday 업무 프로세스(입사·퇴사·직무 변경 등)가 끝나면 Workday 가 Okta API 를 불러 바로 가져오기를 시킴 (Real-Time Sync). Okta API 주소와 Okta API 토큰을 Workday 연동 시스템의 속성(Integration Attributes)에 둔다
  identify:
    api: workday Get_Integration_Systems (Attribute 값)
    when: 속성 Okta API Endpoint 가 https://<Okta 조직>/api/v1/app/<Identity Provider ID>/activities/ 꼴
  note: Okta 는 RTS 를 1~2일 주기 예약 가져오기와 함께 쓰라고 한다. Okta API 토큰은 super admin 또는 최소 권한 사용자 지정 역할(Manage Users, Manage group membership, Manage Applications)로 만든다. Get_Integration_Systems 가 토큰 값을 돌려주는지는 문서에 없다
  points_to:
  - tier: config_name
    a: workday 연동 속성 Okta API Endpoint 의 호스트
    b: okta 조직 주소 (<조직>.okta.com)
    check: a 와 b 가 같다
  - tier: config_id
    a: workday 연동 속성 Okta API Endpoint 경로의 Identity Provider ID
    b: okta Workday 앱 Sign On 탭 View Setup Instructions 의 Issuer 값
    check: a 와 b 가 같다
  - tier: config_name
    a: okta GET /api/v1/api-tokens 의 토큰 name, 소유자
    b: workday 연동 속성 Okta API Token (값은 보지 않는다)
    check: 토큰 이름으로만 (약한 근거)
  - tier: log_time
    a: workday Get_Integration_Events 의 Initiated_DateTime, Completed_DateTime (그 Integration_System_Reference)
    b: okta 그 API 토큰으로 한 동작, app.realtimesync.import.details.add_user·update_user·delete_user (Workday 와의 대응은 문서에 없음)
    check: 시각이 가깝다
  activity:
  - workday Get_Integration_Events
  - okta system.api_token.create, app.realtimesync.import.details.*
  sources:
  - https://help.okta.com/en-us/content/topics/provisioning/workday/workday-rts.htm (Okta API Endpoint 꼴, Identity Provider ID 는 Issuer 값, Okta API Token, Integration Attributes, 예약 가져오기 병행)
  - https://community.workday.com/sites/default/files/file-hosting/productionapi/Integrations/v47.0/Get_Integration_Systems.html (Attribute 값)
  - https://community.workday.com/sites/default/files/file-hosting/productionapi/Integrations/v47.0/Get_Integration_Events.html (Initiated_DateTime, Completed_DateTime, Integration_System_Reference)
  - https://developer.okta.com/docs/reference/api/event-types/ (app.realtimesync.import.details.*, system.api_token.create)
- id: workflows_workday_connector
  type: app_grant
  what: Okta Workflows Workday 커넥터가 Workday REST API 를 부름. Workday 에 API 클라이언트(Authorization Code Grant, Non-Expiring Refresh Tokens, scope Contact Information·Organizations and Roles·Staffing·Tenant Non-Configurable)를 만들고 ISU 로 승인한다. 카드는 Read Worker, Search Workers, Update Work Email·Phone·Address 등 12개
  identify:
    api: okta System Log
    when: workflows.user.connection.create 의 target Connection alternateId 가 Workday 커넥터 (값은 연결을 만든 뒤 로그에서 읽는다)
  note: ISU 는 승인 때 UI 로그인이 필요해서 Do Not Allow UI Sessions 를 끈 상태여야 한다고 Okta 문서가 적는다
  points_to:
  - tier: config_id
    a: okta Workflows 연결의 Client ID (콘솔)
    b: workday View API Clients 의 그 API 클라이언트 Client ID
    check: a 와 b 가 같다
    if_unreadable: 'Okta Workflows 연결 목록을 주는 공개 API 없음 (Workflows 콘솔 > Connections). Workday 쪽은 View API Clients 리포트 (화면)'
  - tier: config_name
    a: workday API 클라이언트의 Redirection URI
    b: okta Workflows 셀 주소 https://oauth.workflows.okta.com/oauth/workday/cb (preview 는 oktapreview.com, 정부용은 okta-gov.com)
    check: a 와 b 가 같다
  - tier: config_name
    a: okta Workflows 연결의 Tenant, Token and API Endpoint Domain
    b: workday 테넌트 이름과 REST API 호스트
    check: a 와 b 가 같다
  - tier: log_id
    a: workday Get_Workday_Account_Signons 의 API_Client_ID
    b: workday 그 API 클라이언트 Client ID
    check: a 와 b 가 같다
  - tier: log_time
    a: okta workflows.user.connection.create 시각과 사용자
    b: workday 그 ISU 의 로그인 (Get_Workday_Account_Signons)
    check: 시각이 가깝다
  activity:
  - okta workflows.user.connection.create, .delete, .reauthorize, .revoke
  - workday Get_Workday_Account_Signons (API_Client_ID), Work Contact Change 업무 프로세스 (Update Work 카드)
  sources:
  - https://help.okta.com/wf/en-us/content/topics/workflows/connector-reference/workday/overviews/authorization.htm (Authorization Code Grant, Redirection URI, Non-Expiring Refresh Tokens, scope, Client ID, Tenant, Do Not Allow UI Sessions)
  - https://help.okta.com/wf/en-us/content/topics/workflows/connector-reference/workday/workday.htm (카드 목록)
  - https://doc.workday.com/peakon/en-us/workday-peakon-employee-voice/integrations/workday-integration/gen1667304794785.html (View API Clients 리포트)
  - https://community.workday.com/sites/default/files/file-hosting/productionapi/Identity_Management/v47.0/Get_Workday_Account_Signons.html (API_Client_ID)
  - https://developer.okta.com/docs/reference/api/event-types/ (workflows.user.connection.*)
- id: email_match
  type: same_person
  what: 같은 사람의 계정 (Okta login·email = Workday 업무 이메일·Workday Account)
  identify:
    api: okta GET /api/v1/users; workday Get_Workers (Include_User_Account), Get_Workday_Account
    when: 항상
  points_to:
  - tier: via_person
    a: okta user.profile.login, email, employeeNumber
    b: workday Workday Account User_Name, 업무 이메일, Employee_ID
    check: a 와 b 가 같다
  sources:
  - https://community.workday.com/sites/default/files/file-hosting/productionapi/Human_Resources/v47.0/Get_Workers.html (Employee_ID, User_Account_Data)
  - https://community.workday.com/sites/default/files/file-hosting/productionapi/Human_Resources/v47.0/Get_Workday_Account.html (User_Name)
  note: 로그 등급 없음. 같은 사람 대조는 두 계정의 속성 비교라 로그에서 잇는 값이 따로 없다
- id: okta_ai_agent_import_workday
  type: app_grant
  what: Okta 가 Workday 의 Agent System of Record(ASOR) 에이전트를 가져와 Okta 에 등록한다(AI agent import). Workday 에 Authorization Code 방식의 OAuth 2.0 API 클라이언트를 만들고(Bearer 토큰, Okta 콜백 주소, 만료 없는 refresh token, System·Agent System of Record 기능 영역 스코프) client ID, secret, 토큰 주소를 Okta 에 넣는다. Workday 쪽은 두 기능 영역을 켜고 관리자 보안 그룹에 에이전트 관련 보안 정책 Get·Put 권한을 주고 Activate Pending Security Policy Changes 를 실행해야 한다
  identify:
    api: okta 앱 인스턴스의 AI agent import 설정(화면), workday 의 API 클라이언트 등록 목록
    when: okta 에 Workday 에이전트 가져오기 설정이 있고 Workday 에 Okta 콜백 주소를 쓰는 API 클라이언트가 있음
  points_to:
  - tier: config_id
    a: okta 에 넣은 Workday API 클라이언트의 client ID
    b: workday 에 등록한 API 클라이언트의 client ID
    check: a 와 b 가 같다
    if_unreadable: client secret 은 비밀이라 못 읽는다
  - tier: config_name
    a: okta 에 넣은 토큰 주소(Workday 테넌트)
    b: workday 테넌트의 토큰 주소
    check: a 와 b 가 같다
  - tier: log_time
    a: okta System Log app.ai_agent_provider.import.complete 의 시각
    b: workday 쪽 API 클라이언트 로그인 기록 위치는 문서에 없다
    check: 시각이 가깝다. 짝 확인 방법은 문서에 없다
  activity:
  - okta System Log app.ai_agent_provider.create, .update, .credential.validate, .import.start, .import.complete, .import_staging.confirm 등 (기존 agentforce_agent_import 와 같은 이벤트 계열)
  sources:
  - https://help.okta.com/oie/en-us/Content/topics/ai-agents/ai-agent-configure-workday.htm (ASOR 에이전트, OAuth 2.0 API 클라이언트, 사전 조건)
  - https://www.okta.com/blog/product-innovations/?page=15 (2026-07-31 Workday ASOR GA 표기. 조사 에이전트 요약, 직접 미확인)
  note: okta-workday 쌍에는 기존에 프로필 가져오기(workday_profile_source_import)가 있고 이 방법은 에이전트 가져오기다. 설정 문서에 상태·플랜 문구는 없다. 실측 없음
