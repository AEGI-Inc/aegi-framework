# gws ↔ workday 연결 규칙
# 벤더 문서로만 썼다 (2026-10-16). 시험 테넌트 결과는 ../test-environment/gws-workday.yaml 에 채운다. Workday 공통 확인 표면은 okta-workday.yaml 머리말

pair:
- gws
- workday
written: '2026-10-16'
verified: '2026-10-16'
kind: rules
note: 실제 값은 넣지 않는다. 시험 환경 값은 ../test-environment/gws-workday.yaml
methods:
- id: google_saml_idp
  type: identity
  what: Google Workspace 가 SAML IdP 로 Workday 로그인을 맡음 (Google 관리 콘솔 앱 카탈로그 「Workday Web (SAML)」, 최고 관리자). Workday 사용자 이메일 도메인이 Google 주 도메인과 같아야 한다
  identify:
    api: gws Reports applicationName=saml 의 application_name; 관리 콘솔 Apps > Web and mobile apps 의 Workday (화면)
    when: SAML 앱 Workday 가 있음
  points_to:
  - tier: config_id
    a: workday SAML Identity Providers 행의 「Issuer」
    b: gws SAML 앱 「Entity ID」
    check: a 와 b 가 같다
    if_unreadable: 'Workday: Edit Tenant Setup - Security 화면 (API 는 문서에서 찾지 못함). Google: 관리 콘솔 > 앱 > 웹 및 모바일 앱 > Workday (최고 관리자)'
  - tier: config_name
    a: workday SAML Identity Providers 행의 「IdP SSO Service URL」
    b: gws SAML 앱 「SSO URL」
    check: a 와 b 가 같다
  - tier: config_name
    a: gws SAML 앱 서비스 제공자 세부정보의 ACS URL (자리표시자를 Workday 도메인과 테넌트 이름으로 바꾼 값)
    b: workday 테넌트 주소 (Login Redirect URL https://{workday 도메인/테넌트}/login-saml2.htmld)
    check: a 와 b 가 같은 테넌트를 가리킨다
  - tier: fingerprint
    a: workday SAML Identity Providers 행의 「x509 Certificate」
    b: gws SAML 앱 Certificate
    check: a 의 sha256 과 b 가 같다
  - tier: via_person
    a: gws user primaryEmail
    b: workday Workday Account User_Name 또는 업무 이메일
    check: a 와 b 가 같다
  - tier: log_id
    a: workday Get_Workday_Account_Signons 의 SAML_Identity_Provider_Reference
    b: workday SAML Identity Providers 의 Google 행
    check: a 가 그 행을 가리킨다
  - tier: log_time
    a: gws saml login_success (application_name, initiated_by)
    b: workday Get_Workday_Account_Signons 의 Signon_DateTime, User_Name
    check: 시각이 가깝고 사람이 같다
  activity:
  - gws Reports applicationName=saml login_success, login_failure (Workday 가 어떤 application_name 으로 남는지는 문서에 없음)
  - workday Get_Workday_Account_Signons
  sources:
  - https://knowledge.workspace.google.com/admin/apps/integrations/workday-cloud-app (Workday Web (SAML), SSO URL·Entity ID·Certificate, Issuer = Entity ID, IdP SSO Service URL = SSO URL, Service Provider ID http://www.workday.com, login-saml2.htmld, 주 도메인 일치)
  - https://developers.google.com/workspace/admin/reports/v1/appendix/activity/saml (login_success, login_failure, application_name, initiated_by)
  - https://community.workday.com/sites/default/files/file-hosting/productionapi/Identity_Management/v47.0/Get_Workday_Account_Signons.html (SAML_Identity_Provider_Reference)
- id: workday_for_google_chat
  type: app_grant
  what: Google Workspace Marketplace 앱 「Workday for Google Chat」(개발자 표기 Google) 으로 Chat 에서 Workday 작업(휴가, 경비, 동료 찾기)을 함
  identify:
    api: gws admin 감사 ADD_APPLICATION, 관리 콘솔 Apps > Google Workspace Marketplace apps (화면), tokens.list displayText
    when: 앱 이름 Workday for Google Chat
  points_to:
  - tier: config_name
    a: gws 설치 앱 Workday for Google Chat (Marketplace 앱 ID 205664636212)
    b: workday 테넌트 (Workday 쪽에서 이 앱을 어떻게 등록·승인하는지는 문서에 없음. 연결해 보고 View API Clients 와 로그인 기록을 본다)
    check: 같은 조직에서 설치와 Workday 로그인이 함께 있다
  - tier: via_person
    a: gws 설치·사용자
    b: workday Workday Account
    check: 같은 사람
  - tier: log_id
    a: gws admin 감사 ADD_APPLICATION·ADD_APPLICATION_TO_WHITELIST 의 APP_ID
    b: Marketplace 앱 ID 205664636212 (Workday for Google Chat)
    check: a 와 b 가 같다
  - tier: log_time
    a: gws token 감사 authorize 시각과 actor.email
    b: workday Get_Workday_Account_Signons 의 Signon_DateTime, User_Name, API_Client_ID
    check: 시각이 가깝고 사람이 같다
  activity:
  - gws admin 감사 ADD_APPLICATION, token 감사 authorize
  - workday Get_Workday_Account_Signons (API_Client_ID, Authentication_Type)
  sources:
  - https://workspace.google.com/marketplace/app/workday_for_google_chat/205664636212 (앱 이름, 개발자 Google, 기능)
  - https://developers.google.com/workspace/admin/reports/v1/appendix/activity/admin-domain-settings (ADD_APPLICATION)
  - https://community.workday.com/sites/default/files/file-hosting/productionapi/Identity_Management/v47.0/Get_Workday_Account_Signons.html (Signon_DateTime, User_Name, Authentication_Type, SAML_Identity_Provider_Reference, API_Client_ID, Signon_IP_Address)
- id: workday_for_google_sheets
  type: app_grant
  what: Google Sheets 부가기능 「Workday for Google Sheets」(Workday, Inc. 게시) 가 Workday Adaptive Planning 데이터를 Sheets 로 가져옴. Adaptive Planning 은 HCM·Financials 테넌트와 별개 제품이다
  identify:
    api: gws admin 감사 ADD_APPLICATION, Marketplace apps (화면), tokens.list displayText
    when: 앱 이름 Workday for Google Sheets
  points_to:
  - tier: config_name
    a: gws 설치 앱 Workday for Google Sheets (Marketplace 앱 ID 154487802303)
    b: workday Adaptive Planning 인스턴스 (Adaptive Planning 쪽 확인 방법은 이 규칙 범위 밖)
    check: 설치한 사람이 Adaptive Planning 사용자다
  - tier: log_id
    a: gws admin 감사 ADD_APPLICATION·ADD_APPLICATION_TO_WHITELIST 의 APP_ID
    b: Marketplace 앱 ID 154487802303 (Workday for Google Sheets)
    check: a 와 b 가 같다
  activity:
  - gws admin 감사 ADD_APPLICATION, token 감사 authorize
  sources:
  - https://workspace.google.com/marketplace/app/workday_for_google_sheets/154487802303 (앱 이름, Workday, Inc., Adaptive Planning 데이터)
  - "https://developers.google.com/workspace/admin/reports/v1/appendix/activity/admin-domain-settings (ADD_APPLICATION·ADD_APPLICATION_TO_WHITELIST: APP_ID, APPLICATION_NAME. AUTHORIZE_API_CLIENT_ACCESS: API_CLIENT_NAME, API_SCOPES)"
  note: Adaptive Planning 쪽 로그는 이 규칙 범위 밖이라 로그 시각 등급은 적지 않는다
- id: learning_google_calendar
  type: stored_credential
  what: Workday Learning 이 강의 초대를 Google Calendar 로 보냄. Google Cloud 프로젝트에서 받은 「Service Owners Key」와 메일함 주소를 Workday 테넌트 설정에 넣는다. 도메인 전체 위임은 쓰지 않고 설정한 메일함 하나에서 15분마다 보낸다
  identify:
    api: workday Edit Tenant Setup - HCM > Learning 의 Calendar Integration (Calendar Provider = Google Calendar, ISU, Service Owners Key, Mailbox. 화면)
    when: Calendar Integration 이 켜져 있고 Calendar Provider 가 Google Calendar
  points_to:
  - tier: config_name
    a: workday Learning 설정의 Mailbox 주소
    b: gws 사용자 primaryEmail (그 메일함. Google Cloud 프로젝트에 등록한 주소와 같아야 한다)
    check: a 와 b 가 같다
  - tier: config_id
    a: workday Learning 설정의 Service Owners Key (값은 보지 않는다)
    b: gws(Google Cloud) 프로젝트의 그 키 (어떤 종류의 키인지는 Workday 문서에 없음)
    check: 같은 프로젝트의 키다 (프로젝트·키 ID 로만)
  - tier: log_time
    a: workday Learning Calendar Integration Status 리포트의 실행 시각
    b: gws Calendar 감사의 그 메일함 일정 생성 시각 (이벤트 이름은 이 규칙에서 확인하지 않음)
    check: 시각이 가깝다
  activity:
  - workday Learning Calendar Integration Status 리포트
  sources:
  - https://doc.workday.com/admin-guide/en-us/human-capital-management/learning/learning-content/configure-google-calendar-for-learning.html (Service Owners Key, Mailbox, domain-wide delegation 안 씀, 15분, ISU, Learning Calendar Integration Status)
- id: interview_scheduling_google_calendar
  type: app_grant
  what: Workday Marketplace 앱 「Interview Scheduling by Workday (for Google)」 이 면접 일정을 Google Calendar 초대로 보냄 (Workday 게시)
  identify:
    api: workday 앱 설정 (Workday Marketplace 개요 페이지에는 Google 쪽 권한·설정이 없음)
    when: 그 앱을 씀
  points_to:
  - tier: config_name
    a: workday 면접 일정 기능이 쓰는 Google 계정 (설정 값은 문서에 없음. 연결해 보고 읽는다)
    b: gws 사용자 또는 OAuth 승인 앱 (token 감사 authorize)
    check: 같은 계정이다
  sources:
  - https://marketplace.workday.com/en-US/apps/414158/google-calendar-interview-management-integration/overview (Google Calendar 로 초대, Workday 게시) [브라우저]
  note: 로그 등급 없음. Workday 쪽 설정 값이 문서에 없어 어느 로그의 무엇을 맞출지 정할 수 없다. 연결해 보고 gws token 감사 authorize 와 Workday 로그인 기록을 본다
- id: person_link
  type: same_person
  what: 같은 사람 (Google 계정 ↔ Workday 계정)
  identify:
    api: gws users primaryEmail; workday Get_Workers, Get_Workday_Account
    when: 항상
  points_to:
  - tier: via_person
    a: gws user primaryEmail
    b: workday 업무 이메일, Workday Account User_Name
    check: a 와 b 가 같다
  sources:
  - https://community.workday.com/sites/default/files/file-hosting/productionapi/Human_Resources/v47.0/Get_Workers.html (Email_Address)
  note: 로그 등급 없음. 같은 사람 대조는 두 계정의 속성 비교라 로그에서 잇는 값이 따로 없다
- id: workday_a2a_gemini_enterprise
  type: app_grant
  what: Gemini Enterprise 같은 외부 AI 플랫폼이 A2A 프로토콜로 Workday Self-Service Agent 를 부른다. Workday 쪽은 Agent System of Record 에 외부 에이전트 정의를 POST 하고, ISU 와 Agent System of Record 기능 영역의 통합 API 클라이언트(Workday Owned Scopes 포함)를 만들어 ISU 의 refresh token 을 낸다. 게이트웨이의 well-known 주소(테넌트 별칭, 에이전트 WID)에서 Agent Card 를 받아 외부 플랫폼에 가져오고, 같은 클라이언트 자격 증명과 PKCE 로 OAuth 를 설정한다
  identify:
    api: workday Agent System of Record 의 외부 에이전트 정의와 통합 API 클라이언트, 게이트웨이의 Agent Card 주소
    when: Workday 에 외부 에이전트 정의가 있고 Gemini Enterprise 에 가져온 Agent Card 가 있음
  points_to:
  - tier: config_id
    a: workday 통합 API 클라이언트의 client ID
    b: Gemini Enterprise 의 OAuth 설정에 넣은 client ID
    check: a 와 b 가 같다
    if_unreadable: client secret 은 비밀이라 못 읽는다
  - tier: config_name
    a: workday 게이트웨이의 Agent Card 주소(테넌트 별칭, 에이전트 WID)
    b: Gemini Enterprise 에 가져온 Agent Card
    check: a 와 b 가 같다
  - tier: via_person
    a: workday 에이전트 활성화 때 지정한 보안 그룹의 사용자
    b: Gemini Enterprise 에서 에이전트 역할을 받은 사용자·그룹
    check: 같은 사람
  - tier: log_time
    a: workday 쪽 호출 기록 위치는 문서에 없다
    b: gws 쪽 대응 기록 위치는 문서에 없다
    check: 시각이 가깝다. 짝 확인 방법은 문서에 없다
  activity:
  - 문서에 없다
  sources:
  - https://doc.workday.com/admin-guide/en-us/workday-ai/agents/external-agents/connect-external-agent-to-workday-using-a2a.html (등록, 인증, Agent Card, 외부 플랫폼 설정, 접근 제한)
  note: 출시 단계, 플랜, 비용은 문서에 없다. 정의 API 예시 페이지(reference--definition-api)는 열지 못했다. 실측 없음
