# salesforce ↔ workday 연결 규칙
# 벤더 문서로만 썼다 (2026-10-16). 시험 테넌트 결과는 ../test-environment/salesforce-workday.yaml 에 채운다. Workday 공통 확인 표면은 okta-workday.yaml 머리말
# Salesforce AuthProvider ProviderType 값에 Workday 는 없다 (sforce_api_objects_authprovider.htm). 2024-07-24 두 회사의 Agentforce 직원 서비스 에이전트 발표는 계획만 적는다 (https://www.salesforce.com/news/press-releases/2024/07/24/workday-employee-service-agent/). AppExchange 의 Workday 연동 목록은 찾지 못했다
# Workday 의 2025 사회공학 사고 공지는 「third-party CRM platform」 의 업무 연락처가 노출됐고 고객 테넌트 접근 징후는 없다고 적는다. 플랫폼 이름은 적지 않는다 (https://blog.workday.com/en-us/protecting-you-from-social-engineering-campaigns-update-from-workday.html). 테넌트 사이 연결 방법은 아니다

pair:
- salesforce
- workday
written: '2026-10-16'
verified: '2026-10-16'
kind: rules
note: 실제 값은 넣지 않는다. 시험 환경 값은 ../test-environment/salesforce-workday.yaml
methods:
- id: mulesoft_workday_connector
  type: stored_credential
  what: MuleSoft Anypoint Workday 커넥터(Salesforce 회사 제품)가 Workday 표준 작업을 부름. 인증은 Basic(사용자 이름, 비밀번호, 호스트, 테넌트), Workday OAuth Code(Consumer Key·Secret), x.509 세 가지다. 설정은 Mule 앱에 있고 Salesforce 조직(SOQL)에는 남지 않는다
  identify:
    api: mulesoft Mule 앱의 Workday 커넥터 설정 (Anypoint 쪽. 이 저장소 수집 범위 밖); workday Get_Integration_System_Users, View API Clients
    when: Workday 접속 계정이 Mule 용 ISU 이거나 API 클라이언트가 Mule 용
  points_to:
  - tier: config_name
    a: mulesoft 커넥터 설정의 Host Name, Tenant Name
    b: workday 테넌트 주소와 이름
    check: a 와 b 가 같다
  - tier: config_name
    a: mulesoft 커넥터 설정의 User Name (Basic·x.509)
    b: workday Get_Integration_System_Users 의 User_Name
    check: a 와 b 가 같다
  - tier: config_id
    a: mulesoft 커넥터 설정의 Consumer Key (OAuth Code)
    b: workday View API Clients 의 Client ID
    check: a 와 b 가 같다
  - tier: log_id
    a: workday Get_Workday_Account_Signons 의 API_Client_ID, User_Name
    b: 그 Consumer Key 또는 ISU
    check: a 와 b 가 같다
  activity:
  - workday Get_Workday_Account_Signons, User Activity Logging (System Account = 그 계정)
  sources:
  - https://docs.mulesoft.com/workday-connector/latest/workday-connector-studio (Basic·OAuth Code·x.509 필드, Tenant Name, Consumer Key, 연결 시험 Get_Degrees)
  - https://community.workday.com/sites/default/files/file-hosting/productionapi/Identity_Management/v47.0/Get_Workday_Account_Signons.html (API_Client_ID, User_Name)
  - https://community.workday.com/sites/default/files/file-hosting/productionapi/Integrations/v47.0/Get_Integration_System_Users.html (User_Name)
- id: person_link
  type: same_person
  what: 같은 사람 (Salesforce 사용자 ↔ Workday 계정)
  identify:
    api: salesforce SOQL User; workday Get_Workers
    when: 항상
  points_to:
  - tier: via_person
    a: salesforce User.Email, FederationIdentifier
    b: workday 업무 이메일, Employee_ID
    check: a 와 b 가 같다
  sources:
  - https://community.workday.com/sites/default/files/file-hosting/productionapi/Human_Resources/v47.0/Get_Workers.html (Email_Address, Employee_ID)
  note: 로그 등급 없음. 같은 사람 대조는 두 계정의 속성 비교라 로그에서 잇는 값이 따로 없다
- id: agentforce_registry_workday_mcp
  type:
  - app_grant
  - stored_credential
  what: Salesforce Agentforce 가 Agentforce Registry 에 등록한 Workday MCP 서버(https://us.agent.workday.com/mcp)로 Workday 를 부른다. Workday 쪽은 Agent System of Record 설정, External Agent 등록, 보안 정책 구성이 필요하고, 인증은 OAuth authorization code 로 Agent System User 토큰(액세스 60분, 리프레시 24시간)을 받는다. Workday 문서는 Extend Professionals 전용이라고 적는다. 등록 때 서버 이름·URL·인증 방식(No Authentication, OAuth 2.0, Use External Credential)을 정하면 Salesforce 가 Named Credential, External Credential, 「{서버이름} Permission Set」을 만들고, 허용한 도구가 Agentforce Assets > Actions 에 「도구 이름 서버 이름」 꼴로 나온다. 사용자별 인증은 Employee 에이전트에만 된다
  identify:
    api: salesforce Setup > Agentforce Registry 의 MCP 서버 (이름, URL, 인증), Named Credential·External Credential·PermissionSet 「{서버이름} Permission Set」, Agentforce Assets > Actions. workday External Agent 등록과 Agent System User
    when: salesforce Agentforce Registry 에 URL 이 agent.workday.com/mcp 인 MCP 서버가 있음
  points_to:
  - tier: config_name
    a: salesforce Agentforce Registry 의 MCP 서버 URL
    b: workday MCP 서버 주소 https://us.agent.workday.com/mcp
    check: a 와 b 가 같다
  - tier: config_id
    a: salesforce External Credential 의 OAuth Client ID
    b: workday External Agent 의 OAuth Client ID
    check: a 와 b 가 같다
  - tier: via_person
    a: salesforce 사용자 (사용자별 인증일 때 본인이 OAuth 동의)
    b: workday Agent System User
    check: 같은 사람
  - tier: log_time
    a: workday 쪽 호출 기록 위치는 문서에 없다
    b: salesforce 쪽 대응 기록 위치는 문서에 없다
    check: 시각이 가깝다. 짝 확인 방법은 문서에 없다
  activity:
  - 문서에 없다
  sources:
  - https://help.salesforce.com/s/articleView?id=ai.agent_mcp_connect_register.htm&language=en_US (Agentforce Registry > New, 인증 No Authentication·OAuth 2.0·Use External Credential, 사용자별 인증은 Employee 에이전트만, 자동 생성 Named Credential·External Credential·「{서버이름} Permission Set」, 도구 이름 「Tool Name ServerName」, 에디션 Enterprise·Performance·Unlimited·Developer, 권한 Manage AI Agents) [Exa]
  - https://doc.workday.com/admin-guide/en-us/workday-ai/agents/external-agents/connect-an-external-agent-with-workday-mcp.html?toc=0.8.6 (주소, ASU, 토큰 수명, Extend Professionals, 호환 예시에 Salesforce 없음) [Exa]
  note: Workday 문서는 Agentforce 를 호환 플랫폼으로 들지 않는다. 실측 없음
- id: data360_workday_connector
  type: stored_credential
  what: Salesforce Data 360 이 Workday 의 데이터를 가져온다(정형 데이터). 배치 수집은 GA, Zero Copy(Query Federation)는 베타다. 연결을 만들려면 Workday 쪽 자격 증명을 Data 360 연결에 넣는다
  identify:
    api: salesforce Data 360 설정의 연결(Data Cloud 데이터 스트림·연결 목록), workday Integration System User 목록
    when: Data 360 에 Workday 커넥터 연결이 있음
  points_to:
  - tier: config_name
    a: salesforce Data 360 연결에 넣은 Workday 테넌트 주소
    b: workday 테넌트 주소
    check: a 와 b 가 같다
  - tier: via_person
    a: salesforce Data 360 연결이 쓰는 Workday 사용자(ISU)
    b: workday Integration System User
    check: 같은 계정
  - tier: log_time
    a: salesforce 쪽 수집 실행 기록 위치는 문서에 없다
    b: workday 쪽 ISU 로그인 기록
    check: 시각이 가깝다. 짝 확인 방법은 문서에 없다
  activity:
  - workday ISU 로그인 기록 (문서의 세부는 확인하지 못했다)
  sources:
  - https://developer.salesforce.com/docs/data/data-cloud-int/guide/c360-a-workday-connector.html (정형, 배치 GA, Zero Copy 베타) [Exa]
  - https://developer.salesforce.com/docs/data/data-cloud-int/guide/c360-a-set-up-workday-connection.html (인증 방식. 조사 에이전트 요약, 직접 미확인) [Exa]
  note: 기존 mulesoft_workday_connector·isu_password_integration 과 방식이 겹칠 수 있다. 이 방법은 Salesforce 의 Data 360 이 직접 읽는 경우라 따로 둔다. 인증 방식이 Workday 사용자 이름·비밀번호라는 점은 조사 에이전트 요약이다. 플랜·에디션은 문서에 없다. 실측 없음
