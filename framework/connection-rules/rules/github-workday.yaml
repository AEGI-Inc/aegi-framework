# github ↔ workday 연결 규칙
# 벤더 문서로만 썼다 (2026-10-16). 시험 테넌트 결과는 ../test-environment/github-workday.yaml 에 채운다. Workday 공통 확인 표면은 okta-workday.yaml 머리말
# 두 SaaS 를 직접 잇는 공개 문서는 찾지 못했다. GitHub Marketplace 「workday」 검색에 Workday 앱·액션이 없었고, Workday Extend 공개 페이지에 GitHub·CI 언급이 없었다 (2026-10-16). GitHub 과 Workday 를 잇는 것은 Workato·Zapier 같은 제3자 플랫폼 목록뿐이었고 원문은 열지 않았다

pair:
- github
- workday
written: '2026-10-16'
verified: '2026-10-16'
kind: rules
note: 실제 값은 넣지 않는다. 시험 환경 값은 ../test-environment/github-workday.yaml
methods:
- id: person_link
  type: same_person
  what: 같은 사람 (GitHub 계정 ↔ Workday 계정)
  identify:
    api: github GraphQL externalIdentities (SAML nameId), 커밋 이메일; workday Get_Workers
    when: 항상
  points_to:
  - tier: via_person
    a: github SAML nameId, 검증 이메일
    b: workday 업무 이메일
    check: a 와 b 가 같다
  sources:
  - https://community.workday.com/sites/default/files/file-hosting/productionapi/Human_Resources/v47.0/Get_Workers.html (Email_Address)
  note: 로그 등급 없음. 같은 사람 대조는 두 계정의 속성 비교라 로그에서 잇는 값이 따로 없다
