<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SaaS 연결 지도</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<style>
/* 레이아웃: 쌍마다 한 화면. 양옆 기둥(두 SaaS) 사이를 가로선이 잇고, 선 가운데에 방법 카드 */
:root {
  --bg: #f2f4f1; --surface: #ffffff; --ink: #18201c; --muted: #5d6a63; --rule: #cdd4ce; --pillar: #e3e8e3;
  --ok: #0b6b5e; --out: #a3650f; --cfg: #2c5ca3; --unk: #6a4e9e; --off: #8e9992;
  --ok-bg: #dcefe9; --out-bg: #f6e8d2; --cfg-bg: #dfe8f6; --unk-bg: #ebe4f5; --off-bg: #e9ecea;
  --font: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Consolas, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #111614; --surface: #1a221f; --ink: #e5ebe7; --muted: #9aa69f; --rule: #34403a; --pillar: #222c28;
  --ok: #43c2aa; --out: #e2a548; --cfg: #82a8ea; --unk: #b69ee8; --off: #75817b;
  --ok-bg: #173a33; --out-bg: #3d2d14; --cfg-bg: #1d2b44; --unk-bg: #2c2340; --off-bg: #262e2b; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #111614; --surface: #1a221f; --ink: #e5ebe7; --muted: #9aa69f; --rule: #34403a; --pillar: #222c28;
  --ok: #43c2aa; --out: #e2a548; --cfg: #82a8ea; --unk: #b69ee8; --off: #75817b;
  --ok-bg: #173a33; --out-bg: #3d2d14; --cfg-bg: #1d2b44; --unk-bg: #2c2340; --off-bg: #262e2b; color-scheme: dark }
* { box-sizing: border-box }
body { background: var(--bg); color: var(--ink); font-family: var(--font); font-size: 15px; line-height: 1.55; margin: 0 }
.wrap { max-width: 1180px; margin: 0 auto; padding-inline: 20px; padding-block: 28px 64px }
header h1 { font-size: 1.7rem; font-weight: 700; letter-spacing: -0.01em; margin: 0 0 4px; text-wrap: balance }
header p { margin: 0; color: var(--muted); max-width: 70ch }
nav { display: flex; flex-wrap: wrap; gap: 6px; margin-block: 20px 22px }
.saasf { display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: center; margin: 0 0 10px; font-size: 0.86rem }
.saasf label { display: inline-flex; gap: 5px; align-items: center; cursor: pointer }
.saasf button { font: inherit; font-size: 0.78rem; padding: 2px 10px; border-radius: 999px; border: 1px solid var(--rule); background: var(--surface); color: var(--ink); cursor: pointer }
nav button { font: 500 0.86rem var(--font); color: var(--ink); background: var(--surface); border: 1px solid var(--rule); border-radius: 999px; padding: 6px 12px; cursor: pointer }
nav button[aria-selected="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink) }
nav button:focus-visible, .ov-pair:focus-visible { outline: 2px solid var(--ok); outline-offset: 2px }
nav .sep { width: 1px; background: var(--rule); margin-inline: 4px }
.legend { display: flex; flex-wrap: wrap; gap: 8px 18px; font-size: 0.82rem; color: var(--muted); align-items: center; margin-bottom: 14px }
.legend .k { display: inline-flex; align-items: center; gap: 6px }
.tools { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between; margin-bottom: 18px }
.tools label { font-size: 0.86rem; display: inline-flex; gap: 6px; align-items: center; cursor: pointer }
.count { font-size: 0.86rem; color: var(--muted); font-variant-numeric: tabular-nums }

/* 쌍 화면 */
.pair-title { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; margin: 0 0 6px }
.pair-title h2 { font-size: 1.35rem; margin: 0; letter-spacing: -0.01em }
.bridge { display: grid; grid-template-columns: 7.5rem minmax(1.25rem, 1fr) minmax(0, 46rem) minmax(1.25rem, 1fr) 7.5rem; row-gap: 14px; position: relative }
.pillar { grid-row: 1 / span var(--rows); background: var(--pillar); border-radius: 10px; display: flex; justify-content: center; padding-top: 14px; min-width: 0 }
.pillar.l { grid-column: 1 } .pillar.r { grid-column: 5 }
.pillar span { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 12px); align-self: flex-start; font-weight: 700; font-size: 0.98rem; text-align: center; padding-inline: 8px; overflow-wrap: anywhere }
.wire { align-self: center; height: 0; border-top: 3px solid var(--ok); position: relative }
.wire.l { grid-column: 2 } .wire.r { grid-column: 4 }
.wire::after { content: ""; position: absolute; top: -7px; width: 0; height: 0; border-block: 5.5px solid transparent }
.wire.r.head::after { right: -2px; border-left: 9px solid currentColor }
.wire.l.head::after { left: -2px; border-right: 9px solid currentColor }
.wire.dot::after { top: -6px; width: 9px; height: 9px; border: 0; border-radius: 50%; background: currentColor }
.wire.l.dot::after { left: -4px } .wire.r.dot::after { right: -4px }
.wire { color: var(--ok) }
.card { grid-column: 3; background: var(--surface); border: 1px solid var(--rule); border-radius: 10px; padding: 12px 14px; min-width: 0 }
.card .top { display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: baseline; justify-content: space-between }
.mid { font-family: var(--mono); font-size: 0.78rem; color: var(--muted) }
.dir { font-size: 0.78rem; color: var(--muted); white-space: nowrap }
.what { font-weight: 600; margin: 2px 0 8px; text-wrap: pretty }
.chk { font-size: 0.86rem; display: grid; grid-template-columns: auto 1fr; gap: 2px 8px }
.chk dt { color: var(--muted); font-size: 0.78rem; padding-top: 2px }
.chk dd { margin: 0; min-width: 0; overflow-wrap: anywhere }
.tier { display: inline-block; font-size: 0.72rem; font-weight: 600; letter-spacing: 0.02em; padding: 0 6px; border-radius: 4px; border: 1px solid var(--rule); margin-inline: 2px; vertical-align: 1px }
.tier.t-ID { color: var(--ok); border-color: var(--ok) } .tier.t-지문 { color: var(--cfg); border-color: var(--cfg) } .tier.t-이름 { color: var(--ink) } .tier.t-사람 { color: var(--unk); border-color: var(--unk) } .tier.t-로그 { color: var(--out); border-color: var(--out) }
.note { color: var(--muted); font-size: 0.78rem }
.idf { font-size: 0.8rem; color: var(--muted); margin: -2px 0 8px; overflow-wrap: anywhere }
.lbl { font-size: 0.72rem; font-weight: 600; letter-spacing: 0.03em; color: var(--muted); margin-right: 4px }
.checks { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px }
.checks > li { display: grid; grid-template-columns: 4.6rem minmax(0, 1fr); gap: 2px 8px; align-items: start; padding: 6px 0; border-top: 1px solid var(--rule) }
.checks > li:first-child { border-top: 0; padding-top: 0 }
.checks > li > :not(.tier) { grid-column: 2 }
.checks .tier { justify-self: start; margin: 2px 0 0 }
.checks .noteonly { display: block; color: var(--muted); font-size: 0.82rem }
.pair { display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); gap: 8px; align-items: start; font-size: 0.84rem }
.side { min-width: 0; overflow-wrap: anywhere }
.eq { font-family: var(--mono); font-weight: 600; color: var(--muted); padding-top: 1px }
.how { font-size: 0.78rem; color: var(--muted); overflow-wrap: anywhere }
details { font-size: 0.8rem; color: var(--muted) }
details summary { cursor: pointer; color: var(--ink); font-size: 0.78rem; font-weight: 500 }
details.more { margin-top: 8px; border-top: 1px dashed var(--rule); padding-top: 6px }
details.more ul { margin: 6px 0; padding-left: 1.1rem }
details p { margin: 6px 0; overflow-wrap: anywhere }
.tier.t-로그 { white-space: nowrap }
code { font-family: var(--mono); font-size: 0.82em; background: var(--off-bg); padding: 0 4px; border-radius: 4px }
.row { display: contents }
.row[hidden] { display: none !important }

/* 전체 지도 */
.ov { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr); gap: 22px; align-items: start }
.ov svg { width: 100%; height: auto; display: block; background: var(--surface); border: 1px solid var(--rule); border-radius: 12px }
.ov svg text { font-family: var(--font); fill: var(--ink) }
.ov-list { display: grid; gap: 8px }
.ov-pair { display: grid; grid-template-columns: 1fr auto; gap: 2px 10px; text-align: left; font: inherit; color: inherit; background: var(--surface); border: 1px solid var(--rule); border-radius: 10px; padding: 10px 12px; cursor: pointer }
.ov-pair b { font-weight: 600 }
.ov-pair .n { font-size: 0.82rem; color: var(--muted); font-variant-numeric: tabular-nums }
.ov-note { font-size: 0.84rem; color: var(--muted); margin-top: 12px; max-width: 70ch }

@media (max-width: 780px) {
  .bridge { grid-template-columns: minmax(0, 1fr) }
  .pillar, .wire { display: none }
  .card { grid-column: 1 }
  .dir { color: var(--ink); font-weight: 600 }
  .ov { grid-template-columns: minmax(0, 1fr) }
}
@media (prefers-reduced-motion: no-preference) { nav button, .ov-pair { transition: background-color .15s, border-color .15s } }
</style>

<div class="wrap">
  <header>
    <h1>SaaS 연결 지도</h1>
    <p>Okta, GitHub, Google Workspace, Slack, Atlassian(Jira·Confluence·Bitbucket), Salesforce 사이와 각 SaaS 밖으로 이어질 수 있는 방법 <span id="total"></span>개. 방법마다 어느 쪽이 어느 쪽을 부르는지, 무슨 값이 같으면 이어진 것인지 보여 준다. 아래에서 SaaS 를 고르면 그 사이의 쌍만 남는다.</p>

</div>

document.getElementById('total').textContent = PAGES.reduce((n, p) => n + p.rows.length, 0);
const NAME = { 'Google Workspace': 'GWS', '밖 (외부 서버·서비스)': '밖' };
const short = s => NAME[s] || s;
const esc = s => s.replace(/[&<>"]/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[ch]));
const TIERS = ['ID', '이름', '지문', '사람', '로그'];
function fmtCheck(text) {
  let h = esc(text).replace(/`([^`]+)`/g, '<code>$1</code>');
  return h.replace(/\(([^()]*)\)/g, (m, inner) => {
    const parts = inner.split(/,\s*/);
    if (!parts.some(p => TIERS.includes(p.trim()))) return m;
    const tiers = parts.filter(p => TIERS.includes(p.trim())).map(p => `<span class="tier t-${p.trim()}">${p.trim()}</span>`).join('');
    const rest = parts.filter(p => !TIERS.includes(p.trim())).join(', ');
    return tiers + (rest ? ` <span class="note">${rest}</span>` : '');
  });
}
const fmtText = t => esc(String(t || '')).replace(/`([^`]+)`/g, '<code>$1</code>');
const dirText = (p, d) => d === '>' ? `${short(p.left)} → ${short(p.right)}` : d === '<' ? `${short(p.right)} → ${short(p.left)}` : `${short(p.left)} ↔ ${short(p.right)}`;

function renderPair(p) {
  const rows = p.rows.map(r => {
    const lw = r.dir === '<' ? 'head' : r.dir === '=' ? 'dot' : '';
    const rw = r.dir === '>' ? 'head' : r.dir === '=' ? 'dot' : '';
    return `<div class="row">
      <div class="wire l ${lw}" aria-hidden="true"></div>
      <article class="card">
        <div class="top"><span class="mid">${esc(r.id)}</span><span class="dir">${dirText(p, r.dir)}</span></div>
        <div class="what">${fmtCheck(r.what)}</div>
        ${r.identify ? `<div class="idf"><span class="lbl">알아보는 법</span> ${fmtText(r.identify)}</div>` : ''}
        <ol class="checks">${r.checks.map(c => c.tier ? `<li><span class="tier t-${c.tier.split(' ')[0]}">${c.tier}</span>
          <div class="pair"><span class="side">${fmtText(c.a)}</span><span class="eq" title="${esc(c.check)}">${c.check.includes('sha256') ? '#=' : c.tier.startsWith('로그 시각') ? '≈' : '='}</span><span class="side">${fmtText(c.b)}</span></div>
          ${c.check && !/^a 와 b 가 같다$/.test(c.check) ? `<div class="how">${fmtText(c.check)}</div>` : ''}
          ${c.alt ? `<details><summary>못 읽을 때</summary>${fmtText(c.alt)}</details>` : ''}
          ${c.note ? `<div class="how">${fmtText(c.note)}</div>` : ''}</li>` : `<li class="noteonly">${fmtText(c.note)}</li>`).join('') || '<li class="noteonly">같은 값으로 잇는 방법이 정해지지 않았다 (본문 링크 등)</li>'}</ol>
        ${r.alt || r.note || r.activity.length ? `<details class="more"><summary>${[r.activity.length ? `활동 로그 ${r.activity.length}` : '', r.alt ? '못 읽을 때' : '', r.note ? '메모' : ''].filter(Boolean).join(' · ')}</summary>
          ${r.activity.length ? `<ul>${r.activity.map(a => `<li>${fmtText(a)}</li>`).join('')}</ul>` : ''}
          ${r.alt ? `<p>${fmtText(r.alt)}</p>` : ''}${r.note ? `<p class="note">${fmtText(r.note)}</p>` : ''}</details>` : ''}
      </article>
      <div class="wire r ${rw}" aria-hidden="true"></div>
    </div>`;
  }).join('');
  return `<section aria-labelledby="h-${p.key}">
    <div class="pair-title"><h2 id="h-${p.key}">${esc(p.left)} ↔ ${esc(p.right)}</h2><span class="count">방법 ${p.rows.length}개</span></div>
    ${legend()}
    <div class="bridge" style="--rows:${p.rows.length}">
      <div class="pillar l"><span>${esc(p.left)}</span></div>
      ${rows}
      <div class="pillar r"><span>${esc(p.right)}</span></div>
    </div>
  </section>`;
}
function legend() {
  return `<div class="legend">

    <span class="k">근거 등급 (강한 순) <span class="tier t-ID">ID</span><span class="tier t-이름">이름</span><span class="tier t-지문">지문</span><span class="tier t-사람">사람</span><span class="tier t-로그">로그 ID</span><span class="tier t-로그">로그 시각</span></span>
    <span class="k"><code>=</code> 값이 같다, <code>#=</code> sha256 지문이 같다, <code>≈</code> 시각이 가깝다</span>
  </div>`;
}

function renderOverview() {
  const pos = { Okta: [110, 160], GitHub: [690, 160], 'Google Workspace': [110, 490], Slack: [690, 490], Atlassian: [400, 50], Salesforce: [400, 600], '밖 (외부 서버·서비스)': [400, 325] };
  const placed = Object.entries(pos).map(([n, [x, y]]) => [x, y, n.startsWith('밖') ? 75 : 85, 26]); const lines = PAGES.filter(saasVisible).map(p => {
    const [x1, y1] = pos[p.left], [x2, y2] = pos[p.right];
    const mx = (x1 + x2) / 2, my = (y1 + y2) / 2;
    const ext = p.right.startsWith('밖');
    const cands = ext ? [0.55, 0.45, 0.65, 0.35, 0.75] : [0.5, 0.4, 0.6, 0.3, 0.7, 0.25, 0.75, 0.2, 0.8]; let best = null, bestHit = Infinity; for (const c of cands) { const cx = x1 + (x2 - x1) * c, cy = y1 + (y2 - y1) * c; const hit = placed.reduce((s, [bx, by, bw, bh]) => s + Math.max(0, 52 + bw + 4 - Math.abs(cx - bx)) * Math.max(0, 17 + bh + 3 - Math.abs(cy - by)), 0); if (hit < bestHit) { best = [cx, cy]; bestHit = hit } if (!hit) break } const [lx, ly] = best; placed.push([lx, ly, 52, 17]);
    return `<g class="edge" data-key="${p.key}" style="cursor:pointer" tabindex="0" role="button" aria-label="${esc(p.left)}와 ${esc(p.right)} 보기">
      <line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="var(--rule)" stroke-width="${2 + p.rows.length * 0.5}" stroke-linecap="round"/>
    </g>\u0001<g class="edge" data-key="${p.key}" style="cursor:pointer" aria-hidden="true">
      <rect x="${lx - 52}" y="${ly - 17}" width="104" height="26" rx="8" fill="var(--surface)" stroke="var(--rule)"/>
      <text x="${lx}" y="${ly + 1}" text-anchor="middle" font-size="12.5" font-weight="600">방법 ${p.rows.length}</text>
    </g>\u0001`;
  }).join('');
  const nodes = Object.entries(pos).map(([name, [x, y]]) => {
    const w = name.startsWith('밖') ? 150 : 170;
    return `<g><rect x="${x - w / 2}" y="${y - 26}" width="${w}" height="52" rx="12" fill="${name.startsWith('밖') ? 'var(--pillar)' : 'var(--ink)'}"/>
      <text x="${x}" y="${y + 6}" text-anchor="middle" font-size="16" font-weight="700" style="fill:${name.startsWith('밖') ? 'var(--ink)' : 'var(--bg)'}">${esc(short(name) === '밖' ? '밖 (외부)' : name)}</text></g>`;
  }).join('');
  const list = PAGES.filter(saasVisible).map(p => {
    return `<button class="ov-pair" data-key="${p.key}"><b>${esc(short(p.left))} ↔ ${esc(short(p.right))}</b><span class="n">${p.rows.length}개</span></button>`;
  }).join('');
  return `<section aria-label="전체 지도"><div class="ov">
    <div><svg viewBox="0 0 800 650" role="img" aria-label="SaaS 와 밖 사이 연결 방법 수">${lines.split('\u0001').filter((_, i) => i % 2 === 0).join('')}${nodes}${lines.split('\u0001').filter((_, i) => i % 2 === 1).join('')}</svg>
      <p class="ov-note">선 굵기는 규칙에 있는 방법 수. 선이나 오른쪽 목록을 누르면 그 쌍으로 간다.</p></div>
    <div class="ov-list">${list}</div></div>${legend()}</section>`;
}

// SaaS 고르기: 고른 SaaS 사이의 쌍과, 고른 SaaS 의 「밖」 쌍만 보인다
const SAAS = ['Okta', 'GitHub', 'Google Workspace', 'Slack', 'Atlassian', 'Salesforce'];
let saasSel = new Set(SAAS); try { const v = localStorage.getItem('saas'); if (v) saasSel = new Set(JSON.parse(v).filter(x => SAAS.includes(x))) } catch {}
if (!saasSel.size) saasSel = new Set(SAAS);
const saasVisible = p => saasSel.has(p.left) && (saasSel.has(p.right) || p.right.startsWith('밖'));
const saasf = document.getElementById('saasf');
saasf.innerHTML = `<span class="lbl">SaaS</span>` + SAAS.map(n => `<label><input type="checkbox" data-saas="${esc(n)}" ${saasSel.has(n) ? 'checked' : ''}> ${esc(short(n))}</label>`).join('') + `<button type="button" id="saasAll">모두</button>`;
saasf.addEventListener('change', e => { const cb = e.target.closest('input[data-saas]'); if (!cb) return; if (cb.checked) saasSel.add(cb.dataset.saas); else saasSel.delete(cb.dataset.saas); if (!saasSel.size) { saasSel.add(cb.dataset.saas); cb.checked = true } try { localStorage.setItem('saas', JSON.stringify([...saasSel])) } catch {} refreshSaas() });
document.getElementById('saasAll').addEventListener('click', () => { saasSel = new Set(SAAS); saasf.querySelectorAll('input[data-saas]').forEach(c => c.checked = true); try { localStorage.removeItem('saas') } catch {} refreshSaas() });
function refreshSaas() {
  tabs.querySelectorAll('button[data-key]').forEach(b => { const p = PAGES.find(x => x.key === b.dataset.key); if (p) b.hidden = !saasVisible(p) });
  const cur = location.hash.slice(1); const p = PAGES.find(x => x.key === cur);
  show(p && !saasVisible(p) ? 'overview' : cur || 'overview');
}
const tabs = document.getElementById('tabs'), view = document.getElementById('view');
const keys = ['overview', ...PAGES.map(p => p.key)];
tabs.innerHTML = `<button role="tab" data-key="overview">전체</button><span class="sep" aria-hidden="true"></span>` + PAGES.map((p, i) => (p.key.endsWith('-external') && !PAGES[i - 1].key.endsWith('-external') ? '<span class="sep" aria-hidden="true"></span>' : '') + `<button role="tab" data-key="${p.key}" ${saasVisible(p) ? '' : 'hidden'}>${esc(short(p.left))} ↔ ${esc(short(p.right))}</button>`).join('');
function show(key) {
  if (!keys.includes(key)) key = 'overview';
  tabs.querySelectorAll('button').forEach(b => b.setAttribute('aria-selected', String(b.dataset.key === key)));
  view.innerHTML = key === 'overview' ? renderOverview() : renderPair(PAGES.find(p => p.key === key));
  view.querySelectorAll('[data-key]').forEach(el => { const go = () => show(el.dataset.key); el.addEventListener('click', go); el.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); go() } }) });
  try { localStorage.setItem('tab', key) } catch {}
  if (location.hash.slice(1) !== key) history.replaceState(null, '', '#' + key);
}
tabs.addEventListener('click', e => { const b = e.target.closest('button'); if (b) show(b.dataset.key) });
let start = location.hash.slice(1); if (!keys.includes(start)) { try { start = localStorage.getItem('tab') || 'overview' } catch { start = 'overview' } }
show(start);
</script>
