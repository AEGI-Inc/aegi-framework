  - id: S39
    number: 999
    name: "문서 공유 범위"
    finding: "Salesforce 문서가 레코드나 라이브러리에 모든 사용자 공개로 연결됨(사람 확인)"
    targets:
      - provider: salesforce
        object_type: ContentDocumentLink
        # 11-17 기본 기준(사용자 결정): 사용자(Id 005)에 연결된 링크와 내부 사용자 공개는 조직 안 공유라 충족.
        # 레코드, 라이브러리에 모든 사용자(AllUsers) 공개로 연결된 것은 커뮤니티 사용자에게 보일 수 있어 사람 확인으로 둔다.
        # linkedentityid 참조는 정규화에서 아직 풀리지 않아(target_type_not_collected) 사용자 종류(UserType)는 보지 못한다
        cases:
          - when: {path: properties.LinkedEntityId, starts_with: "005"}
            status: pass
            value: "사용자 연결 문서({properties.ShareType}, {properties.Visibility})"
          - when: {path: properties.Visibility, eq: InternalUsers}
            status: pass
            value: "내부 사용자 공개 문서({properties.ShareType})"
          - when: {path: properties.Visibility, exists: true}
            status: org_policy
            value: "문서 공유({properties.ShareType}, {properties.Visibility})"
          - {status: unknown, value: "공유 범위 값 없음"}
    items:
      salesforce: [ISO27001:5.14, ISO27001:5.15, ISO27001:5.18, ISO27001:8.12, ISO27001:8.3, PIPA:admin-73493:article-5:p2, PIPA:admin-73493:article-6:p3]

