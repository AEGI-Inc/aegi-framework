  - id: S29
    number: 989
    name: "인가 서버 서명 키"
    finding: "인가 서버 서명 키에 취약한 SHA-1 알고리즘이 쓰임"
    targets:
      - provider: okta
        object_type: AuthorizationServerJsonWebKey
        cases:
          - when: {path: properties.status, in: [INACTIVE, EXPIRED]}
            status: pass
            value: "비활성 키"
          - when: {path: properties.alg, in: [RS1, HS1, SHA1]}
            status: fail
            value: "취약 서명 알고리즘({properties.alg})"
          - when: {path: properties.alg, exists: true}
            status: pass
            value: "서명 키({properties.kty}, {properties.alg})"
          - {status: unknown, value: "서명 알고리즘 없음"}
      - provider: okta
        object_type: JsonWebKey_2
        cases:
          - when: {path: properties.alg, in: [RS1, HS1, SHA1]}
            status: fail
            value: "취약 서명 알고리즘({properties.alg})"
          - when: {path: properties.alg, exists: true}
            status: pass
            value: "서명 키({properties.kty}, {properties.alg})"
          - {status: unknown, value: "서명 알고리즘 없음"}
    items:
      okta: [ISMS-P:2.7.1-02, ISMS-P:2.7.2-02, ISO27001:8.24]

