            value: "스페이스 기록({properties.setting_value.historyState})"
          - when: {all: [{path: properties.setting_type, eq: settings/data_regions.data_at_rest_region}, {path: properties.setting_value.region, eq: ANY_REGION}]}
            status: org_policy
            value: "저장 데이터 리전 미제한"
          - when: {path: properties.setting_type, eq: settings/data_regions.data_at_rest_region}
            status: pass
            value: "저장 데이터 리전({properties.setting_value.region})"
          - when: {all: [{path: properties.setting_type, eq: settings/data_regions.data_processing_region}, {path: properties.setting_value.limitToStorageRegion, eq: false}]}
            status: org_policy
            value: "처리 리전 제한 꺼짐"
          - when: {path: properties.setting_type, eq: settings/data_regions.data_processing_region}
            status: pass
            value: "처리 리전 제한 켜짐"
          - when: {all: [{path: properties.setting_type, eq: settings/drive_and_docs.file_security_update}, {path: properties.setting_value.allowUsersToManageUpdate, eq: true}]}
            status: org_policy
            value: "사용자 보안 업데이트 해제 허용"
          - when: {path: properties.setting_type, eq: settings/drive_and_docs.file_security_update}
            status: pass
            value: "파일 보안 업데이트 적용"
          - when: {all: [{path: properties.setting_type, eq: settings/drive_and_docs.shared_drive_creation}, {path: properties.setting_value.allowSharedDriveCreation, eq: false}]}
            status: pass
            value: "공유 드라이브 생성 꺼짐"
          - when: {all: [{path: properties.setting_type, eq: settings/drive_and_docs.shared_drive_creation}, {any: [{path: properties.setting_value.allowExternalUserAccess, eq: true}, {path: properties.setting_value.allowNonMemberAccess, eq: true}]}]}
            status: org_policy
            value: "공유 드라이브 외부 또는 비구성원 접근 허용"
          - when: {path: properties.setting_type, eq: settings/drive_and_docs.shared_drive_creation}
            status: pass
            value: "공유 드라이브 외부 접근 제한"
          - when: {all: [{path: properties.setting_type, eq: settings/gmail.web_offline}, {path: properties.setting_value.enabled, eq: false}]}
            status: pass
            value: "웹 오프라인 메일 꺼짐"
          - when: {path: properties.setting_type, eq: settings/gmail.web_offline}
            status: org_policy
            value: "웹 오프라인 메일 켜짐"
          - when: {all: [{path: properties.setting_type, eq: settings/meet.video_recording}, {path: properties.setting_value.enableRecording, eq: false}]}
            status: pass
            value: "Meet 녹화 꺼짐"
          - when: {path: properties.setting_type, eq: settings/meet.video_recording}
            status: org_policy
            value: "Meet 녹화 켜짐"
          - when: {all: [{path: properties.setting_type, eq: settings/multi_party_approval.domains_actions}, {path: properties.setting_value.domainsApiMultiPartyApprovalState, ne: ENABLED}]}
            status: org_policy
            value: "도메인 작업 다중 승인 꺼짐"
          - when: {path: properties.setting_type, eq: settings/multi_party_approval.domains_actions}
            status: pass
            value: "도메인 작업 다중 승인 켜짐"
          - when: {all: [{path: properties.setting_type, eq: settings/youtube.user_takeout}, {path: properties.setting_value.takeoutStatus, eq: DISABLED}]}
