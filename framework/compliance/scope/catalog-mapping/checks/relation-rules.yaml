          - when: {path: properties.preventBruteForceLockoutFromUnknownDevices, eq: true}
            status: pass
            value: "알 수 없는 기기 잠금 활성"
          - {status: unknown, value: "잠금 설정 값 없음"}
    items:
      okta: [ISMS-P:2.10.2-02, ISMS-P:2.10.2-03, ISMS-P:2.5.3-01, ISMS-P:2.5.3-02, ISMS-P:2.5.4-03, ISO27001:5.17, ISO27001:5.23, ISO27001:8.5, PIPA:admin-73493:article-5:p5, PIPA:admin-73493:article-5:p6, PIPA:admin-73493:article-6:p2]

