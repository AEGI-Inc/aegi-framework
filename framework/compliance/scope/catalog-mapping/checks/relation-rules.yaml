  - id: S46
    number: 1006
    name: "GWS Gmail 악성코드와 스푸핑 방어"
    finding: "Gmail 첨부파일, 링크, 스푸핑 보호 기능이 꺼져 있음"
    targets:
      - provider: gws
        object_type: Policy
        cases:
          - when: {path: properties.setting_type, not_in: [settings/gmail.email_attachment_safety, settings/gmail.enhanced_pre_delivery_message_scanning, settings/gmail.links_and_external_images, settings/gmail.spoofing_and_authentication]}
            status: _skip
          - when: {all: [{path: properties.setting_type, eq: settings/gmail.email_attachment_safety}, {any: [{path: properties.setting_value.enableEncryptedAttachmentProtection, eq: false}, {path: properties.setting_value.enableAttachmentWithScriptsProtection, eq: false}, {path: properties.setting_value.enableAnomalousAttachmentProtection, eq: false}]}]}
            status: fail
            value: "첨부파일 안전 보호 일부 꺼짐"
          - when: {path: properties.setting_type, eq: settings/gmail.email_attachment_safety}
            status: pass
            value: "첨부파일 안전 보호 켜짐"
          - when: {all: [{path: properties.setting_type, eq: settings/gmail.enhanced_pre_delivery_message_scanning}, {path: properties.setting_value.enableImprovedSuspiciousContentDetection, eq: false}]}
            status: fail
            value: "전송 전 향상된 스캔 꺼짐"
          - when: {path: properties.setting_type, eq: settings/gmail.enhanced_pre_delivery_message_scanning}
            status: pass
            value: "전송 전 향상된 스캔 켜짐"
          - when: {all: [{path: properties.setting_type, eq: settings/gmail.links_and_external_images}, {any: [{path: properties.setting_value.enableShortenerScanning, eq: false}, {path: properties.setting_value.enableExternalImageScanning, eq: false}, {path: properties.setting_value.enableAggressiveWarningsOnUntrustedLinks, eq: false}]}]}
            status: fail
            value: "링크와 외부 이미지 보호 일부 꺼짐"
          - when: {path: properties.setting_type, eq: settings/gmail.links_and_external_images}
            status: pass
            value: "링크와 외부 이미지 보호 켜짐"
          - when: {all: [{path: properties.setting_type, eq: settings/gmail.spoofing_and_authentication}, {any: [{path: properties.setting_value.detectDomainNameSpoofing, eq: false}, {path: properties.setting_value.detectEmployeeNameSpoofing, eq: false}, {path: properties.setting_value.detectDomainSpoofingFromUnauthenticatedSenders, eq: false}]}]}
            status: fail
            value: "스푸핑 탐지 일부 꺼짐"
          - when: {path: properties.setting_type, eq: settings/gmail.spoofing_and_authentication}
            status: pass
            value: "스푸핑 탐지 켜짐"
          - {status: unknown, value: "메일 보안 설정 값 없음"}
    items:
      gws: [ISMS-P:2.10.2-02, ISO27001:5.23, ISO27001:8.7]

