# ---- 사람 확인 항목 (2026-11-13 결정: 대상 객체를 manual target 으로 낸다) ----
# 절차, 보관 기간, 정기 점검 같은 운영 사실이라 API 값으로 위반이 정해지지 않는 항목. 판정기는 그 항목의 typeScope 대상 객체를
# status manual 로 낸다(finding <provider>-958, 「사람 확인: <항목 제목>」). 대상 목록은 dashboard typeScope 와 같은 원본
# (items-clean/item-type-scope.jsonl, confirmed 쌍)을 읽는다.
manual_items:
  number: 958
  name: 사람 확인 항목의 대상
  # 11-17 사용자 결정으로 모두 끊었다. ISO 8.10, 8.15, ISMS-P 2.5.6-01, PIPA 5-3, 8-3 은 같은 날 범위에서 제외됐고(knowledge#320),
  # 남은 ISMS-P 2.9.4-03, PIPA 8-2 는 자동 점검만으로 판정하며 대상 종류도 자동 점검이 보는 것만 남겼다
  # (items-clean/scope-review-1117.jsonl). 항목 연결과 근거 카드에서도 뺐다(checks/apply_unlink_958_1117.py)
  items: []

# ---- SaaS 별 값 표 (판정기 코드 대신 여기에만 SaaS 이름) ----
tables:
  # IdP: 같은 사람의 이 SaaS 계정이 비활성이면 다른 SaaS 계정도 비활성으로 본다(R3). IdP 사람 계정의 이메일 도메인은 조직 도메인(R4)
  idp_providers: [okta, gws]
  # 이메일로 쓰는 칸(R4 도메인 판정). login, Username 은 이메일 모양이어도 계정 이름이라 쓰지 않는다(Salesforce Username 은 조직 접미사가 붙는다)
  email_fields: [email, primaryEmail, Email, emailAddress, profile.email]
  # 조직 도메인을 모으는 곳(R4). 값이 이메일 도메인 모양인 것만 쓴다
  # 11-13 운영 그래프에서 칸 이름과 값을 확인했다(gws Domains.domainName, Customer.customerDomain)
  org_domains:
    - {provider: gws, object_type: Domains, path: domainName}
    - {provider: gws, object_type: Customer, path: customerDomain}
  # 다중 인증 수단 객체(R6). status 가 있으면 ACTIVE 만. 11-13 그래프: UserFactor 12(ACTIVE 12), AuthenticatorMethodBase 10(ACTIVE 7)
  mfa_factors:
    - {provider: okta, object_type: UserFactor, status_path: status, status_ok: [ACTIVE]}
    - {provider: okta, object_type: AuthenticatorMethodBase, status_path: status, status_ok: [ACTIVE]}
  # 계정 속성으로 아는 다중 인증(R6). 11-13 그래프: gws User isEnrolledIn2Sv 10명 모두 false
  mfa_properties:
    - {provider: gws, object_type: User, path: isEnrolledIn2Sv, values: [true]}
  # 다중 인증을 요구하는 정책(R6). 11-13 그래프: okta Policy type MFA_ENROLL 1개. GWS 2단계 인증 강제 설정은 정책 원본에 없다
  mfa_policies:
    - {provider: okta, object_type: Policy, path: type, values: [MFA_ENROLL]}
  # SSO 로 로그인해 인증을 IdP 에 맡기는 SaaS(R6). 테넌트에 SSO 설정 객체가 있을 때만 맡긴다
  sso_delegation:
    - {provider: salesforce, sso_object: SamlSsoConfig, idp: okta}
  # 다중 인증 값이 수집본에 없는 SaaS(R6 → not_collected). GitHub simple-user 의 two_factor_authentication 은 비어 있다
  no_mfa_data: [slack, atlassian, github]
  # 공용 계정 표지(R7). 로그인, 이메일 앞부분, 표시 이름을 소문자로 보고 낱말 경계로 맞춘다
  shared_markers: [admin, administrator, test, shared, common, team, ops, service, support, info, root, master, guest, temp]
