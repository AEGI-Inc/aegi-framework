  - id: S36
    number: 996
    name: "이메일 서비스와 Slack 플로우 연동"
    finding: "이메일 서비스가 TLS 또는 인증을 요구하지 않음"
    targets:
      - provider: salesforce
        object_type: EmailServicesFunction
        cases:
          - when: {path: properties.IsActive, eq: false}
            status: pass
            value: "사용 안 함"
          - when: {any: [{path: properties.IsTlsRequired, eq: false}, {path: properties.IsAuthenticationRequired, eq: false}]}
            status: fail
            value: "TLS({properties.IsTlsRequired}) 또는 인증({properties.IsAuthenticationRequired}) 미요구"
          - {status: org_policy, value: "활성 이메일 서비스({properties.FunctionName})"}
      - provider: salesforce
        object_type: FlowSlackActionEndpoint
        cases:
          - when: {path: properties.action_type, exists: true}
            status: org_policy
